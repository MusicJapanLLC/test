<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ギルドの灯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--BODY-->
<div id="app">
  <canvas id="scene" aria-label="ギルドの断面図"></canvas>

  <header id="hud">
    <div class="hud-row">
      <button id="rankBtn" class="rank" aria-label="ギルドランクの詳細">
        <span class="crest" id="rankNum">1</span>
        <span class="rank-txt">
          <b id="rankTitle">廃屋同然</b>
          <span class="fame"><i id="fameFill"></i></span>
          <span class="fame-txt" id="fameText">名声 0 / 20</span>
        </span>
      </button>
      <div class="res">
        <span class="pill gold" id="goldPill"><span class="ic"></span><b id="goldVal">0</b></span>
        <span class="pill mat" id="matPill"><span class="ic"></span><b id="matVal">0</b></span>
        <button class="pill cry" id="cryPill" aria-label="魔晶石（ショップへ）"><span class="ic"></span><b id="cryVal">0</b></button>
      </div>
      <button id="bellBtn" class="icon-btn bell" aria-label="お知らせ"></button>
      <button id="menuBtn" class="icon-btn" aria-label="記録と設定"></button>
    </div>
    <button id="objChip" class="obj"><span class="obj-label">目標</span><span id="objText"></span><span class="obj-prog"><i id="objFill"></i></span><span id="objCount"></span></button>
    <button id="boostChip" hidden aria-label="使っているアイテム"></button>
    <div id="expStrip" aria-label="遠征中のパーティ"></div>
  </header>

  <section id="sheet" hidden aria-live="polite">
    <div id="sheetHead">
      <button id="sheetBack" hidden aria-label="戻る"></button>
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" aria-label="閉じる"></button>
    </div>
    <div id="sheetBody"></div>
  </section>

  <nav id="tabs">
    <button id="tab-quests" data-tab="quests"><span class="ti"></span>依頼<i class="dot" hidden></i></button>
    <button id="tab-roster" data-tab="roster"><span class="ti"></span>冒険者<i class="dot" hidden></i></button>
    <button id="tab-reels" data-tab="reels" aria-label="冒険譚を見る"><span class="disc-shadow"></span><span class="disc"><span class="ti"></span></span><span class="badge" hidden>0</span><span id="reelSub">冒険譚</span></button>
    <button id="tab-build" data-tab="build"><span class="ti"></span>施設<i class="dot" hidden></i></button>
    <button id="tab-treasury" data-tab="treasury"><span class="ti"></span>宝物庫<i class="dot" hidden></i></button>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="notice" hidden role="status"></div>
  <div id="advPop" hidden></div>

  <div id="tut" hidden>
    <div id="tutRing" hidden></div>
    <div id="tutHand" hidden></div>
    <div id="tutBox" role="dialog" aria-label="受付のリナ">
      <img id="tutFace" alt="">
      <div><b>受付のリナ</b><p id="tutText"></p></div>
      <span id="tutNext" hidden>タップで次へ ▼</span>
      <button id="tutSkip">説明をとばす</button>
    </div>
  </div>

  <section id="reels" hidden aria-label="冒険譚">
    <canvas id="reelCanvas"></canvas>
    <div class="reel-top">
      <button id="reelClose" aria-label="ギルドに戻る"></button>
      <span id="reelTitle">冒険譚</span>
      <span class="pill gold" id="reelGold"><span class="ic"></span><b>0</b></span>
    </div>
    <div id="reelStreak" hidden></div>
    <button id="reelAll" hidden></button>
    <button id="reelLike" class="hit" aria-label="応援する"></button>
    <button id="reelComments" class="hit" aria-label="コメントを見る"></button>
    <div id="reelHint" hidden>上にスワイプで次へ ・ ダブルタップで応援</div>
    <div id="reelPause" hidden>一時停止中</div>
    <div id="reelEnd" data-active="0">
      <div class="end-in">
        <h2 id="endTitle">すべての冒険譚を見ました</h2>
        <div id="endSummary"></div>
        <div id="endNext"></div>
        <div id="endActive"></div>
        <div class="end-actions">
          <button class="btn primary big" id="endQuests">依頼を出す</button>
          <button class="btn ghost" id="endBack">ギルドに戻る</button>
          <button class="btn ghost" id="endHistory" hidden>過去の冒険譚を見る</button>
        </div>
      </div>
    </div>
    <div id="comments" hidden>
      <div id="commentsBackdrop"></div>
      <div class="c-sheet">
        <div class="c-head"><span class="c-grip"></span><b id="commentsCount">コメント</b><span id="commentsPlus"></span><button id="commentsClose" aria-label="コメントを閉じる"></button></div>
        <div id="commentsList"></div>
        <div id="commentsPost"></div>
      </div>
    </div>
  </section>

  <div id="modal" hidden><div class="modal-card" id="modalCard" role="dialog"></div></div>
  <div id="chestFx" hidden><canvas id="chestCanvas"></canvas><div class="cf-ui"></div></div>
  <canvas id="fx"></canvas>
  <div id="safeProbe"></div>

  <div id="boot" tabindex="0" role="button" aria-label="ゲームをはじめる">
    <div>
      <div class="logo">
        <div class="lantern"><i></i></div>
        <h1>ギルドの灯</h1>
        <span class="en">Guild of Lanterns</span>
      </div>
      <div id="bootSub"></div>
      <div id="bootHint">タップしてはじめる</div>
    </div>
    <div class="boot-note">音が出ます ・ セーブはこの端末に自動保存</div>
  </div>
</div>
<!--/BODY-->
<script src="js/core.js"></script>
<script src="js/save.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/items.js"></script>
<script src="js/comments.js"></script>
<script src="js/sim.js"></script>
<script src="js/scene.js"></script>
<script src="js/reels.js"></script>
<script src="js/treasury.js"></script>
<script src="js/ui.js"></script>
<script src="js/notify.js"></script>
<script src="js/main.js"></script>
</body>
</html>
