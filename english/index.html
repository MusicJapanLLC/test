<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MJ ENGLISH</title>
  <meta name="description" content="Learn the English people actually say. Phrases and words from real talk, songs, film, classic books, comedy and science, each with a recorded voice. By Music Japan LLC, Osaka." />
  <meta name="theme-color" content="#060607" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#efe9e0" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MJ ENGLISH" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MJ ENGLISH" />
  <meta property="og:title" content="MJ ENGLISH — Real English, on record" />
  <meta property="og:description" content="Phrases and words from real talk, songs, film and books. Every card has a voice. By Music Japan LLC." />
  <meta property="og:image" content="og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" />
</head>
<body>
  <div id="app" class="app">
    <header class="bar">
      <a class="bar__logo" href="#/" aria-label="MJ ENGLISH home" data-logo></a>
      <div class="hud">
        <span class="hud__streak" title="Day streak"><span data-flame></span><b data-hud="streak">0</b></span>
        <span class="hud__ring" title="Today's goal" data-hud="ring"></span>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabs" aria-label="Main" data-tabs></nav>
  </div>
  <div id="session" class="session" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="party" class="party" hidden></div>
  <dialog id="sheet" class="sheet"></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
