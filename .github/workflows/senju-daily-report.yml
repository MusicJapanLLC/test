name: Senju Daily Adversarial Report

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 07:00 JST (22:00 UTC)
  workflow_dispatch:
    inputs:
      population:
        description: "各陣営の個体数"
        default: "200"
      generations:
        description: "世代数"
        default: "30"
      matches:
        description: "1世代あたりの対戦数"
        default: "800"
  push:
    branches: ["claude/multi-agent-adversarial-system-r2zppe"]
    paths:
      - "senju/**"
      - ".github/workflows/senju-daily-report.yml"

permissions:
  contents: read

concurrency:
  group: senju-daily-adversarial-report
  cancel-in-progress: true

jobs:
  simulate:
    name: Run adversarial tournament
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Run safety + engine tests
        working-directory: senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest tests -q

      - name: Verify scope guard blocks public targets
        working-directory: senju
        run: |
          set -euo pipefail
          python -m senju.cli safety-check sim://ci-target
          if python -m senju.cli safety-check 8.8.8.8; then
            echo "SECURITY FAIL: public IP was allowed" >&2
            exit 1
          fi
          echo "scope guard OK: public target rejected as expected"

      - name: Run tournament and generate report
        working-directory: senju
        env:
          POP: ${{ github.event.inputs.population || '200' }}
          GEN: ${{ github.event.inputs.generations || '30' }}
          MATCHES: ${{ github.event.inputs.matches || '800' }}
        run: |
          python -m senju.cli run --population "$POP" --generations "$GEN" --matches "$MATCHES" --quiet || \
          python -m senju.cli run --population "$POP" --generations "$GEN" --matches "$MATCHES"

      - name: Publish report to job summary
        working-directory: senju
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack (optional; requires SLACK_WEBHOOK_URL secret)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        working-directory: senju
        run: |
          python - <<'PYEOF'
          import json, os, urllib.request
          data = json.load(open("reports/latest.json", encoding="utf-8"))
          gens = data["generations"]
          first, last = gens[0], gens[-1]
          deaths = sum(g["red_deaths"] + g["blue_deaths"] for g in gens)
          births = sum(g["red_births"] + g["blue_births"] for g in gens)
          viol = len(data["scope_violations"])
          safe = "✅ スコープ違反ゼロ" if viol == 0 else f"⚠️ スコープ違反 {viol} 件"
          text = (
              f"*Senju 戦況レポート* — {data['scenario']}\n"
              f"{safe}\n"
              f"世代 {len(gens)} / 累計淘汰 {deaths} / 誕生 {births}\n"
              f"レッド最高R {first['red_top_rating']}→{last['red_top_rating']} / "
              f"ブルー最高R {first['blue_top_rating']}→{last['blue_top_rating']}\n"
              f"レッド総資産 {last['red_resources']} / ブルー総資産 {last['blue_resources']}"
          )
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps({"text": text}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=10) as r:  # noqa: S310
              print("slack status", r.status)
          PYEOF
