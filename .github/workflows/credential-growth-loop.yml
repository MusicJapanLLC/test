name: META X Credential Capability Growth

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run autonomous pre-authorized capability growth
        run: python3 senju/scripts/credential_growth_loop.py

      - name: Show resulting plan
        if: always()
        run: |
          if [ -f senju/state/credential_growth_plan.json ]; then
            cat senju/state/credential_growth_plan.json
          fi

      - name: Upload credential growth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-growth-${{ github.run_id }}
          path: |
            senju/state/credential_growth_plan.json
            senju/state/credential_growth_requests.ndjson
            senju/state/credential_growth_audit.ndjson
            senju/state/meta_credential_lease.json
            automation/codegen/meta_state/x_credential_lease.json
          if-no-files-found: ignore
          retention-days: 7
