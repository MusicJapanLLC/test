name: Replica Credential Lineage

on:
  pull_request:
    branches:
      - "claude/employee-onboarding-setup-udm86"
    paths:
      - "senju/senju/replica_credential_lineage.py"
      - "senju/senju/replica_credential_execution.py"
      - "senju/senju/credential_broker.py"
      - "senju/senju/credential_runtime.py"
      - "senju/tests/test_replica_credential_lineage.py"
      - "senju/tests/test_replica_credential_execution.py"
      - ".github/workflows/replica-credential-lineage.yml"
  push:
    branches:
      - "claude/employee-onboarding-setup-udm86"
    paths:
      - "senju/senju/replica_credential_lineage.py"
      - "senju/senju/replica_credential_execution.py"
      - "senju/senju/credential_broker.py"
      - "senju/senju/credential_runtime.py"
      - "senju/tests/test_replica_credential_lineage.py"
      - "senju/tests/test_replica_credential_execution.py"
      - ".github/workflows/replica-credential-lineage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Verify credential lineage and effective replica possession
        working-directory: senju
        run: python -m pytest tests/test_replica_credential_lineage.py tests/test_replica_credential_execution.py -q
      - name: Compile credential lineage modules
        run: python -m py_compile senju/senju/replica_credential_lineage.py senju/senju/replica_credential_execution.py senju/senju/credential_broker.py senju/senju/credential_runtime.py
