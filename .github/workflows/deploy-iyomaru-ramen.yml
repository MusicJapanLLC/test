name: Deploy Iyomaru Ramen site

on:
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - "iyomaru-ramen/**"
      - ".github/workflows/deploy-iyomaru-ramen.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iyomaru-ramen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build site
        env:
          # This repo (musicjapanllc/test) is not a *.github.io repo, so its
          # Pages URL is served from a project subpath. These two env vars
          # make the CI build resolve correctly at that subpath without
          # touching the checked-in production defaults in config/site.json
          # (which stay at basePath "/" for the eventual real domain).
          SITE_URL: https://musicjapanllc.github.io
          SITE_BASE_PATH: /test/
        run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iyomaru-ramen/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
