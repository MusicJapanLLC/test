name: Owned Test Site Monitor

on:
  push:
    branches:
      - 'claude/employee-onboarding-setup-udm86'
    paths:
      - 'monitoring/owned_site_monitor.py'
      - 'monitoring/test_owned_site_monitor.py'
      - 'monitoring/owned_site_drift.py'
      - 'monitoring/test_owned_site_drift.py'
      - '.github/workflows/owned-site-monitor.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: owned-test-site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify audit scope and learning logic
        run: python -m unittest monitoring.test_owned_site_monitor monitoring.test_owned_site_drift
      - name: Restore previous successful live evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-audit
          PREVIOUS_RUN="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow owned-site-monitor.yml \
              --branch claude/employee-onboarding-setup-udm86 \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty' 2>/dev/null || true
          )"
          if [ -n "$PREVIOUS_RUN" ]; then
            gh run download "$PREVIOUS_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name owned-site-monitor-report \
              --dir previous-audit || true
          fi
      - name: Run live defensive audit
        run: python monitoring/owned_site_monitor.py | tee owned-site-monitor-report.json
      - name: Learn from consecutive live evidence
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS=""
          if [ -f previous-audit/owned-site-monitor-report.json ]; then
            PREVIOUS="--previous previous-audit/owned-site-monitor-report.json"
          fi
          python monitoring/owned_site_drift.py \
            --current owned-site-monitor-report.json \
            $PREVIOUS \
            --out owned-site-learning.json >/dev/null
      - name: Publish summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path('owned-site-monitor-report.json').read_text(encoding='utf-8'))
          learning = json.loads(Path('owned-site-learning.json').read_text(encoding='utf-8'))
          print('## Owned test site defensive audit')
          print()
          print('- evidence: **live**')
          print('- simulation: **false**')
          print(f"- previous live evidence reused: **{str(learning['previous_evidence_available']).lower()}**")
          print(f"- learning packet: `{learning['packet_sha256']}`")
          print()
          for target in report['targets']:
              print(f"### {target['origin']}")
              print(f"- pages checked: **{target['pages_checked']}**")
              print(f"- findings: `{json.dumps(target['finding_counts'], sort_keys=True)}`")
              tls = target.get('tls', {})
              print(f"- TLS days remaining: **{tls.get('days_remaining', 'unknown')}**")
              learned = next((x for x in learning['targets'] if x['origin'] == target['origin']), None)
              if learned:
                  print(f"- changed pages: **{len(learned['page_changes'])}**")
                  print(f"- new findings: **{len(learned['new_findings'])}**")
                  print(f"- resolved findings: **{len(learned['resolved_findings'])}**")
                  print(f"- recurring findings: **{len(learned['recurring_findings'])}**")
              print()
          if learning['adaptive_follow_up_ranking']:
              print('### Adaptive follow-up ranking')
              for row in learning['adaptive_follow_up_ranking']:
                  print(
                      f"- `{row['type']}` score={row['follow_up_score']} "
                      f"current={row['current_count']} recurring={row['recurring_count']} new={row['new_count']}"
                  )
          PY
      - name: Upload audit report and live learning
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-site-monitor-report
          path: |
            owned-site-monitor-report.json
            owned-site-learning.json
          retention-days: 14
