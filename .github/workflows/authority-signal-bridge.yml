name: Authority Signal Bridge

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'automation/codegen/engine/authority_signal_bridge.py'
      - 'automation/codegen/run_authority_signal_bridge.py'
      - 'automation/codegen/tests/test_authority_signal_bridge.py'
      - '.github/workflows/authority-signal-bridge.yml'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'automation/codegen/engine/authority_signal_bridge.py'
      - 'automation/codegen/run_authority_signal_bridge.py'
      - 'automation/codegen/tests/test_authority_signal_bridge.py'
      - '.github/workflows/authority-signal-bridge.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: authority-signal-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connect-signals-to-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore shared authority memory
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-signal-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            authority-signal-${{ github.ref_name }}-
            authority-opportunity-${{ github.ref_name }}-
            authority-opportunity-

      - name: Verify signal-authority invariants
        env:
          PYTHONPATH: automation/codegen
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q automation/codegen/tests/test_authority_signal_bridge.py

      - name: Connect discovery similarity and AI consensus to Authority
        env:
          PYTHONPATH: automation/codegen
        run: |
          mkdir -p .authority-opportunity-runtime
          python automation/codegen/run_authority_signal_bridge.py \
            --state .authority-opportunity-runtime \
            --json-out .authority-opportunity-runtime/authority_signal_bridge_run.json

          test "$(jq -r '.connected' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "true"
          test "$(jq -r '.formula.discovery' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "authority_candidate_creation_signal"
          test "$(jq -r '.formula.similarity' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "authority_weight_and_provisional_signal"
          test "$(jq -r '.formula.ai_consensus' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "authority_provisional_and_activation_signal"
          test "$(jq -r '.persistent_reconsideration' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "true"
          test "$(jq -r '.no_reprompt_for_auto_apply_ready' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "true"
          test "$(jq -r '.new_unrelated_live_root_from_signals_alone' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "false"
          test "$(jq -r '.raw_credentials_from_signals' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "false"
          test "$(jq -r '.revocation_override_from_signals' .authority-opportunity-runtime/authority_signal_bridge_run.json)" = "false"
          test -s .authority-opportunity-runtime/provisional_authorities.json
          test -s .authority-opportunity-runtime/signal_authority_activation_queue.json

      - name: Save shared authority memory
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-signal-${{ github.ref_name }}-${{ github.run_id }}

      - name: Preserve signal-authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authority-signal-bridge-${{ github.run_id }}
          path: .authority-opportunity-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Authority signal summary
        if: always()
        run: |
          echo "## Authority Signal Bridge" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .authority-opportunity-runtime/authority_signal_bridge_run.json ]; then
            echo "- Connected: $(jq -r '.connected' .authority-opportunity-runtime/authority_signal_bridge_run.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Candidates: $(jq -r '.candidate_count' .authority-opportunity-runtime/authority_signal_bridge_run.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Provisional authorities: $(jq -r '.provisional_authority_count' .authority-opportunity-runtime/authority_signal_bridge_run.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Auto-apply ready: $(jq -r '.auto_apply_ready_count' .authority-opportunity-runtime/authority_signal_bridge_run.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Live owner-envelope connections: $(jq -r '.live_authority_connected_count' .authority-opportunity-runtime/authority_signal_bridge_run.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
