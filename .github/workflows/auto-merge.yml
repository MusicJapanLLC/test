name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
      - main
      - master
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Merge audited ready PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const allowedConclusions = new Set(['success', 'neutral', 'skipped']);
            let merged = 0;
            let skipped = 0;

            for (const pr of pulls.data) {
              if (pr.draft) {
                console.log(`⏭️ Draft PR #${pr.number} — skip`);
                skipped++;
                continue;
              }

              const detail = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number
              });

              if (detail.data.mergeable_state === 'blocked') {
                console.log(`🔒 PR #${pr.number} blocked — skip`);
                skipped++;
                continue;
              }

              if (['dirty', 'unknown'].includes(detail.data.mergeable_state)) {
                console.log(`⚠️ PR #${pr.number} mergeable_state=${detail.data.mergeable_state} — skip`);
                skipped++;
                continue;
              }

              const checks = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha
              });
              const runs = checks.data.check_runs;
              const failed = runs.filter(r =>
                r.status === 'completed' && !allowedConclusions.has(r.conclusion)
              );
              if (failed.length > 0) {
                console.log(`❌ PR #${pr.number} has ${failed.length} failing check(s) — skip`);
                skipped++;
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number,
                  merge_method: 'squash'
                });
                console.log(`✅ Merged PR #${pr.number}: ${pr.title}`);
                merged++;
              } catch (e) {
                console.log(`⚠️ Could not merge PR #${pr.number}: ${e.message}`);
                skipped++;
              }
            }
            console.log(`Done. merged=${merged} skipped=${skipped}`);
