name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, review_requested, edited]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
      - main
      - master
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'

      - name: Apply frontier findings
        run: |
          if gh run download --name adversarial-boundary-growth-corpus 2>/dev/null; then
            if [ -f corpus.json ]; then
              python apply_findings.py --corpus corpus.json --create-pr
            else
              echo "corpus.json was not found in the downloaded artifact."
            fi
          else
            echo "Artifact 'adversarial-boundary-growth-corpus' not found. Skipping."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge audited ready PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const allowedConclusions = new Set(['success', 'neutral', 'skipped']);

            function isSecurityBoundaryPath(path) {
              const p = (path || '').toLowerCase();
              const exact = new Set([
              
                '.github/workflows/auto-merge.yml',
                '.github/workflows/auto-conflict-resolver.yml',
                'senju/finding_trust_policy.md'
              ]);

              const sensitiveTerms = [
                'scopeguard', 'scope_guard', 'security-guard', 'security_guard',
                'artifact_guard', 'authorization', 'authority', 'engagement',
                'externalcontact', 'external_contact', 'secret',
                'allowlist'
              ];
              if (sensitiveTerms.some(term => p.includes(term))) return true;

              if (p.startsWith('.github/workflows/') &&
                  /(security|guard|merge|deploy|release|executor|autonomous|spear|meta)/.test(p)) {
                return true;
              }

              return false;
            }

            async function listChangedFiles(prNumber) {
              const files = [];
              for (let page = 1; page <= 10; page++) {
                const res = await github.rest.pulls.listFiles({
                  owner, repo, pull_number: prNumber, per_page: 100, page
                });
                files.push(...res.data.map(f => f.filename));
                if (res.data.length < 100) break;
              }
              return files;
            }

            async function hasIndependentMaintainerApproval(pr) {
              const reviews = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number, per_page: 100
              });

              const latestByUser = new Map();
              for (const review of reviews.data) {
                const login = review.user?.login;
                if (!login) continue;
                latestByUser.set(login, review);
              }

              for (const [login, review] of latestByUser) {
                if (review.state !== 'APPROVED') continue;
                if (login === pr.user?.login) continue;
                if (review.user?.type === 'Bot' || login.endsWith('[bot]')) continue;

                try {
                  const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner, repo, username: login
                  });
                  if (['write', 'maintain', 'admin'].includes(perm.data.permission)) {
                    return true;
                  }
                } catch (e) {
                  console.log(`Reviewer permission lookup failed for ${login}: ${e.message}`);
                }
              }
              return false;
            }

            let merged = 0;
            let skipped = 0;

            for (const pr of pulls.data) {
              if (pr.draft) {
                console.log(`⏭️ Draft PR #${pr.number} — skip`);
                skipped++;
                continue;
              }

              const detail = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number
              });

              if (detail.data.mergeable_state === 'blocked') {
                console.log(`🔒 PR #${pr.number} blocked — skip`);
                skipped++;
                continue;
              }

              if (['dirty', 'unknown'].includes(detail.data.mergeable_state)) {
                console.log(`⚠️ PR #${pr.number} mergeable_state=${detail.data.mergeable_state} — skip`);
                skipped++;
                continue;
              }

              const checks = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100
              });

              // Exclude this auto-merge job itself to avoid self-deadlock.
              const runs = checks.data.check_runs.filter(r => r.name !== 'auto-merge');
              const pending = runs.filter(r => r.status !== 'completed');
              const failed = runs.filter(r =>
                r.status === 'completed' && !allowedConclusions.has(r.conclusion)
              );

              if (pending.length > 0) {
                console.log(`⏳ PR #${pr.number} has ${pending.length} pending check(s) — skip`);
                skipped++;
                continue;
              }

              if (failed.length > 0) {
                console.log(`❌ PR #${pr.number} has ${failed.length} failing check(s) — skip`);
                skipped++;
                continue;
              }

              const changedFiles = await listChangedFiles(pr.number);
              const boundaryFiles = changedFiles.filter(isSecurityBoundaryPath);

              if (boundaryFiles.length > 0) {
                const approved = await hasIndependentMaintainerApproval(pr);
                if (!approved) {
                  console.log(`🛡️ PR #${pr.number} changes Security Boundary and lacks independent maintainer approval — skip`);
                  console.log(`Boundary files: ${boundaryFiles.join(', ')}`);
                  skipped++;
                  continue;
                }
                console.log(`🛡️ PR #${pr.number} Security Boundary review satisfied`);
              }

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number,
                  merge_method: 'squash',
                  sha: pr.head.sha
                });
                console.log(`✅ Merged PR #${pr.number}: ${pr.title}`);
                merged++;
              } catch (e) {
                console.log(`⚠️ Could not merge PR #${pr.number}: ${e.message}`);
                skipped++;
              }
            }

            console.log(`Done. merged=${merged} skipped=${skipped}`);
