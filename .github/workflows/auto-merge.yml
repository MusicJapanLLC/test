name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
      - main
      - master
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge ready PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            let merged = 0;
            let skipped = 0;

            for (const pr of pulls.data) {
              if (pr.draft) {
                console.log(`⏭️ Draft PR #${pr.number} — skip`);
                continue;
              }

              const detail = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });

              const mergeable = detail.data.mergeable;
              const state = detail.data.mergeable_state;

              if (mergeable === true && state === 'clean') {
                try {
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    merge_method: 'squash',
                    commit_title: `${pr.title} (#${pr.number})`
                  });
                  console.log(`✅ Merged PR #${pr.number}: ${pr.title}`);
                  merged++;
                  await new Promise(r => setTimeout(r, 2000));
                } catch (e) {
                  console.log(`❌ Failed PR #${pr.number}: ${e.message}`);
                  skipped++;
                }
              } else {
                console.log(`⏭️ PR #${pr.number} not ready (mergeable=${mergeable}, state=${state})`);
                skipped++;
              }
            }

            console.log(`\n📊 Done: ${merged} merged, ${skipped} skipped`);
