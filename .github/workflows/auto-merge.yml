name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
      - main
      - master
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Merge audited ready PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const allowedConclusions = new Set(['success', 'neutral', 'skipped']);
            let merged = 0;
            let skipped = 0;

            for (const pr of pulls.data) {
              if (pr.draft) {
                console.log(`⏭️ Draft PR #${pr.number} — skip`);
                skipped++;
                continue;
              }

              if (pr.base.ref !== defaultBranch) {
                console.log(`⏭️ PR #${pr.number} targets ${pr.base.ref}, not default ${defaultBranch} — skip`);
                skipped++;
                continue;
              }

              const labels = new Set((pr.labels || []).map(label => label.name));
              if (!labels.has('ai-merge-approved')) {
                console.log(`🛑 PR #${pr.number} missing ai-merge-approved — audit interlock active`);
                skipped++;
                continue;
              }

              const detail = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number
              });

              const headSha = detail.data.head.sha;
              if (detail.data.mergeable !== true || detail.data.mergeable_state !== 'clean') {
                console.log(`⏭️ PR #${pr.number} not clean (mergeable=${detail.data.mergeable}, state=${detail.data.mergeable_state})`);
                skipped++;
                continue;
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              if (reviews.some(review => review.state === 'CHANGES_REQUESTED')) {
                console.log(`🛑 PR #${pr.number} has CHANGES_REQUESTED review`);
                skipped++;
                continue;
              }

              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100
              });

              const badCheck = checks.data.check_runs.find(check =>
                check.status !== 'completed' || !allowedConclusions.has(check.conclusion)
              );
              if (badCheck) {
                console.log(`🛑 PR #${pr.number} blocked by check ${badCheck.name}: status=${badCheck.status}, conclusion=${badCheck.conclusion}`);
                skipped++;
                continue;
              }

              try {
                const result = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`,
                  sha: headSha
                });

                if (result.data.merged) {
                  console.log(`✅ Merged PR #${pr.number}: ${pr.title}`);
                  merged++;
                } else {
                  console.log(`⏭️ GitHub declined merge for PR #${pr.number}: ${result.data.message}`);
                  skipped++;
                }
                await new Promise(resolve => setTimeout(resolve, 2000));
              } catch (error) {
                console.log(`❌ Failed PR #${pr.number}: ${error.message}`);
                skipped++;
              }
            }

            console.log(`\n📊 Done: ${merged} merged, ${skipped} skipped; temporary AI audit interlock enforced`);
