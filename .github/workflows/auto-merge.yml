name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
      - main
      - master
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Merge ordinary ready PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const allowedConclusions = new Set(['success', 'neutral', 'skipped']);
            const machineBranchPrefixes = [
              'senju/', 'feat/senju-', 'fix/senju-',
              'meta/', 'feat/meta-', 'fix/meta-',
              'x/', 'feat/x-', 'fix/x-'
            ];
            const machineTitlePrefixes = [
              '[Senju]', 'Senju advisor:', 'feat(senju)', 'fix(senju)',
              '[META]', 'feat(meta)', 'fix(meta)',
              '[X]', 'feat(x)', 'fix(x)'
            ];

            function isMachineLane(pr) {
              const title = pr.title || '';
              const branch = pr.head?.ref || '';
              return machineBranchPrefixes.some(prefix => branch.startsWith(prefix)) ||
                     machineTitlePrefixes.some(prefix => title.startsWith(prefix));
            }

            function isSecurityBoundaryPath(filename) {
              const p = String(filename || '').replace(/\\/g, '/');
              const lower = p.toLowerCase();
              const base = lower.split('/').pop() || '';

              if (base === 'safety.py' || base === 'external.py') return true;
              if (base === 'authorized_test_targets.json') return true;

              // Any workflow can change GITHUB_TOKEN permissions or merge/audit behavior.
              if (lower.startsWith('.github/workflows/')) return true;
              if (lower === '.github/codeowners') return true;

              if (lower.includes('/security/') || lower.startsWith('automation/security/')) return true;
              if (lower.includes('guard')) return true;
              if (lower.includes('credential')) return true;
              if (lower.includes('scope') && lower.includes('policy')) return true;
              if (lower.includes('permission') && lower.includes('policy')) return true;
              if (lower.includes('auto-merge') || lower.includes('automerge')) return true;
              if (lower.includes('audit') && lower.includes('workflow')) return true;
              return false;
            }

            function isMergeControlCheck(name) {
              const n = String(name || '').toLowerCase();
              return n.includes('auto-merge') ||
                     n.includes('audited-machine-merge') ||
                     n.includes('audit-router') ||
                     n.includes('openhands audit router');
            }

            let merged = 0;
            let skipped = 0;

            for (const pr of pulls.data) {
              if (pr.draft) {
                console.log(`⏭️ Draft PR #${pr.number} — skip`);
                skipped++;
                continue;
              }

              if (isMachineLane(pr)) {
                console.log(`🤖 PR #${pr.number} reserved for audited autonomous merge lane — skip generic merge`);
                skipped++;
                continue;
              }

              const files = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: pr.number, per_page: 100 }
              );
              const boundaryFiles = files.filter(f => isSecurityBoundaryPath(f.filename));
              if (boundaryFiles.length > 0) {
                console.log(`🔐 PR #${pr.number} changes Security Boundary (${boundaryFiles.map(f => f.filename).join(', ')}) — generic auto-merge forbidden`);
                skipped++;
                continue;
              }

              const detail = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number
              });

              if (['blocked', 'dirty', 'unknown', 'unstable'].includes(detail.data.mergeable_state)) {
                console.log(`🔒 PR #${pr.number} mergeable_state=${detail.data.mergeable_state} — skip`);
                skipped++;
                continue;
              }

              const checks = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100
              });
              const runs = checks.data.check_runs.filter(r => !isMergeControlCheck(r.name));
              const failed = runs.filter(r =>
                r.status === 'completed' && !allowedConclusions.has(r.conclusion)
              );
              const pending = runs.filter(r => r.status !== 'completed');
              if (failed.length > 0) {
                console.log(`❌ PR #${pr.number} has ${failed.length} failing check(s) — skip`);
                skipped++;
                continue;
              }
              if (pending.length > 0) {
                console.log(`⏳ PR #${pr.number} has ${pending.length} pending check(s) — wait`);
                skipped++;
                continue;
              }

              try {
                const mergeResult = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  sha: pr.head.sha,
                });
                if (mergeResult.data.merged) {
                  console.log(`✅ Merged ordinary PR #${pr.number}: ${pr.title}`);
                  merged++;
                } else {
                  console.log(`⏭️ PR #${pr.number} not merged: ${mergeResult.data.message}`);
                  skipped++;
                }
              } catch (e) {
                console.log(`⚠️ Could not merge PR #${pr.number}: ${e.message}`);
                skipped++;
              }
            }
            console.log(`Done. merged=${merged} skipped=${skipped}`);
