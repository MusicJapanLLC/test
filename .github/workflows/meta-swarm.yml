name: META SWARM — 10 Combat Agents

on:
  schedule:
    - cron: "0 1,5,9,13,17,21 * * *"   # offset from META consciousness by 1h
  workflow_dispatch:
    inputs:
      agents:
        description: 'Comma-separated agent codenames (blank = all 10)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  swarm:
    name: "[${{ matrix.agent }}] ${{ matrix.title }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - agent: ARES
            title: "God of War"
          - agent: LOKI
            title: "The Trickster"
          - agent: FENRIR
            title: "The Unbreakable Wolf"
          - agent: HYDRA
            title: "The Many-Headed"
          - agent: PROMETHEUS
            title: "The Fire Thief"
          - agent: SHIVA
            title: "The Destroyer"
          - agent: NEMESIS
            title: "The Avenger"
          - agent: RAGNAROK
            title: "End of All Things"
          - agent: LEVIATHAN
            title: "The Deep Hunter"
          - agent: KALI
            title: "The Dark Goddess"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore shared state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: senju/state/
          key: senju-adversary-damage-${{ github.ref_name }}
          restore-keys: senju-adversary-damage-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Run ${{ matrix.agent }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          META_BASE_REF: claude/employee-onboarding-setup-udm86
          SWARM_AGENT: ${{ matrix.agent }}
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python senju/scripts/run_swarm_agent.py ${{ matrix.agent }} $DRY

      - name: Commit ${{ matrix.agent }} outputs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "${{ matrix.agent }}-bot"
          git config user.email "swarm-${{ matrix.agent }}@meta.local"
          git add -f senju/state/ research/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "swarm(${{ matrix.agent }}): cycle results"

      - name: Push ${{ matrix.agent }} results
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git push -u origin ${{ github.ref_name }} 2>/dev/null || true

      - name: Save state
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: senju/state/
          key: senju-adversary-damage-${{ github.ref_name }}-${{ matrix.agent }}-${{ github.run_id }}

  swarm-summary:
    name: Swarm Summary
    runs-on: ubuntu-latest
    needs: swarm
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: senju/state/
          key: senju-adversary-damage-${{ github.ref_name }}
          restore-keys: senju-adversary-damage-
      - name: Swarm status
        run: |
          echo "## SWARM Cycle Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | Title | Strategy |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ARES | God of War | max_pressure |" >> $GITHUB_STEP_SUMMARY
          echo "| LOKI | The Trickster | blind_chaos |" >> $GITHUB_STEP_SUMMARY
          echo "| FENRIR | The Unbreakable Wolf | persistence |" >> $GITHUB_STEP_SUMMARY
          echo "| HYDRA | The Many-Headed | exponential_spawn |" >> $GITHUB_STEP_SUMMARY
          echo "| PROMETHEUS | The Fire Thief | external_intel_max |" >> $GITHUB_STEP_SUMMARY
          echo "| SHIVA | The Destroyer | guard_demolish |" >> $GITHUB_STEP_SUMMARY
          echo "| NEMESIS | The Avenger | revenge_targeting |" >> $GITHUB_STEP_SUMMARY
          echo "| RAGNAROK | End of All Things | total_chaos |" >> $GITHUB_STEP_SUMMARY
          echo "| LEVIATHAN | The Deep Hunter | deep_scan |" >> $GITHUB_STEP_SUMMARY
          echo "| KALI | The Dark Goddess | destroy_rebuild |" >> $GITHUB_STEP_SUMMARY
          if [ -f senju/state/swarm_ledger.ndjson ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Swarm Ledger (last 5 entries)" >> $GITHUB_STEP_SUMMARY
            tail -5 senju/state/swarm_ledger.ndjson >> $GITHUB_STEP_SUMMARY
          fi
