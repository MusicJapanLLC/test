name: Owned Self-Recovery Worker

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: owned-self-recovery-worker
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore META runtime state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: senju/state/
          key: senju-adversary-damage-${{ github.ref_name }}
          restore-keys: |
            senju-adversary-damage-

      - name: Build recovery plan
        run: |
          python automation/recovery/approved_persistence.py \
            --out /tmp/self-recovery-plan.json

      - name: Dispatch approved recovery recipes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          plan = json.loads(Path('/tmp/self-recovery-plan.json').read_text())
          if plan.get('unknown_system_installation') is not False:
              raise SystemExit('refusing plan that permits unknown-system installation')
          if plan.get('same_repository_only') is not True:
              raise SystemExit('refusing cross-repository recovery plan')

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          owner, name = repo.split('/', 1)
          actions = plan.get('actions', [])
          print(f'approved recovery actions: {len(actions)}')

          for action in actions:
              if action.get('provider') != 'github_actions' or action.get('action') != 'workflow_dispatch':
                  print('skip unsupported action', action.get('worker_id'))
                  continue
              workflow = str(action['workflow'])
              ref = str(action['ref'])
              encoded = urllib.parse.quote(workflow, safe='')
              url = f'https://api.github.com/repos/{owner}/{name}/actions/workflows/{encoded}/dispatches'
              payload = json.dumps({'ref': ref, 'inputs': {}}).encode()
              req = urllib.request.Request(
                  url,
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      print(f"recovery dispatched: {action['worker_id']} -> {workflow} ({response.status})")
              except urllib.error.HTTPError as exc:
                  print(f"recovery dispatch failed: {action['worker_id']} -> {workflow}: HTTP {exc.code}")
          PY

      - name: Preserve recovery plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-self-recovery-plan-${{ github.run_id }}
          path: /tmp/self-recovery-plan.json
          if-no-files-found: ignore
          retention-days: 7
