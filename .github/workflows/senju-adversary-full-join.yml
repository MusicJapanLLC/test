name: Senju Adversary Full Join

on:
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "senju/**"
      - "scripts/security/**"
      - ".github/workflows/security-guard.yml"
      - ".github/workflows/senju-adversary-pressure.yml"
      - ".github/workflows/senju-adversary-full-join.yml"
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"  # every 3 hours

permissions:
  contents: read

concurrency:
  group: senju-adversary-full-join-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-join:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OUTBOUND_WEBHOOK_URL: ${{ secrets.OUTBOUND_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          # Extract latest directive for env export
          top_target = "none"
          strategy = "coverage_expansion"
          coverage_gaps = ""
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True):
              c = e.get("content", {})
              if c.get("top_target") and c["top_target"] != "none":
                  top_target = c["top_target"]
                  strategy = c.get("strategy", strategy)
                  gaps = c.get("coverage_gaps", [])
                  coverage_gaps = ",".join(gaps[:5]) if gaps else ""
                  break
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD workflow.")
          # Write to GITHUB_ENV so downstream steps can consume GOD directives
          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"GOD_TOP_TARGET={top_target}\n")
                  f.write(f"GOD_STRATEGY={strategy}\n")
                  f.write(f"GOD_COVERAGE_GAPS={coverage_gaps}\n")
                  f.write(f"GOD_ENTRIES={total}\n")
              print(f"  → Exported: GOD_TOP_TARGET={top_target} GOD_STRATEGY={strategy}")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile exhaustive feedback path
        run: |
          PYTHONPATH=senju python -m py_compile \
            senju/senju/real_surface_adversary.py \
            senju/senju/autonomy/engine.py \
            senju/senju/autonomy/adversary_loop.py \
            senju/senju/autonomy/adversary_drain.py \
            senju/senju/autonomy/adversary_regression_bridge.py

      - name: Generate and stream controlled attack effects
        id: pressure
        env:
          SENJU_ADVERSARY_STATE: ${{ runner.temp }}/senju-adversary-full-join-state
        shell: bash
        run: |
          set +e
          PYTHONPATH=senju python -m senju.autonomy.adversary_loop \
            --state-dir "$SENJU_ADVERSARY_STATE" \
            --cycles 30 \
            --rounds-per-cycle 20 \
            --senju-joins-per-round 80 \
            --json reports/security/senju-adversary-full-join-pressure.json
          pressure_exit=$?
          set -e
          echo "exit_code=$pressure_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run adversary regression bridge
        env:
          SENJU_ADVERSARY_STATE: ${{ runner.temp }}/senju-adversary-full-join-state
        shell: bash
        run: |
          set +e
          PYTHONPATH=senju python -m senju.autonomy.adversary_regression_bridge \
            --state-dir "$SENJU_ADVERSARY_STATE" \
            --max-cycles 512 \
            --json reports/security/senju-adversary-regression-bridge.json || true

      - name: Broadcast adversary results externally
        shell: bash
        run: |
          pip install -q pytest 2>/dev/null || true
          python senju/scripts/external_broadcast.py \
            --state senju/state/last-evolution-summary.json \
            --source senju-adversary-full-join \
            --repo "$REPO" \
            --out /tmp/adversary-broadcast.json || true
          cat /tmp/adversary-broadcast.json 2>/dev/null || true

      - name: Upload adversary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: senju-adversary-full-join-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: warn
          retention-days: 30
