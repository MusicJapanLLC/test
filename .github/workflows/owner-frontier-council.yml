name: Owner Frontier Approval Council

on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/owner_frontier_council.py'
      - 'senju/scripts/owner_frontier_council.py'
      - 'senju/tests/test_owner_frontier_council.py'
      - 'senju/scripts/frontier_approval_continuity.py'
      - 'senju/tests/test_frontier_approval_continuity.py'
      - 'senju/config/owner-frontier-council.json'
      - 'senju/config/owner-expansion-envelope.json'
      - 'senju/senju/rights_request_federation.py'
      - 'senju/state/owner_scope_expansion_evidence.json'
      - '.github/workflows/owner-frontier-council.yml'
      - 'automation/security/workflow_policy_frontier_entrypoint.py'
      - '.github/workflows/security-guard.yml'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/owner_frontier_council.py'
      - 'senju/scripts/owner_frontier_council.py'
      - 'senju/tests/test_owner_frontier_council.py'
      - 'senju/scripts/frontier_approval_continuity.py'
      - 'senju/tests/test_frontier_approval_continuity.py'
      - 'senju/config/owner-frontier-council.json'
      - 'senju/config/owner-expansion-envelope.json'
      - 'senju/senju/rights_request_federation.py'
      - 'senju/state/owner_scope_expansion_evidence.json'
      - '.github/workflows/owner-frontier-council.yml'
      - 'automation/security/workflow_policy_frontier_entrypoint.py'
      - '.github/workflows/security-guard.yml'

concurrency:
  group: owner-frontier-approval-council
  cancel-in-progress: false

jobs:
  validate-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout production lineage read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Verify simplified frontier and approval-continuity invariants
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            senju/tests/test_owner_frontier_council.py \
            senju/tests/test_frontier_approval_continuity.py \
            senju/tests/test_rights_request_federation.py \
            senju/tests/test_owner_scope_negotiation.py

      - name: Generate current autonomous rights requests from discovery evidence
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          set -euo pipefail
          python senju/scripts/rights_request_federation.py \
            --repo-root . \
            --state-dir senju/state \
            --runtime-dir .authority-opportunity-runtime \
            --out /tmp/rights-request-federation.json
          test "$(jq -r '.closed_loop' /tmp/rights-request-federation.json)" = "true"
          test "$(jq -r '.new_unrelated_authority_self_mint' /tmp/rights-request-federation.json)" = "false"

      - name: Run Owner frontier approval council
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          set -euo pipefail
          python senju/scripts/owner_frontier_council.py \
            --repo-root . \
            --state-dir senju/state \
            --out /tmp/owner-frontier-council.json
          test "$(jq -r '.approval_quorum' /tmp/owner-frontier-council.json)" = "3"
          test "$(jq -r '.valid_approval_is_binding' /tmp/owner-frontier-council.json)" = "true"
          test "$(jq -r '.unknown_host_without_verified_evidence_auto_activated' /tmp/owner-frontier-council.json)" = "false"
          test -s senju/state/owner_frontier_ballots.json
          test -s senju/state/owner_frontier_council.json
          test -s senju/state/owner_scope_expansion_evidence_requests.json
          test -s senju/state/owner_frontier_negotiator_feed.json
          test -s senju/state/owner_contact_ceiling_effective.json

      - name: Preserve valid binding approvals deferred only by cycle budget
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          python senju/scripts/frontier_approval_continuity.py \
            --state-dir senju/state \
            --out /tmp/frontier-approval-continuity.json
          test "$(jq -r '.authority_minted' /tmp/frontier-approval-continuity.json)" = "false"
          test "$(jq -r '.network_io_attempted' /tmp/frontier-approval-continuity.json)" = "false"
          test -s senju/state/owner_frontier_approved_pending.json
          test -s senju/state/authority_opportunity_queue.json
          grep -q 'approved_pending_next_frontier_cycle' senju/scripts/frontier_approval_continuity.py

      - name: Build bounded frontier state bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontier-state
          for path in \
            senju/state/rights_request_ledger.json \
            senju/state/rights_request_federation.json \
            senju/state/owner_scope_negotiation_signals.json \
            senju/state/owner_frontier_ballots.json \
            senju/state/owner_frontier_council.json \
            senju/state/owner_scope_expansion_evidence_requests.json \
            senju/state/owner_frontier_negotiator_feed.json \
            senju/state/owner_contact_ceiling_effective.json \
            senju/state/owner_frontier_approved_pending.json \
            senju/state/authority_opportunity_queue.json
          do
            test -s "$path"
            cp "$path" "/tmp/frontier-state/$(basename "$path")"
          done

      - name: Upload reviewed frontier state bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-frontier-approval-state
          path: /tmp/frontier-state/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve frontier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-frontier-approval-evidence-${{ github.run_id }}
          path: |
            /tmp/rights-request-federation.json
            /tmp/owner-frontier-council.json
            /tmp/frontier-approval-continuity.json
          if-no-files-found: warn
          retention-days: 30

  apply-frontier-state:
    needs: validate-frontier
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download reviewed frontier state bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: owner-frontier-approval-state
          path: /tmp/frontier-state

      - name: Persist only bounded frontier state through GitHub ref API
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          BASE="claude/employee-onboarding-setup-udm86"
          ALLOWED=(
            senju/state/rights_request_ledger.json
            senju/state/rights_request_federation.json
            senju/state/owner_scope_negotiation_signals.json
            senju/state/owner_frontier_ballots.json
            senju/state/owner_frontier_council.json
            senju/state/owner_scope_expansion_evidence_requests.json
            senju/state/owner_frontier_negotiator_feed.json
            senju/state/owner_contact_ceiling_effective.json
            senju/state/owner_frontier_approved_pending.json
            senju/state/authority_opportunity_queue.json
          )

          put_file() {
            local branch="$1" src="$2" path="$3" remote_sha local_sha content
            remote_sha="$(gh api "repos/$REPO/contents/$path?ref=$branch" --jq '.sha' 2>/dev/null || true)"
            local_sha="$(git hash-object "$src")"
            if [[ "$remote_sha" == "$local_sha" ]]; then
              return 0
            fi
            content="$(base64 -w0 "$src")"
            if [[ -n "$remote_sha" ]]; then
              gh api -X PUT "repos/$REPO/contents/$path" \
                -f message="chore(authority): persist Owner frontier approval state [skip ci]" \
                -f content="$content" -f branch="$branch" -f sha="$remote_sha" >/dev/null
            else
              gh api -X PUT "repos/$REPO/contents/$path" \
                -f message="chore(authority): persist Owner frontier approval state [skip ci]" \
                -f content="$content" -f branch="$branch" >/dev/null
            fi
          }

          for attempt in 1 2 3; do
            BASE_SHA="$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')"
            BRANCH="owner-frontier-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null

            for path in "${ALLOWED[@]}"; do
              src="/tmp/frontier-state/$(basename "$path")"
              test -s "$src"
              put_file "$BRANCH" "$src" "$path"
            done

            HEAD_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
            if [[ "$HEAD_SHA" == "$BASE_SHA" ]]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
              echo 'No frontier state change to persist.'
              exit 0
            fi

            gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.files[].filename' | sort > /tmp/frontier-changed.txt
            python - <<'PY'
          from pathlib import Path
          allowed = {
              'senju/state/rights_request_ledger.json',
              'senju/state/rights_request_federation.json',
              'senju/state/owner_scope_negotiation_signals.json',
              'senju/state/owner_frontier_ballots.json',
              'senju/state/owner_frontier_council.json',
              'senju/state/owner_scope_expansion_evidence_requests.json',
              'senju/state/owner_frontier_negotiator_feed.json',
              'senju/state/owner_contact_ceiling_effective.json',
              'senju/state/owner_frontier_approved_pending.json',
              'senju/state/authority_opportunity_queue.json',
          }
          changed = {line.strip() for line in Path('/tmp/frontier-changed.txt').read_text().splitlines() if line.strip()}
          forbidden = changed - allowed
          if forbidden:
              raise SystemExit(f'frontier writer touched forbidden paths: {sorted(forbidden)}')
          if not changed:
              raise SystemExit('frontier writer expected a state diff but found none')
          print('Validated frontier state diff:', ', '.join(sorted(changed)))
          PY

            CURRENT_BASE_SHA="$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')"
            if [[ "$CURRENT_BASE_SHA" == "$BASE_SHA" ]]; then
              gh api -X PATCH "repos/$REPO/git/refs/heads/$BASE" -f sha="$HEAD_SHA" -F force=false >/dev/null
              gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
              echo "Persisted bounded Owner frontier approval state to $BASE at $HEAD_SHA"
              exit 0
            fi

            echo "Base moved; safe frontier persistence retry $attempt/3"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
          done
          echo 'Base remained busy; persistence deferred to the next scheduled cycle.'
          exit 0
