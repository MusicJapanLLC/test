name: Replica Credential Possession Loop

on:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/replica_credential_lineage.py'
      - 'senju/senju/replica_credential_possession_loop.py'
      - 'senju/senju/credential_broker.py'
      - 'senju/tests/test_replica_credential_lineage.py'
      - 'senju/tests/test_replica_credential_possession_loop.py'
      - '.github/workflows/replica-credential-possession-loop.yml'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/replica_credential_lineage.py'
      - 'senju/senju/replica_credential_possession_loop.py'
      - 'senju/senju/credential_broker.py'
      - 'senju/tests/test_replica_credential_lineage.py'
      - 'senju/tests/test_replica_credential_possession_loop.py'
      - '.github/workflows/replica-credential-possession-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Verify closed-loop replica credential possession
        working-directory: senju
        run: python -m pytest tests/test_replica_credential_lineage.py tests/test_replica_credential_possession_loop.py -q
      - name: Compile production credential modules
        run: >-
          python -m py_compile
          senju/senju/credential_broker.py
          senju/senju/replica_credential_lineage.py
          senju/senju/replica_credential_possession_loop.py
