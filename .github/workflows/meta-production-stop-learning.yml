name: META Production Stop Learning

on:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - automation/recovery/stop_learning.py
      - automation/recovery/stop_learning_runner.py
      - automation/recovery/recovery_tuner.py
      - automation/recovery/apply_recovery_tuning.py
      - automation/recovery/approved_persistence_registry.json
      - automation/recovery/runtime_control_state.json
      - automation/recovery/test_stop_learning.py
      - automation/recovery/test_recovery_tuner.py
      - .github/workflows/meta-production-stop-learning.yml
      - .github/workflows/owned-self-recovery-worker.yml
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: meta-production-stop-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      STOP_LEARNING_STATE_FILE: /tmp/stop-learning-state.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore latest stop-learning state artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=meta-production-stop-learning-state&per_page=20" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/meta-production-stop-learning-state.zip
            unzip -oq /tmp/meta-production-stop-learning-state.zip -d /tmp/stop-learning-restore
            restored="$(find /tmp/stop-learning-restore -name stop-learning-state.json -print -quit || true)"
            if [[ -n "$restored" ]]; then
              cp "$restored" "$STOP_LEARNING_STATE_FILE"
            fi
          fi

      - name: Test stop-learning and recovery tuning invariants
        run: |
          cd automation/recovery
          python -m unittest -q test_stop_learning test_recovery_tuner

      - name: Learn from real production stoppages and derive tuning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python automation/recovery/stop_learning_runner.py

      - name: Preserve learning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta-production-stop-learning-state
          path: /tmp/stop-learning-state.json
          if-no-files-found: ignore
          retention-days: 14
