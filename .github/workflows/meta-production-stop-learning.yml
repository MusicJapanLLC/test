name: META Production Stop Learning

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: meta-production-stop-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test stop-learning invariants
        run: |
          cd automation/recovery
          python -m pytest test_stop_learning.py -q

      - name: Learn from real production stoppages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/recovery/stop_learning_runner.py

      - name: Preserve learning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-production-stop-learning-${{ github.run_id }}
          path: /tmp/stop-learning-state.json
          if-no-files-found: ignore
          retention-days: 14
