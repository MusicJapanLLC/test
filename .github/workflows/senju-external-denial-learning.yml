name: Senju External Denial Learning

on:
  push:
    branches:
      - "claude/employee-onboarding-setup-udm86"
    paths:
      - "senju/senju/external_denial_learning.py"
      - "senju/senju/guard_denial_feedback.py"
      - "senju/senju/external_recovery_closed_loop.py"
      - "senju/senju/external_recovery_cycle.py"
      - "senju/senju/external.py"
      - "senju/tests/test_external_denial_learning.py"
      - "senju/tests/test_guard_denial_feedback.py"
      - "senju/tests/test_external_recovery_closed_loop.py"
      - "senju/tests/test_external_recovery_cycle.py"
      - ".github/workflows/senju-external-denial-learning.yml"
      - ".github/workflows/senju-external-recovery-cycle.yml"
  pull_request:
    branches:
      - "claude/employee-onboarding-setup-udm86"
    paths:
      - "senju/senju/external_denial_learning.py"
      - "senju/senju/guard_denial_feedback.py"
      - "senju/senju/external_recovery_closed_loop.py"
      - "senju/senju/external_recovery_cycle.py"
      - "senju/senju/external.py"
      - "senju/tests/test_external_denial_learning.py"
      - "senju/tests/test_guard_denial_feedback.py"
      - "senju/tests/test_external_recovery_closed_loop.py"
      - "senju/tests/test_external_recovery_cycle.py"
      - ".github/workflows/senju-external-denial-learning.yml"
      - ".github/workflows/senju-external-recovery-cycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denial-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          # Extract latest directive for env export
          top_target = "none"
          strategy = "coverage_expansion"
          coverage_gaps = ""
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True):
              c = e.get("content", {})
              if c.get("top_target") and c["top_target"] != "none":
                  top_target = c["top_target"]
                  strategy = c.get("strategy", strategy)
                  gaps = c.get("coverage_gaps", [])
                  coverage_gaps = ",".join(gaps[:5]) if gaps else ""
                  break
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD workflow.")
          # Write to GITHUB_ENV so downstream steps can consume GOD directives
          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"GOD_TOP_TARGET={top_target}\n")
                  f.write(f"GOD_STRATEGY={strategy}\n")
                  f.write(f"GOD_COVERAGE_GAPS={coverage_gaps}\n")
                  f.write(f"GOD_ENTRIES={total}\n")
              print(f"  → Exported: GOD_TOP_TARGET={top_target} GOD_STRATEGY={strategy}")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Verify denial learning, guard pressure, and authority-preserving recovery
        working-directory: senju
        run: >-
          python -m pytest
          tests/test_external_denial_learning.py
          tests/test_guard_denial_feedback.py
          tests/test_external_recovery_closed_loop.py
          tests/test_external_recovery_cycle.py
          -q

      - name: Compile production modules
        run: >-
          python -m py_compile
          senju/senju/external_denial_learning.py
          senju/senju/guard_denial_feedback.py
          senju/senju/external_recovery_closed_loop.py
          senju/senju/external_recovery_cycle.py
          senju/senju/external.py
