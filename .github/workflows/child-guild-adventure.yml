name: THE WORLD - Child Guild Adventure

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: child-guild-adventure
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Pick one child and one adventure
        run: |
          python company-society/playground_engine.py \
            --registry company-society/child_guild.json \
            --seed "${{ github.run_id }}" \
            --json child-guild-adventure.json \
            --report child-guild-adventure.md
          cat child-guild-adventure.md >> "$GITHUB_STEP_SUMMARY"

      - name: Test the playground boundary
        run: python -m unittest company-society/test_playground_engine.py -v

      - name: Preserve adventure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: child-guild-adventure-${{ github.run_id }}
          path: |
            child-guild-adventure.md
            child-guild-adventure.json
          retention-days: 30
          if-no-files-found: warn

      - name: Tell TOMOKI what the kids picked
        if: always()
        env:
          TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
        run: |
          if [[ ! -f child-guild-adventure.md ]]; then
            printf '# THE WORLD — Child Guild\n\nAdventure generation failed.\n' > child-guild-adventure.md
          fi
          python tomoki-agents/slack_post.py \
            --agent "CHILD-GUILD" \
            --file child-guild-adventure.md \
            --status "${{ job.status }}"
