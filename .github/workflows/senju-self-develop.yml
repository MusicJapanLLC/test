name: Senju Autonomous Self-Development Loop

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:
  workflow_run:
    # Re-trigger immediately after Improver or after an auto-lab PR merges
    workflows:
      - "Senju GitHub Native Autonomous Improver"
      - "Auto Merge PRs"
    types: [completed]

concurrency:
  group: senju-self-develop
  cancel-in-progress: false

jobs:
  analyze-and-generate:
    name: Gap analysis → lab manifest generation → PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read

    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: claude/employee-onboarding-setup-udm86
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Restore latest Senju evolution summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-memory
          PREV_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju GitHub Native Autonomous Improver" \
            --status success --limit 5 \
            --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV_RUN" ]]; then
            gh run download "$PREV_RUN" --repo "$GITHUB_REPOSITORY" \
              --name senju-validated-promotion --dir /tmp/senju-memory || true
          fi
          if [[ -f /tmp/senju-memory/last-evolution-summary.json ]]; then
            cp /tmp/senju-memory/last-evolution-summary.json /tmp/evolution-summary.json
            echo "Restored from improver run $PREV_RUN"
          elif [[ -f senju/state/last-evolution-summary.json ]]; then
            cp senju/state/last-evolution-summary.json /tmp/evolution-summary.json
            echo "Using repository state"
          else
            echo '{}' > /tmp/evolution-summary.json
            echo "Starting fresh"
          fi

      - name: Run coverage gap analysis (ELO-weighted)
        id: gap
        working-directory: senju
        shell: python
        run: |
          import sys, json, os
          sys.path.insert(0, ".")
          from senju.lab_planner import analyze_coverage, find_gaps, _existing_covered_classes
          from pathlib import Path

          summary = json.loads(Path("/tmp/evolution-summary.json").read_text())
          existing = _existing_covered_classes(Path("labs"))
          coverage = analyze_coverage(summary)
          gaps = find_gaps(coverage, summary, existing)

          print(f"Existing covered classes: {sorted(existing)}")
          print(f"Gaps ({len(gaps)}): {gaps}")

          with open("/tmp/gaps.json", "w") as f:
              json.dump({"gaps": gaps, "coverage": coverage, "existing": list(existing)}, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"gap_count={len(gaps)}\n")
              f.write(f"has_gaps={'true' if gaps else 'false'}\n")

      - name: Generate lab manifests (skip existing)
        id: gen
        if: steps.gap.outputs.has_gaps == 'true'
        working-directory: senju
        shell: python
        run: |
          import sys, json, os
          sys.path.insert(0, ".")
          from senju.lab_planner import plan
          from pathlib import Path

          written = plan("/tmp/evolution-summary.json", "labs", max_manifests=3)
          paths = [str(p) for p in written]
          print(f"Generated: {paths}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"manifest_count={len(written)}\n")
              f.write(f"manifests={json.dumps(paths)}\n")

      - name: Commit, push, open PR
        if: steps.gen.outputs.manifest_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="senju/auto-lab-gen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add senju/labs/
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }

          COUNT='${{ steps.gen.outputs.manifest_count }}'
          MANIFESTS='${{ steps.gen.outputs.manifests }}'
          GAPS="$(python3 -c "import json; print(len(json.load(open('/tmp/gaps.json'))['gaps']))")" 

          git commit -m "feat(senju): auto-generate $COUNT lab manifest(s) [$GAPS gaps found] [run ${GITHUB_RUN_ID}]"
          git push -u origin "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "feat(senju): auto-generate lab manifests [$GAPS gaps, run ${GITHUB_RUN_ID}]" \
            --body "## Senju Auto-Lab Generation

ELO-weighted coverage gap analysis found **${GAPS}** uncovered attack classes.
Generated **${COUNT}** new lab manifest(s) targeting the highest-urgency gaps.

**New manifests:** ${MANIFESTS}

Will be auto-merged and active on the next Senju evolution cycle.

---
_Generated by [Claude Code](https://claude.ai/code)_"

      - name: Summary
        if: always()
        shell: bash
        run: |
          COUNT="${{ steps.gen.outputs.manifest_count || 0 }}"
          GAPS="$(python3 -c "import json; d=json.load(open('/tmp/gaps.json')); print(len(d['gaps']))" 2>/dev/null || echo '?')"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Senju Self-Development Run ${GITHUB_RUN_ID}
          - Gaps found (ELO-weighted): **${GAPS}**
          - Lab manifests generated: **${COUNT}**
          EOF
