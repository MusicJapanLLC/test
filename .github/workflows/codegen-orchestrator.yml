name: Codegen Orchestrator (Autonomous)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full | run | expand | report"
        default: "full"
      new_task_count:
        description: "New tasks to generate"
        default: "5"
      max_iterations:
        description: "Max codegen iterations per task"
        default: "15"
  repository_dispatch:
    types: [codegen-full, codegen-run, codegen-expand]

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install anthropic pytest

      - name: Resolve mode
        id: cfg
        run: |
          MODE="${{ github.event.inputs.mode || github.event.client_payload.mode || 'full' }}"
          NEW_COUNT="${{ github.event.inputs.new_task_count || github.event.client_payload.new_task_count || '5' }}"
          MAX_ITER="${{ github.event.inputs.max_iterations || github.event.client_payload.max_iterations || '15' }}"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          echo "max_iter=$MAX_ITER" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "claude-codegen-orchestrator"
          git config user.email "claude-codegen@noreply"

      - name: Create cycle branch
        id: branch
        run: |
          BRANCH="codegen/cycle-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Run orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: automation/codegen
        run: |
          python orchestrator.py \
            "${{ steps.cfg.outputs.mode }}" \
            "${{ steps.cfg.outputs.new_count }}" \
            "${{ steps.cfg.outputs.max_iter }}"

      - name: Commit & push all results
        if: always()
        run: |
          git add -A \
            automation/codegen/runs/ \
            automation/codegen/generated/ \
            automation/codegen/knowledge/ \
            automation/codegen/tasks/auto/ \
            automation/codegen/tests/ \
            automation/agent_factory/codegen_feed.ndjson \
            tomoki-agents/data/codegen_feed.ndjson \
            automation/reporting/codegen_summary.ndjson \
            data/codegen_knowledge.ndjson 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" || \
            git commit -m "codegen(cycle): $(date +%Y-%m-%dT%H:%M) mode=${{ steps.cfg.outputs.mode }} [skip ci]"
          git push -u origin "${{ steps.branch.outputs.branch }}"

      - name: Summary
        if: always()
        run: |
          echo "## Codegen Cycle" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: \`${{ steps.cfg.outputs.mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ steps.branch.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f automation/codegen/knowledge/index.json ]; then
            python -c "
import json
idx = json.load(open('automation/codegen/knowledge/index.json'))
print(f'- Tasks tracked: {len(idx)}')
print(f'- Passing: {sum(1 for v in idx.values() if v.get(\"successes\",0)>0)}/{len(idx)}')
print(f'- Total attempts: {sum(v.get(\"attempts\",0) for v in idx.values())}')
" >> $GITHUB_STEP_SUMMARY
          fi
