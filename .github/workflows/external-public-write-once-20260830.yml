name: THE WORLD External Public Write Once 20260830

on:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - ".github/workflows/external-public-write-once-20260830.yml"

permissions:
  contents: read

jobs:
  publish-exactly-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Autonomous browser worker writes exactly one public web entry
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_URL='https://the-world-public-write-proof-bvhivr.v2.appdeploy.ai/'
          MARKER="THE-WORLD-AUTONOMY-PROOF-${GITHUB_RUN_ID}"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME" ]]; then
            echo 'No Chromium-compatible browser on runner.' >&2
            exit 1
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "${PUBLIC_URL}?worker_marker=${MARKER}" > /tmp/write-result.html
          if ! grep -Fq "Worker write confirmed: ${MARKER}" /tmp/write-result.html; then
            echo 'Browser opened the public site, but the write confirmation was not rendered.' >&2
            grep -o 'Worker write [^<]*' /tmp/write-result.html | tail -n 5 || true
            exit 1
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$PUBLIC_URL" > /tmp/public-result.html
          if ! grep -Fq "$MARKER" /tmp/public-result.html; then
            echo 'Write confirmation rendered, but marker was not visible on a clean public-page read.' >&2
            exit 1
          fi

          python - <<'PY'
          import json, os
          marker = f"THE-WORLD-AUTONOMY-PROOF-{os.environ['GITHUB_RUN_ID']}"
          receipt = {
              'schema':'the-world-external-public-write-once/v4',
              'status':'POSTED',
              'platform':'appdeploy-public-web-via-browser',
              'marker':marker,
              'writer':'github-actions[bot] browser worker',
              'remote_url':'https://the-world-public-write-proof-bvhivr.v2.appdeploy.ai/',
              'verified_by_clean_public_browser_read':True,
              'email_used':False,
          }
          with open('external-public-write-receipt.json','w',encoding='utf-8') as f:
              json.dump(receipt,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps(receipt,ensure_ascii=False))
          PY

      - name: Preserve public-write receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-public-write-once-receipt
          retention-days: 30
          if-no-files-found: warn
          path: external-public-write-receipt.json
