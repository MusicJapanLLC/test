name: THE WORLD External Public Write Once 20260830

on:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - ".github/workflows/external-public-write-once-20260830.yml"

permissions:
  contents: read

jobs:
  publish-exactly-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Autonomous worker writes one post to public web app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          public_url = 'https://the-world-public-write-proof-bvhivr.v2.appdeploy.ai/'
          endpoint = public_url + 'api/posts'
          marker = f"THE-WORLD-AUTONOMY-PROOF-{os.environ['GITHUB_RUN_ID']}"
          payload = {
              'marker': marker,
              'message': 'One benign public test post written autonomously by a GitHub Actions worker. Email was not used.',
              'source': 'https://github.com/MusicJapanLLC/test/issues/100',
          }
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type':'application/json','User-Agent':'TheWorld-OneShotPublicWrite/2.0'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=25) as res:
              body = json.loads(res.read().decode('utf-8') or '{}')
              code = int(res.status)
          if not (200 <= code < 300):
              raise SystemExit(f'POST failed: {code}')

          with urllib.request.urlopen(endpoint, timeout=25) as res:
              listing = json.loads(res.read().decode('utf-8') or '{}')
          matched = [p for p in listing.get('posts', []) if p.get('marker') == marker]
          if not matched:
              raise SystemExit('POST returned success but marker was not visible in public read API')

          receipt = {
              'schema':'the-world-external-public-write-once/v2',
              'status':'POSTED',
              'platform':'appdeploy-public-web',
              'marker':marker,
              'http_status':code,
              'remote_id':(body.get('post') or {}).get('id'),
              'remote_url':public_url,
              'verified_by_read_api':True,
          }
          with open('external-public-write-receipt.json','w',encoding='utf-8') as f:
              json.dump(receipt,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps(receipt,ensure_ascii=False))
          PY

      - name: Preserve public-write receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-public-write-once-receipt
          retention-days: 30
          if-no-files-found: warn
          path: external-public-write-receipt.json
