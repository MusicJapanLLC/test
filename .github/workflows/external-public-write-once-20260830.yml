name: THE WORLD External Public Write Once 20260830

on:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - ".github/workflows/external-public-write-once-20260830.yml"

permissions:
  contents: read

jobs:
  publish-exactly-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Autonomous worker creates exactly one public dpaste snippet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          marker = f"THE-WORLD-AUTONOMY-PROOF-{os.environ['GITHUB_RUN_ID']}"
          content = (
              f"{marker}\n\n"
              "One benign public test post written autonomously by a GitHub Actions worker.\n"
              "Purpose: verify autonomous execution -> external internet write -> public URL.\n"
              "Email was not used.\n"
              "Source: https://github.com/MusicJapanLLC/test/issues/100\n"
          )
          data = urllib.parse.urlencode({
              'format':'url',
              'content':content,
              'lexer':'_text',
              'expires':'604800',
          }).encode('utf-8')
          req = urllib.request.Request(
              'https://dpaste.org/api/',
              data=data,
              headers={'Content-Type':'application/x-www-form-urlencoded','User-Agent':'TheWorld-OneShotPublicWrite/3.0'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=25) as res:
              public_url = res.read().decode('utf-8').strip().strip('"')
              code = int(res.status)
          if not (200 <= code < 300) or not public_url.startswith('https://dpaste.org/'):
              raise SystemExit(f'dpaste create failed: status={code} url={public_url!r}')

          check = urllib.request.Request(public_url, headers={'User-Agent':'TheWorld-OneShotPublicWrite/3.0'})
          with urllib.request.urlopen(check, timeout=25) as res:
              page = res.read(262144).decode('utf-8','replace')
              verify_code = int(res.status)
          if marker not in page:
              raise SystemExit('dpaste returned a public URL but marker was not visible when fetched')

          receipt = {
              'schema':'the-world-external-public-write-once/v3',
              'status':'POSTED',
              'platform':'dpaste.org',
              'marker':marker,
              'http_status':code,
              'verify_http_status':verify_code,
              'remote_url':public_url,
              'verified_by_public_get':True,
          }
          with open('external-public-write-receipt.json','w',encoding='utf-8') as f:
              json.dump(receipt,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps(receipt,ensure_ascii=False))
          PY

      - name: Preserve public-write receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-public-write-once-receipt
          retention-days: 30
          if-no-files-found: warn
          path: external-public-write-receipt.json
