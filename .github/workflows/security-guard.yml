name: Security Guard

on:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
  schedule:
    - cron: "23 1 * * 1"

permissions:
  contents: read

concurrency:
  group: security-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\..*)|\.npmrc$|\.pypirc$|\.netrc$|credentials\.json$|token\.json$|client_secret[^/]*\.json$|service-account[^/]*\.json$|firebase-adminsdk[^/]*\.json$|.*\.(pem|key|p12|pfx|kdbx)$|id_rsa$|id_ed25519$)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden secret-bearing files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Block obvious credential material
        shell: bash
        run: |
          set -euo pipefail
          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}'
          if git grep -I -nE -e "$patterns" -- ':!*.md' ':!*.example' ':!.github/workflows/security-guard.yml'; then
            echo "Potential credential material found in tracked source."
            exit 1
          fi

      - name: Scan newly introduced lines for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}'
          diff_file="$(mktemp)"
          if [[ "$EVENT_NAME" == "pull_request" && -n "${BASE_SHA:-}" && -n "${PR_HEAD_SHA:-}" ]]; then
            git diff --unified=0 "$BASE_SHA...$PR_HEAD_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --unified=0 "$BEFORE_SHA" "$CURRENT_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file"
          else
            git show --format= --unified=0 "$CURRENT_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file" || true
          fi
          if grep '^+' "$diff_file" | grep -v '^+++' | grep -E -- "$patterns"; then
            echo "Potential secret introduced by this change."
            exit 1
          fi

      - name: Validate privileged workflow blast radii
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.github/workflows')
          workflows = {p.name: p.read_text(encoding='utf-8') for p in root.glob('*.y*ml')}
          write_re = re.compile(
              r'(?m)^\s+(contents|actions|checks|deployments|issues|packages|pull-requests|statuses|pages|id-token|copilot-requests):\s*write\s*$'
          )

          unsafe = [
              'pull_request_target:', 'workflow_run:', 'issue_comment:', 'repository_dispatch:',
              'runs-on: self-hosted', 'permissions: write-all', 'write-all',
              'git push --force', 'git push -f', '--yolo', '--allow-all-tools',
          ]
          for name, body in workflows.items():
              if name == 'security-guard.yml':
                  continue
              for token in unsafe:
                  if token in body:
                      raise SystemExit(f'{name}: forbidden workflow capability: {token}')

          def writes(body: str) -> set[str]:
              return {m.group(1) for m in write_re.finditer(body)}

          def require(name: str, required: list[str], forbidden: list[str] | None = None) -> str:
              body = workflows.get(name, '')
              if not body:
                  return ''
              for item in required:
                  if item not in body:
                      raise SystemExit(f'{name}: missing required guardrail: {item}')
              for item in (forbidden or []):
                  if item in body:
                      raise SystemExit(f'{name}: contains forbidden capability: {item}')
              return body

          # GitHub Pages is a legitimate OIDC use. Validate it by capability rather than filename
          # so every current/future Pages deployment gets the same bounded policy automatically.
          page_lanes = set()
          for name, body in workflows.items():
              w = writes(body)
              if 'pages' not in w:
                  continue
              page_lanes.add(name)
              if w - {'pages', 'id-token'}:
                  raise SystemExit(f'{name}: Pages lane has unrelated write permissions: {sorted(w)}')
              for item in [
                  'contents: read', 'pages: write', 'id-token: write', 'name: github-pages',
                  'actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128',
              ]:
                  if item not in body:
                      raise SystemExit(f'{name}: Pages lane missing invariant: {item}')
              if body.count('pages: write') != 1 or body.count('id-token: write') != 1:
                  raise SystemExit(f'{name}: Pages/OIDC write permissions must exist in exactly one deployment job')
              if 'pull_request:' in body and "if: github.event_name != 'pull_request'" not in body:
                  raise SystemExit(f'{name}: PR-triggered Pages workflow must suppress deployment on PR events')
              if 'push:' in body and 'paths:' not in body:
                  raise SystemExit(f'{name}: auto Pages deployment must be path-scoped')
              if 'schedule:' in body:
                  raise SystemExit(f'{name}: Pages deployment must not be schedule-triggered')

          # OIDC is allowed only for the resident worker or validated Pages lanes.
          oidc_lanes = {name for name, body in workflows.items() if 'id-token' in writes(body)}
          unexpected_oidc = oidc_lanes - page_lanes - {'the-world-task-worker.yml'}
          if unexpected_oidc:
              raise SystemExit(f'Unexpected OIDC write lanes: {sorted(unexpected_oidc)}')

          task_worker = require(
              'the-world-task-worker.yml',
              ['contents: read', 'actions: write', 'id-token: write', 'workflow_dispatch:', 'schedule:',
               "cron: '*/5 * * * *'", 'persist-credentials: false',
               'automation/world/task_worker.py', 'gh workflow run',
               'Claim one personality-linked task', 'Reconcile downstream GitHub evidence'],
              ['contents: write', 'issues: write', 'pull-requests: write', 'packages: write',
               'deployments: write', 'pages: write'],
          )
          if task_worker:
              if writes(task_worker) != {'actions', 'id-token'}:
                  raise SystemExit(f'the-world-task-worker.yml: unexpected writes {sorted(writes(task_worker))}')
              # Build the marker in pieces so GitHub does not interpret it inside this policy script.
              secrets_marker = '$' + '{{' + ' secrets.'
              if secrets_marker in task_worker:
                  raise SystemExit('the-world-task-worker.yml: long-lived Actions secrets are forbidden')
              client = Path('automation/world/task_worker.py').read_text(encoding='utf-8')
              for item in [
                  'AUDIENCE = "the-world-worker"',
                  'GATEWAY_PROTOCOL = "oidc-repository-v4-audited"',
                  'ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN',
                  'method="POST"',
                  'https://czwdtjgunsafcifjhpwt.supabase.co/functions/v1/the-world-github-worker',
              ]:
                  if item not in client:
                      raise SystemExit(f'task_worker.py: missing OIDC/gateway invariant: {item}')

          explicit = {
              'senju-autonomous-improver.yml': {'contents'},
              'tomoki-forge.yml': {'contents', 'pull-requests', 'copilot-requests'},
              'tomoki-manager.yml': {'actions', 'copilot-requests'},
              'tomoki-hound.yml': {'copilot-requests'},
              'tomoki-skeptic.yml': {'copilot-requests'},
              'ai-factory-boss.yml': {'actions'},
              'the-world-realtime-kernel.yml': {'actions'},
              'the-core-autonomous-director.yml': {'actions', 'copilot-requests'},
              'world-reality-agency.yml': {'issues'},
          }
          for name, expected in explicit.items():
              body = workflows.get(name, '')
              if not body:
                  continue
              actual = writes(body)
              if actual != expected:
                  raise SystemExit(f'{name}: privileged write set drifted: expected={sorted(expected)} actual={sorted(actual)}')
              for invariant in ['workflow_dispatch:', 'schedule:', 'persist-credentials: false']:
                  if invariant not in body:
                      raise SystemExit(f'{name}: missing privileged-lane invariant: {invariant}')

          # HOUND and SKEPTIC are local/read-only observers. Copilot may edit the ephemeral
          # checkout/report and use git/gh read surfaces, but repository token writes remain denied.
          for observer_name in ['tomoki-hound.yml', 'tomoki-skeptic.yml']:
              observer = workflows.get(observer_name, '')
              if not observer:
                  continue
              copilot_lines = [x.strip() for x in observer.splitlines() if x.strip().startswith('copilot -p ')]
              if len(copilot_lines) != 1:
                  raise SystemExit(f'{observer_name}: must have exactly one Copilot execution line')
              line = copilot_lines[0]
              for required_cap in [
                  '--allow-tool=write', "--allow-tool='shell(git:*)'",
                  "--allow-tool='shell(gh:*)'", '--no-ask-user',
              ]:
                  if required_cap not in line:
                      raise SystemExit(f'{observer_name}: missing bounded observer capability: {required_cap}')
              if line.count("--allow-tool='shell(") != 2:
                  raise SystemExit(f'{observer_name}: observer shell capability expanded beyond git/gh')

          # Reality Agency may create one daily issue only in an explicitly allowlisted owned repo.
          reality = workflows.get('world-reality-agency.yml', '')
          if reality:
              for item in [
                  'contents: read', 'actions: read', 'issues: write',
                  'outside-world/reality_policy.json', 'outside-world/reality_gateway.py',
                  '--execute-owned-writes', 'persist-credentials: false',
              ]:
                  if item not in reality:
                      raise SystemExit(f'world-reality-agency.yml: missing owned-write invariant: {item}')
              gateway = Path('outside-world/reality_gateway.py').read_text(encoding='utf-8')
              policy_path = Path('outside-world/reality_policy.json')
              if not policy_path.exists():
                  raise SystemExit('world-reality-agency.yml: reality policy is missing')
              policy = json.loads(policy_path.read_text(encoding='utf-8'))
              repos = ((policy.get('allowlists') or {}).get('github_repositories') or [])
              if repos != ['MusicJapanLLC/test']:
                  raise SystemExit(f'world-reality-agency.yml: GitHub issue allowlist drifted: {repos}')
              for marker in [
                  'repo not in allowed', 'SKIPPED_DAILY_LIMIT',
                  'https://api.github.com/repos/{repo}/issues',
                  'Treat this as external evidence/inspiration. Validate before promoting',
              ]:
                  if marker not in gateway:
                      raise SystemExit(f'reality_gateway.py: missing bounded issue invariant: {marker}')

          # Preserve the tightest file-level restrictions on autonomous code writers.
          senju = workflows.get('senju-autonomous-improver.yml', '')
          if senju:
              for item in [
                  'senju/state/champion.json', 'senju/state/strategy.json',
                  'senju/state/last-evolution-summary.json', 'senju/state/last-evolution-plan.md',
                  'CURRENT_BASE_SHA=', 'force=false',
              ]:
                  if item not in senju:
                      raise SystemExit(f'senju-autonomous-improver.yml: missing invariant: {item}')
              allowed = {
                  'senju/state/champion.json', 'senju/state/strategy.json',
                  'senju/state/last-evolution-summary.json', 'senju/state/last-evolution-plan.md',
              }
              observed = {
                  line.strip().split()[-1] for line in senju.splitlines()
                  if line.strip().startswith('put_file ')
              }
              if observed != allowed:
                  raise SystemExit(f'Senju autonomous write allowlist mismatch: {sorted(observed)}')

          forge = workflows.get('tomoki-forge.yml', '')
          if forge:
              for item in ['python /tmp/tomoki-policy-gate.py', 'bash /tmp/tomoki-verify.sh',
                           'git add -A -- sales-command-30', 'gh pr create']:
                  if item not in forge:
                      raise SystemExit(f'tomoki-forge.yml: missing bounded-writer invariant: {item}')
              copilot_lines = [x.strip() for x in forge.splitlines() if x.strip().startswith('copilot -p ')]
              if len(copilot_lines) != 1 or '--allow-tool=write' not in copilot_lines[0] or 'shell(' in copilot_lines[0]:
                  raise SystemExit('TOMOKI FORGE Copilot permissions drifted')

          director = workflows.get('the-core-autonomous-director.yml', '')
          if director:
              copilot_lines = [x.strip() for x in director.splitlines() if x.strip().startswith('copilot -p ')]
              if len(copilot_lines) != 1 or '--allow-tool=write' not in copilot_lines[0] or 'shell(' in copilot_lines[0]:
                  raise SystemExit('THE CORE Director Copilot permissions drifted')

          # Anything else with repository-affecting writes is denied by default.
          known = set(explicit) | page_lanes | {'the-world-task-worker.yml', 'security-guard.yml'}
          unknown = {name: sorted(writes(body)) for name, body in workflows.items() if writes(body) and name not in known}
          if unknown:
              raise SystemExit(f'Unclassified privileged workflows: {unknown}')
          PY

      - name: Validate TOMOKI FORGE file policy remains bounded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          gate = Path('tomoki-agents/policy_gate.py')
          verifier = Path('tomoki-agents/verify.sh')
          workflow = Path('.github/workflows/tomoki-forge.yml')
          if not workflow.exists():
              raise SystemExit(0)
          if not gate.exists() or not verifier.exists():
              raise SystemExit('TOMOKI FORGE guardrail files are missing')
          gate_text = gate.read_text(encoding='utf-8')
          for item in [
              "'sales-command-30/src/'", "'sales-command-30/tests/'",
              "'sales-command-30/README.md'", 'if len(names) > 3:',
              'if changed_lines > 250:', 'FORBIDDEN_PATTERNS',
          ]:
              if item not in gate_text:
                  raise SystemExit(f'TOMOKI policy gate missing invariant: {item}')
          if "'.github/" in gate_text or '".github/' in gate_text:
              raise SystemExit('TOMOKI policy gate must never allow .github writes')
          verify_text = verifier.read_text(encoding='utf-8')
          if 'npm run build' not in verify_text or 'py_compile' not in verify_text:
              raise SystemExit('TOMOKI verifier must retain compile/build checks')
          PY

      - name: Block remote shell execution patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(curl|wget).*(\|[[:space:]]*(bash|sh))|(bash|sh|source)[[:space:]]*<\([[:space:]]*(curl|wget)' .github/workflows --exclude='security-guard.yml'; then
            echo "Remote content is being executed directly as shell code."
            exit 1
          fi

      - name: Block direct interpolation of untrusted event text
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '\$\{\{[[:space:]]*github\.event\.(issue|comment|pull_request)\.(title|body)' .github/workflows --exclude='security-guard.yml'; then
            echo "Untrusted event text is directly interpolated into a workflow."
            exit 1
          fi

      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r entry; do
            ref="${entry#uses:}"
            ref="${ref#${ref%%[![:space:]]*}}"
            [[ "$ref" == ./* ]] && continue
            version="${ref##*@}"
            if [[ ! "$version" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Action is not pinned to a full commit SHA: $ref"
              failed=1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows --exclude='security-guard.yml' || true)
          exit "$failed"

      - name: Require checkout credentials to be discarded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          failures = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if 'uses: actions/checkout@' not in line:
                      continue
                  block = '\n'.join(lines[i:i+8])
                  if 'persist-credentials: false' not in block:
                      failures.append(f'{path}:{i+1}')
          if failures:
              raise SystemExit('checkout must set persist-credentials: false at ' + ', '.join(failures))
          PY
