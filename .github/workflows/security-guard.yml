name: Security Guard

on:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Block tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\..*)|credentials\.json$|token\.json$|.*\.(pem|key|p12|pfx)$|id_rsa$|id_ed25519$)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden secret-bearing files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Block obvious credential material
        shell: bash
        run: |
          set -euo pipefail
          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}'
          if git grep -nE -e "$patterns" -- ':!*.md' ':!*.example' ':!.github/workflows/security-guard.yml'; then
            echo "Potential credential material found in tracked source."
            exit 1
          fi

      - name: Enforce safe workflow triggers and permissions
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'pull_request_target:|permissions:[[:space:]]*write-all' .github/workflows --exclude='security-guard.yml'; then
            echo "Unsafe GitHub Actions trigger or broad write permission detected."
            exit 1
          fi

      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r entry; do
            ref="${entry#uses:}"
            ref="${ref#${ref%%[![:space:]]*}}"
            [[ "$ref" == ./* ]] && continue
            version="${ref##*@}"
            if [[ ! "$version" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Action is not pinned to a full commit SHA: $ref"
              failed=1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows || true)
          exit "$failed"
