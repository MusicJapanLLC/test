name: Security Guard

on:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
  schedule:
    - cron: "23 1 * * 1"

permissions:
  contents: read

concurrency:
  group: security-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\..*)|\.npmrc$|\.pypirc$|\.netrc$|credentials\.json$|token\.json$|client_secret[^/]*\.json$|service-account[^/]*\.json$|firebase-adminsdk[^/]*\.json$|.*\.(pem|key|p12|pfx|kdbx)$|id_rsa$|id_ed25519$)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden secret-bearing files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Block obvious credential material in tracked source
        shell: bash
        run: |
          set -euo pipefail
          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}'
          if git grep -I -nE -e "$patterns" -- ':!*.md' ':!*.example' ':!.github/workflows/security-guard.yml'; then
            echo "Potential credential material found in tracked source."
            exit 1
          fi

      - name: Scan newly introduced lines for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}'
          diff_file="$(mktemp)"
          if [[ "$EVENT_NAME" == "pull_request" && -n "${BASE_SHA:-}" && -n "${PR_HEAD_SHA:-}" ]]; then
            git diff --unified=0 "$BASE_SHA...$PR_HEAD_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --unified=0 "$BEFORE_SHA" "$CURRENT_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file"
          else
            git show --format= --unified=0 "$CURRENT_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file" || true
          fi
          if grep '^+' "$diff_file" | grep -v '^+++' | grep -E -- "$patterns"; then
            echo "Potential secret introduced by this change. Rotate it if it was real, then remove it from history before merging."
            exit 1
          fi

      - name: Block unsafe workflow triggers and runners
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'pull_request_target:|workflow_run:|issue_comment:|repository_dispatch:|permissions:[[:space:]]*write-all|runs-on:[[:space:]]*self-hosted' .github/workflows --exclude='security-guard.yml'; then
            echo "Unsafe workflow trigger, broad permission, or self-hosted runner detected."
            exit 1
          fi

      - name: Enforce privileged permission allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          allowed = {
              '.github/workflows/codeql.yml': {'security-events'},
              '.github/workflows/deploy-iyomaru-ramen.yml': {'pages', 'id-token'},
              '.github/workflows/pages.yml': {'pages', 'id-token'},
              '.github/workflows/release-provenance.yml': {'attestations', 'id-token'},
              '.github/workflows/senju-autonomous-improver.yml': {'contents', 'pull-requests'},
              '.github/workflows/senju-promotion-gate.yml': {'contents', 'pull-requests'},
              '.github/workflows/tomoki-forge.yml': {'contents', 'pull-requests', 'copilot-requests'},
              '.github/workflows/tomoki-forge-promotion-gate.yml': {'contents', 'pull-requests'},
          }
          failures=[]
          pattern=re.compile(r'^\s+([a-z0-9-]+):\s*write\s*(?:#.*)?$')
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              if path.name == 'security-guard.yml':
                  continue
              permitted=allowed.get(str(path), set())
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  m=pattern.match(line)
                  if not m:
                      continue
                  scope=m.group(1)
                  if scope not in permitted:
                      failures.append(f'{path}:{lineno}: unauthorized {scope}: write')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Block administrative bypass and destructive workflow Git operations
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'gh[[:space:]]+pr[[:space:]]+merge[^\n]*--admin|git[[:space:]]+push[^\n]*(--force|-f([[:space:]]|$))|gh[[:space:]]+api[^\n]*-X[[:space:]]+DELETE' .github/workflows --exclude='security-guard.yml'; then
            echo "Administrative bypass, forced push, or destructive GitHub API operation detected."
            exit 1
          fi

      - name: Enforce Senju two-key boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          proposal_path=Path('.github/workflows/senju-autonomous-improver.yml')
          gate_path=Path('.github/workflows/senju-promotion-gate.yml')
          if not proposal_path.exists() or not gate_path.exists():
              raise SystemExit('Senju two-key workflows must both exist')
          proposal=proposal_path.read_text(encoding='utf-8')
          gate=gate_path.read_text(encoding='utf-8')
          if 'gh pr merge' in proposal or '/pulls/$PR/merge' in proposal:
              raise SystemExit('Senju proposal workflow must never hold merge authority')
          if 'secrets.' in proposal:
              raise SystemExit('Senju proposal workflow must not receive repository secrets')
          if 'models:' in gate or 'secrets.' in gate or 'copilot-requests:' in gate:
              raise SystemExit('Senju deterministic gate must not receive AI/model access or repository secrets')
          if 'actions/checkout@' in gate:
              raise SystemExit('Senju promotion gate must not checkout candidate code')
          if '--admin' in proposal or '--admin' in gate:
              raise SystemExit('Senju may not use administrator merge bypass')
          expected={
              'senju/state/champion.json',
              'senju/state/strategy.json',
              'senju/state/last-evolution-summary.json',
              'senju/state/last-evolution-plan.md',
          }
          destinations=set()
          for line in proposal.splitlines():
              m=re.search(r'^\s*put_file\s+\S+\s+(senju/state/\S+)\s*$', line)
              if m:
                  destinations.add(m.group(1))
          if destinations != expected:
              raise SystemExit(f'Senju proposal write surface changed: {sorted(destinations)}')
          PY

      - name: Enforce TOMOKI FORGE three-zone isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wf=Path('.github/workflows/tomoki-forge.yml')
          gate=Path('.github/workflows/tomoki-forge-promotion-gate.yml')
          verifier=Path('.github/workflows/tomoki-forge-pr-verify.yml')
          if not wf.exists() or not gate.exists() or not verifier.exists():
              raise SystemExit('FORGE isolation workflows must all exist')
          text=wf.read_text(encoding='utf-8')
          gate_text=gate.read_text(encoding='utf-8')
          verify_text=verifier.read_text(encoding='utf-8')

          if '\n  propose:\n' not in text or '\n  publish:\n' not in text or '\n  report:\n' not in text:
              raise SystemExit('FORGE must keep propose/publish/report jobs separated')
          propose=text.split('\n  propose:\n',1)[1].split('\n  publish:\n',1)[0]
          publish=text.split('\n  publish:\n',1)[1].split('\n  report:\n',1)[0]
          report=text.split('\n  report:\n',1)[1]

          if 'copilot-requests: write' not in propose or 'contents: write' in propose or 'pull-requests: write' in propose:
              raise SystemExit('FORGE AI proposal zone may access Copilot but must not have repository write authority')
          if 'COPILOT_GITHUB_TOKEN:' not in propose or '--allow-tool=write' not in propose:
              raise SystemExit('FORGE proposal invariant changed unexpectedly')
          if 'contents: write' not in publish or 'pull-requests: write' not in publish:
              raise SystemExit('FORGE publisher must hold only explicit PR publication authority')
          if 'copilot-requests: write' in publish or 'COPILOT_GITHUB_TOKEN:' in publish or 'secrets.' in publish:
              raise SystemExit('FORGE publisher must never receive AI credentials or repository secrets')
          if 'gh pr merge' in text or '--admin' in text:
              raise SystemExit('FORGE generator/publisher may never merge its own PR')
          if 'TOMOKI_SLACK_WEBHOOK_URL' not in report or 'contents: write' in report or 'copilot-requests: write' in report:
              raise SystemExit('FORGE Slack reporting must remain isolated from AI and repository-write authority')
          if 'actions/checkout@' in gate_text or 'secrets.' in gate_text or 'copilot-requests:' in gate_text:
              raise SystemExit('FORGE deterministic merge gate must not checkout candidate code or receive AI/secrets')
          if '-f sha="$HEAD"' not in gate_text or '--admin' in gate_text:
              raise SystemExit('FORGE merge gate must bind merge to exact candidate SHA without admin bypass')
          if 'permissions:\n  contents: read' not in verify_text:
              raise SystemExit('FORGE PR verifier must remain read-only')
          PY

      - name: Block remote shell execution patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(curl|wget).*(\|[[:space:]]*(bash|sh))|(bash|sh|source)[[:space:]]*<\([[:space:]]*(curl|wget)' .github/workflows --exclude='security-guard.yml'; then
            echo "Remote content is being executed directly as shell code."
            exit 1
          fi

      - name: Block direct interpolation of untrusted event text
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '\$\{\{[[:space:]]*github\.event\.(issue|comment|pull_request)\.(title|body)' .github/workflows --exclude='security-guard.yml'; then
            echo "Untrusted event text is directly interpolated into a workflow. Pass it through env/input handling instead."
            exit 1
          fi

      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r entry; do
            ref="${entry#uses:}"
            ref="${ref#${ref%%[![:space:]]*}}"
            [[ "$ref" == ./* ]] && continue
            version="${ref##*@}"
            if [[ ! "$version" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Action is not pinned to a full commit SHA: $ref"
              failed=1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows --exclude='security-guard.yml' || true)
          exit "$failed"

      - name: Require checkout credentials to be discarded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          failures = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if 'uses: actions/checkout@' not in line:
                      continue
                  block = '\n'.join(lines[i:i+8])
                  if 'persist-credentials: false' not in block:
                      failures.append(f'{path}:{i+1}')
          if failures:
              raise SystemExit('checkout must set persist-credentials: false at ' + ', '.join(failures))
          PY
