name: Autonomous Codegen Loop

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: "Agent ID"
        required: true
        default: "codegen-1"
        type: choice
        options:
          - codegen-1
          - codegen-2
          - codegen-3
      task_id:
        description: "Task ID (automation/codegen/tasks/<task_id>.json)"
        required: true
        default: "example"
      max_iterations:
        description: "Maximum generation attempts"
        required: false
        default: "10"
  repository_dispatch:
    types: [run-codegen]

permissions:
  contents: write

jobs:
  selected-agent:
    uses: ./.github/workflows/_autonomous-codegen-agent.yml
    with:
      agent_id: ${{ github.event.inputs.agent_id || github.event.client_payload.agent_id || 'codegen-1' }}
      task_id: ${{ github.event.inputs.task_id || github.event.client_payload.task_id || 'example' }}
      max_iterations: ${{ github.event.inputs.max_iterations || github.event.client_payload.max_iterations || '10' }}
    secrets: inherit
