name: Senju AI Advisor Council

on:
  workflow_dispatch:
    inputs:
      question:
        description: "Question for Personal AI Core + AI FOUNDRY (any topic)"
        required: false
        type: string
      create_implementation_issue:
        description: "Allow useful advisor answers to become a Jules implementation issue"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: senju-ai-advisor-council
  cancel-in-progress: false

jobs:
  consult:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEFAULT_QUESTION: >-
        Review the current Senju system as an engineering peer. What is the single
        highest-leverage improvement we can implement next to increase useful autonomy,
        development quality, agent collaboration, learning speed, or reliability?
        Give concrete file-level changes, tests, success criteria, and overlap risks.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run advisor council unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          cd senju
          python -m pytest tests/test_advisor_council.py -q

      - name: Ask both external AI advisors
        id: ask
        shell: bash
        env:
          INPUT_QUESTION: ${{ github.event.inputs.question }}
        run: |
          set -euo pipefail
          question="${INPUT_QUESTION:-}"
          if [[ -z "$question" ]]; then
            question="$DEFAULT_QUESTION"
          fi

          context="Repository: $GITHUB_REPOSITORY
          Commit: $GITHUB_SHA
          Trigger: $GITHUB_EVENT_NAME
          Standing rule: Senju may ask these AIs any question, and useful answers may be implemented through the normal engineering loop."

          cd senju
          python -m senju.advisor_council \
            --question "$question" \
            --context "$context" \
            --base-sha "$GITHUB_SHA" \
            --out-dir reports/advisor-council

      - name: Upload advisor evidence
        uses: actions/upload-artifact@v4
        with:
          name: senju-ai-advisor-council-${{ github.run_id }}
          path: senju/reports/advisor-council/
          retention-days: 30

      - name: Prepare bounded Jules implementation handoff
        if: ${{ github.event_name == 'schedule' || github.event.inputs.create_implementation_issue != 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'in:title "[Jules] Senju advisor council: implement latest AI recommendations"' \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing" ]]; then
            echo "Existing advisor implementation issue #$existing is still open; keeping this cycle evidence-only."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("senju/reports/advisor-council/latest.json")
          data = json.loads(src.read_text(encoding="utf-8"))
          usable = [
              item for item in data.get("advisor_answers", [])
              if item.get("ok") and item.get("answer")
          ]
          if not usable:
              raise SystemExit("no usable advisor answers")

          lines = [
              "## Senju Advisor Council implementation handoff",
              "",
              f"Base SHA: `{data.get('base_sha', '')}`",
              "",
              "### Standing owner rules",
              "- Personal AI Core and AI FOUNDRY may be asked **any question**.",
              "- Their answers **may be implemented** when they improve the system.",
              "- Advisor text is an implementation proposal, not a shell script or authority grant.",
              "- Use the repository's existing Senju/Jules/FOUNDRY engineering lanes for implementation.",
              "- Preserve the current external-authority, monitoring, restriction, and security-policy semantics unless a separate explicit owner task changes them.",
              "- Check active PR overlap before editing. Prefer extending or superseding existing work over duplicate branches.",
              "- Run focused tests and provide reproducible evidence. Open at most one focused PR.",
              "",
              "### Question",
              data.get("question", ""),
              "",
              "### Advisor answers",
          ]
          for item in usable:
              lines.extend([
                  "",
                  f"#### {item.get('source_name', item.get('source_id', 'advisor'))}",
                  f"- endpoint: {item.get('endpoint_url', '')}",
                  f"- response_sha256: `{item.get('response_sha256', '')}`",
                  "",
                  str(item.get("answer", ""))[:6000],
              ])
          lines.extend([
              "",
              "### Mission",
              "Synthesize the strongest currently relevant recommendation from the answers above and implement it if it is still valid against current default. "
              "Do not blindly copy advisor text. Inspect the repo, detect overlap/staleness, make the smallest high-value implementation, test it, and open one PR.",
          ])
          Path("/tmp/senju-advisor-issue.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[Jules] Senju advisor council: implement latest AI recommendations" \
            --body-file /tmp/senju-advisor-issue.md
