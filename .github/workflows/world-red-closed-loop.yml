name: World RED Closed Loop Memory

on:
  workflow_run:
    workflows:
      - "Senju - RED Autonomous Expedition"
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: world-red-closed-loop-memory
  cancel-in-progress: true

jobs:
  consolidate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify closed-loop boundaries
        working-directory: senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          python -m pytest tests/test_world_red_closed_loop.py -q

      - name: Download completed RED expedition evidence
        uses: actions/download-artifact@v4
        with:
          pattern: senju-red-owner-pool-100-url-loop-*
          path: /tmp/senju-red-expedition
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore persistent RED strategy memory
        uses: actions/cache@v4
        with:
          path: /tmp/senju-red-memory
          key: senju-red-memory-${{ github.run_id }}
          restore-keys: |
            senju-red-memory-

      - name: Consolidate transport feedback into strategy memory
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-red-memory /tmp/world-red-closed-loop

          REPORT_ARGS=()
          if [ -s /tmp/senju-red-expedition/rotating-report.json ]; then
            REPORT_ARGS+=(--red-report /tmp/senju-red-expedition/rotating-report.json)
          fi
          if [ -s /tmp/senju-red-expedition/learned-report.json ]; then
            REPORT_ARGS+=(--red-report /tmp/senju-red-expedition/learned-report.json)
          fi

          PREVIOUS_ARGS=()
          if [ -s /tmp/senju-red-memory/world_red_strategy_memory.json ]; then
            PREVIOUS_ARGS+=(--previous-memory /tmp/senju-red-memory/world_red_strategy_memory.json)
          fi

          URL_POOL=/tmp/senju-red-expedition/authorized-url-pool-learned.json
          if [ ! -s "$URL_POOL" ]; then
            URL_POOL=/tmp/senju-red-expedition/authorized-url-pool-before.json
          fi

          PYTHONPATH=senju python senju/scripts/world_red_closed_loop.py \
            --state-dir senju/state \
            --owner-pool /tmp/senju-red-expedition/owner-authorization-pool.json \
            --target-queue /tmp/senju-red-expedition/red-authorized-target-queue.json \
            --url-pool "$URL_POOL" \
            "${REPORT_ARGS[@]}" \
            "${PREVIOUS_ARGS[@]}" \
            --out /tmp/world-red-closed-loop/world-red-closed-loop.json

          cp senju/state/world_red_strategy_memory.json /tmp/senju-red-memory/world_red_strategy_memory.json
          cp senju/state/world_red_strategy_memory.json /tmp/world-red-closed-loop/world-red-strategy-memory.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/world-red-closed-loop/world-red-closed-loop.json').read_text())
          caps = report['capabilities']
          assert report['closed_loop'] is True
          assert caps['response_to_red_learning'] is True
          assert caps['automatic_safe_retry_planning'] is True
          assert caps['successful_strategy_memory'] is True
          assert caps['memory_recovery_after_restart'] is True
          assert caps['new_host_ai_self_authorization'] is False
          assert caps['real_credential_inheritance'] is False
          assert caps['post_put_patch_exploit_execution'] is False
          assert caps['revoked_authority_recovery'] is False
          assert caps['guard_self_approval'] is False
          assert set(caps['real_methods']) <= {'GET', 'HEAD', 'OPTIONS'}
          print(
              'WORLD_RED_CLOSED_LOOP_READY',
              'hosts=', report['authorized_host_count'],
              'retry=', len(report['retry_plan']),
              'strategies=', len(report['strategy_ranking']),
          )
          PY

      - name: Publish consolidated closed-loop state
        uses: actions/upload-artifact@v4
        with:
          name: world-red-closed-loop-${{ github.run_id }}
          path: /tmp/world-red-closed-loop/
          retention-days: 30
          if-no-files-found: error
