name: Senju Defense Adversary Team

on:
  push:
    branches: ["main"]
    paths:
      - "senju/**"
      - "scripts/security/**"
      - ".github/workflows/security-guard.yml"
      - ".github/workflows/senju-defense-adversary-team.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "senju/**"
      - "scripts/security/**"
      - ".github/workflows/security-guard.yml"
      - ".github/workflows/senju-defense-adversary-team.yml"
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senju-defense-adversary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pressure-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Senju package
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install -e './senju[dev]'

      - name: Run V2 adversary tests
        working-directory: senju
        run: python -m pytest tests/test_defense_adversary_team_v2.py tests/test_multiguard_adversary.py -v

      - name: Run V2 coordinated pressure campaign
        run: >-
          python -m senju.defense_adversary_team_v2
          --scope-cases 4096
          --json security-reports/senju-defense-adversary.json

      - name: Upload adversary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: senju-defense-adversary-${{ github.sha }}
          path: security-reports/senju-defense-adversary.json
          if-no-files-found: error
          retention-days: 30
