name: Senju Authority Factory

on:
  push:
    paths:
      - 'senju/senju/authority_factory.py'
      - 'senju/senju/credential_broker.py'
      - 'senju/senju/credential_self_tuner.py'
      - 'senju/senju/credential_recovery_loop.py'
      - 'senju/senju/credential_runtime.py'
      - 'senju/senju/meta/agent_dispatch.py'
      - 'senju/senju/secret_memory.py'
      - 'senju/senju/external.py'
      - 'senju/senju/private_network.py'
      - 'senju/scripts/authority_mint.py'
      - 'senju/tests/test_authority_factory.py'
      - 'senju/tests/test_credential_broker.py'
      - 'senju/tests/test_credential_self_tuner.py'
      - 'senju/tests/test_credential_recovery_loop.py'
      - 'senju/tests/test_credential_runtime.py'
      - 'senju/tests/test_secret_memory.py'
      - 'senju/tests/test_private_network.py'
      - 'senju/pyproject.toml'
      - '.github/workflows/senju-authority-factory.yml'
  pull_request:
    paths:
      - 'senju/senju/authority_factory.py'
      - 'senju/senju/credential_broker.py'
      - 'senju/senju/credential_self_tuner.py'
      - 'senju/senju/credential_recovery_loop.py'
      - 'senju/senju/credential_runtime.py'
      - 'senju/senju/meta/agent_dispatch.py'
      - 'senju/senju/secret_memory.py'
      - 'senju/senju/external.py'
      - 'senju/senju/private_network.py'
      - 'senju/scripts/authority_mint.py'
      - 'senju/tests/test_authority_factory.py'
      - 'senju/tests/test_credential_broker.py'
      - 'senju/tests/test_credential_self_tuner.py'
      - 'senju/tests/test_credential_recovery_loop.py'
      - 'senju/tests/test_credential_runtime.py'
      - 'senju/tests/test_secret_memory.py'
      - 'senju/tests/test_private_network.py'
      - 'senju/pyproject.toml'
      - '.github/workflows/senju-authority-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-factory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD SINGULARITY workflow.")
          PYEOF
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Senju and test dependency
        run: python -m pip install --disable-pip-version-check -e './senju[dev]'

      - name: Run Authority, Credential Broker, Self-Tuner, Recovery Loop, Runtime and Secret Memory tests
        run: pytest -q senju/tests/test_authority_factory.py senju/tests/test_credential_broker.py senju/tests/test_credential_self_tuner.py senju/tests/test_credential_recovery_loop.py senju/tests/test_credential_runtime.py senju/tests/test_secret_memory.py senju/tests/test_private_network.py

      - name: Compile Authority, Credential Runtime and Secret Memory modules
        run: python -m py_compile senju/senju/authority_factory.py senju/senju/credential_broker.py senju/senju/credential_self_tuner.py senju/senju/credential_recovery_loop.py senju/senju/credential_runtime.py senju/senju/meta/agent_dispatch.py senju/senju/secret_memory.py senju/scripts/authority_mint.py
