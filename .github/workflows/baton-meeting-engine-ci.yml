name: Baton AI Minutes Evidence Engine (internal MVP)
on:
  pull_request:
    paths:
      - "baton-meetings/**"
      - ".github/workflows/baton-meeting-engine-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-meeting-engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test baton-meetings/tests/engine.test.mjs
      - run: node --check baton-meetings/src/engine.mjs
      - run: node --check baton-meetings/src/server.mjs
      - run: node --check baton-meetings/src/start.mjs
