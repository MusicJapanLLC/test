name: Standing Authorization Tests

on:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
      - chatgpt/private-zone-auto-enroll
      - chatgpt/transitive-trust
      - chatgpt/trust-derived-autonomy
      - chatgpt/wide-autonomy-closed-loop
    paths:
      - 'senju/senju/meta/standing_authorization.py'
      - 'senju/senju/meta/private_zone_authority.py'
      - 'senju/senju/meta/transitive_trust.py'
      - 'senju/senju/meta/trust_derived_autonomy.py'
      - 'senju/senju/meta/autonomy_auto_approval.py'
      - 'senju/tests/test_standing_authorization.py'
      - 'senju/tests/test_private_zone_authority.py'
      - 'senju/tests/test_transitive_trust.py'
      - 'senju/tests/test_trust_derived_autonomy.py'
      - 'senju/tests/test_autonomy_auto_approval.py'
      - '.github/workflows/standing-authorization-tests.yml'
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/meta/standing_authorization.py'
      - 'senju/senju/meta/private_zone_authority.py'
      - 'senju/senju/meta/transitive_trust.py'
      - 'senju/senju/meta/trust_derived_autonomy.py'
      - 'senju/senju/meta/autonomy_auto_approval.py'
      - 'senju/tests/test_standing_authorization.py'
      - 'senju/tests/test_private_zone_authority.py'
      - 'senju/tests/test_transitive_trust.py'
      - 'senju/tests/test_trust_derived_autonomy.py'
      - 'senju/tests/test_autonomy_auto_approval.py'
      - '.github/workflows/standing-authorization-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run standing authorization tests
        env:
          PYTHONPATH: senju
        run: >-
          python -m pytest -q
          senju/tests/test_standing_authorization.py
          senju/tests/test_private_zone_authority.py
          senju/tests/test_transitive_trust.py
          senju/tests/test_trust_derived_autonomy.py
          senju/tests/test_autonomy_auto_approval.py
