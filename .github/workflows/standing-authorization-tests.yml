name: Standing Authorization Tests

on:
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/meta/standing_authorization.py'
      - 'senju/tests/test_standing_authorization.py'
      - '.github/workflows/standing-authorization-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/employee-onboarding-setup-udm86

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run standing authorization tests
        env:
          PYTHONPATH: senju
        run: python -m pytest -q senju/tests/test_standing_authorization.py
