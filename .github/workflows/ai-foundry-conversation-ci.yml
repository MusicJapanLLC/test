name: AI Foundry - Conversational Core CI

on:
  pull_request:
    paths:
      - 'automation/ai_foundry/**'
      - '.github/workflows/ai-foundry-conversation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-foundry-conversation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile Python modules
        run: |
          set -euo pipefail
          python -m compileall -q automation/ai_foundry

      - name: Run conversational compiler tests
        run: |
          set -euo pipefail
          python -m unittest -v automation.ai_foundry.test_conversation_foundry

      - name: Run existing Foundry regression tests
        run: |
          set -euo pipefail
          python -m unittest -v automation.ai_foundry.test_minute_evolution
          python -m unittest -v automation.ai_foundry.test_track_progression

      - name: Compile real request into AI system spec
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-foundry
          python automation/ai_foundry/conversation_foundry.py compile \
            --request 'AI開発に特化した会話型AIを作り、既存のGitHub、コネクタ、サブエージェント、Supabase、Vercelを最大限再利用して実装する' \
            --out /tmp/ai-foundry/spec.json
          python automation/ai_foundry/conversation_foundry.py validate \
            --spec /tmp/ai-foundry/spec.json
          python - <<'PY'
          import json
          spec=json.load(open('/tmp/ai-foundry/spec.json',encoding='utf-8'))
          assert spec['mode'] == 'BUILD'
          assert spec['factory_handoff']['pr_required'] is True
          assert spec['completion_gate']['prose_only_complete'] is False
          print(json.dumps({
              'project_id': spec['project_id'],
              'mode': spec['mode'],
              'resources': [x['id'] for x in spec['resources']],
              'specialists': spec['specialists'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Preserve compiled evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-foundry-conversation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: /tmp/ai-foundry/spec.json
