name: THE WORLD - Realtime Kernel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'TOMOKI - MANAGER'
      - 'AI Factory - BOSS Watchdog'
      - 'R&D x Senju Coupled Loop'
      - 'Senju GitHub Native Autonomous Improver'
      - 'THE WORLD - Child Guild Adventure'
    types: [completed]

concurrency:
  group: the-world-realtime-kernel
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      WORLD_REALTIME_REF: ${{ github.event.repository.default_branch }}
      WORLD_SLACK_WEBHOOK_URL: ${{ secrets.WORLD_SLACK_WEBHOOK_URL }}
      RND_SLACK_WEBHOOK_URL: ${{ secrets.RND_SLACK_WEBHOOK_URL }}
      TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test realtime boundary
        run: python -m unittest automation.world.test_realtime_kernel -v
      - name: Pulse and bounded recovery
        run: |
          python automation/world/realtime_kernel.py --plan automation/world/realtime_plan.json --json world-realtime-pulse.json --report world-realtime-pulse.md --apply
          cat world-realtime-pulse.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report material pulse to internal Slack
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          p=Path('world-realtime-pulse.json')
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text(encoding='utf-8'))
          if not d.get('material'): raise SystemExit(0)
          webhook=(os.getenv('WORLD_SLACK_WEBHOOK_URL') or os.getenv('RND_SLACK_WEBHOOK_URL') or os.getenv('TOMOKI_SLACK_WEBHOOK_URL') or '').strip()
          if not webhook:
              print('No internal Slack webhook configured; artifact remains canonical evidence.')
              raise SystemExit(0)
          report=Path('world-realtime-pulse.md').read_text(encoding='utf-8')[:12000]
          req=urllib.request.Request(webhook,data=json.dumps({'text':report},ensure_ascii=False).encode('utf-8'),headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=15) as res: print('slack status',res.status)
          PY
      - name: Preserve pulse evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-realtime-pulse-${{ github.run_id }}
          path: |
            world-realtime-pulse.json
            world-realtime-pulse.md
          retention-days: 14
          if-no-files-found: warn
