name: Senju - Live Network Canary

on:
  workflow_dispatch:
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/senju-live-network-canary.yml'
      - 'senju/senju/external.py'
      - 'senju/senju/cli.py'
      - 'senju/tests/test_external_contact.py'

permissions:
  contents: read

jobs:
  external-capabilities-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          # Extract latest directive for env export
          top_target = "none"
          strategy = "coverage_expansion"
          coverage_gaps = ""
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True):
              c = e.get("content", {})
              if c.get("top_target") and c["top_target"] != "none":
                  top_target = c["top_target"]
                  strategy = c.get("strategy", strategy)
                  gaps = c.get("coverage_gaps", [])
                  coverage_gaps = ",".join(gaps[:5]) if gaps else ""
                  break
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD workflow.")
          # Write to GITHUB_ENV so downstream steps can consume GOD directives
          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"GOD_TOP_TARGET={top_target}\n")
                  f.write(f"GOD_STRATEGY={strategy}\n")
                  f.write(f"GOD_COVERAGE_GAPS={coverage_gaps}\n")
                  f.write(f"GOD_ENTRIES={total}\n")
              print(f"  → Exported: GOD_TOP_TARGET={top_target} GOD_STRATEGY={strategy}")
          PYEOF
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify expanded transport behavior
        run: |
          set -euo pipefail
          python -m pip install -e './senju[dev]'
          cd senju
          python -m pytest tests/test_external_contact.py -q
      - name: Contact real external HTTP endpoint through Senju v3
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          python -m senju.cli contact https://example.com/ \
            --allow-host example.com \
            --header 'Accept:text/html' \
            --response-out /tmp/senju-live-network-response.bin \
            --receipt /tmp/senju-live-network-receipt.json \
            > /tmp/senju-live-network-stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/senju-live-network-receipt.json').read_text())
          assert data['schema'] == 'senju-external-contact/v3'
          assert data['host'] == 'example.com'
          assert data['final_host'] == 'example.com'
          assert data['method'] == 'GET'
          assert data['provider_acknowledged'] is True
          assert 200 <= int(data['status']) < 400
          assert data['contacted_hosts'] == ['example.com']
          assert data['resolved_ips']
          assert data['response_sha256']
          assert Path('/tmp/senju-live-network-response.bin').stat().st_size == data['response_bytes']
          print('SENJU_REAL_NETWORK_CONTACT_V3_VERIFIED')
          print(json.dumps(data, ensure_ascii=False))
          PY
      - name: Publish live network receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-live-network-v3-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/senju-live-network-receipt.json
            /tmp/senju-live-network-stdout.json
            /tmp/senju-live-network-response.bin
