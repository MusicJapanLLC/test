name: The World Final Contract Tests

on:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'automation/codegen/engine/production_state_bootstrap.py'
      - 'automation/codegen/run_the_world_unified_loop.py'
      - 'automation/codegen/the_world_final_contract.py'
      - 'automation/codegen/tests/test_production_state_bootstrap.py'
      - 'automation/codegen/tests/test_the_world_final_contract.py'
      - '.github/workflows/the-world-final-contract-tests.yml'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'automation/codegen/engine/production_state_bootstrap.py'
      - 'automation/codegen/run_the_world_unified_loop.py'
      - 'automation/codegen/the_world_final_contract.py'
      - 'automation/codegen/tests/test_production_state_bootstrap.py'
      - 'automation/codegen/tests/test_the_world_final_contract.py'
      - '.github/workflows/the-world-final-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Verify trusted bootstrap and non-empty Discovery -> Target -> Action contract
        env:
          PYTHONPATH: automation/codegen
        run: >-
          python -m pytest -q
          automation/codegen/tests/test_production_state_bootstrap.py
          automation/codegen/tests/test_the_world_final_contract.py
