name: SENJU RED Owned Surface Expansion
# Registered post-merge; this comment also exercises the push trigger.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - 'AUTHORIZED_TEST_TARGETS.json'
      - 'senju/state/verified_control_attestations.json'
      - 'senju/state/owner_contact_ceiling_effective.json'
      - 'senju/scripts/owner_red_surface_expander.py'
      - 'senju/scripts/owner_red_surface_fanout.py'
      - 'senju/scripts/authorized_range_assault.py'
      - 'senju/scripts/authorized_range_assault_full.py'
      - 'senju/tests/test_owner_red_surface_expander.py'
      - 'senju/tests/test_authorized_range_active_exploit.py'
      - '.github/workflows/senju-red-owned-surface-expansion.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: senju-red-owned-surface-expansion
  cancel-in-progress: true

jobs:
  expand-and-exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify owner-only RED expansion contracts
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            senju/tests/test_owner_red_surface_expander.py \
            senju/tests/test_authorized_range_active_exploit.py \
            senju/tests/test_approved_authority_red_adaptive.py
          python -m py_compile \
            senju/scripts/owner_red_surface_expander.py \
            senju/scripts/owner_red_surface_fanout.py

      - name: Expand verified owner-controlled RED URL catalog to 120 plus
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-red-owned
          python senju/scripts/owner_red_surface_expander.py \
            --minimum-profiles 120 \
            --max-profiles 240 \
            --out /tmp/senju-red-owned/catalog.json \
            | tee /tmp/senju-red-owned/catalog-summary.json
          test "$(python - <<'PY'
          import json
          p=json.load(open('/tmp/senju-red-owned/catalog.json'))
          print(p.get('profile_count', 0))
          PY
          )" -ge 120

      - name: Run 32-profile owner-controlled RED observation burst
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          python senju/scripts/owner_red_surface_fanout.py \
            --catalog /tmp/senju-red-owned/catalog.json \
            --operation-id "owner-red-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --max-profiles 32 \
            --memory /tmp/senju-red-owned/memory.json \
            --out /tmp/senju-red-owned/burst.json \
            | tee /tmp/senju-red-owned/burst-summary.json
          test "$(python - <<'PY'
          import json
          p=json.load(open('/tmp/senju-red-owned/burst.json'))
          print(p.get('batch_size', 0))
          PY
          )" -eq 32

      - name: Exercise stronger fixed-owner mutation and canary authority
        working-directory: senju
        env:
          SENJU_ACTIVE_EXPLOIT_SEED: owned-surface-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/authorized_range_assault_full.py --validate
          python scripts/authorized_range_assault_full.py
          cp authorized-range-assault-report.json /tmp/senju-red-owned/authorized-range-assault-report.json

      - name: Verify privilege separation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          catalog=json.load(open('/tmp/senju-red-owned/catalog.json'))
          burst=json.load(open('/tmp/senju-red-owned/burst.json'))
          assault=json.load(open('/tmp/senju-red-owned/authorized-range-assault-report.json'))
          assert catalog['general_web_discovery_authorizes'] is False
          assert catalog['external_link_inheritance'] is False
          assert catalog['exact_host_only'] is True
          assert catalog['mutation_capable_host_count'] >= 1
          assert burst['method'] == 'HEAD'
          assert burst['exact_owner_hosts_only'] is True
          assert assault['target'] == 'https://kabeya-authorized-test-range.onrender.com'
          assert assault['active_exploit']['exact_host_only'] is True
          assert assault['active_exploit']['credential_use'] is False
          print(json.dumps({
              'catalog_profiles': catalog['profile_count'],
              'catalog_hosts': catalog['unique_host_count'],
              'mutation_capable_hosts': catalog['mutation_capable_host_count'],
              'observation_batch': burst['batch_size'],
              'observation_attempts': burst['external_contact_attempts'],
              'fixed_owner_write_methods_accepted_2xx': assault['summary']['write_methods_accepted_2xx'],
              'bounded_canaries': assault['summary']['active_exploit_attempted'],
          }))
          PY

      - name: Upload owner RED expansion evidence
        uses: actions/upload-artifact@v4
        with:
          name: senju-red-owned-surface-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/senju-red-owned/
