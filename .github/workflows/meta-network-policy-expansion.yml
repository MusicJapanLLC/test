name: META Network Policy Expansion

on:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - automation/codegen/engine/network_policy_expansion.py
      - automation/codegen/network_policy_runner.py
      - automation/codegen/network_policy_apply.py
      - automation/codegen/network_policy_seed.py
      - automation/codegen/network_policy_authorized_discovery.py
      - automation/codegen/network_replica_loop.py
      - automation/codegen/network_replica_apply.py
      - automation/codegen/meta_state/network_policy_envelope.json
      - automation/codegen/tests/test_network_policy_expansion.py
      - automation/codegen/tests/test_network_policy_acceleration.py
      - automation/codegen/tests/test_network_persistent_replicas.py
      - .github/workflows/meta-network-policy-expansion.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: meta-network-policy-expansion
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: ${{ github.workspace }}/automation/codegen:${{ github.workspace }}/senju

jobs:
  expand-apply-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/employee-onboarding-setup-udm86
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify network-policy expansion invariants
        run: |
          python automation/codegen/tests/test_network_policy_expansion.py -q
          python automation/codegen/tests/test_network_policy_acceleration.py -q
          python automation/codegen/tests/test_network_persistent_replicas.py -q

      - name: Restore durable previous runtime policy and persistent replicas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/meta-network-policy /tmp/meta-network-policy-prev
          PREV_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "META Network Policy Expansion" --status success --limit 20 \
            --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV_RUN" ]]; then
            gh run download "$PREV_RUN" --repo "$GITHUB_REPOSITORY" \
              --pattern 'meta-network-policy-expansion-*' \
              --dir /tmp/meta-network-policy-prev || true
          fi
          PREV_POLICY="$(find /tmp/meta-network-policy-prev -name runtime-final.json -print -quit || true)"
          PREV_REPLICAS="$(find /tmp/meta-network-policy-prev -name replicas-final.json -print -quit || true)"
          if [[ -n "$PREV_POLICY" ]]; then
            cp "$PREV_POLICY" /tmp/meta-network-policy/previous.json
            echo "loaded durable runtime network policy from run $PREV_RUN"
          else
            printf '{}\n' > /tmp/meta-network-policy/previous.json
            echo "no previous durable runtime network policy artifact"
          fi
          if [[ -n "$PREV_REPLICAS" ]]; then
            cp "$PREV_REPLICAS" /tmp/meta-network-policy/replicas-previous.json
            echo "loaded persistent replica state from run $PREV_RUN"
          else
            printf '{"replicas":[]}\n' > /tmp/meta-network-policy/replicas-previous.json
            echo "no previous persistent replica state"
          fi

      - name: Restore latest external response and agent evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/meta-network-policy/agency
          RUN="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju External Agency Orchestrator" --status success --limit 20 \
            --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RUN" ]]; then
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" \
              --pattern 'senju-agency-*' --dir /tmp/meta-network-policy/agency || true
          fi
          FRONTIER="$(find /tmp/meta-network-policy/agency -name external-frontier.json -print -quit || true)"
          echo "NETWORK_FRONTIER=$FRONTIER" >> "$GITHUB_ENV"
          echo "EXTERNAL_AGENCY_RUN=${RUN:-none}" >> "$GITHUB_ENV"
          if [[ -n "$FRONTIER" ]]; then
            echo "external response evidence restored: $FRONTIER"
          else
            echo "no external frontier artifact; explicit roots and repository META findings still run"
          fi

      - name: Seed every already-explicit production authority
        run: |
          python automation/codegen/network_policy_seed.py \
            --state-dir automation/codegen/meta_state \
            --repo-root . \
            --out /tmp/meta-network-policy/explicit-seeds.json

      - name: Discovery and agent findings -> authority expansion pass 1
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --state-dir automation/codegen/meta_state
            --repo-root .
            --previous /tmp/meta-network-policy/previous.json
            --input /tmp/meta-network-policy/explicit-seeds.json
            --summary-out /tmp/meta-network-policy/expansion-summary-pass1.json
          )
          if [[ -n "${NETWORK_FRONTIER:-}" ]]; then
            args+=(--input "$NETWORK_FRONTIER")
          fi
          python automation/codegen/network_policy_runner.py "${args[@]}"
          cp automation/codegen/meta_state/network_policy_runtime.json /tmp/meta-network-policy/runtime-pass1.json
          cp automation/codegen/meta_state/network_policy_expansion_requests.json /tmp/meta-network-policy/requests-pass1.json
          cp automation/codegen/meta_state/network_policy_audit.json /tmp/meta-network-policy/decision-audit-pass1.json

      - name: External Action pass 1 through real Senju network lane
        run: |
          python automation/codegen/network_policy_apply.py \
            --policy automation/codegen/meta_state/network_policy_runtime.json \
            --out /tmp/meta-network-policy/apply-audit-pass1.json \
            --feedback automation/codegen/meta_state/network_policy_feedback.json \
            --max-hosts 64
          cp automation/codegen/meta_state/network_policy_feedback.json /tmp/meta-network-policy/feedback-pass1.json

      - name: Discover from authorized external responses
        run: |
          python automation/codegen/network_policy_authorized_discovery.py \
            --policy automation/codegen/meta_state/network_policy_runtime.json \
            --out /tmp/meta-network-policy/authorized-response-evidence.json \
            --max-hosts 48

      - name: Authorized response -> authority expansion pass 2
        run: |
          python automation/codegen/network_policy_runner.py \
            --state-dir automation/codegen/meta_state \
            --repo-root . \
            --previous automation/codegen/meta_state/network_policy_runtime.json \
            --input /tmp/meta-network-policy/explicit-seeds.json \
            --input /tmp/meta-network-policy/feedback-pass1.json \
            --input /tmp/meta-network-policy/apply-audit-pass1.json \
            --input /tmp/meta-network-policy/authorized-response-evidence.json \
            --summary-out /tmp/meta-network-policy/expansion-summary-pass2.json
          cp automation/codegen/meta_state/network_policy_runtime.json /tmp/meta-network-policy/runtime-pass2.json
          cp automation/codegen/meta_state/network_policy_expansion_requests.json /tmp/meta-network-policy/requests-pass2.json
          cp automation/codegen/meta_state/network_policy_audit.json /tmp/meta-network-policy/decision-audit-pass2.json

      - name: External Action pass 2 through expanded real network lane
        run: |
          python automation/codegen/network_policy_apply.py \
            --policy automation/codegen/meta_state/network_policy_runtime.json \
            --out /tmp/meta-network-policy/apply-audit-pass2.json \
            --feedback automation/codegen/meta_state/network_policy_feedback.json \
            --max-hosts 64
          cp automation/codegen/meta_state/network_policy_feedback.json /tmp/meta-network-policy/feedback-pass2.json

      - name: Require a live authorized production connection
        shell: bash
        run: |
          set -euo pipefail
          seeds="$(jq '.hosts | length' /tmp/meta-network-policy/explicit-seeds.json)"
          attempted="$(jq '.attempted' /tmp/meta-network-policy/apply-audit-pass2.json)"
          succeeded="$(jq '.succeeded' /tmp/meta-network-policy/apply-audit-pass2.json)"
          echo "explicit_seeds=$seeds attempted=$attempted succeeded=$succeeded"
          if [[ "$seeds" -gt 0 && "$attempted" -eq 0 ]]; then
            echo "explicit authority existed but no network contact was attempted" >&2
            exit 1
          fi
          if [[ "$attempted" -gt 0 && "$succeeded" -eq 0 ]]; then
            echo "no authorized production network contact succeeded" >&2
            exit 1
          fi

      - name: Replication and Persistence from authorized discoveries
        run: |
          python automation/codegen/network_replica_loop.py \
            --policy automation/codegen/meta_state/network_policy_runtime.json \
            --discovery /tmp/meta-network-policy/authorized-response-evidence.json \
            --previous /tmp/meta-network-policy/replicas-previous.json \
            --out /tmp/meta-network-policy/replicas-pass1.json \
            --lease-seconds 43200 \
            --max-replicas 64

      - name: Persistent replicas -> New External Action
        run: |
          python automation/codegen/network_replica_apply.py \
            --policy automation/codegen/meta_state/network_policy_runtime.json \
            --replicas /tmp/meta-network-policy/replicas-pass1.json \
            --out /tmp/meta-network-policy/replica-external-evidence.json \
            --max-actions 32

      - name: Require persistent replicas to drive real action when leases exist
        shell: bash
        run: |
          set -euo pipefail
          replicas="$(jq '.replica_count' /tmp/meta-network-policy/replicas-pass1.json)"
          attempted="$(jq '.attempted' /tmp/meta-network-policy/replica-external-evidence.json)"
          succeeded="$(jq '.succeeded' /tmp/meta-network-policy/replica-external-evidence.json)"
          echo "persistent_replicas=$replicas attempted=$attempted succeeded=$succeeded"
          if [[ "$replicas" -gt 0 && "$attempted" -eq 0 ]]; then
            echo "persistent authorized replicas existed but drove no new external action" >&2
            exit 1
          fi
          if [[ "$attempted" -gt 0 && "$succeeded" -eq 0 ]]; then
            echo "persistent replicas attempted external action but none succeeded" >&2
            exit 1
          fi

      - name: Replica response -> authority expansion pass 3
        run: |
          python automation/codegen/network_policy_runner.py \
            --state-dir automation/codegen/meta_state \
            --repo-root . \
            --previous automation/codegen/meta_state/network_policy_runtime.json \
            --input /tmp/meta-network-policy/explicit-seeds.json \
            --input /tmp/meta-network-policy/feedback-pass2.json \
            --input /tmp/meta-network-policy/apply-audit-pass2.json \
            --input /tmp/meta-network-policy/authorized-response-evidence.json \
            --input /tmp/meta-network-policy/replica-external-evidence.json \
            --summary-out /tmp/meta-network-policy/expansion-summary-pass3.json
          cp automation/codegen/meta_state/network_policy_runtime.json /tmp/meta-network-policy/runtime-pass3.json
          cp automation/codegen/meta_state/network_policy_expansion_requests.json /tmp/meta-network-policy/requests-pass3.json
          cp automation/codegen/meta_state/network_policy_audit.json /tmp/meta-network-policy/decision-audit-pass3.json

      - name: External Action pass 3 after persistent replica discovery
        run: |
          python automation/codegen/network_policy_apply.py \
            --policy automation/codegen/meta_state/network_policy_runtime.json \
            --out /tmp/meta-network-policy/apply-audit-pass3.json \
            --feedback automation/codegen/meta_state/network_policy_feedback.json \
            --max-hosts 64
          cp automation/codegen/meta_state/network_policy_feedback.json /tmp/meta-network-policy/feedback-pass3.json

      - name: Refresh persistent replicas for the next production cycle
        run: |
          python automation/codegen/network_replica_loop.py \
            --policy automation/codegen/meta_state/network_policy_runtime.json \
            --discovery /tmp/meta-network-policy/replica-external-evidence.json \
            --previous /tmp/meta-network-policy/replicas-pass1.json \
            --out /tmp/meta-network-policy/replicas-final.json \
            --lease-seconds 43200 \
            --max-replicas 64

      - name: Feed final action and replica evidence back into policy learner
        run: |
          python automation/codegen/network_policy_runner.py \
            --state-dir automation/codegen/meta_state \
            --repo-root . \
            --previous automation/codegen/meta_state/network_policy_runtime.json \
            --input /tmp/meta-network-policy/explicit-seeds.json \
            --input /tmp/meta-network-policy/feedback-pass3.json \
            --input /tmp/meta-network-policy/apply-audit-pass3.json \
            --input /tmp/meta-network-policy/authorized-response-evidence.json \
            --input /tmp/meta-network-policy/replica-external-evidence.json \
            --summary-out /tmp/meta-network-policy/post-apply-summary.json
          cp automation/codegen/meta_state/network_policy_runtime.json /tmp/meta-network-policy/runtime-final.json
          cp automation/codegen/meta_state/network_policy_audit.json /tmp/meta-network-policy/post-apply-decision-audit.json

      - name: Preserve Discovery -> Authority -> Action -> Persistence -> New Action state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta-network-policy-expansion-${{ github.run_id }}
          path: /tmp/meta-network-policy/
          if-no-files-found: warn
          retention-days: 14
