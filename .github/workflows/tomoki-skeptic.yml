name: TOMOKI - SKEPTIC
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/tomoki-skeptic.yml'
      - 'tomoki-agents/**'
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  security-events: read
  copilot-requests: write
jobs:
  skeptic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.80
      - name: Run SKEPTIC
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          copilot -p "$(cat tomoki-agents/prompts/skeptic.md)" -s --allow-tool=write --allow-tool='shell(git:*)' --allow-tool='shell(gh:*)' --no-ask-user > /tmp/tomoki-copilot.log 2>&1 || true
          if [[ ! -f tomoki-report.md ]]; then printf 'Copilot run failed or produced no report.\n' > tomoki-report.md; fi
      - name: Report to TOMOKI Slack
        if: always()
        env:
          TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
        run: python tomoki-agents/slack_post.py --agent SKEPTIC --file tomoki-report.md --status "${{ job.status }}"
