name: THE WORLD External Write Router

on:
  workflow_dispatch:
  schedule:
    - cron: '12,27,42,57 * * * *'
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "outside-world/external_write_router.py"
      - "outside-world/external_write_targets.json"
      - "outside-world/reality_policy.json"
      - "senju/senju/meta/cooperative_authority_loop.py"
      - "senju/senju/meta/cooperative_coordination_bus.py"
      - "senju/scripts/run_cooperative_authority_loop.py"
      - "senju/scripts/run_cooperative_coordination_bus.py"
      - "senju/tests/test_cooperative_authority_loop.py"
      - "senju/tests/test_cooperative_coordination_bus.py"
      - ".github/workflows/the-world-external-write-router.yml"

concurrency:
  group: the-world-external-write-router
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
  MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
  MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
  BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
  BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
  BLUESKY_PDS_URL: ${{ secrets.BLUESKY_PDS_URL }}
  WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
  WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
  WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout THE WORLD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install Senju cooperative runtime
        run: python -m pip install --disable-pip-version-check -e './senju[dev]'

      - name: Verify cooperative authority and coordination contracts
        run: |
          python -m py_compile \
            senju/senju/meta/cooperative_authority_loop.py \
            senju/senju/meta/cooperative_coordination_bus.py \
            senju/scripts/run_cooperative_authority_loop.py \
            senju/scripts/run_cooperative_coordination_bus.py
          python -m pytest -q \
            senju/tests/test_cooperative_authority_loop.py \
            senju/tests/test_cooperative_coordination_bus.py

      - name: Load latest successful Reality Agency evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/world-reality
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "THE WORLD Reality Agency" --status success --limit 8 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$RUN_ID" ]]; then
            echo "No successful Reality Agency run found" >&2
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name world-reality-agency-state --dir /tmp/world-reality
          EVENTS="$(find /tmp/world-reality -name reality-events.json -print -quit)"
          if [[ -z "$EVENTS" ]]; then
            echo "Reality Agency artifact contains no reality-events.json" >&2
            exit 1
          fi
          cp "$EVENTS" reality-events.json
          echo "WORLD_SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Reality source run: **$RUN_ID**" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore external-write and cooperative authority memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/external-write-prev cooperative-authority
          PREV="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "THE WORLD External Write Router" --status success --limit 8 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV" ]]; then
            gh run download "$PREV" --repo "$GITHUB_REPOSITORY" --name world-external-write-state --dir /tmp/external-write-prev || true
          fi
          STATE="$(find /tmp/external-write-prev -name external-write-state.json -print -quit || true)"
          if [[ -n "$STATE" ]]; then
            cp "$STATE" external-write-previous.json
          fi
          COOP="$(find /tmp/external-write-prev -name cooperative_loop_state.json -print -quit || true)"
          if [[ -n "$COOP" ]]; then
            COOP_DIR="$(dirname "$COOP")"
            cp -R "$COOP_DIR/." cooperative-authority/
            echo "Cooperative authority + AI coordination state restored from run: **$PREV**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cooperative authority state: fresh/recoverable bootstrap" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run META X Senju persistent cooperative authority loop
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          python senju/scripts/run_cooperative_authority_loop.py \
            --events reality-events.json \
            --policy outside-world/reality_policy.json \
            --state-dir cooperative-authority \
            --repo "$GITHUB_REPOSITORY" \
            --out cooperative-authority/last-cycle.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("cooperative-authority/last-cycle.json", encoding="utf-8"))
          print("## META / X / SENJU cooperative authority loop")
          print(f"- Result: `{d.get('reason')}`")
          print(f"- Discovery selected: `{d.get('discovery',{}).get('selected')}`")
          print(f"- Consensus unanimous: `{d.get('consensus',{}).get('unanimous')}`")
          print(f"- Authority ready: `{d.get('authority',{}).get('ready')}`")
          print(f"- Credentialed write posted: `{d.get('credentialed_write',{}).get('posted')}`")
          print(f"- Recursive delegation advanced: `{d.get('recursive_delegation',{}).get('advanced')}`")
          print(f"- Persistent state saved: `{d.get('persistence',{}).get('saved')}`")
          print(f"- Authority state recovered: `{d.get('recovery',{}).get('state_recovered', False)}`")
          if d.get('authority',{}).get('active_profile_id'):
              print(f"- Active authority: `{d['authority']['active_profile_id']}`")
          if d.get('credentialed_write',{}).get('issue_url'):
              print(f"- Credentialed write receipt: {d['credentialed_write']['issue_url']}")
          PY

      - name: Publish shared AI handoff packet
        env:
          PYTHONPATH: senju
          COOPERATIVE_AI_PARTICIPANTS: META,X,SENJU,CLAUDE,JULES,OPENHANDS,COPILOT
        run: |
          set -euo pipefail
          python senju/scripts/run_cooperative_coordination_bus.py \
            --cycle cooperative-authority/last-cycle.json \
            --policy outside-world/reality_policy.json \
            --state-dir cooperative-authority \
            --repo "$GITHUB_REPOSITORY" \
            --out cooperative-authority/last-handoff.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("cooperative-authority/last-handoff.json", encoding="utf-8"))
          print("## Cooperative AI handoff")
          print(f"- Result: `{d.get('reason')}`")
          print(f"- Shared bus saved: `{d.get('bus_saved')}`")
          print(f"- Handoff comment published: `{d.get('published')}`")
          print(f"- Participants: `{', '.join(d.get('participants', []))}`")
          if d.get('message_id'):
              print(f"- Message: `{d['message_id']}`")
          if d.get('comment_url'):
              print(f"- Shared GitHub surface: {d['comment_url']}")
          PY

      - name: Publish through rotating authorized platform adapters
        run: |
          set -euo pipefail
          python outside-world/external_write_router.py \
            --events reality-events.json \
            --config outside-world/external_write_targets.json \
            --previous external-write-previous.json \
            --out external-write-receipts.json \
            --state external-write-state.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("external-write-receipts.json", encoding="utf-8"))
          rows=d.get("receipts", [])
          print(f"External writes attempted: **{len(rows)}**")
          if not rows:
              print("No configured platform credential was available or every candidate was deduplicated/capped.")
          for r in rows:
              print(f"- `{r.get('platform')}` — `{r.get('status')}` — {r.get('source_url','')}")
          PY

      - name: Preserve external-write evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-external-write-state
          retention-days: 30
          if-no-files-found: warn
          path: |
            reality-events.json
            external-write-receipts.json
            external-write-state.json
            cooperative-authority/
