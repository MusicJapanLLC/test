name: Authority Credential Loop CI

on:
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "senju/senju/authorization_handoff_bridge.py"
      - "senju/scripts/authorization_handoff_bridge.py"
      - "the-world-strong-new-game/inherit_credential_bindings.py"
      - "automation/codegen/config/credential_bound_mutation.json"
      - "tests/test_authorization_handoff_bridge.py"
      - "tests/test_strong_new_game_credential_bindings.py"
      - ".github/workflows/negotiation-authorization-accelerator.yml"
      - ".github/workflows/strong-new-game-3h.yml"
      - ".github/workflows/authority-credential-loop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authority-credential-loop-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate Authority handoff and Promotion contracts
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_authorization_handoff_bridge.py \
            senju/tests/test_authority_promotion_bureau.py

      - name: Validate cross-world credential binding inheritance
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          pytest -q tests/test_strong_new_game_credential_bindings.py

      - name: Assert workflow wiring
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          accel = Path('.github/workflows/negotiation-authorization-accelerator.yml').read_text()
          strong = Path('.github/workflows/strong-new-game-3h.yml').read_text()

          assert 'authorization_handoff_bridge.py' in accel
          assert 'run_authority_promotion_bureau.py' in accel
          assert accel.index('authorization_handoff_bridge.py') < accel.index('run_authority_promotion_bureau.py')
          assert 'inherit_credential_bindings.py' in strong
          assert 'credential_binding_inheritance' in strong
          assert 'raw_credential_inheritance' in strong
          print('AUTHORITY_CREDENTIAL_LOOP_WIRING_OK')
          PY
