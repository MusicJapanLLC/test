name: THE WORLD GOD - Supreme Evolution Cycle

on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "api/**"
      - "automation/unified-knowledge/**"
      - "automation/world/autonomy-policy.json"
      - "automation/world/world_observer.py"
      - "music-japan-lp/**"
      - "baton-partners/**"
      - "music-japan/**"
      - "second-take/**"
      - "baton/**"
      - "senju/**"
      - "research/**"
      - ".github/workflows/the-world-god.yml"
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "api/**"
      - "automation/unified-knowledge/**"
      - "automation/world/autonomy-policy.json"
      - "automation/world/world_observer.py"
      - "music-japan-lp/**"
      - "baton-partners/**"
      - "music-japan/**"
      - "second-take/**"
      - "baton/**"
      - "senju/**"
      - "research/**"
      - ".github/workflows/the-world-god.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: the-world-god-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  supreme-evolution:
    name: THE WORLD GOD (30 Layers)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GOD_REPORT: ${{ runner.temp }}/supreme-god-report.json
      WORLD_OBSERVATION: ${{ runner.temp }}/world-observation.json
      GOD_BRANCH: claude/supreme-ai-development-06vi1t

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build shared THE WORLD observation snapshot
        run: |
          set -euo pipefail
          python3 automation/world/world_observer.py --output "$WORLD_OBSERVATION"
          python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['WORLD_OBSERVATION'], encoding='utf-8'))
          assert d.get('schema') == 'the-world-observation/v1'
          assert d.get('autonomy_level') == 95
          assert int(d.get('repository', {}).get('observed_roots', 0)) >= 10
          print('THE_WORLD_OBSERVATION_VERIFIED', d.get('repository'))
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify GOD system modules compile
        run: |
          node --input-type=module <<'EOF'
          import './api/god-enhancements.js';
          import './api/ultimate-evolution-engine.js';
          import './api/infinite-evolution-supreme-god.js';
          console.log('GOD SYSTEM MODULES OK');
          EOF

      - name: Run THE WORLD GOD supreme evolution cycle
        run: node api/run-supreme-god.js

      - name: Verify closed-loop report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          report = json.loads(Path(os.environ['GOD_REPORT']).read_text())
          assert report['schema'] == 'the-world-god-supreme-run/v1'
          assert report['layers_initialized'] == 30
          assert report['closed_loop'] is True
          assert report['external_side_effects'] is False
          assert report['supreme_layer']['omniscience'] == 'ACHIEVED'
          assert report['supreme_layer']['omnipotence'] == 'ACHIEVED'
          print('THE_WORLD_GOD_SUPREME_VERIFIED')
          print(f"Cycles: {report['base_layer']['cycles_completed']}")
          print(f"Tasks processed: {report['base_layer']['tasks_processed']}")
          print(f"Reward trend: {report['base_layer']['reward_trend']}")
          print(f"Avg reward: {report['base_layer']['average_reward']:.3f}")
          PY

      - name: Emit enriched knowledge to GOD registry branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          git config user.name "THE WORLD GOD"
          git config user.email "god@the-world.ai"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "$GOD_BRANCH"

          WORKTREE="/tmp/god-registry-wt"
          git worktree add "$WORKTREE" "origin/$GOD_BRANCH"
          trap "git worktree remove --force '$WORKTREE' 2>/dev/null || true" EXIT

          REGISTRY="$WORKTREE/knowledge/god-registry.json"
          mkdir -p "$(dirname "$REGISTRY")"

          python3 automation/unified-knowledge/god_knowledge_emitter.py \
            "$GOD_REPORT" \
            --repo-root "$GITHUB_WORKSPACE" \
            --registry-path "$REGISTRY"

          python3 automation/unified-knowledge/world_knowledge_emitter.py \
            "$WORLD_OBSERVATION" \
            --registry-path "$REGISTRY"

          cd "$WORKTREE"
          git add knowledge/god-registry.json

          if git diff --cached --quiet; then
            echo "Registry already up-to-date for this cycle"
            exit 0
          fi

          ENTRIES=$(python3 -c "import json; r=json.load(open('knowledge/god-registry.json')); print(r.get('total_entries',0))")
          git commit -m "chore(god): knowledge DB updated with world observation [skip ci]

entries: $ENTRIES
source: THE_WORLD_GOD_SUPREME + THE_WORLD_OBSERVER"
          git push origin "HEAD:$GOD_BRANCH"
          echo "Knowledge committed and pushed to $GOD_BRANCH ($ENTRIES total entries)"

      - name: Upload GOD evolution and world evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-world-god-report-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/supreme-god-report.json
            ${{ runner.temp }}/world-observation.json
