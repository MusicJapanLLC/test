name: Korean live proof
on:
  push:
    branches: [music-japan-production]
    paths: ['.github/workflows/korean-live-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: music-japan-production
          fetch-depth: 12
          persist-credentials: false
      - name: Install real browser test dependencies
        run: |
          python -m pip install playwright pyyaml
          python -m playwright install --with-deps chromium
      - name: Verify actual public navigation before checking UI
        run: |
          mkdir -p korean-release-evidence
          python - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          historic=subprocess.check_output(['git','show','f73047693ba39386874a0323caf0fd6f7d1ad71c:.github/workflows/korean-live-proof.yml'],text=True)
          config=yaml.safe_load(historic)
          step=next(s for s in config['jobs']['verify']['steps'] if s.get('name')=='Verify app payload identity and production browser interactions')
          script=step['run'].split("\n",1)[1].rsplit('\nPY',1)[0]
          old="body=(out/'live-response.html').read_bytes();identity(body)"
          assert script.count(old)==1
          script=script.replace(old,'body=source')
          script=script.replace("passed('every original course, CSS and inline app script preserved exactly in public response')",'')
          old="r=page.goto('https://music-japan.com/korean/',wait_until='load');assert r.status==200;identity(r.body())"
          new="""r=page.goto('https://music-japan.com/korean/',wait_until='load')
              response_body=r.body()
              (out/'live-response.html').write_bytes(response_body)
              (out/'http-result.json').write_text(json.dumps({'status':r.status,'headers':r.all_headers(),'url':r.url,'sha256':hashlib.sha256(response_body).hexdigest(),'originalSha256':hashlib.sha256(source).hexdigest()},indent=2))
              page.screenshot(path=str(out/'initial-screen.png'),full_page=True)
              assert r.status==200, 'Public browser request returned '+str(r.status)
              identity(response_body)"""
          assert script.count(old)==1
          script=script.replace(old,new)
          compile(script,'live-proof.py','exec')
          Path('korean-release-evidence/live-proof.py').write_text(script)
          PY
          python -u korean-release-evidence/live-proof.py 2>&1 | tee korean-release-evidence/browser-log.txt
          test -s korean-release-evidence/live-verification.json
      - name: Preserve real observations including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-live-proof
          path: korean-release-evidence/
          retention-days: 30
