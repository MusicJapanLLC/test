name: Owner Scope Negotiation Tests

on:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/negotiation_intelligence_bus.py'
      - 'senju/senju/negotiation_case_review_gate.py'
      - 'senju/senju/reviewed_owner_scope_runtime.py'
      - 'senju/senju/owner_scope_negotiation.py'
      - 'senju/senju/owner_scope_negotiation_runtime.py'
      - 'senju/senju/discovery_trial_gate.py'
      - 'senju/senju/council_operational_governance.py'
      - 'senju/senju/meta/authorized_host_promotion_corps.py'
      - 'senju/senju/meta/promotion_intelligence_exchange.py'
      - 'senju/senju/negotiated_external_client.py'
      - 'senju/scripts/negotiation_intelligence_bus.py'
      - 'senju/scripts/negotiation_case_review_gate.py'
      - 'senju/scripts/promotion_intelligence_exchange.py'
      - 'senju/scripts/owner_scope_negotiation.py'
      - 'senju/scripts/run_council_operational_governance.py'
      - 'senju/scripts/run_authorized_host_promotion_corps.py'
      - 'senju/scripts/negotiated_external_probe.py'
      - 'senju/tests/test_negotiation_intelligence_bus.py'
      - 'senju/tests/test_negotiation_case_review_gate.py'
      - 'senju/tests/test_reviewed_owner_scope_runtime.py'
      - 'senju/tests/test_promotion_intelligence_exchange.py'
      - 'senju/tests/test_owner_scope_negotiation.py'
      - 'senju/tests/test_discovery_trial_gate.py'
      - 'senju/tests/test_council_operational_governance.py'
      - 'senju/tests/test_authorized_host_promotion*.py'
      - 'senju/config/owner-expansion-envelope.json'
      - 'automation/codegen/engine/root_authority_negotiation.py'
      - 'automation/codegen/engine/authority_collaboration_bus.py'
      - 'automation/codegen/engine/negotiation_context_bridge.py'
      - 'automation/codegen/tests/test_root_authority_negotiation.py'
      - 'automation/codegen/tests/test_authority_collaboration_bus*.py'
      - 'automation/codegen/tests/test_negotiation_context_bridge.py'
      - '.github/workflows/root-authority-negotiation-loop.yml'
      - '.github/workflows/owner-scope-negotiation-*.yml'
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
      - 'chatgpt/**'
    paths:
      - 'senju/senju/negotiation_intelligence_bus.py'
      - 'senju/senju/negotiation_case_review_gate.py'
      - 'senju/senju/reviewed_owner_scope_runtime.py'
      - 'senju/senju/owner_scope_negotiation.py'
      - 'senju/senju/owner_scope_negotiation_runtime.py'
      - 'senju/senju/discovery_trial_gate.py'
      - 'senju/senju/council_operational_governance.py'
      - 'senju/senju/meta/authorized_host_promotion_corps.py'
      - 'senju/senju/meta/promotion_intelligence_exchange.py'
      - 'senju/senju/negotiated_external_client.py'
      - 'senju/scripts/negotiation_intelligence_bus.py'
      - 'senju/scripts/negotiation_case_review_gate.py'
      - 'senju/scripts/promotion_intelligence_exchange.py'
      - 'senju/scripts/owner_scope_negotiation.py'
      - 'senju/scripts/run_council_operational_governance.py'
      - 'senju/scripts/run_authorized_host_promotion_corps.py'
      - 'senju/scripts/negotiated_external_probe.py'
      - 'senju/tests/test_negotiation_intelligence_bus.py'
      - 'senju/tests/test_negotiation_case_review_gate.py'
      - 'senju/tests/test_reviewed_owner_scope_runtime.py'
      - 'senju/tests/test_promotion_intelligence_exchange.py'
      - 'senju/tests/test_owner_scope_negotiation.py'
      - 'senju/tests/test_discovery_trial_gate.py'
      - 'senju/tests/test_council_operational_governance.py'
      - 'senju/tests/test_authorized_host_promotion*.py'
      - 'automation/codegen/engine/root_authority_negotiation.py'
      - 'automation/codegen/engine/authority_collaboration_bus.py'
      - 'automation/codegen/engine/negotiation_context_bridge.py'
      - 'automation/codegen/tests/test_root_authority_negotiation.py'
      - 'automation/codegen/tests/test_authority_collaboration_bus*.py'
      - 'automation/codegen/tests/test_negotiation_context_bridge.py'
      - '.github/workflows/root-authority-negotiation-loop.yml'
      - '.github/workflows/owner-scope-negotiation-*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Verify intake gate, negotiation intelligence, trial, council governance, promotion, and client contracts
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python -m pytest -q \
            senju/tests/test_negotiation_intelligence_bus.py \
            senju/tests/test_negotiation_case_review_gate.py \
            senju/tests/test_reviewed_owner_scope_runtime.py \
            senju/tests/test_promotion_intelligence_exchange.py \
            senju/tests/test_owner_scope_negotiation.py \
            senju/tests/test_discovery_trial_gate.py \
            senju/tests/test_council_operational_governance.py \
            senju/tests/test_authorized_host_promotion_corps.py \
            senju/tests/test_authorized_host_promotion_collaboration.py \
            automation/codegen/tests/test_root_authority_negotiation.py \
            automation/codegen/tests/test_authority_collaboration_bus.py \
            automation/codegen/tests/test_authority_collaboration_bus_v2.py \
            automation/codegen/tests/test_negotiation_context_bridge.py
          python -m py_compile \
            senju/senju/negotiation_intelligence_bus.py \
            senju/senju/negotiation_case_review_gate.py \
            senju/senju/reviewed_owner_scope_runtime.py \
            senju/senju/meta/promotion_intelligence_exchange.py \
            senju/senju/owner_scope_negotiation.py \
            senju/senju/owner_scope_negotiation_runtime.py \
            senju/senju/discovery_trial_gate.py \
            senju/senju/council_operational_governance.py \
            senju/senju/meta/authorized_host_promotion_corps.py \
            senju/senju/negotiated_external_client.py \
            senju/scripts/negotiation_intelligence_bus.py \
            senju/scripts/negotiation_case_review_gate.py \
            senju/scripts/promotion_intelligence_exchange.py \
            senju/scripts/owner_scope_negotiation.py \
            senju/scripts/run_council_operational_governance.py \
            senju/scripts/run_authorized_host_promotion_corps.py \
            senju/scripts/negotiated_external_probe.py \
            automation/codegen/engine/root_authority_negotiation.py \
            automation/codegen/engine/authority_collaboration_bus.py \
            automation/codegen/engine/negotiation_context_bridge.py
      - name: Verify production workflow remains a read-only repository lane with shared memory
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/owner-scope-negotiation-production.yml
          grep -q 'contents: read' "$file"
          grep -q 'actions: read' "$file"
          grep -q 'persist-credentials: false' "$file"
          grep -q 'authority-opportunity-improvement-loop' "$file"
          grep -q 'negotiation_context_bridge.py pull' "$file"
          grep -q 'negotiation_context_bridge.py publish' "$file"
          grep -q -- '--collaboration-dir .authority-opportunity-runtime' "$file"
          ! grep -q 'contents: write' "$file"
          ! grep -q 'actions: write' "$file"
          ! grep -q 'git push ' "$file"
          forbidden_event='pull_request''_target:'
          ! grep -q "$forbidden_event" "$file"
