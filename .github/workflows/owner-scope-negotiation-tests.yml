name: Owner Scope Negotiation Tests

on:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/owner_scope_negotiation.py'
      - 'senju/senju/owner_scope_negotiation_runtime.py'
      - 'senju/senju/discovery_trial_gate.py'
      - 'senju/senju/negotiated_external_client.py'
      - 'senju/scripts/owner_scope_negotiation.py'
      - 'senju/scripts/negotiated_external_probe.py'
      - 'senju/tests/test_owner_scope_negotiation.py'
      - 'senju/tests/test_discovery_trial_gate.py'
      - 'senju/config/owner-expansion-envelope.json'
      - '.github/workflows/owner-scope-negotiation-*.yml'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/owner_scope_negotiation.py'
      - 'senju/senju/owner_scope_negotiation_runtime.py'
      - 'senju/senju/discovery_trial_gate.py'
      - 'senju/senju/negotiated_external_client.py'
      - 'senju/scripts/negotiated_external_probe.py'
      - 'senju/tests/test_owner_scope_negotiation.py'
      - 'senju/tests/test_discovery_trial_gate.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Verify negotiation engine, discovery trial gate, and client projection
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python -m pytest -q \
            senju/tests/test_owner_scope_negotiation.py \
            senju/tests/test_discovery_trial_gate.py
          python -m py_compile \
            senju/senju/owner_scope_negotiation.py \
            senju/senju/owner_scope_negotiation_runtime.py \
            senju/senju/discovery_trial_gate.py \
            senju/senju/negotiated_external_client.py \
            senju/scripts/owner_scope_negotiation.py \
            senju/scripts/negotiated_external_probe.py
      - name: Verify production workflow has no repository writer
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/owner-scope-negotiation-production.yml
          grep -q 'contents: read' "$file"
          grep -q 'persist-credentials: false' "$file"
          ! grep -q 'contents: write' "$file"
          ! grep -q 'git push ' "$file"
          # Keep the same runtime assertion while avoiding a static-policy false positive
          # caused by embedding the forbidden event name verbatim in this test workflow.
          forbidden_event='pull_request''_target:'
          ! grep -q "$forbidden_event" "$file"
