name: Standment Security Portfolio Foundry

on:
  schedule:
    - cron: '45 22 * * *' # 07:45 JST, after R&D x Senju and before daily value loop
  workflow_dispatch:
  pull_request:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - 'automation/security/portfolio_rnd.py'
      - 'automation/security/test_portfolio_rnd.py'
      - 'automation/security/portfolio_daily_report.py'
      - 'automation/security/test_portfolio_daily_report.py'
      - 'standment-security/**'
      - 'security/**'
      - 'PORTFOLIO.md'
      - 'senju/scripts/apply_rnd_directive.py'
      - 'senju/scripts/shadow_selector.py'
      - 'senju/state/**'
      - '.github/workflows/standment-security-portfolio-foundry.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: standment-security-portfolio-foundry-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  RND_SLACK_WEBHOOK_URL: ${{ secrets.RND_SLACK_WEBHOOK_URL }}

jobs:
  portfolio-rnd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout THE WORLD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify portfolio-first R&D and detailed reporting contracts
        run: |
          set -euo pipefail
          (cd automation/security && python -m unittest -v test_portfolio_rnd.py test_portfolio_daily_report.py)
          python -m pip install pytest==9.1.1
          (cd senju && python -m pytest tests/test_rnd_directive.py tests/test_shadow_selector.py -q)
          python -m json.tool standment-security/security_portfolio_program.json >/dev/null
          python -m json.tool value-lab/research_queue.json >/dev/null

      - name: Restore previous successful Foundry baseline
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-foundry reports/standment-security-foundry
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Standment Security Portfolio Foundry" --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RUN_ID" && "$RUN_ID" != "$GITHUB_RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/previous-foundry || true
          fi
          PREV_DAILY="$(find /tmp/previous-foundry -name daily.json -path '*standment-security*' -print -quit || true)"
          PREV_EVIDENCE="$(find /tmp/previous-foundry -name evidence.json -path '*standment-security*' -print -quit || true)"
          [[ -n "$PREV_DAILY" ]] && cp "$PREV_DAILY" reports/standment-security-foundry/previous-daily.json || true
          [[ -n "$PREV_EVIDENCE" ]] && cp "$PREV_EVIDENCE" reports/standment-security-foundry/previous-evidence.json || true
          echo "previous_foundry_run=${RUN_ID:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Rank Standment security portfolio gaps
        run: |
          set -euo pipefail
          python automation/security/portfolio_rnd.py \
            --program standment-security/security_portfolio_program.json \
            --portfolio PORTFOLIO.md \
            --out reports/standment-security-foundry
          cat reports/standment-security-foundry/daily.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach customer and commercial context to selected research track
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          plan_path=pathlib.Path('reports/standment-security-foundry/daily.json')
          program_path=pathlib.Path('standment-security/security_portfolio_program.json')
          plan=json.loads(plan_path.read_text(encoding='utf-8'))
          program=json.loads(program_path.read_text(encoding='utf-8'))
          selected=plan.get('selected') or {}
          track=next((x for x in program.get('tracks',[]) if x.get('id') == selected.get('id')), {})
          for key in ('customer_problem','customer_value','commercial_use','success_criteria'):
              if track.get(key):
                  selected[key]=track[key]
          plan['selected']=selected
          plan_path.write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Convert top portfolio gap into bounded Senju directive
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('reports/standment-security-foundry')
          item=json.loads((root/'senju-research-item.json').read_text(encoding='utf-8'))
          directive={k:item[k] for k in ('research_id','focus','candidate_count','hypothesis')}
          directive['schema']='rnd-to-senju-directive/v1'
          (root/'senju-directive.json').write_text(json.dumps(directive,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python senju/scripts/apply_rnd_directive.py \
            --strategy senju/state/strategy.json \
            --directive reports/standment-security-foundry/senju-directive.json \
            --out reports/standment-security-foundry/proposed-strategy.json \
            --audit reports/standment-security-foundry/directive-audit.json

      - name: Senju shadow competition and unseen holdout
        id: senju
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports/standment-security-foundry/senju-shadow
          CANDIDATES="$(python - <<'PY'
          import json
          d=json.load(open('reports/standment-security-foundry/senju-directive.json',encoding='utf-8'))
          print(max(3,min(9,int(d.get('candidate_count',7)))))
          PY
          )"
          set +e
          PYTHONPATH=senju python senju/scripts/shadow_selector.py \
            --state senju/state/champion.json \
            --strategy reports/standment-security-foundry/proposed-strategy.json \
            --out reports/standment-security-foundry/senju-shadow \
            --selected reports/standment-security-foundry/senju-selected-strategy.json \
            --candidates "$CANDIDATES"
          RC=$?
          set -e
          echo "selector_rc=$RC" >> "$GITHUB_OUTPUT"
          if [[ -f reports/standment-security-foundry/senju-shadow/selection.md ]]; then
            cat reports/standment-security-foundry/senju-shadow/selection.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$RC" -ne 0 && "$RC" -ne 2 ]]; then
            echo "Unexpected Senju selector failure: $RC" >&2
            exit "$RC"
          fi

      - name: Build detailed owner-readable daily evidence digest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python automation/security/portfolio_daily_report.py \
            --plan reports/standment-security-foundry/daily.json \
            --audit reports/standment-security-foundry/directive-audit.json \
            --selection reports/standment-security-foundry/senju-shadow/selection.json \
            --previous-plan reports/standment-security-foundry/previous-daily.json \
            --previous-evidence reports/standment-security-foundry/previous-evidence.json \
            --run-url "$RUN_URL" \
            --out-json reports/standment-security-foundry/evidence.json \
            --out-md reports/standment-security-foundry/evidence.md
          cat reports/standment-security-foundry/evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report detailed daily portfolio R&D delta to Slack
        if: github.event_name != 'pull_request' && env.RND_SLACK_WEBHOOK_URL != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          text=pathlib.Path('reports/standment-security-foundry/evidence.md').read_text(encoding='utf-8')
          req=urllib.request.Request(
              os.environ['RND_SLACK_WEBHOOK_URL'],
              data=json.dumps({'text':text},ensure_ascii=False).encode('utf-8'),
              headers={'Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req,timeout=10) as res:
              print('slack status',res.status)
          PY

      - name: Preserve portfolio R&D evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standment-security-portfolio-foundry-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            reports/standment-security-foundry/daily.json
            reports/standment-security-foundry/daily.md
            reports/standment-security-foundry/senju-research-item.json
            reports/standment-security-foundry/senju-directive.json
            reports/standment-security-foundry/proposed-strategy.json
            reports/standment-security-foundry/directive-audit.json
            reports/standment-security-foundry/senju-shadow/selection.json
            reports/standment-security-foundry/senju-shadow/selection.md
            reports/standment-security-foundry/evidence.json
            reports/standment-security-foundry/evidence.md
