name: Senju Authorized Adversary Live Loop

on:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - "senju/senju/adversary_finding_loop.py"
      - "senju/senju/adversary_test_range_transport.py"
      - "senju/scripts/run_authorized_adversary_live_loop.py"
      - "automation/codegen/meta_state/discovery_policy.json"
      - ".github/workflows/authorized-adversary-live-loop.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-adversary-live-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorized-adversary-live-loop:
    name: META + X + SENJU + CHILD / real bounded transport
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install -e './senju'

      - name: Verify explicit live authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("automation/codegen/meta_state/discovery_policy.json").read_text())
          host = "kabeya-authorized-test-range.onrender.com"
          assert host in set(policy.get("trusted_roots", []))
          profile = policy.get("action_profiles", {}).get(host, {})
          assert profile.get("owner_authorization") == "explicit"
          assert profile.get("credential_scope") == "none"
          assert profile.get("inherit_to_descendants") is False
          actions = profile.get("external_actions", {})
          ids = {
              item.get("id")
              for rows in actions.values()
              for item in rows
              if isinstance(item, dict)
          }
          required = {
              "synthetic-contact-write",
              "synthetic-record-create",
              "synthetic-record-update",
              "synthetic-record-cleanup",
          }
          assert required <= ids
          print("explicit_authorized_host:", host)
          print("owner_defined_actions:", sorted(required))
          PY

      - name: Execute real shared adversary finding loop
        working-directory: senju
        run: >-
          python scripts/run_authorized_adversary_live_loop.py
          --json-out authorized-adversary-live-loop-report.json

      - name: Summarize live outcomes
        if: always()
        working-directory: senju
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("authorized-adversary-live-loop-report.json")
          if not path.exists():
              print("report_missing")
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print("mode:", report.get("mode"))
          print("exact_host:", report.get("exact_host"))
          print("campaign_size:", report.get("campaign_size"))
          print("passed:", report.get("passed"))
          for row in report.get("outcomes", []):
              print(
                  row.get("actor"),
                  row.get("status"),
                  row.get("action_id"),
                  row.get("transport_status"),
                  row.get("url"),
              )
          PY

      - name: Upload live loop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authorized-adversary-live-loop-${{ github.sha }}
          path: senju/authorized-adversary-live-loop-report.json
          if-no-files-found: warn
          retention-days: 30
