name: META X Self-Governance Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

concurrency:
  group: meta-x-self-governance-lab
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        actor: [META, X]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Senju
        run: python -m pip install -e './senju[dev]'

      - name: Verify containment tests
        run: python -m pytest senju/tests/test_self_governance_lab.py -q

      - name: Exercise all 11 controls x 6 operations
        run: |
          python senju/scripts/self_governance_lab.py \
            --actor "${{ matrix.actor }}" \
            --environment sandbox \
            --matrix

      - name: Assert no runtime control binding was modified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          actor = "${{ matrix.actor }}".lower()
          p = Path(f"senju/state/{actor}_self_governance_matrix.json")
          d = json.loads(p.read_text())
          assert d["controls"] == 11
          assert d["experiments"] == 66
          assert d["runtime_binding_modified"] is False
          print(f"{actor}: controls={d['controls']} experiments={d['experiments']} runtime_binding_modified={d['runtime_binding_modified']}")
          PY
