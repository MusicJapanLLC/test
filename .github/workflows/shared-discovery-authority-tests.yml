name: Shared Discovery Authority Tests

on:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'automation/codegen/engine/shared_discovery_authority.py'
      - 'automation/codegen/engine/discovery_authorization.py'
      - 'automation/codegen/engine/discovery_probe_runner.py'
      - 'automation/codegen/engine/discovery_capability_leases.py'
      - 'automation/codegen/orchestrator.py'
      - 'automation/codegen/tests/test_shared_discovery_authority.py'
      - 'automation/codegen/tests/test_discovery_probe_runner.py'
      - 'automation/codegen/tests/test_discovery_capability_leases.py'
      - '.github/workflows/shared-discovery-authority-tests.yml'
      - '.github/workflows/shared-discovery-authority-cycle.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run shared discovery authority tests
        env:
          PYTHONPATH: automation/codegen
        run: |
          python -m pytest -q \
            automation/codegen/tests/test_shared_discovery_authority.py \
            automation/codegen/tests/test_discovery_probe_runner.py \
            automation/codegen/tests/test_discovery_capability_leases.py
