name: Senju Autonomous Delegator

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - "feat/senju-autonomous-delegation-20260831"
    paths:
      - "senju/scripts/autonomy_delegate.py"
      - "senju/tests/test_autonomy_delegate.py"
      - ".github/workflows/senju-autonomous-delegator.yml"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: senju-autonomous-delegator
  cancel-in-progress: true

jobs:
  delegate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Test autonomous delegation router
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          (cd senju && python -m pytest tests/test_autonomy_delegate.py -q)

      - name: Restore latest Senju advisor evidence
        id: restore
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-memory
          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju Daily Self Evolution" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name senju-memory \
              --dir /tmp/senju-memory || true
          fi
          ADVISOR="$(find /tmp/senju-memory -name advisor-brief.json -print -quit || true)"
          if [[ -z "$ADVISOR" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No advisor evidence available; nothing to delegate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp "$ADVISOR" /tmp/advisor-brief.json
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "source_run=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Decide autonomous route
        id: route
        if: steps.restore.outputs.available == 'true'
        run: |
          set -euo pipefail
          python senju/scripts/autonomy_delegate.py \
            --advisor /tmp/advisor-brief.json \
            --out /tmp/delegation.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/delegation.json', encoding='utf-8'))
          for key in ('route','priority','delegation_key'):
              print(f"{key}={d.get(key,'')}")
          PY
          cat /tmp/delegation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Delegate safe cross-repository work to Jules
        if: steps.route.outputs.route == 'jules'
        run: |
          set -euo pipefail
          KEY="${{ steps.route.outputs.delegation_key }}"
          TITLE="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/delegation.json', encoding='utf-8'))['title'])
          PY
          )"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/delegation.json', encoding='utf-8'))
          Path('/tmp/delegation-body.md').write_text(d['body'], encoding='utf-8')
          PY

          EXISTING="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --search "$KEY in:body" \
            --limit 10 \
            --json number \
            --jq '.[0].number // empty' || true)"
          if [[ -n "$EXISTING" ]]; then
            echo "Delegation already exists as issue #$EXISTING" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          URL="$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body-file /tmp/delegation-body.md)"
          echo "Delegated to Jules: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve delegation evidence
        if: always() && steps.restore.outputs.available == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: senju-autonomous-delegation
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/advisor-brief.json
            /tmp/delegation.json
