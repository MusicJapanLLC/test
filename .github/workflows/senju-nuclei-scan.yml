name: Senju Real Scan — Nuclei against own endpoints

on:
  schedule:
    - cron: "7 * * * *"  # hourly owned-surface research
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional HTTPS target on an owned allowlisted domain; empty scans every owned target"
        required: false

concurrency:
  group: senju-nuclei-scan
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate target URL against owned allowlist
        id: validate
        shell: python
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url }}
        run: |
          import os, pathlib, urllib.parse

          own_domains = frozenset([
            'iyomaru-ramen.vercel.app',
            'musicjapanllc.github.io',
            'music-japan.com',
            'partners.music-japan.com',
            'secondtake.music-japan.com',
            'music-japan-lp.vercel.app',
            'test-musicjapanllc.vercel.app',
          ])

          raw = os.environ.get('INPUT_TARGET_URL', '').strip()
          targets = []
          if raw:
              parsed = urllib.parse.urlsplit(raw)
              if parsed.scheme != 'https':
                  raise SystemExit('target must use HTTPS')
              if parsed.username or parsed.password:
                  raise SystemExit('userinfo in target URL is not allowed')
              host = parsed.hostname or ''
              if not host:
                  raise SystemExit('target URL has no hostname')
              if parsed.port:
                  raise SystemExit('custom target ports are not allowed')
              if host not in own_domains:
                  raise SystemExit(f'target host is not in owned allowlist: {host}')
              targets = [f"https://{host}{parsed.path or '/'}"]
          else:
              targets = [f'https://{host}/' for host in sorted(own_domains)]

          pathlib.Path('/tmp/senju-owned-targets.txt').write_text('\n'.join(targets) + '\n', encoding='utf-8')
          print(f'validated {len(targets)} owned target(s)')
          for target in targets:
              print(target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'target_count={len(targets)}\n')

      - name: Install Nuclei
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Update Nuclei templates
        run: nuclei -update-templates -silent || true

      - name: Run Nuclei scan (safe templates only, owned allowlist)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nuclei-out
          test -s /tmp/senju-owned-targets.txt
          nuclei \
            -l /tmp/senju-owned-targets.txt \
            -tags misconfig,exposure,config,tech,info,ssl,headers,cves \
            -exclude-tags dos,fuzz,rce,sqli,xss,intrusive,exploit,bruteforce \
            -severity info,low,medium,high,critical \
            -json \
            -output /tmp/nuclei-out/findings.jsonl \
            -timeout 10 \
            -rate-limit 100 \
            -bulk-size 50 \
            -concurrency 25 \
            -silent || true

      - name: Ingest findings into Senju state
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=senju python - <<'PY'
          import json, pathlib, datetime

          NUCLEI_TAG_MAP = {
              'misconfig': 'misconfiguration',
              'exposure': 'info_disclosure',
              'ssl': 'tls_config',
              'headers': 'security_headers',
              'tech': 'tech_fingerprint',
              'config': 'misconfiguration',
              'cves': 'known_cve',
          }

          findings_path = pathlib.Path('/tmp/nuclei-out/findings.jsonl')
          state_path = pathlib.Path('senju/state/last-evolution-summary.json')
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state = json.loads(state_path.read_text()) if state_path.exists() else {}

          hits = state.setdefault('vuln_class_hits', {})
          severities = state.setdefault('nuclei_severity_hits', {})
          count = 0
          if findings_path.exists():
              for line in findings_path.read_text().splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  info = obj.get('info', {})
                  severity = str(info.get('severity') or 'unknown').lower()
                  severities[severity] = severities.get(severity, 0) + 1
                  for tag in info.get('tags', []):
                      vc = NUCLEI_TAG_MAP.get(tag)
                      if vc:
                          hits[vc] = hits.get(vc, 0) + 1
                          count += 1

          state['last_nuclei_ingest'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          state['last_nuclei_target_count'] = sum(1 for line in pathlib.Path('/tmp/senju-owned-targets.txt').read_text().splitlines() if line.strip())
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')
          print(f'Ingested {count} nuclei class hits into Senju state')
          PY

      - name: Persist updated state through GitHub API
        shell: bash
        env:
          TARGET_BRANCH: claude/employee-onboarding-setup-udm86
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          state_path = Path('senju/state/last-evolution-summary.json')
          if not state_path.exists():
              raise SystemExit('state file was not generated')

          owner, repo = os.environ['REPO'].split('/', 1)
          token = os.environ['GH_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          path = 'senju/state/last-evolution-summary.json'
          endpoint = f"https://api.github.com/repos/{owner}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          sha = None
          get_request = urllib.request.Request(
              f"{endpoint}?{urllib.parse.urlencode({'ref': branch})}",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(get_request, timeout=15) as response:
                  sha = json.loads(response.read()).get('sha')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          payload = {
              'message': 'chore(senju): nuclei scan findings [skip ci]',
              'content': base64.b64encode(state_path.read_bytes()).decode('ascii'),
              'branch': branch,
          }
          if sha:
              payload['sha'] = sha
          put_request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode('utf-8'),
              method='PUT',
              headers=headers,
          )
          with urllib.request.urlopen(put_request, timeout=20) as response:
              result = json.loads(response.read())
          print(f"state persisted: {result.get('content', {}).get('path', path)}")
          PY

      - name: Upload nuclei findings artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-nuclei-findings-${{ github.run_id }}
          path: |
            /tmp/senju-owned-targets.txt
            /tmp/nuclei-out/findings.jsonl
          if-no-files-found: warn
          retention-days: 30
