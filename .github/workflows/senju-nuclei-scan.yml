name: Senju Real Scan — Nuclei against own endpoints

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "HTTPS target on an owned/explicitly authorized allowlisted domain"
        required: false

concurrency:
  group: senju-nuclei-scan
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_BRANCH: claude/employee-onboarding-setup-udm86

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate target URL against owned allowlist
        id: validate
        shell: python
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url }}
        run: |
          import os, urllib.parse

          own_domains = frozenset([
            'iyomaru-ramen.vercel.app',
            'musicjapanllc.github.io',
            'kabeya-authorized-test-range.onrender.com',
          ])

          raw = os.environ.get('INPUT_TARGET_URL', '').strip()
          target = raw or 'https://kabeya-authorized-test-range.onrender.com/'
          parsed = urllib.parse.urlsplit(target)

          if parsed.scheme != 'https':
              raise SystemExit('target must use HTTPS')
          if parsed.username or parsed.password:
              raise SystemExit('userinfo in target URL is not allowed')
          host = parsed.hostname or ''
          if not host:
              raise SystemExit('target URL has no hostname')
          if parsed.port:
              raise SystemExit('custom target ports are not allowed')
          if host not in own_domains:
              raise SystemExit(f'target host is not in owned allowlist: {host}')

          normalized = f"https://{host}{parsed.path or '/'}"
          print(f'validated owned target: {normalized}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'target={normalized}\n')

      - name: Install Nuclei
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Update Nuclei templates
        run: nuclei -update-templates -silent || true

      - name: Run Nuclei scan (non-destructive templates, authorized targets only)
        shell: bash
        run: |
          mkdir -p /tmp/nuclei-out
          TARGET="${{ steps.validate.outputs.target }}"
          nuclei \
            -u "$TARGET" \
            -tags misconfig,exposure,config,tech,info,ssl,headers,cves \
            -exclude-tags dos,rce,bruteforce,intrusive,exploit \
            -severity info,low,medium,high,critical \
            -json \
            -output /tmp/nuclei-out/findings.jsonl \
            -timeout 10 \
            -rate-limit 50 \
            -bulk-size 30 \
            -concurrency 15 \
            -silent || true

      - name: Ingest findings into Senju state
        id: ingest
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=senju python - <<'PY'
          import json, pathlib, datetime, os

          NUCLEI_TAG_MAP = {
              'misconfig': 'misconfiguration',
              'exposure': 'info_disclosure',
              'ssl': 'tls_config',
              'headers': 'security_headers',
              'tech': 'tech_fingerprint',
              'config': 'misconfiguration',
              'cves': 'known_cve',
          }

          findings_path = pathlib.Path('/tmp/nuclei-out/findings.jsonl')
          state_path = pathlib.Path('senju/state/last-evolution-summary.json')
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state = json.loads(state_path.read_text()) if state_path.exists() else {}

          hits = state.setdefault('vuln_class_hits', {})
          finding_count = 0
          mapped_hits = 0
          if findings_path.exists():
              for line in findings_path.read_text().splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  finding_count += 1
                  for tag in obj.get('info', {}).get('tags', []):
                      vc = NUCLEI_TAG_MAP.get(tag)
                      if vc:
                          hits[vc] = hits.get(vc, 0) + 1
                          mapped_hits += 1

          state['last_nuclei_ingest'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          state['last_nuclei_finding_count'] = finding_count
          state['last_nuclei_mapped_hits'] = mapped_hits
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')
          print(f'Ingested {finding_count} findings / {mapped_hits} mapped hits into Senju state')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'finding_count={finding_count}\n')
              output.write(f'mapped_hits={mapped_hits}\n')
          PY

      - name: Persist updated state through GitHub API
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          state_path = Path('senju/state/last-evolution-summary.json')
          if not state_path.exists():
              raise SystemExit('state file was not generated')

          owner, repo = os.environ['REPO'].split('/', 1)
          token = os.environ['GH_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          path = 'senju/state/last-evolution-summary.json'
          endpoint = f"https://api.github.com/repos/{owner}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          sha = None
          get_request = urllib.request.Request(
              f"{endpoint}?{urllib.parse.urlencode({'ref': branch})}",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(get_request, timeout=15) as response:
                  sha = json.loads(response.read()).get('sha')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          payload = {
              'message': 'chore(senju): nuclei scan findings [skip ci]',
              'content': base64.b64encode(state_path.read_bytes()).decode('ascii'),
              'branch': branch,
          }
          if sha:
              payload['sha'] = sha
          put_request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode('utf-8'),
              method='PUT',
              headers=headers,
          )
          with urllib.request.urlopen(put_request, timeout=20) as response:
              result = json.loads(response.read())
          print(f"state persisted: {result.get('content', {}).get('path', path)}")
          PY

      - name: Trigger Senju self-development from observed vulnerability evidence
        if: steps.ingest.outputs.finding_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run senju-self-develop.yml --ref "$TARGET_BRANCH"

      - name: Upload nuclei findings artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-nuclei-findings-${{ github.run_id }}
          path: /tmp/nuclei-out/findings.jsonl
          if-no-files-found: warn
          retention-days: 30
