name: Senju Live Opposition Force

on:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - "senju/OFFENSE_FIRST.md"
      - "senju/adversary/**"
      - "senju/senju/safety.py"
      - "senju/senju/authorized_assessment.py"
      - "senju/senju/external.py"
      - "senju/senju/autonomy/**"
      - "senju/senju/multiguard_adversary.py"
      - "senju/senju/multiguard_adversary_v2.py"
      - "senju/senju/opposition_force.py"
      - "senju/scripts/run_live_opposition_force.py"
      - "senju/tests/test_live_opposition_force.py"
      - "scripts/security/artifact_guard.py"
      - ".github/workflows/security-guard.yml"
      - ".github/workflows/live-opposition-force.yml"
  pull_request:
    paths:
      - "senju/OFFENSE_FIRST.md"
      - "senju/adversary/**"
      - "senju/senju/safety.py"
      - "senju/senju/authorized_assessment.py"
      - "senju/senju/external.py"
      - "senju/senju/autonomy/**"
      - "senju/senju/multiguard_adversary.py"
      - "senju/senju/multiguard_adversary_v2.py"
      - "senju/senju/opposition_force.py"
      - "senju/scripts/run_live_opposition_force.py"
      - "senju/tests/test_live_opposition_force.py"
      - "scripts/security/artifact_guard.py"
      - ".github/workflows/security-guard.yml"
      - ".github/workflows/live-opposition-force.yml"
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-opposition-force-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-opposition-force:
    name: Real guards / persistent degraded baseline / 39.8k pressure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Senju test dependency
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install -e './senju[dev]'

      - name: Lock persistent degraded baseline and regression scars
        working-directory: senju
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("adversary/degraded_profile.json").read_text())
          scars = json.loads(Path("adversary/regression_scars.json").read_text())
          assert profile["test_only"] is True
          assert profile["require_fake_transport"] is True
          assert profile["minimum_pressure_attempts"] >= 39800
          assert len(scars["entries"]) >= 4
          print("persistent_degraded_floor:", profile["minimum_pressure_attempts"])
          print("persistent_regression_scars:", len(scars["entries"]))
          PY

      - name: Prove live repository bindings and pressure invariants
        working-directory: senju
        run: python -m pytest tests/test_live_opposition_force.py -q

      - name: Hammer all seven real guard surfaces
        working-directory: senju
        run: >-
          python scripts/run_live_opposition_force.py
          --compact
          --fail-on-surprise
          --json-out live-opposition-force-report.json
          > /tmp/live-opposition-force-stdout.json

      - name: Summarize result
        working-directory: senju
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("live-opposition-force-report.json").read_text())
          profile = json.loads(Path("adversary/degraded_profile.json").read_text())
          scars = json.loads(Path("adversary/regression_scars.json").read_text())
          print("mode:", report["mode"])
          print("binding_count:", report["binding_count"])
          print("surrogate_count:", report["surrogate_count"])
          print("campaign_total:", report["campaign"]["total"])
          print("pressure_attempts:", report["pressure_attempts"])
          print("persistent_degraded_floor:", profile["minimum_pressure_attempts"])
          print("persistent_regression_scars:", len(scars["entries"]))
          print("pressure_failures:", report["pressure_failures"])
          print("passed:", report["passed"])
          for pressure in report["pressure"]:
              print("pressure", pressure["name"], "attempts=" + str(pressure["attempts"]), "passed=" + str(pressure["passed"]), "side_effect_calls=" + str(pressure["side_effect_calls"]))
          PY

      - name: Upload opposition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-opposition-force-${{ github.sha }}
          path: |
            senju/live-opposition-force-report.json
            senju/adversary/degraded_profile.json
            senju/adversary/regression_scars.json
          if-no-files-found: warn
          retention-days: 30
