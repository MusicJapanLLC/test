name: Senju Federated Action Bus Canary

on:
  workflow_dispatch:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
      - senju/federation-action-bus-20260830
    paths:
      - "senju/senju/federation.py"
      - "senju/tests/test_federation.py"
      - "senju/examples/federation-readonly.json"
      - ".github/workflows/senju-federation-canary.yml"

permissions:
  contents: read

concurrency:
  group: senju-federation-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  federation:
    name: Multi-agent intents -> Senju -> real API evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD SINGULARITY workflow.")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install -e './senju[dev]'

      - name: Verify federation and transport regression
        working-directory: senju
        run: |
          set -euo pipefail
          python -m pytest tests/test_federation.py tests/test_external_contact.py -q

      - name: Execute real read-only multi-producer federation
        working-directory: senju
        run: |
          set -euo pipefail
          rm -rf /tmp/senju-federation
          python -m senju.federation \
            --intent examples/federation-readonly.json \
            --allow-host api.github.com \
            --max-effect read \
            --retries 1 \
            --out-dir /tmp/senju-federation

      - name: Verify chained external evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("/tmp/senju-federation/federation-run.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data["schema"] == "senju-federation-run/v1"
          assert data["success"] is True
          assert data["max_effect"] == "read"
          assert data["producers"] == ["BOSS", "FOUNDRY", "RND"]
          assert data["planned_steps"] == 3
          assert data["executed_steps"] == 3
          assert [x["id"] for x in data["steps"]] == ["repo", "latest_commit", "workflows"]
          assert all(x["ok"] is True for x in data["steps"])
          assert all(x["status"] == 200 for x in data["steps"])
          assert all(x["receipt_schema"] == "senju-external-contact/v3" for x in data["steps"])

          repo_url = data["steps"][0]["response_json"]["url"]
          assert repo_url == "https://api.github.com/repos/MusicJapanLLC/test"
          assert data["steps"][1]["requested_url"].startswith(repo_url + "/commits")
          assert data["steps"][2]["requested_url"].startswith(repo_url + "/actions/workflows")

          print("SENJU_FEDERATION_REAL_API_CHAIN_VERIFIED")
          print(json.dumps({
              "run_id": data["run_id"],
              "producers": data["producers"],
              "statuses": [x["status"] for x in data["steps"]],
              "total_response_bytes": data["total_response_bytes"],
          }, ensure_ascii=False))
          PY

      - name: Publish federation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-federation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/senju-federation/
