name: SENJU RED Public Lab Expansion

on:
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/config/public_red_lab_sources.json'
      - 'senju/config/public_red_route_seeds.json'
      - 'senju/config/public-red-lab-registry.json'
      - 'senju/scripts/admit_public_red_registry.py'
      - 'senju/scripts/public_red_target_intake.py'
      - 'senju/scripts/public_red_target_fanout.py'
      - 'senju/scripts/public_red_seed_expander.py'
      - 'senju/scripts/public_red_burst_fanout.py'
      - 'senju/senju/public_red_lab_discovery.py'
      - 'senju/tests/test_public_red_lab_discovery.py'
      - 'senju/tests/test_public_red_target_pipeline.py'
      - 'senju/tests/test_public_red_url_expansion.py'
      - 'senju/state/standing_authorizations.json'
      - 'senju/state/owner_contact_ceiling_effective.json'
      - '.github/workflows/senju-red-public-lab-expansion.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senju-red-public-lab-expansion
  cancel-in-progress: false

jobs:
  expand-and-rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Verify public-lab RED expansion contracts
        env:
          PYTHONPATH: senju
        run: |
          python -m pytest -q \
            senju/tests/test_public_red_lab_discovery.py \
            senju/tests/test_public_red_target_pipeline.py \
            senju/tests/test_public_red_url_expansion.py \
            senju/tests/test_approved_authority_red_adaptive.py
          python -m py_compile \
            senju/scripts/admit_public_red_registry.py \
            senju/scripts/public_red_target_intake.py \
            senju/scripts/public_red_target_fanout.py \
            senju/scripts/public_red_seed_expander.py \
            senju/scripts/public_red_burst_fanout.py \
            senju/senju/public_red_lab_discovery.py \
            senju/senju/approved_authority_red_adaptive.py

      - name: Admit curated operator-published public RED labs
        env:
          PYTHONPATH: senju
        run: |
          python senju/scripts/admit_public_red_registry.py \
            | tee /tmp/public_red_registry_admission.json
          test "$(python - <<'PY'
          import json
          p=json.load(open('/tmp/public_red_registry_admission.json'))
          print(p.get('registry_target_count', 0))
          PY
          )" -ge 20
          test "$(python - <<'PY'
          import json
          p=json.load(open('/tmp/public_red_registry_admission.json'))
          print(p.get('effective_safe_host_count', 0))
          PY
          )" -ge 20

      - name: Refresh operator-published security lab authority
        run: |
          python senju/scripts/public_red_target_intake.py \
            --admit-standing \
            --sync-effective \
            --create-gruyere-instance

      - name: Expand exact-host route seeds to at least 60 RED URLs
        env:
          PYTHONPATH: senju
        run: |
          python senju/scripts/public_red_seed_expander.py --minimum-profiles 60 \
            | tee /tmp/public_red_seed_expansion.json
          test "$(python - <<'PY'
          import json
          p=json.load(open('senju/state/public_red_discovery.json'))
          print(p.get('expanded_unique_url_count', 0))
          PY
          )" -ge 60

      - name: Revalidate expanded RED catalog
        env:
          PYTHONPATH: senju
        run: |
          python senju/scripts/public_red_target_fanout.py --validate-only \
            | tee /tmp/public_red_catalog_validation.json

      - name: Run hourly diversified bounded RED burst
        env:
          PYTHONPATH: senju
        run: |
          python senju/scripts/public_red_burst_fanout.py \
            --operation-id "public-red-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --max-profiles 6 \
            --memory /tmp/approved_authority_red_memory.json \
            --out /tmp/public_red_burst_latest.json \
            | tee /tmp/public_red_burst_summary.json
          test "$(python - <<'PY'
          import json
          p=json.load(open('/tmp/public_red_burst_latest.json'))
          print(p.get('validated_target_profiles', 0))
          PY
          )" -ge 60
          test "$(python - <<'PY'
          import json
          p=json.load(open('/tmp/public_red_burst_latest.json'))
          print(p.get('batch_size', 0))
          PY
          )" -eq 6
          cat /tmp/public_red_burst_latest.json

      - name: Upload RED expansion evidence
        uses: actions/upload-artifact@v4
        with:
          name: senju-red-public-lab-expansion-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            /tmp/public_red_registry_admission.json
            /tmp/public_red_seed_expansion.json
            /tmp/public_red_catalog_validation.json
            /tmp/public_red_burst_summary.json
            /tmp/public_red_burst_latest.json
            senju/state/public_red_discovery.json

      - name: Persist newly verified public-lab URL inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'senju-red-lab-bot'
          git config user.email 'senju-red-lab-bot@users.noreply.github.com'
          git add \
            senju/state/standing_authorizations.json \
            senju/state/owner_contact_ceiling_effective.json \
            senju/state/public_red_discovery.json \
            senju/state/public_red_lab_authority.json
          if git diff --cached --quiet; then
            echo 'No public-lab authority/inventory changes to persist.'
            exit 0
          fi
          git commit -m 'chore(senju-red): refresh expanded operator-verified RED URL inventory'
          git push origin HEAD:claude/employee-onboarding-setup-udm86
