name: Manager Schedule Regression Guard

on:
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/tomoki-manager-queue.yml'
      - '.github/workflows/manager-schedule-regression.yml'
  pull_request:
    paths:
      - '.github/workflows/tomoki-manager-queue.yml'

permissions:
  contents: read

jobs:
  canonical-manager-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Enforce staggered five-minute cadence
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/tomoki-manager-queue.yml').read_text(encoding='utf-8')
          canonical = "cron: '2-59/5 * * * *'"
          forbidden = "cron: '*/5 * * * *'"

          if canonical not in workflow:
              raise SystemExit('Manager schedule drift: canonical 2-59/5 cadence is missing')
          if forbidden in workflow:
              raise SystemExit('Manager schedule drift: hourly-boundary */5 cadence is forbidden')

          print('Manager schedule regression guard: PASS')
