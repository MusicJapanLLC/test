name: Adaptive Homage Lab

on:
  pull_request:
    paths:
      - 'security/homage_lab/**'
      - '.github/workflows/adaptive-homage-lab.yml'
  push:
    branches:
      - 'claude/employee-onboarding-setup-udm86'
    paths:
      - 'security/homage_lab/**'
      - '.github/workflows/adaptive-homage-lab.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-homage-lab
  cancel-in-progress: false

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run simulation-only homage tests
        run: python -m unittest security.homage_lab.test_adaptive_homage
      - name: Run autonomous simulation cycle
        run: python -m security.homage_lab.adaptive_homage | tee adaptive-homage-report.json
      - name: Publish cycle summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path('adaptive-homage-report.json').read_text(encoding='utf-8'))
          evolution = report['phases']['evolution']
          print('## Adaptive Homage Lab')
          print()
          print('Mode: **simulation-only**')
          print(f"External I/O: **{report['external_io']}**")
          print(f"Best fitness: **{evolution['fitness']}**")
          print(f"Generations: **{len(evolution['history'])}**")
          PY
