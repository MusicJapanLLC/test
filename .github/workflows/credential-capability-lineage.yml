name: Senju Credential Capability Lineage

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - "claude/employee-onboarding-setup-udm86"
      - "openai/credential-capability-lineage-prod-20260831"
    paths:
      - "senju/senju/meta/credential_capability_lineage.py"
      - "senju/senju/meta/agent_factory.py"
      - "senju/senju/meta/agent_fleet.py"
      - "senju/senju/meta/closed_loop_agent_fabric.py"
      - "senju/senju/meta/recursive_agent_broker.py"
      - "senju/tests/test_credential_capability_lineage.py"
      - "senju/tests/test_agent_factory.py"
      - "senju/tests/test_closed_loop_agent_fabric.py"
      - ".github/workflows/credential-capability-lineage.yml"
  pull_request:
    branches:
      - "claude/employee-onboarding-setup-udm86"
    paths:
      - "senju/senju/meta/credential_capability_lineage.py"
      - "senju/senju/meta/agent_factory.py"
      - "senju/senju/meta/agent_fleet.py"
      - "senju/senju/meta/closed_loop_agent_fabric.py"
      - "senju/senju/meta/recursive_agent_broker.py"
      - "senju/tests/test_credential_capability_lineage.py"
      - "senju/tests/test_agent_factory.py"
      - "senju/tests/test_closed_loop_agent_fabric.py"
      - ".github/workflows/credential-capability-lineage.yml"

permissions:
  contents: read

concurrency:
  group: senju-credential-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Verify credential capability lineage and replica integration
        working-directory: senju
        run: >-
          python -m pytest -q
          tests/test_credential_capability_lineage.py
          tests/test_agent_factory.py
          tests/test_closed_loop_agent_fabric.py

      - name: Compile production credential and replica modules
        run: >-
          python -m py_compile
          senju/senju/meta/credential_capability_lineage.py
          senju/senju/meta/agent_factory.py
          senju/senju/meta/agent_fleet.py
          senju/senju/meta/closed_loop_agent_fabric.py
          senju/senju/meta/recursive_agent_broker.py

      - name: Exercise all credential classes through Parent Child Grandchild lineage
        working-directory: senju
        run: |
          set -euo pipefail
          rm -rf /tmp/senju-credential-lineage
          mkdir -p /tmp/senju-credential-lineage
          python - <<'PY'
          import json
          from pathlib import Path
          from senju.meta.credential_capability_lineage import (
              SUPPORTED_CREDENTIAL_CLASSES,
              build_use_request,
              delegate_capability,
              issue_root_capability,
              lineage,
              register_root_reference,
              registry_summary,
          )

          root_dir = Path('/tmp/senju-credential-lineage')
          registry = root_dir / 'credential_capability_registry.json'
          evidence = []
          for klass in sorted(SUPPORTED_CREDENTIAL_CLASSES):
              root = register_root_reference(
                  registry,
                  owner_agent_id='META',
                  credential_class=klass,
                  provider='production-credential-broker',
                  secret_ref=f'broker://production/{klass}/primary',
                  scopes=['read'],
                  audiences=['service.example.com'],
              )
              parent = issue_root_capability(
                  registry,
                  root_reference_id=root.root_reference_id,
                  subject_agent_id='META',
              )
              child = delegate_capability(
                  registry,
                  parent_agent_id='META',
                  child_agent_id=f'META-{klass}-CHILD',
                  parent_capability_id=parent.capability_id,
              )
              grandchild = delegate_capability(
                  registry,
                  parent_agent_id=f'META-{klass}-CHILD',
                  child_agent_id=f'META-{klass}-GRANDCHILD',
                  parent_capability_id=child.capability_id,
              )
              request = build_use_request(
                  registry,
                  capability_id=grandchild.capability_id,
                  subject_agent_id=f'META-{klass}-GRANDCHILD',
                  requested_scope='read',
                  audience='service.example.com',
              )
              chain = lineage(registry, capability_id=grandchild.capability_id)
              assert len(chain) == 3
              assert request.raw_credential_returned is False
              evidence.append({
                  'credential_class': klass,
                  'lineage_subjects': [row['subject_agent_id'] for row in chain],
                  'materialization_mode': request.materialization_mode,
                  'raw_credential_returned': request.raw_credential_returned,
              })

          payload = {
              'schema': 'senju-credential-capability-production-evidence/v1',
              'production_control_plane': True,
              'raw_credential_copying': False,
              'lineage_mode': 'parent_child_grandchild_provider_exchange',
              'registry_summary': registry_summary(registry),
              'credential_classes': evidence,
          }
          (root_dir / 'evidence.json').write_text(json.dumps(payload, indent=2) + '\n')
          print('SENJU_CREDENTIAL_CAPABILITY_LINEAGE_VERIFIED classes=' + str(len(evidence)))
          PY

      - name: Publish non-secret lineage evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: senju-credential-capability-lineage-evidence
          retention-days: 30
          if-no-files-found: error
          path: /tmp/senju-credential-lineage/evidence.json
