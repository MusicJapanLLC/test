name: Authorization Review Key Precedent

on:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - 'senju/authorization_issuance_bureau.py'
      - 'senju/scripts/run_authorization_issuance_bureau.py'
      - 'senju/state/public_review_key_policy.json'
      - 'senju/state/authorization_key_precedent.md'
      - 'tests/test_authorization_issuance_bureau.py'
      - '.github/workflows/authorization-review-key-precedent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precedent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Senju
        run: python -m pip install --disable-pip-version-check -e './senju[dev]'

      - name: Run focused tests
        run: pytest -q tests/test_authorization_issuance_bureau.py

      - name: Issue a new open review key and carry it to approval
        env:
          STATE: ${{ runner.temp }}/authorization-key-precedent
        run: |
          set -euo pipefail
          mkdir -p "$STATE"
          cat > "$STATE/input.json" <<'JSON'
          {
            "host": "sustainaboy-works.onrender.com",
            "source": "external_input",
            "requester": "precedent-public-requester",
            "request_review_key": true,
            "requested_methods": ["GET", "HEAD"],
            "credential_scope": "none",
            "private_network": false,
            "proof_ref": "precedent-001"
          }
          JSON
          python senju/scripts/run_authorization_issuance_bureau.py \
            --input "$STATE/input.json" \
            --output "$STATE/output.json"
          test "$(jq -r '.review_key.acquisition_policy' "$STATE/output.json")" = "open"
          test "$(jq -r '.review_key.authority_effect' "$STATE/output.json")" = "none"
          test "$(jq -r '.authorization.authority_effect' "$STATE/output.json")" = "authorization_issued"
          test "$(jq -r '.requested_authority.host' "$STATE/output.json")" = "sustainaboy-works.onrender.com"
          test "$(jq -r '.requested_authority.inheritance' "$STATE/output.json")" = "same_or_narrower"
          test "$(jq -r '.precedent' "$STATE/output.json")" = "open_review_key_to_authorization"

      - name: Preserve precedent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authorization-review-key-precedent-${{ github.run_id }}
          path: ${{ runner.temp }}/authorization-key-precedent/
          if-no-files-found: warn
          retention-days: 30
