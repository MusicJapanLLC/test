name: Music Japan Meeting Engine CI

on:
  pull_request:
    paths:
      - 'baton-meetings/participation-engine/**'
      - '.github/workflows/mj-meeting-participation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-unit-tests:
    name: Windows Node.js isolated unit tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert mock participation invariants
        working-directory: baton-meetings/participation-engine
        run: node --test
