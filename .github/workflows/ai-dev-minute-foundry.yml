name: AI Dev - Minute Foundry

on:
  schedule:
    # GitHub scheduling is not real-time; the job itself performs ~1-minute ticks.
    - cron: '11 * * * *'
  workflow_dispatch:
  pull_request:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/ai-dev-minute-foundry.yml'
      - 'automation/ai_foundry/**'

concurrency:
  group: ai-dev-minute-foundry
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      STATE_DIR: /tmp/ai-dev-foundry
    steps:
      - name: Checkout THE WORLD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify minute-evolution control plane
        run: |
          set -euo pipefail
          python -m unittest -v automation.ai_foundry.test_minute_evolution

      - name: Restore previous AI Developer champion
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR"
          if git fetch origin ai-foundry-state:refs/remotes/origin/ai-foundry-state 2>/dev/null; then
            if git show origin/ai-foundry-state:state/ai-dev/champion.json > "$STATE_DIR/champion.json" 2>/dev/null; then
              echo "Restored champion state from ai-foundry-state." >> "$GITHUB_STEP_SUMMARY"
            else
              python automation/ai_foundry/minute_evolution.py init --out "$STATE_DIR/champion.json"
            fi
          else
            python automation/ai_foundry/minute_evolution.py init --out "$STATE_DIR/champion.json"
          fi
          cp "$STATE_DIR/champion.json" "$STATE_DIR/start.json"

      - name: Run minute-scale AI strategy evolution
        id: evolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            rounds=5
            sleep_seconds=0
          else
            rounds=60
            sleep_seconds=60
          fi

          python automation/ai_foundry/minute_evolution.py run \
            --state "$STATE_DIR/champion.json" \
            --out "$STATE_DIR/champion-next.json" \
            --summary "$STATE_DIR/hourly-summary.json" \
            --history "$STATE_DIR/history.jsonl" \
            --rounds "$rounds" \
            --sleep-seconds "$sleep_seconds" \
            --seed "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

          mv "$STATE_DIR/champion-next.json" "$STATE_DIR/champion.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p=os.environ['STATE_DIR']+'/hourly-summary.json'
          d=json.load(open(p, encoding='utf-8'))
          print('fingerprint='+d['report_fingerprint'])
          print('material=' + ('true' if d['material_delta'] else 'false'))
          print('rounds='+str(d['rounds']))
          print('promotions='+str(d['promotions_delta']))
          print('next_focus='+d['weakest_next_focus'])
          PY

      - name: Render human-readable hourly delta
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=os.environ['STATE_DIR']+'/hourly-summary.json'
          d=json.load(open(p, encoding='utf-8'))
          lines=[
              '# AI Dev Minute Foundry',
              f"- rounds: {d['rounds']}",
              f"- champion: {d['start_champion']} -> {d['end_champion']}",
              f"- promotions: {d['promotions_delta']}",
              f"- no-op rounds: {d['noops_delta']}",
              f"- curriculum: L{d['curriculum_level']}",
              f"- next weakest focus: {d['weakest_next_focus']}",
              f"- report fingerprint: {d['report_fingerprint']}",
              '',
              '## Quality proxy delta',
          ]
          for k,v in d['quality_proxy_delta'].items():
              lines.append(f'- {k}: {v:+.3f}')
          lines += [
              '',
              '> These are strategy-proxy deltas, not proof that model weights or real-world capability improved. Code-level capability is verified separately by Agent Factory tests/PR gates.',
          ]
          text='\n'.join(lines)+'\n'
          open(os.environ['STATE_DIR']+'/hourly-summary.md','w',encoding='utf-8').write(text)
          print(text)
          PY
          cat "$STATE_DIR/hourly-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist champion on isolated state branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "THE WORLD AI Foundry"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          work=/tmp/ai-foundry-state-worktree
          rm -rf "$work"
          if git ls-remote --exit-code origin refs/heads/ai-foundry-state >/dev/null 2>&1; then
            git fetch origin ai-foundry-state
            git worktree add -B ai-foundry-state "$work" origin/ai-foundry-state
          else
            git worktree add --detach "$work" HEAD
            cd "$work"
            git checkout --orphan ai-foundry-state
            git rm -rf . >/dev/null 2>&1 || true
            cd - >/dev/null
          fi

          mkdir -p "$work/state/ai-dev"
          cp "$STATE_DIR/champion.json" "$work/state/ai-dev/champion.json"
          cp "$STATE_DIR/hourly-summary.json" "$work/state/ai-dev/hourly-summary.json"
          cp "$STATE_DIR/hourly-summary.md" "$work/state/ai-dev/hourly-summary.md"
          cp "$STATE_DIR/history.jsonl" "$work/state/ai-dev/latest-hour-history.jsonl"

          cd "$work"
          git add state/ai-dev
          if git diff --cached --quiet; then
            echo "No state delta to persist." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "ai-foundry: evolve AI developer champion run ${GITHUB_RUN_ID}"
            git push origin HEAD:ai-foundry-state
          fi

      - name: Trigger bounded code-level Agent Factory forge
        if: github.event_name != 'pull_request' && steps.evolve.outputs.material == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Minute evolution changes strategy state only. Real repository changes remain
          # behind the existing Agent Factory tournament, policy, tests and PR gate.
          gh workflow run the-world-agent-factory.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}"
          echo "Triggered existing Agent Factory for code-level improvement." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve AI Foundry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-dev-minute-foundry-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/ai-dev-foundry/start.json
            /tmp/ai-dev-foundry/champion.json
            /tmp/ai-dev-foundry/hourly-summary.json
            /tmp/ai-dev-foundry/hourly-summary.md
            /tmp/ai-dev-foundry/history.jsonl

      - name: Final foundry status
        if: always()
        run: |
          echo "### AI Dev reporting contract" >> "$GITHUB_STEP_SUMMARY"
          echo "- Slack channel: #ai-dev (C0BT25UCSBV)" >> "$GITHUB_STEP_SUMMARY"
          echo "- hourly fingerprint: ${{ steps.evolve.outputs.fingerprint }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- material delta: ${{ steps.evolve.outputs.material }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- rounds: ${{ steps.evolve.outputs.rounds }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- promotions: ${{ steps.evolve.outputs.promotions }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- next focus: ${{ steps.evolve.outputs.next_focus }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- identical fingerprints must not produce duplicate Slack reports" >> "$GITHUB_STEP_SUMMARY"
