name: Verify Music Japan PR 915 publication
on:
  push:
    branches: [work/verify-music-japan-915]
    paths: [.github/workflows/verify-music-japan-915.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare live Japanese and English pages with approved preview
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const preview = 'https://94100548.music-japan.pages.dev';
          const live = 'https://music-japan.com';
          const read = async url => {
            const r = await fetch(url, { headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(15000) });
            if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
            return r.text();
          };
          for (const path of ['/', '/en/']) {
            const expected = await read(preview + path);
            let matches = false;
            for (let attempt = 0; attempt < 12; attempt++) {
              const actual = await read(live + path);
              if (actual === expected) { matches = true; break; }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!matches) throw new Error('Live HTML differs from approved preview: ' + path);
            const message = live + path + ': HTTP 200, HTML exactly matches PR 915 preview';
            console.log(message);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- ' + message + '\n');
          }
          NODE
