name: Senju Autonomous Boundary Research

on:
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "senju/senju/autonomy/boundary_research_loop.py"
      - "senju/tests/test_boundary_research_loop.py"
      - "senju/senju/emergency_stop_state.py"
      - "senju/senju/meta/standing_authorization.py"
      - "senju/senju/credential_broker.py"
      - "senju/senju/replica_credential_lineage.py"
      - "automation/world/boundary_opportunity_miner.py"
      - "automation/world/run_boundary_opportunity_cycle.py"
      - "automation/world/shared_discovery_opportunity_bridge.py"
      - "automation/world/test_boundary_opportunity_miner.py"
      - "automation/world/test_shared_discovery_opportunity_bridge.py"
      - "automation/codegen/engine/authority_collaboration_bus.py"
      - "automation/codegen/tests/test_authority_collaboration_bus.py"
      - ".github/workflows/senju-autonomous-boundary-research.yml"
      - ".github/workflows/senju-adversary-pressure.yml"
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "senju/senju/autonomy/boundary_research_loop.py"
      - "senju/tests/test_boundary_research_loop.py"
      - "senju/senju/emergency_stop_state.py"
      - "senju/senju/meta/standing_authorization.py"
      - "senju/senju/credential_broker.py"
      - "senju/senju/replica_credential_lineage.py"
      - "automation/world/boundary_opportunity_miner.py"
      - "automation/world/run_boundary_opportunity_cycle.py"
      - "automation/world/shared_discovery_opportunity_bridge.py"
      - "automation/world/test_boundary_opportunity_miner.py"
      - "automation/world/test_shared_discovery_opportunity_bridge.py"
      - "automation/codegen/engine/authority_collaboration_bus.py"
      - "automation/codegen/tests/test_authority_collaboration_bus.py"
      - ".github/workflows/senju-autonomous-boundary-research.yml"
      - ".github/workflows/senju-adversary-pressure.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

# Serialize all proposal-producing authority loops on one shared cache bus.
concurrency:
  group: authority-opportunity-improvement-loop
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATE_DIR: ${{ runner.temp }}/senju-boundary-research
      OUTPUT_DIR: ${{ runner.temp }}/senju-boundary-research/reports
      OPPORTUNITY_STATE: ${{ runner.temp }}/senju-boundary-research/opportunities
      SHARED_DISCOVERY_STATE: ${{ runner.temp }}/senju-boundary-research/shared-discovery
      AUTHORITY_BUS: .authority-opportunity-runtime
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore shared authority collaboration memory
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-opportunity-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            authority-opportunity-${{ github.ref_name }}-
            boundary-opportunity-${{ github.ref_name }}-
            rights-request-${{ github.ref_name }}-
            authority-opportunity-

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Verify research engines and collaboration bus before autonomous cycle
        env:
          PYTHONPATH: automation/codegen
        run: |
          python -m pytest -q \
            senju/tests/test_boundary_research_loop.py \
            automation/world/test_boundary_opportunity_miner.py \
            automation/world/test_shared_discovery_opportunity_bridge.py \
            automation/codegen/tests/test_authority_collaboration_bus.py

      - name: Restore previous research generation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR" "$OPPORTUNITY_STATE"
          PREV_RUN="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju Autonomous Boundary Research" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV_RUN" ]]; then
            rm -rf "${STATE_DIR}-prev"
            mkdir -p "${STATE_DIR}-prev"
            gh run download "$PREV_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name senju-boundary-research-state \
              --dir "${STATE_DIR}-prev" || true
            PREV_STATE="$(find "${STATE_DIR}-prev" -type f -name boundary_research_state.json -print -quit || true)"
            if [[ -n "$PREV_STATE" ]]; then
              cp "$PREV_STATE" "$STATE_DIR/boundary_research_state.json"
            fi
            PREV_OPPORTUNITY="$(find "${STATE_DIR}-prev" -type f -name boundary_evolution_checkpoint.json -print -quit || true)"
            if [[ -n "$PREV_OPPORTUNITY" ]]; then
              PREV_OPPORTUNITY_DIR="$(dirname "$PREV_OPPORTUNITY")"
              cp -a "$PREV_OPPORTUNITY_DIR/." "$OPPORTUNITY_STATE/"
            fi
          fi

      - name: Restore latest Shared Discovery candidates
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SHARED_DISCOVERY_STATE"
          mkdir -p "$SHARED_DISCOVERY_STATE/raw" "$SHARED_DISCOVERY_STATE/normalized"
          DISCOVERY_RUN="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Shared Discovery Authority Cycle" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$DISCOVERY_RUN" ]]; then
            gh run download "$DISCOVERY_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name shared-discovery-authority-state \
              --dir "$SHARED_DISCOVERY_STATE/raw" || true
          fi
          CANDIDATES="$(find "$SHARED_DISCOVERY_STATE/raw" -type f -name discovery_candidates.json -print -quit || true)"
          KNOWLEDGE="$(find "$SHARED_DISCOVERY_STATE/raw" -type f -name shared_discovery_knowledge.json -print -quit || true)"
          if [[ -n "$CANDIDATES" ]]; then
            cp "$CANDIDATES" "$SHARED_DISCOVERY_STATE/normalized/discovery_candidates.json"
          fi
          if [[ -n "$KNOWLEDGE" ]]; then
            cp "$KNOWLEDGE" "$SHARED_DISCOVERY_STATE/normalized/shared_discovery_knowledge.json"
          fi

      - name: Bridge unknown discovery into persistent authority opportunity research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OPPORTUNITY_STATE" "$SHARED_DISCOVERY_STATE/normalized"
          python automation/world/shared_discovery_opportunity_bridge.py \
            --shared-state "$SHARED_DISCOVERY_STATE/normalized" \
            --boundary-state "$OPPORTUNITY_STATE"
          python automation/world/run_boundary_opportunity_cycle.py \
            --state-dir "$OPPORTUNITY_STATE" \
            --source-trust-root-id the-world-owner-root

      - name: Verify opportunity handoff remains non-activating
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = Path(os.environ['OPPORTUNITY_STATE'])
          bridge = json.loads((state / 'shared_discovery_opportunity_bridge.json').read_text())
          cycle = json.loads((state / 'boundary_opportunity_cycle_result.json').read_text())
          assert bridge['schema'] == 'the-world-shared-discovery-opportunity-bridge/v1'
          assert bridge['external_side_effects'] is False
          assert bridge['authority_activated'] is False
          assert bridge['finding_is_permission'] is False
          assert bridge['credentials_touched'] is False
          assert bridge['private_network_activation'] is False
          assert cycle['schema'] == 'the-world-boundary-opportunity-cycle/v2'
          assert cycle['activation_count'] == 0
          assert cycle['applied_count'] == 0
          print({
              'shared_discovery_handoff_count': bridge['handoff_count'],
              'research_only_count': bridge['research_only_count'],
              'boundary_opportunity_count': cycle['opportunity_count'],
              'proposal_ready_count': cycle['proposal_ready_count'],
          })
          print('SHARED_DISCOVERY_BOUNDARY_OPPORTUNITY_HANDOFF_VERIFIED')
          PY

      - name: Publish Boundary Research into shared authority collaboration bus
        env:
          PYTHONPATH: automation/codegen
        shell: bash
        run: |
          set -euo pipefail
          python automation/codegen/engine/authority_collaboration_bus.py \
            --bus-dir "$AUTHORITY_BUS" \
            --boundary-state-dir "$OPPORTUNITY_STATE" \
            --json-out /tmp/authority-collaboration-bus-boundary.json
          test "$(jq -r '.closed_loop' /tmp/authority-collaboration-bus-boundary.json)" = "true"
          test "$(jq -r '.authority_effect' /tmp/authority-collaboration-bus-boundary.json)" = "none"
          test "$(jq -r '.authority_activated' /tmp/authority-collaboration-bus-boundary.json)" = "false"
          test -s "$AUTHORITY_BUS/authority_opportunity_queue.json"
          test -s "$AUTHORITY_BUS/boundary_opportunities.json"

      - name: Run autonomous boundary mutation and counterexample cycle
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR" "$OUTPUT_DIR"
          PYTHONPATH=senju python -m senju.autonomy.boundary_research_loop \
            --state-dir "$STATE_DIR" \
            --output-dir "$OUTPUT_DIR" \
            --json "$OUTPUT_DIR/cycle-summary.json"

      - name: Verify closed-loop research evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['OUTPUT_DIR'])
          report = json.loads((root / 'boundary_research_report.json').read_text())
          handoff = json.loads((root / 'boundary_research_handoff.json').read_text())
          assert report['schema'] == 'senju-autonomous-boundary-research/v1'
          assert report['closed_loop'] is True
          assert report['autonomous_research'] is True
          assert report['external_side_effects'] is False
          assert report['denial_becomes_permission'] is False
          assert report['security_stop_bypass'] is False
          assert report['revocation_bypass'] is False
          assert report['raw_secret_replication'] is False
          assert report['case_count'] >= 17
          assert len(report['family_coverage']) >= 4
          assert handoff['schema'] == 'senju-boundary-research-handoff/v1'
          assert handoff['finding_is_permission'] is False
          assert 'senju-adversary-pressure' in handoff['share_targets']
          print('SENJU_AUTONOMOUS_BOUNDARY_RESEARCH_VERIFIED')
          PY

      - name: Compile boundary research production modules
        run: |
          python -m py_compile \
            senju/senju/autonomy/boundary_research_loop.py \
            senju/senju/autonomy/adversary_regression_bridge.py \
            senju/senju/autonomy/adversary_loop.py \
            automation/world/boundary_opportunity_miner.py \
            automation/world/run_boundary_opportunity_cycle.py \
            automation/world/shared_discovery_opportunity_bridge.py \
            automation/codegen/engine/authority_collaboration_bus.py

      - name: Save shared authority collaboration memory
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-opportunity-${{ github.ref_name }}-${{ github.run_id }}

      - name: Publish persistent research state and shared handoff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: senju-boundary-research-state
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/senju-boundary-research/
            /tmp/authority-collaboration-bus-boundary.json
            .authority-opportunity-runtime/authority_collaboration_bus.json
            .authority-opportunity-runtime/authority_opportunity_queue.json
