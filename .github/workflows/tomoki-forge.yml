name: TOMOKI - FORGE
on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/tomoki-forge.yml'
      - 'tomoki-agents/**'
permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: read
  copilot-requests: write
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run FORGE experiment
        id: experiment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f tomoki-forge-report.md
          copilot -p "$(cat tomoki-agents/prompts/forge.md)" --allow-tool='read' --allow-tool='search' --allow-tool='write' --allow-tool='shell(find:*)' --allow-tool='shell(grep:*)' --allow-tool='shell(ls:*)' --allow-tool='shell(cat:*)' --allow-tool='shell(npm:*)' --allow-tool='shell(node:*)' --allow-tool='shell(python:*)' --no-ask-user > /tmp/tomoki-copilot.log 2>&1 || true
          if [[ -f tomoki-forge-report.md ]]; then cp tomoki-forge-report.md /tmp/tomoki-forge-report.md; rm tomoki-forge-report.md; fi
          if git diff --quiet; then
            printf '今回は安全に採用できる変更なし。コード変更は0件。\n' > /tmp/tomoki-forge-report.md
            echo 'result=no-change' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python tomoki-agents/policy_gate.py > /tmp/tomoki-policy.txt 2>&1; then
            printf '\n\n**POLICY: REVERTED**\n' >> /tmp/tomoki-forge-report.md
            cat /tmp/tomoki-policy.txt >> /tmp/tomoki-forge-report.md
            git reset --hard HEAD
            echo 'result=reverted-policy' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! bash tomoki-agents/verify.sh > /tmp/tomoki-verify.txt 2>&1; then
            printf '\n\n**VERIFY: REVERTED**\n' >> /tmp/tomoki-forge-report.md
            tail -80 /tmp/tomoki-verify.txt >> /tmp/tomoki-forge-report.md
            git reset --hard HEAD
            echo 'result=reverted-verify' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '\n\n**POLICY: PASS / VERIFY: PASS**\n' >> /tmp/tomoki-forge-report.md
          BRANCH="tomoki/forge-${GITHUB_RUN_ID}"
          git config user.name 'TOMOKI-FORGE[bot]'
          git config user.email 'tomoki-forge@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A -- sales-command-30
          git commit -m "chore(tomoki-forge): autonomous verified improvement ${GITHUB_RUN_ID}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" --title "TOMOKI/FORGE: verified autonomous improvement #${GITHUB_RUN_ID}" --body 'Autonomous low-risk improvement. Policy gate and local verification passed. Generated by TOMOKI/FORGE.' 2>/dev/null || true)
          if [[ -n "$PR_URL" ]]; then
            printf '\nPR: %s\n' "$PR_URL" >> /tmp/tomoki-forge-report.md
            if gh pr merge "$PR_URL" --squash --delete-branch >/tmp/tomoki-merge.txt 2>&1; then
              printf 'MERGE: KEEP\n' >> /tmp/tomoki-forge-report.md
              echo 'result=merged' >> "$GITHUB_OUTPUT"
            else
              printf 'MERGE: PR作成済み・自動マージ不可。レビュー待ち。\n' >> /tmp/tomoki-forge-report.md
              echo 'result=pr-created' >> "$GITHUB_OUTPUT"
            fi
          else
            printf '\nPR作成がGitHub設定で拒否された。branchはpush済み。\n' >> /tmp/tomoki-forge-report.md
            echo 'result=branch-only' >> "$GITHUB_OUTPUT"
          fi
      - name: Report to TOMOKI Slack
        if: always()
        env:
          TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
        run: |
          if [[ ! -f /tmp/tomoki-forge-report.md ]]; then printf 'FORGE run failed before report generation.\n' > /tmp/tomoki-forge-report.md; fi
          python tomoki-agents/slack_post.py --agent FORGE --file /tmp/tomoki-forge-report.md --status "${{ steps.experiment.outputs.result || job.status }}"
