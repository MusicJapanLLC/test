name: TOMOKI - FORGE

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/tomoki-forge.yml'
      - 'tomoki-agents/**'

permissions:
  contents: read

concurrency:
  group: tomoki-forge
  cancel-in-progress: false

jobs:
  propose:
    name: AI proposal in read-only repository context
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout read-only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install pinned Copilot CLI
        run: npm install -g @github/copilot@1.0.80

      - name: Snapshot fixed guardrails
        run: |
          set -euo pipefail
          cp tomoki-agents/policy_gate.py /tmp/tomoki-policy-gate.py
          cp tomoki-agents/verify.sh /tmp/tomoki-verify.sh
          chmod 500 /tmp/tomoki-policy-gate.py /tmp/tomoki-verify.sh

      - name: Generate and validate bounded proposal
        id: experiment
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f /tmp/forge.patch /tmp/tomoki-forge-report.md
          copilot -p "$(cat tomoki-agents/prompts/forge.md)" -s --allow-tool=write --no-ask-user > /tmp/tomoki-copilot.log 2>&1 || true
          if [[ -f tomoki-forge-report.md ]]; then
            cp tomoki-forge-report.md /tmp/tomoki-forge-report.md
            rm tomoki-forge-report.md
          fi
          git add -N -- sales-command-30 2>/dev/null || true
          if git diff --quiet; then
            printf 'No safe code change selected.\n' > /tmp/tomoki-forge-report.md
            : > /tmp/forge.patch
            echo 'result=no-change' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python /tmp/tomoki-policy-gate.py > /tmp/tomoki-policy.txt 2>&1; then
            printf 'POLICY: REJECTED\n' > /tmp/tomoki-forge-report.md
            cat /tmp/tomoki-policy.txt >> /tmp/tomoki-forge-report.md
            git reset --hard HEAD
            git clean -fd -- sales-command-30
            : > /tmp/forge.patch
            echo 'result=rejected-policy' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! bash /tmp/tomoki-verify.sh > /tmp/tomoki-verify.txt 2>&1; then
            printf 'VERIFY: REJECTED\n' > /tmp/tomoki-forge-report.md
            tail -80 /tmp/tomoki-verify.txt >> /tmp/tomoki-forge-report.md
            git reset --hard HEAD
            git clean -fd -- sales-command-30
            : > /tmp/forge.patch
            echo 'result=rejected-verify' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --binary -- sales-command-30 > /tmp/forge.patch
          test -s /tmp/forge.patch
          printf 'POLICY: PASS\nVERIFY: PASS\nPatch prepared for an isolated publisher job.\n' > /tmp/tomoki-forge-report.md
          echo 'result=validated-patch' >> "$GITHUB_OUTPUT"

      - name: Upload validated patch bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: tomoki-forge-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/forge.patch
            /tmp/tomoki-forge-report.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Deterministic publisher opens PR only
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      result: ${{ steps.publish.outputs.result }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
    steps:
      - name: Checkout trusted repository state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated patch bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tomoki-forge-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/forge-candidate

      - name: Revalidate and open state-limited PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PATCH=/tmp/forge-candidate/forge.patch
          if [[ ! -s "$PATCH" ]]; then
            echo 'result=no-change' >> "$GITHUB_OUTPUT"
            echo 'pr_url=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp tomoki-agents/policy_gate.py /tmp/tomoki-policy-gate.py
          cp tomoki-agents/verify.sh /tmp/tomoki-verify.sh
          chmod 500 /tmp/tomoki-policy-gate.py /tmp/tomoki-verify.sh
          git apply --whitespace=error "$PATCH"
          git add -N -- sales-command-30 2>/dev/null || true
          python /tmp/tomoki-policy-gate.py
          bash /tmp/tomoki-verify.sh

          BASE="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          BASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE" --jq '.object.sha')"
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [[ "$CURRENT_SHA" != "$BASE_SHA" ]]; then
            echo 'Default branch moved after proposal creation; refusing stale publish.'
            exit 1
          fi

          BRANCH="tomoki/forge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'TOMOKI-FORGE[bot]'
          git config user.email 'tomoki-forge@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A -- sales-command-30
          git commit -m "chore(tomoki-forge): validated improvement ${GITHUB_RUN_ID}"
          gh auth setup-git
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base "$BASE" --head "$BRANCH" --title "TOMOKI/FORGE: verified autonomous improvement #${GITHUB_RUN_ID}" --body 'AI-generated patch was created in a read-only repository context, passed the fixed policy gate and verifier, then was independently re-applied and re-validated by a publisher job. This workflow cannot merge its own PR.')"
          echo "result=pr-created" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

  report:
    name: Isolated Slack report
    if: always()
    needs: [propose, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
      PUBLISH_RESULT: ${{ needs.publish.outputs.result }}
      PR_URL: ${{ needs.publish.outputs.pr_url }}
    steps:
      - name: Send sanitized result only
        if: env.TOMOKI_SLACK_WEBHOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          result=os.environ.get('PUBLISH_RESULT') or 'not-published'
          pr=os.environ.get('PR_URL') or '(none)'
          body=json.dumps({'text': f'TOMOKI/FORGE security-isolated run: {result}\nPR: {pr}'}).encode()
          req=urllib.request.Request(os.environ['TOMOKI_SLACK_WEBHOOK_URL'], data=body, headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=10) as response:
              if response.status >= 300:
                  raise SystemExit(f'Slack returned HTTP {response.status}')
          PY
