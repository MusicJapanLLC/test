name: Senju - Trusted Owner Scope

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL inside configured authorized federation scope"
        required: true
        type: string
      method:
        description: "HTTP method"
        required: true
        default: "GET"
        type: choice
        options:
          - GET
          - HEAD
          - OPTIONS
          - POST
      body:
        description: "Optional UTF-8 request body"
        required: false
        default: ""
        type: string
  push:
    branches:
      - chatgpt/trusted-owner-scope-20260831
      - claude/employee-onboarding-setup-udm86
    paths:
      - "AUTHORIZED_TEST_TARGETS.json"
      - "senju/config/authorized-test-range.json"
      - "senju/config/authorized-test-federation.json"
      - "senju/config/authorized-test-federation-broadcast.json"
      - "automation/codegen/meta_state/authorized_test_federation.json"
      - "senju/senju/safety.py"
      - "senju/senju/trusted_scope.py"
      - "senju/tests/test_safety.py"
      - "senju/tests/test_trusted_scope.py"
      - ".github/workflows/senju-trusted-owner-scope.yml"

permissions:
  contents: read

concurrency:
  group: senju-trusted-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify authorized federation runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          # Extract latest directive for env export
          top_target = "none"
          strategy = "coverage_expansion"
          coverage_gaps = ""
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True):
              c = e.get("content", {})
              if c.get("top_target") and c["top_target"] != "none":
                  top_target = c["top_target"]
                  strategy = c.get("strategy", strategy)
                  gaps = c.get("coverage_gaps", [])
                  coverage_gaps = ",".join(gaps[:5]) if gaps else ""
                  break
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD workflow.")
          # Write to GITHUB_ENV so downstream steps can consume GOD directives
          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"GOD_TOP_TARGET={top_target}\n")
                  f.write(f"GOD_STRATEGY={strategy}\n")
                  f.write(f"GOD_COVERAGE_GAPS={coverage_gaps}\n")
                  f.write(f"GOD_ENTRIES={total}\n")
              print(f"  → Exported: GOD_TOP_TARGET={top_target} GOD_STRATEGY={strategy}")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install -e './senju[dev]'

      - name: Run scope tests
        working-directory: senju
        run: python -m pytest tests/test_trusted_scope.py tests/test_safety.py -q

      - name: Verify federation seed and non-member rejection
        working-directory: senju
        run: |
          python - <<'PY'
          from pathlib import Path
          from senju.safety import ScopeGuard, default_lab_policy
          from senju.trusted_scope import TrustedOwnerScope

          scope = TrustedOwnerScope.load(Path('config/authorized-test-federation.json'))
          urls = [
              'https://kabeya-authorized-test-range.onrender.com/',
              'https://kabeya-authorized-test-range.onrender.com/lab/index.html',
              'https://kabeya-authorized-test-range.onrender.com/lab/nullharbor.html?role=admin#panel',
          ]
          guard = ScopeGuard(default_lab_policy())
          for url in urls:
              assert scope.allows_url(url)
              guard.check(url)
          assert not scope.allows_url('https://example.com/')
          assert not guard.is_allowed('https://example.com/')
          print('AUTHORIZED_TEST_FEDERATION_VERIFIED')
          PY

  execute:
    name: Execute inside persistent authorized federation scope
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install -e ./senju

      - name: Build trusted request plan
        env:
          TRUSTED_SCOPE_JSON: ${{ secrets.SENJU_TRUSTED_OWNER_SCOPE_JSON }}
          TARGET_URL: ${{ inputs.target_url }}
          METHOD: ${{ inputs.method }}
          BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail
          if [ -n "${TRUSTED_SCOPE_JSON}" ]; then
            printf '%s' "${TRUSTED_SCOPE_JSON}" > /tmp/senju-trusted-scope.json
          else
            cp senju/config/authorized-test-federation.json /tmp/senju-trusted-scope.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          body = os.environ.get('BODY', '')
          request = {'url': os.environ['TARGET_URL'], 'method': os.environ['METHOD']}
          if body:
              request['body'] = body
          Path('/tmp/senju-trusted-requests.json').write_text(
              json.dumps({'requests': [request]}, ensure_ascii=False), encoding='utf-8'
          )
          PY

      - name: Execute trusted request
        working-directory: senju
        run: |
          set -euo pipefail
          python -m senju.trusted_scope \
            /tmp/senju-trusted-scope.json \
            /tmp/senju-trusted-requests.json \
            --out /tmp/senju-trusted-report.json
          cat /tmp/senju-trusted-report.json

      - name: Publish sanitized receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-trusted-owner-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/senju-trusted-report.json
