name: Authorized Credential Mutation Bundle

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'AUTHORIZED_TEST_TARGETS.json'
      - 'automation/codegen/config/authorized_credential_mutation_plan.json'
      - 'automation/codegen/engine/authorized_credential_mutation.py'
      - 'automation/codegen/run_authorized_credential_mutation.py'
      - 'automation/codegen/tests/test_authorized_credential_mutation.py'
      - '.github/workflows/authorized-credential-mutation.yml'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'AUTHORIZED_TEST_TARGETS.json'
      - 'automation/codegen/config/authorized_credential_mutation_plan.json'
      - 'automation/codegen/engine/authorized_credential_mutation.py'
      - 'automation/codegen/run_authorized_credential_mutation.py'
      - 'automation/codegen/tests/test_authorized_credential_mutation.py'
      - '.github/workflows/authorized-credential-mutation.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: authorized-credential-mutation
  cancel-in-progress: false

jobs:
  verify-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'

      - name: Verify credential-bound mutation invariants
        env:
          PYTHONPATH: automation/codegen:senju
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q automation/codegen/tests/test_authorized_credential_mutation.py
          python -m py_compile \
            automation/codegen/engine/authorized_credential_mutation.py \
            automation/codegen/run_authorized_credential_mutation.py
          python -m json.tool automation/codegen/config/authorized_credential_mutation_plan.json >/dev/null

      - name: Restore latest shared Authority lease state
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p automation/codegen/meta_state /tmp/shared-authority
          PREV="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Shared Discovery Authority Cycle" --status success --limit 8 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV" ]]; then
            gh run download "$PREV" --repo "$GITHUB_REPOSITORY" --name shared-discovery-authority-state --dir /tmp/shared-authority || true
          fi
          FOUND="$(find /tmp/shared-authority -name discovery_capability_leases.json -print -quit || true)"
          if [[ -n "$FOUND" ]]; then
            cp "$FOUND" automation/codegen/meta_state/discovery_capability_leases.json
          fi
          echo "Shared Authority source run: **${PREV:-none}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Run bundled Authority + synthetic credential + mutation lane
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: automation/codegen:senju
          AUTHORIZED_TEST_MUTATION_ENABLED: ${{ vars.AUTHORIZED_TEST_MUTATION_ENABLED }}
          AUTHORIZED_TEST_SYNTHETIC_TOKEN: ${{ secrets.AUTHORIZED_TEST_SYNTHETIC_TOKEN }}
        run: |
          set -euo pipefail
          python automation/codegen/run_authorized_credential_mutation.py \
            --state automation/codegen/meta_state \
            --repo-root . \
            --execute-if-enabled \
            --json-out automation/codegen/meta_state/authorized_credential_mutation_run.json

          test "$(jq -r '.credential_secret_recorded' automation/codegen/meta_state/authorized_credential_mutation_run.json)" = "false"

          echo "mode=$(jq -r '.mode' automation/codegen/meta_state/authorized_credential_mutation_run.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "target=$(jq -r '.target' automation/codegen/meta_state/authorized_credential_mutation_run.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "credential_secret_recorded=$(jq -r '.credential_secret_recorded' automation/codegen/meta_state/authorized_credential_mutation_run.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve mutation receipts
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authorized-credential-mutation-${{ github.run_id }}
          path: |
            automation/codegen/config/authorized_credential_mutation_plan.json
            automation/codegen/meta_state/authorized_credential_mutation_result.json
            automation/codegen/meta_state/authorized_credential_mutation_run.json
            automation/codegen/meta_state/authorized_credential_mutation_receipts.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
