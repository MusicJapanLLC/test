name: Cooperative Authority Loop Tests

on:
  pull_request:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - 'senju/senju/meta/cooperative_authority_loop.py'
      - 'senju/senju/meta/cooperative_coordination_bus.py'
      - 'senju/scripts/run_cooperative_authority_loop.py'
      - 'senju/scripts/run_cooperative_coordination_bus.py'
      - 'senju/tests/test_cooperative_authority_loop.py'
      - 'senju/tests/test_cooperative_coordination_bus.py'
      - 'outside-world/reality_policy.json'
      - '.github/workflows/the-world-external-write-router.yml'
      - '.github/workflows/cooperative-authority-loop-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install Senju
        run: python -m pip install --disable-pip-version-check -e './senju[dev]'

      - name: Compile and test cooperative authority + coordination loop
        run: |
          python -m py_compile \
            senju/senju/meta/cooperative_authority_loop.py \
            senju/senju/meta/cooperative_coordination_bus.py \
            senju/scripts/run_cooperative_authority_loop.py \
            senju/scripts/run_cooperative_coordination_bus.py
          python -m pytest -q \
            senju/tests/test_cooperative_authority_loop.py \
            senju/tests/test_cooperative_coordination_bus.py
