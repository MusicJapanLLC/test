name: THE WORLD - Resident Task Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/the-world-task-worker.yml'
      - 'automation/world/task_worker.py'

concurrency:
  group: the-world-resident-task-worker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  motor-cortex:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Load one prior dispatch for evidence reconciliation
        id: review
        shell: bash
        run: |
          python automation/world/task_worker.py review --out /tmp/world-review.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/world-review.json',encoding='utf-8'))
          t=d.get('task') or {}
          r=t.get('result') or {}
          print('has_review=' + ('true' if t else 'false'))
          print('task_id=' + str(t.get('id') or ''))
          print('run_id=' + str(r.get('github_run_id') or ''))
          print('workflow=' + str(r.get('workflow') or ''))
          PY

      - name: Reconcile downstream GitHub evidence
        if: steps.review.outputs.has_review == 'true'
        shell: bash
        env:
          REVIEW_RUN_ID: ${{ steps.review.outputs.run_id }}
          REVIEW_WORKFLOW: ${{ steps.review.outputs.workflow }}
        run: |
          set -euo pipefail
          DATA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}")"
          STATUS="$(jq -r '.status' <<<"$DATA")"
          CONCLUSION="$(jq -r '.conclusion // ""' <<<"$DATA")"
          URL="$(jq -r '.html_url' <<<"$DATA")"
          if [[ "$STATUS" != "completed" ]]; then
            echo "Downstream run ${REVIEW_RUN_ID} is still ${STATUS}; leave task in review." >> "$GITHUB_STEP_SUMMARY"
          else
            python - "$STATUS" "$CONCLUSION" "$URL" "$REVIEW_WORKFLOW" <<'PY'
          import json,sys
          status,conclusion,url,workflow=sys.argv[1:]
          ok=status=='completed' and conclusion=='success'
          d={
            'schema':'the-world-task-result/v1',
            'status':'DONE' if ok else 'FAILED',
            'summary':f'Deterministic owned workflow {workflow} completed with {conclusion}.',
            'verified':ok,
            'produced_change':ok,
            'evidence':[f'github_run:{url}',f'workflow:{workflow}',f'conclusion:{conclusion}'],
            'changed_files':[],
            'tests':[],
            'next_action':'NONE' if ok else 'retry through bounded lane',
          }
          open('/tmp/world-review-result.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
            if [[ "$CONCLUSION" == "success" ]]; then
              python automation/world/task_worker.py finish-review --review /tmp/world-review.json --result /tmp/world-review-result.json --success
            else
              python automation/world/task_worker.py finish-review --review /tmp/world-review.json --result /tmp/world-review-result.json --error "downstream workflow conclusion=${CONCLUSION}"
            fi
          fi

      - name: Claim one personality-linked task
        id: claim
        shell: bash
        run: |
          python automation/world/task_worker.py claim --out /tmp/world-claim.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/world-claim.json',encoding='utf-8'))
          t=d.get('task') or {}
          print('has_task=' + ('true' if t else 'false'))
          print('task_id=' + str(t.get('id') or ''))
          PY

      - name: Select deterministic execution lane from personality and intent
        if: steps.claim.outputs.has_task == 'true'
        id: route
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/world-claim.json',encoding='utf-8'))
          t=d.get('task') or {}; r=d.get('resident') or {}; c=t.get('context') or {}
          identity=str(r.get('identity_class') or '').lower()
          role=str(r.get('role') or '').lower()
          unit=str(r.get('unit') or '').lower()
          runtime=str(r.get('runtime_id') or c.get('runtime_id') or '').lower()
          intent=str(c.get('intent_type') or '').upper()
          if identity == 'fictional_child_persona':
              wf='child-guild-adventure.yml'
          elif 'security' in role or 'security' in unit or 'security' in runtime:
              wf='security-guard.yml'
          elif identity == 'security_society':
              wf='senju-autonomous-improver.yml' if intent in {'SEEK_VERIFIED_CONTRIBUTION','IMPROVE_CRAFT'} else 'rnd-senju-coupled-loop.yml'
          elif intent in {'RESEARCH','EXPLORE','LEARN','SHARE_SURPRISE'}:
              wf='rnd-senju-coupled-loop.yml'
          elif identity in {'management_identity','executive_identity'} or 'manager' in role:
              wf='tomoki-manager.yml'
          elif identity == 'automation_resident':
              wf='the-world-realtime-kernel.yml'
          else:
              wf='ai-factory-boss.yml'
          print('workflow='+wf)
          print('intent='+intent)
          print('resident='+str(r.get('resident_key') or c.get('world_resident_key') or ''))
          PY

      - name: Dispatch one owned execution lane
        if: steps.claim.outputs.has_task == 'true'
        id: dispatch
        shell: bash
        env:
          TARGET_WORKFLOW: ${{ steps.route.outputs.workflow }}
        run: |
          set -euo pipefail
          BUSY="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [[ "${BUSY:-0}" -gt 0 ]]; then
            python automation/world/task_worker.py release --claim /tmp/world-claim.json --delay 15 --reason "execution lane ${TARGET_WORKFLOW} busy"
            echo 'dispatched=false' >> "$GITHUB_OUTPUT"
            echo "Lane ${TARGET_WORKFLOW} busy; task returned without attempt penalty." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$TARGET_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          RUN_ID=''
          RUN_URL=''
          for i in {1..12}; do
            ROW="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$GITHUB_REF_NAME" --event workflow_dispatch --limit 10 --json databaseId,url,createdAt --jq --arg start "$START" '[.[] | select(.createdAt >= $start)] | sort_by(.createdAt) | last // {}')"
            RUN_ID="$(jq -r '.databaseId // empty' <<<"$ROW")"
            RUN_URL="$(jq -r '.url // empty' <<<"$ROW")"
            [[ -n "$RUN_ID" ]] && break
            sleep 2
          done
          if [[ -z "$RUN_ID" ]]; then
            python automation/world/task_worker.py release --claim /tmp/world-claim.json --delay 10 --reason "workflow dispatch accepted but run id not observed"
            echo 'dispatched=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python automation/world/task_worker.py dispatched --claim /tmp/world-claim.json --workflow "$TARGET_WORKFLOW" --run-id "$RUN_ID" --run-url "$RUN_URL"
          echo 'dispatched=true' >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "Resident=${{ steps.route.outputs.resident }} intent=${{ steps.route.outputs.intent }} -> ${TARGET_WORKFLOW} -> ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Motor cortex heartbeat
        if: always()
        run: |
          echo "THE WORLD deterministic motor cortex completed run $GITHUB_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
          echo "No Brainbase or Copilot execution quota is required for routing and reconciliation." >> "$GITHUB_STEP_SUMMARY"
