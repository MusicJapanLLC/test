name: Learning search publication
on:
  push:
    branches: [seo/music-japan-learning-20261017, music-japan-production]
    paths: ['music-japan-site-trace/**', '.github/workflows/learning-search-publication.yml']
  pull_request:
    branches: [music-japan-production]
    paths: ['music-japan-site-trace/**', '.github/workflows/learning-search-publication.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-search-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: music-japan-site-trace
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify course regression and final published search data
        run: |
          set -o pipefail
          mkdir -p ../learning-browser-evidence
          npm ci --ignore-scripts
          npm test 2>&1 | tee ../learning-browser-evidence/site-tests.txt
          node ../tools/korean-v11/acceptance.test.mjs 2>&1 | tee ../learning-browser-evidence/korean-regression.txt
          npm run typecheck
          npm run build:deploy 2>&1 | tee ../learning-browser-evidence/final-build.txt
          git diff --exit-code -- learning/korean next/public/wahran
      - name: Prepare isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/learning-browser" --ignore-scripts --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/learning-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Check mobile rendering, navigation, saved progress and course use
        env:
          LEARNING_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/learning-browser/node_modules/playwright/index.mjs"
          export LEARNING_EVIDENCE_DIR="$GITHUB_WORKSPACE/learning-browser-evidence"
          node server.mjs --deploy > ../learning-browser-evidence/server.txt 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in {1..30}; do if curl --fail --silent http://127.0.0.1:4173/learning/ >/dev/null; then break; fi; sleep 1; done
          LEARNING_BROWSER=chromium node scripts/verify-learning-browser.mjs 2>&1 | tee ../learning-browser-evidence/chromium.txt
          LEARNING_BROWSER=webkit node scripts/verify-learning-browser.mjs 2>&1 | tee ../learning-browser-evidence/webkit.txt
      - name: Preserve reviewable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-search-evidence-${{ github.sha }}
          path: learning-browser-evidence/
          retention-days: 30
