name: Senju Live Production Chaos Canary

on:
  pull_request:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - "senju/senju/live_production_chaos_canary.py"
      - "senju/tests/test_live_production_chaos_canary.py"
      - "senju/senju/adversary_test_range_transport.py"
      - "automation/codegen/meta_state/discovery_policy.json"
      - ".github/workflows/live-production-chaos-canary.yml"
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - "senju/senju/live_production_chaos_canary.py"
      - "senju/senju/adversary_test_range_transport.py"
      - "automation/codegen/meta_state/discovery_policy.json"
      - ".github/workflows/live-production-chaos-canary.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: live-production-chaos-canary-${{ github.ref }}
  cancel-in-progress: false

env:
  CANARY_DIR: /tmp/senju-live-production-chaos-canary
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify canary lease boundaries
        working-directory: senju
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest tests/test_live_production_chaos_canary.py -q
          python -m py_compile senju/live_production_chaos_canary.py senju/adversary_test_range_transport.py

  live-canary:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production default
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: claude/employee-onboarding-setup-udm86
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Issue randomized short-lived canary authority
        id: lease
        working-directory: senju
        run: |
          set -euo pipefail
          rm -rf "$CANARY_DIR"
          mkdir -p "$CANARY_DIR"
          seed="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}:$(date +%s%N)"
          python -m senju.live_production_chaos_canary issue \
            --seed "$seed" \
            --run-id "$GITHUB_RUN_ID" \
            --ttl-seconds 180 \
            --out "$CANARY_DIR/lease-local.json"
          scenario="$(python -c 'import json,os;print(json.load(open(os.environ["CANARY_DIR"]+"/lease-local.json"))["scenario"])')"
          echo "scenario=$scenario" >> "$GITHUB_OUTPUT"
          echo "Live scenario: $scenario" >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize authority using the real GitHub credential
        id: github_authority
        run: |
          set -euo pipefail
          branch="chaos-canary/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          # This is a real authenticated production-side state mutation. The branch is
          # deliberately ephemeral and cannot be consumed as a production Trust Root.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" \
            -f sha="$GITHUB_SHA" >/dev/null

          encoded="$(base64 -w0 "$CANARY_DIR/lease-local.json")"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.canary-authority/live-lease.json" \
            -f message="chaos-canary: materialize live authority lease" \
            -f content="$encoded" \
            -f branch="$branch" >/dev/null

          # Fetch the authority back through GitHub. This returned production state,
          # rather than the local draft, is what gates the real external mutation.
          gh api "repos/$GITHUB_REPOSITORY/contents/.canary-authority/live-lease.json?ref=$branch" \
            --jq .content | tr -d '\n' | base64 -d > "$CANARY_DIR/lease-from-github.json"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ['CANARY_DIR'])
          a=root.joinpath('lease-local.json').read_bytes()
          b=root.joinpath('lease-from-github.json').read_bytes()
          assert hashlib.sha256(a).digest() == hashlib.sha256(b).digest()
          print('REAL_GITHUB_AUTHORITY_ROUNDTRIP_VERIFIED')
          PY

      - name: Execute real owner-controlled production canary mutation
        working-directory: senju
        run: |
          set -euo pipefail
          python -m senju.live_production_chaos_canary execute \
            --lease "$CANARY_DIR/lease-from-github.json" \
            --report "$CANARY_DIR/live-report.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['CANARY_DIR']+'/live-report.json').read_text())
          assert report['network_io'] is True
          assert report['real_external_mutation'] is True
          assert report['production_side_effects'] is True
          assert report['authority_state_source'] == 'github_canary_branch'
          assert report['credential_path'] == 'github_actions_token_runtime_only'
          assert report['production_trust_root_mutated'] is False
          print('LIVE_PRODUCTION_CHAOS_CANARY_VERIFIED')
          for row in report['outcomes']:
              print(row['method'], row['status'], row['url'], row['action_id'])
          PY
          cat "$CANARY_DIR/live-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke canary authority by deleting its GitHub branch
        if: always() && steps.github_authority.outputs.branch != ''
        env:
          CANARY_BRANCH: ${{ steps.github_authority.outputs.branch }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CANARY_BRANCH" || true
          echo "Canary authority branch revoked: $CANARY_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-production-chaos-canary-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/senju-live-production-chaos-canary/lease-local.json
            /tmp/senju-live-production-chaos-canary/lease-from-github.json
            /tmp/senju-live-production-chaos-canary/live-report.json
