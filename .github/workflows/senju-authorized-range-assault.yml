name: Senju - Authorized Range Assault

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - 'senju/scripts/authorized_range_assault.py'
      - 'senju/config/authorized-test-federation.json'
      - 'senju/config/authorized-test-federation-broadcast.json'
      - 'automation/codegen/meta_state/authorized_test_federation.json'
      - '.github/workflows/senju-authorized-range-assault.yml'

permissions:
  contents: read

concurrency:
  group: senju-authorized-range-assault
  cancel-in-progress: true

jobs:
  exercise:
    name: Repeated adversarial exercise of fixed authorized range
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate bounded active exploit budget
        working-directory: senju
        run: |
          python - <<'PY'
          import runpy
          mod = runpy.run_path('scripts/authorized_range_assault.py', run_name='senju_active_budget_check')
          selected = mod['selected_active_exploit_probes']('ci-budget-check')
          authority = mod['current_active_exploit_authority']()
          assert mod['ACTIVE_EXPLOIT_ROLLOUT_PERCENT'] == 20
          assert len(mod['ACTIVE_EXPLOIT_PROBES']) == 10
          assert len(selected) == 2
          assert all(row['path'].startswith('/') for row in selected)
          assert mod['MAX_ACTIVE_EXPLOIT_PROBES'] == 2
          assert mod['ACTIVE_EXPLOIT_MAX_RPS'] <= 1.0
          assert mod['AUTHORIZED_HOST'] == 'kabeya-authorized-test-range.onrender.com'
          assert authority['approved'] is True
          assert authority['host'] == mod['AUTHORIZED_HOST']
          assert 'GET' in authority['methods']
          print({'active_exploit_budget_ok': True, 'authority_gate': authority, 'selected': [x['name'] for x in selected]})
          PY

      - name: Run Senju authorized adversarial exercise
        working-directory: senju
        env:
          SENJU_ACTIVE_EXPLOIT_SEED: gha-${{ github.run_id }}
        run: python scripts/authorized_range_assault.py

      - name: Publish sanitized findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-authorized-range-assault-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: senju/authorized-range-assault-report.json
