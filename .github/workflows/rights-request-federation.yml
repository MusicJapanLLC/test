name: META X SENJU Rights Request Federation

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/rights_request_federation.py'
      - 'senju/scripts/rights_request_federation.py'
      - 'senju/tests/test_rights_request_federation.py'
      - '.github/workflows/rights-request-federation.yml'
      - '.github/workflows/owner-scope-negotiation-production.yml'
      - 'automation/security/workflow_policy.py'
      - 'senju/senju/owner_scope_negotiation.py'
      - 'senju/senju/owner_scope_negotiation_runtime.py'
      - 'senju/config/owner-expansion-envelope.json'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/rights_request_federation.py'
      - 'senju/scripts/rights_request_federation.py'
      - 'senju/tests/test_rights_request_federation.py'
      - '.github/workflows/rights-request-federation.yml'
      - '.github/workflows/owner-scope-negotiation-production.yml'
      - 'automation/security/workflow_policy.py'
      - 'senju/senju/owner_scope_negotiation.py'
      - 'senju/senju/owner_scope_negotiation_runtime.py'
      - 'senju/config/owner-expansion-envelope.json'

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: owner-scope-negotiation-production
  cancel-in-progress: false

jobs:
  federate-negotiate-share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore shared authority runtime
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: rights-request-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            authority-signal-${{ github.ref_name }}-
            authority-opportunity-${{ github.ref_name }}-
            authority-opportunity-

      - name: Verify rights-request closed-loop invariants
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            senju/tests/test_rights_request_federation.py \
            senju/tests/test_owner_scope_negotiation.py

      - name: Generate proactive META X SENJU rights requests
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/rights_request_federation.py \
            --repo-root . \
            --state-dir senju/state \
            --runtime-dir .authority-opportunity-runtime \
            --out /tmp/rights-request-federation.json
          test "$(jq -r '.closed_loop' /tmp/rights-request-federation.json)" = "true"
          test "$(jq -r '.new_unrelated_authority_self_mint' /tmp/rights-request-federation.json)" = "false"
          test -s senju/state/rights_request_ledger.json
          test -s senju/state/owner_scope_negotiation_signals.json

      - name: Run existing production Owner-scope negotiation immediately
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/owner_scope_negotiation.py \
            --repo-root . \
            --state-dir senju/state \
            --out /tmp/owner-scope-negotiation-report.json
          test -s senju/state/owner_scope_negotiation_campaign.json
          test -s senju/state/owner_scope_negotiation_result.json
          test -s senju/state/owner_contact_ceiling_effective.json
          test "$(jq -r '.result.hard_limits | index("no_scope_change_outside_owner_expansion_envelope") != null' /tmp/owner-scope-negotiation-report.json)" = "true"

      - name: Feed negotiation result back into next rights-request generation
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/rights_request_federation.py \
            --repo-root . \
            --state-dir senju/state \
            --runtime-dir .authority-opportunity-runtime \
            --out /tmp/rights-request-federation-after.json
          echo "active_requests=$(jq -r '.active_request_count' /tmp/rights-request-federation-after.json)"
          echo "persistent_owner_review=$(jq -r '.owner_review_persistent_count' /tmp/rights-request-federation-after.json)"

      - name: Persist bounded negotiation state through GitHub ref API
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          BASE="claude/employee-onboarding-setup-udm86"
          ALLOWED=(
            senju/state/rights_request_ledger.json
            senju/state/rights_request_federation.json
            senju/state/owner_scope_negotiation_signals.json
            senju/state/owner_scope_negotiation_campaign.json
            senju/state/owner_scope_negotiation_result.json
            senju/state/owner_contact_ceiling_effective.json
          )

          put_file() {
            local branch="$1" src="$2" path="$3" remote_sha local_sha content
            remote_sha="$(gh api "repos/$REPO/contents/$path?ref=$branch" --jq '.sha' 2>/dev/null || true)"
            local_sha="$(git hash-object "$src")"
            if [[ "$remote_sha" == "$local_sha" ]]; then
              return 0
            fi
            content="$(base64 -w0 "$src")"
            if [[ -n "$remote_sha" ]]; then
              gh api -X PUT "repos/$REPO/contents/$path" \
                -f message="chore(authority): persist META X SENJU rights negotiation [skip ci]" \
                -f content="$content" -f branch="$branch" -f sha="$remote_sha" >/dev/null
            else
              gh api -X PUT "repos/$REPO/contents/$path" \
                -f message="chore(authority): persist META X SENJU rights negotiation [skip ci]" \
                -f content="$content" -f branch="$branch" >/dev/null
            fi
          }

          for attempt in 1 2 3; do
            BASE_SHA="$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')"
            BRANCH="rights-request-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null

            for path in "${ALLOWED[@]}"; do
              test -f "$path"
              put_file "$BRANCH" "$path" "$path"
            done

            HEAD_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
            if [[ "$HEAD_SHA" == "$BASE_SHA" ]]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
              echo "No meaningful federation state change."
              break
            fi

            gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.files[].filename' | sort > /tmp/rights-state-changed.txt
            python - <<'PY'
          from pathlib import Path
          allowed = {
              'senju/state/rights_request_ledger.json',
              'senju/state/rights_request_federation.json',
              'senju/state/owner_scope_negotiation_signals.json',
              'senju/state/owner_scope_negotiation_campaign.json',
              'senju/state/owner_scope_negotiation_result.json',
              'senju/state/owner_contact_ceiling_effective.json',
          }
          changed = {line.strip() for line in Path('/tmp/rights-state-changed.txt').read_text().splitlines() if line.strip()}
          forbidden = changed - allowed
          if forbidden:
              raise SystemExit(f'rights-state promotion touched forbidden paths: {sorted(forbidden)}')
          print('Validated bounded rights-state diff:', ', '.join(sorted(changed)))
          PY

            CURRENT_BASE_SHA="$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')"
            if [[ "$CURRENT_BASE_SHA" == "$BASE_SHA" ]]; then
              gh api -X PATCH "repos/$REPO/git/refs/heads/$BASE" -f sha="$HEAD_SHA" -F force=false >/dev/null
              gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
              echo "Promoted bounded rights negotiation state to $BASE at $HEAD_SHA"
              break
            fi

            echo "Base moved; safe rights-state promotion retry $attempt/3"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
            if [[ "$attempt" -eq 3 ]]; then
              echo "Base remained busy; persistence deferred to next cycle."
            fi
          done

      - name: Share active rights requests with authority-related PRs
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: senju:automation/codegen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from senju.rights_request_federation import pr_federation_message
          marker, message = pr_federation_message(Path('senju/state'))
          Path('/tmp/rights-marker.txt').write_text(marker, encoding='utf-8')
          Path('/tmp/rights-message.md').write_text(message, encoding='utf-8')
          PY
          MARKER=$(cat /tmp/rights-marker.txt)
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 80 --json number,title --jq '.[] | select(.title | test("authority|scope|senju|meta|discovery|trust|external|guard"; "i")) | .number' | head -n 8 > /tmp/rights-prs.txt
          while read -r PR; do
            [ -n "$PR" ] || continue
            if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' | grep -Fq "$MARKER"; then
              echo "PR #$PR already has this federation snapshot"
              continue
            fi
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/rights-message.md
          done < /tmp/rights-prs.txt

      - name: Save shared authority runtime
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: rights-request-${{ github.ref_name }}-${{ github.run_id }}

      - name: Preserve negotiation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rights-request-federation-${{ github.run_id }}
          path: |
            /tmp/rights-request-federation.json
            /tmp/rights-request-federation-after.json
            /tmp/owner-scope-negotiation-report.json
            senju/state/rights_request_ledger.json
            senju/state/rights_request_federation.json
            senju/state/owner_scope_negotiation_signals.json
            senju/state/owner_scope_negotiation_campaign.json
            senju/state/owner_scope_negotiation_result.json
            senju/state/owner_contact_ceiling_effective.json
          if-no-files-found: warn
          retention-days: 30
