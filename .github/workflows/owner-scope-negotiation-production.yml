name: Owner Scope Negotiation Production

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/state/owner_scope_expansion_evidence.json'
      - 'senju/state/owner_scope_negotiation_ballots.json'
      - 'senju/state/owner_scope_negotiation_signals.json'
      - 'senju/state/adversary_external_host_requests.json'
      - 'senju/state/council_operational_proposals.json'
      - 'senju/state/council_operational_ballots.json'
      - 'senju/config/owner-expansion-envelope.json'
      - 'senju/senju/owner_scope_negotiation.py'
      - 'senju/senju/owner_scope_negotiation_runtime.py'
      - 'senju/senju/council_operational_governance.py'
      - 'senju/senju/meta/authorized_host_promotion_corps.py'
      - 'senju/senju/negotiated_external_client.py'
      - 'senju/scripts/owner_scope_negotiation.py'
      - 'senju/scripts/run_council_operational_governance.py'
      - 'senju/scripts/run_authorized_host_promotion_corps.py'
      - 'senju/scripts/negotiated_external_probe.py'
      - 'automation/codegen/engine/authority_collaboration_bus.py'
      - 'automation/codegen/engine/negotiation_context_bridge.py'
      - 'automation/codegen/tests/test_authority_collaboration_bus*.py'
      - 'automation/codegen/tests/test_negotiation_context_bridge.py'

permissions:
  contents: read
  actions: read

# Share one lock with Root negotiation / Rights / Boundary collaboration memory so a
# promotion result cannot be lost while another negotiation loop saves the same cache.
concurrency:
  group: authority-opportunity-improvement-loop
  cancel-in-progress: false

jobs:
  negotiate-and-exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: claude/employee-onboarding-setup-udm86
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'

      - name: Restore shared Root Rights Promotion negotiation memory
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-opportunity-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            authority-opportunity-${{ github.ref_name }}-
            rights-request-${{ github.ref_name }}-
            boundary-opportunity-${{ github.ref_name }}-
            authority-opportunity-

      - name: Pull shared negotiation AI context into Owner Scope signals
        env:
          PYTHONPATH: automation/codegen
        run: |
          set -euo pipefail
          mkdir -p .authority-opportunity-runtime
          python automation/codegen/engine/authority_collaboration_bus.py \
            --bus-dir .authority-opportunity-runtime \
            --rights-state-dir senju/state \
            --root-state-dir .authority-opportunity-runtime \
            --promotion-state-dir .authority-opportunity-runtime \
            --max-inbox-items 192 \
            --json-out /tmp/authority-collaboration-pre.json
          python automation/codegen/engine/negotiation_context_bridge.py pull \
            --bus-dir .authority-opportunity-runtime \
            --state-dir senju/state \
            --max-signals 192 \
            --json-out /tmp/negotiation-context-import.json
          test "$(jq -r '.bidirectional_exchange' /tmp/authority-collaboration-pre.json)" = "true"
          test "$(jq -r '.authority_effect' /tmp/authority-collaboration-pre.json)" = "none"
          test -s .authority-opportunity-runtime/negotiation_evidence_bundle.json
          test -s .authority-opportunity-runtime/negotiation_agent_inboxes.json
          test -s senju/state/negotiation_context_import.json

      - name: Run real production negotiation cycle
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/owner_scope_negotiation.py \
            --repo-root . \
            --state-dir senju/state \
            --out /tmp/owner-scope-negotiation-report.json

      - name: Apply META X SENJU operational governance
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/run_council_operational_governance.py \
            --repo-root . \
            --state-dir senju/state \
            > /tmp/council-operational-governance-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/council-operational-governance-report.json', encoding='utf-8'))
          print('## META/X/SENJU Operational Governance')
          print(f"- Proposals: `{d.get('proposal_count', 0)}`")
          print(f"- Applied by 3/3 council: `{d.get('applied_count', 0)}`")
          print(f"- Rejected outside operational bounds: `{d.get('rejected_count', 0)}`")
          policy=d.get('policy', {})
          print(f"- Owner per-change approval required: `{policy.get('owner_per_change_approval_required')}`")
          for row in d.get('decisions', [])[:12]:
              print(f"- `{row.get('proposal_id')}` → `{row.get('status')}`")
          PY

      - name: Advance standing-authorized candidates with shared negotiation context
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/run_authorized_host_promotion_corps.py \
            --repo-root . \
            --state-dir senju/state \
            --promotion-dir senju/state/authorized-host-promotion \
            --collaboration-dir .authority-opportunity-runtime \
            --out /tmp/authorized-host-promotion-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/authorized-host-promotion-report.json', encoding='utf-8'))
          print('## Authorized Host Promotion Corps v2')
          print(f"- Shared context hosts: `{d.get('collaboration_host_count', 0)}`")
          print(f"- Proposals: `{d.get('proposal_count', 0)}`")
          print(f"- Execution-ready: `{d.get('execution_ready_count', 0)}`")
          print(f"- Promotion packets: `{d.get('packet_count', 0)}`")
          print(f"- Shared agents: `{','.join(d.get('shared_agents', []))}`")
          for row in d.get('execution_ready', []):
              print(f"- `{row.get('host')}` → `{row.get('status')}` methods=`{','.join(row.get('covered_methods', []))}`")
          for row in d.get('packets', [])[:12]:
              print(f"- candidate `{row.get('host')}` → `{row.get('status')}`")
          PY

      - name: Publish Promotion and Owner Scope feedback to all negotiation AI
        env:
          PYTHONPATH: automation/codegen
        run: |
          set -euo pipefail
          python automation/codegen/engine/negotiation_context_bridge.py publish \
            --bus-dir .authority-opportunity-runtime \
            --promotion-dir senju/state/authorized-host-promotion \
            --state-dir senju/state \
            --json-out /tmp/promotion-feedback-publish.json
          python automation/codegen/engine/authority_collaboration_bus.py \
            --bus-dir .authority-opportunity-runtime \
            --rights-state-dir senju/state \
            --root-state-dir .authority-opportunity-runtime \
            --promotion-state-dir senju/state/authorized-host-promotion \
            --max-inbox-items 192 \
            --json-out /tmp/authority-collaboration-post.json
          test "$(jq -r '.promotion_feedback_reingested' /tmp/authority-collaboration-post.json)" = "true"
          test "$(jq -r '.bidirectional_exchange' /tmp/authority-collaboration-post.json)" = "true"
          test -s .authority-opportunity-runtime/promotion_feedback_publish.json
          test -s .authority-opportunity-runtime/negotiation_coordination_protocol.json
          test -s .authority-opportunity-runtime/agent-inbox/meta.json
          test -s .authority-opportunity-runtime/agent-inbox/senju.json

      - name: Exercise negotiated and council-governed policy through real ExternalContactClient
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/negotiated_external_probe.py \
            --repo-root . \
            --state-dir senju/state \
            --out /tmp/negotiated-external-production-probe.json

      - name: Save shared negotiation AI memory
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-opportunity-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload production negotiation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-scope-negotiation-${{ github.run_id }}
          path: |
            /tmp/authority-collaboration-pre.json
            /tmp/negotiation-context-import.json
            /tmp/owner-scope-negotiation-report.json
            /tmp/council-operational-governance-report.json
            /tmp/authorized-host-promotion-report.json
            /tmp/promotion-feedback-publish.json
            /tmp/authority-collaboration-post.json
            /tmp/negotiated-external-production-probe.json
            senju/state/negotiation_context_import.json
            senju/state/owner_scope_negotiation_campaign.json
            senju/state/owner_scope_negotiation_result.json
            senju/state/owner_contact_ceiling_effective.json
            senju/state/council_operational_policy.json
            senju/state/council_operational_governance_result.json
            senju/state/authorized-host-promotion/
            .authority-opportunity-runtime/authority_collaboration_bus.json
            .authority-opportunity-runtime/authority_opportunity_queue.json
            .authority-opportunity-runtime/negotiation_evidence_bundle.json
            .authority-opportunity-runtime/negotiation_agent_inboxes.json
            .authority-opportunity-runtime/negotiation_coordination_protocol.json
            .authority-opportunity-runtime/agent-inbox/
            .authority-opportunity-runtime/promotion_feedback_publish.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
