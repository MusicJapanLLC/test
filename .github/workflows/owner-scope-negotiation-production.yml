name: Owner Scope Negotiation Production

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/state/owner_scope_expansion_evidence.json'
      - 'senju/state/owner_scope_negotiation_ballots.json'
      - 'senju/state/owner_scope_negotiation_signals.json'
      - 'senju/state/adversary_external_host_requests.json'
      - 'senju/state/council_operational_proposals.json'
      - 'senju/state/council_operational_ballots.json'
      - 'senju/config/owner-expansion-envelope.json'
      - 'senju/senju/negotiation_intelligence_bus.py'
      - 'senju/senju/owner_scope_negotiation.py'
      - 'senju/senju/owner_scope_negotiation_runtime.py'
      - 'senju/senju/council_operational_governance.py'
      - 'senju/senju/meta/authorized_host_promotion_corps.py'
      - 'senju/senju/meta/promotion_negotiation_bridge.py'
      - 'senju/senju/negotiated_external_client.py'
      - 'senju/scripts/negotiation_intelligence_bus.py'
      - 'senju/scripts/owner_scope_negotiation.py'
      - 'senju/scripts/run_council_operational_governance.py'
      - 'senju/scripts/run_authorized_host_promotion_corps.py'
      - 'senju/scripts/negotiated_external_probe.py'

permissions:
  contents: read
  actions: read

# Share the same lock as Root Authority / Rights / Boundary collaboration so the cache
# is consumed and updated as one negotiation memory instead of racing independent loops.
concurrency:
  group: authority-opportunity-improvement-loop
  cancel-in-progress: false

jobs:
  negotiate-and-exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: claude/employee-onboarding-setup-udm86
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'

      - name: Restore shared Root negotiation memory
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-opportunity-${{ github.ref_name }}-promotion-${{ github.run_id }}
          restore-keys: |
            authority-opportunity-${{ github.ref_name }}-
            rights-request-${{ github.ref_name }}-
            boundary-opportunity-${{ github.ref_name }}-
            authority-opportunity-

      - name: Pull external and negotiation intelligence into Owner-scope signals
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/negotiation_intelligence_bus.py \
            --state-dir senju/state \
            --input-root .authority-opportunity-runtime \
            --out /tmp/negotiation-intelligence-bus-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/negotiation-intelligence-bus-report.json', encoding='utf-8'))
          print('## Negotiation Intelligence Bus')
          print(f"- Source files: `{d.get('source_file_count', 0)}`")
          print(f"- Intelligence records: `{d.get('record_count', 0)}`")
          print(f"- New Owner-scope signals: `{d.get('signal_added_count', 0)}`")
          print(f"- Raw credentials forwarded: `{d.get('raw_credentials_forwarded')}`")
          PY

      - name: Run real production negotiation cycle
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/owner_scope_negotiation.py \
            --repo-root . \
            --state-dir senju/state \
            --out /tmp/owner-scope-negotiation-report.json

      - name: Apply META X SENJU operational governance
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/run_council_operational_governance.py \
            --repo-root . \
            --state-dir senju/state \
            > /tmp/council-operational-governance-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/council-operational-governance-report.json', encoding='utf-8'))
          print('## META/X/SENJU Operational Governance')
          print(f"- Proposals: `{d.get('proposal_count', 0)}`")
          print(f"- Applied by 3/3 council: `{d.get('applied_count', 0)}`")
          print(f"- Rejected outside operational bounds: `{d.get('rejected_count', 0)}`")
          policy=d.get('policy', {})
          print(f"- Owner per-change approval required: `{policy.get('owner_per_change_approval_required')}`")
          for row in d.get('decisions', [])[:12]:
              print(f"- `{row.get('proposal_id')}` → `{row.get('status')}`")
          PY

      - name: Advance and synchronize Promotion Corps
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          mkdir -p .authority-opportunity-runtime
          python senju/scripts/run_authorized_host_promotion_corps.py \
            --repo-root . \
            --state-dir senju/state \
            --promotion-dir senju/state/authorized-host-promotion \
            --collaboration-dir .authority-opportunity-runtime \
            --out /tmp/authorized-host-promotion-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/authorized-host-promotion-report.json', encoding='utf-8'))
          print('## Authorized Host Promotion Corps')
          print(f"- Proposals: `{d.get('proposal_count', 0)}`")
          print(f"- Negotiation intelligence hosts: `{d.get('negotiation_intelligence_host_count', 0)}`")
          print(f"- Feedback tasks: `{d.get('feedback_task_count', 0)}`")
          print(f"- Execution-ready: `{d.get('execution_ready_count', 0)}`")
          print(f"- Promotion packets: `{d.get('packet_count', 0)}`")
          for row in d.get('execution_ready', []):
              print(f"- `{row.get('host')}` → `{row.get('status')}` methods=`{','.join(row.get('covered_methods', []))}` priority=`{row.get('coordination_priority')}`")
          for row in d.get('packets', [])[:12]:
              print(f"- candidate `{row.get('host')}` → `{row.get('status')}` priority=`{row.get('coordination_priority')}` missing=`{','.join(row.get('missing_requirements', []))}`")
          PY

      - name: Exercise negotiated and council-governed policy through real ExternalContactClient
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python senju/scripts/negotiated_external_probe.py \
            --repo-root . \
            --state-dir senju/state \
            --out /tmp/negotiated-external-production-probe.json

      - name: Save Promotion Corps feedback into shared negotiation memory
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-opportunity-${{ github.ref_name }}-promotion-${{ github.run_id }}

      - name: Upload production negotiation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-scope-negotiation-${{ github.run_id }}
          path: |
            /tmp/negotiation-intelligence-bus-report.json
            /tmp/owner-scope-negotiation-report.json
            /tmp/council-operational-governance-report.json
            /tmp/authorized-host-promotion-report.json
            /tmp/negotiated-external-production-probe.json
            senju/state/negotiation_intelligence_bus.json
            senju/state/negotiation_intelligence_receipts.json
            senju/state/owner_scope_negotiation_campaign.json
            senju/state/owner_scope_negotiation_result.json
            senju/state/owner_contact_ceiling_effective.json
            senju/state/council_operational_policy.json
            senju/state/council_operational_governance_result.json
            senju/state/authorized-host-promotion/
            .authority-opportunity-runtime/promotion_corps_feedback_outbox.json
            .authority-opportunity-runtime/promotion_corps_execution_feed.json
            .authority-opportunity-runtime/promotion_corps_intelligence_snapshot.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
