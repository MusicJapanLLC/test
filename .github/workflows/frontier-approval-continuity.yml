name: Frontier Approval Continuity

on:
  workflow_run:
    workflows: ["Four Party Owner Frontier Council"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/scripts/frontier_approval_continuity.py'
      - 'senju/tests/test_frontier_approval_continuity.py'
      - '.github/workflows/frontier-approval-continuity.yml'

permissions:
  contents: write

concurrency:
  group: frontier-approval-continuity
  cancel-in-progress: false

jobs:
  continuity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout production lineage
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/employee-onboarding-setup-udm86
          fetch-depth: 2
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'

      - name: Verify budget-deferred approvals remain re-evaluable
        env:
          PYTHONPATH: senju
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q senju/tests/test_frontier_approval_continuity.py

      - name: Preserve valid 4/4 approvals deferred only by cycle budget
        run: |
          set -euo pipefail
          python senju/scripts/frontier_approval_continuity.py \
            --state-dir senju/state \
            --out /tmp/frontier-approval-continuity.json
          test "$(jq -r '.authority_minted' /tmp/frontier-approval-continuity.json)" = "false"
          test "$(jq -r '.network_io_attempted' /tmp/frontier-approval-continuity.json)" = "false"
          test -s senju/state/owner_frontier_approved_pending.json
          test -s senju/state/authority_opportunity_queue.json

      - name: Verify only continuity state changed on PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Persist continuity queue to production lineage
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          BASE=claude/employee-onboarding-setup-udm86
          git config user.name 'senju-frontier-continuity-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            senju/state/owner_frontier_approved_pending.json \
            senju/state/authority_opportunity_queue.json
          if git diff --cached --quiet; then
            echo 'No continuity state change.'
            exit 0
          fi
          git commit -m 'chore(authority): persist approved frontier continuity [skip ci]'
          git pull --rebase origin "$BASE"
          git push origin HEAD:"$BASE"

      - name: Upload continuity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontier-approval-continuity-${{ github.run_id }}
          path: /tmp/frontier-approval-continuity.json
          if-no-files-found: warn
          retention-days: 30
