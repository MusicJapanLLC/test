name: PR Traffic Controller

on:
  schedule:
    - cron: '*/30 * * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: pr-traffic-controller
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  control-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PR Traffic Controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python automation/control_plane/pr_traffic_controller.py \
            --out reports/pr-traffic/status.json

      - name: Upload PR Traffic Status Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-traffic-status
          path: reports/pr-traffic/status.json
          retention-days: 7
