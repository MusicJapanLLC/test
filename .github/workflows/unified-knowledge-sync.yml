name: Unified Knowledge Sync

on:
  push:
    paths:
      - '**'
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  issues:
    types: [opened]

jobs:
  sync-knowledge:
    runs-on: ubuntu-latest
    name: Sync Knowledge to Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client
          pip install requests pyyaml

      - name: Extract knowledge from commit
        id: extract
        run: |
          python3 << 'EOF'
          import json
          import sys
          import os
          from datetime import datetime

          # GitHub context
          event_data = json.loads(os.getenv('GITHUB_EVENT_PATH', '{}') or '{}')

          knowledge_ids = []

          if event_data.get('commits'):
              for commit in event_data['commits']:
                  msg = commit.get('message', '')
                  if 'fingerprint:' in msg:
                      # Extract knowledge metadata
                      lines = msg.split('\n')
                      metadata = {}
                      for line in lines[1:]:
                          if ':' in line:
                              k, v = line.split(':', 1)
                              metadata[k.strip()] = v.strip()

                      if metadata.get('fingerprint'):
                          print(f"✓ Found knowledge in commit: {metadata['fingerprint']}")
                          knowledge_ids.append(metadata['fingerprint'])

          print(f"KNOWLEDGE_COUNT={len(knowledge_ids)}")
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"knowledge_ids={json.dumps(knowledge_ids)}\n")
          EOF
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Log knowledge to registry
        if: steps.extract.outputs.knowledge_ids != '[]'
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime

          knowledge_ids = json.loads('${{ steps.extract.outputs.knowledge_ids }}' or '[]')

          # ログ出力（本番では Google Sheets に記録）
          for kid in knowledge_ids:
              print(f"[KNOWLEDGE_REGISTRY] {kid} - {datetime.utcnow().isoformat()}")

          # 監査ログに記録
          with open('/tmp/unified-knowledge-audit.log', 'a') as f:
              for kid in knowledge_ids:
                  f.write(f"${{ github.event_name }} | {kid} | ${{ github.actor }} | {datetime.utcnow().isoformat()}\n")
          EOF

      - name: Notify THE-WORLD-GOD
        if: steps.extract.outputs.knowledge_ids != '[]'
        run: |
          echo "📡 Notifying THE-WORLD-GOD..."
          echo "Knowledge IDs: ${{ steps.extract.outputs.knowledge_ids }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"

          # 本番: THE-WORLD-GOD API を呼び出し
          # curl -X POST https://orchestrator.internal/api/knowledge-sync \
          #   -H "Authorization: Bearer ${{ secrets.ORCHESTRATOR_TOKEN }}" \
          #   -d "{\"knowledge_ids\": ${{ steps.extract.outputs.knowledge_ids }}}"

  cross-repo-apply:
    runs-on: ubuntu-latest
    name: Apply Cross-Repo Knowledge
    needs: sync-knowledge
    if: github.repository == 'MusicJapanLLC/test' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if cross-repo patterns apply
        run: |
          echo "🔍 Checking for cross-repo applicable patterns..."

          # 本番実装:
          # 1. THE-WORLD-GOD に query
          # 2. the-world2 で既に解決されたパターンを確認
          # 3. 同じ問題がこのリポジトリで起きそうなら提案

          echo "✓ No cross-repo patterns to apply at this time"

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: knowledge-audit-log
          path: /tmp/unified-knowledge-audit.log
          retention-days: 90

  verification:
    runs-on: ubuntu-latest
    name: Verify Knowledge Integrity
    needs: sync-knowledge
    if: always()

    steps:
      - name: Checkout unified-knowledge system
        uses: actions/checkout@v4

      - name: Verify schemas
        run: |
          echo "✓ Verifying knowledge schemas..."
          test -f "automation/unified-knowledge/SCHEMA.md" && echo "✓ SCHEMA found"
          test -f "automation/unified-knowledge/knowledge-sync-worker.py" && echo "✓ Worker found"
          test -f "automation/unified-knowledge/sheets-connector.py" && echo "✓ Connector found"
          test -f "automation/unified-knowledge/the-world-god-unified-orchestrator.py" && echo "✓ Orchestrator found"

      - name: Report summary
        run: |
          echo "═══════════════════════════════════════"
          echo "Unified Knowledge System Status"
          echo "═══════════════════════════════════════"
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "═══════════════════════════════════════"
