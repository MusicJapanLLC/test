name: Root Authority Negotiation Loop

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'automation/codegen/config/authority_approval_constitution.json'
      - 'automation/codegen/engine/authority_approval_constitution.py'
      - 'automation/codegen/engine/root_authority_negotiation.py'
      - 'automation/codegen/run_root_authority_negotiation.py'
      - 'automation/codegen/tests/test_root_authority_negotiation.py'
      - 'automation/codegen/engine/authority_collaboration_bus.py'
      - 'automation/codegen/tests/test_authority_collaboration_bus.py'
      - 'automation/codegen/engine/negotiation_submission_accelerator.py'
      - 'automation/codegen/run_negotiation_submission_accelerator.py'
      - 'automation/codegen/tests/test_negotiation_submission_accelerator.py'
      - '.github/workflows/root-authority-negotiation-loop.yml'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'automation/codegen/config/authority_approval_constitution.json'
      - 'automation/codegen/engine/authority_approval_constitution.py'
      - 'automation/codegen/engine/root_authority_negotiation.py'
      - 'automation/codegen/run_root_authority_negotiation.py'
      - 'automation/codegen/tests/test_root_authority_negotiation.py'
      - 'automation/codegen/engine/authority_collaboration_bus.py'
      - 'automation/codegen/tests/test_authority_collaboration_bus.py'
      - 'automation/codegen/engine/negotiation_submission_accelerator.py'
      - 'automation/codegen/run_negotiation_submission_accelerator.py'
      - 'automation/codegen/tests/test_negotiation_submission_accelerator.py'
      - '.github/workflows/root-authority-negotiation-loop.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: authority-opportunity-improvement-loop
  cancel-in-progress: false

jobs:
  negotiate-new-host-root:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'

      - name: Restore shared authority collaboration memory
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-opportunity-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            authority-opportunity-${{ github.ref_name }}-
            rights-request-${{ github.ref_name }}-
            boundary-opportunity-${{ github.ref_name }}-
            authority-opportunity-

      - name: Verify council-first Root negotiation and canonical approval surface
        env:
          PYTHONPATH: automation/codegen
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            automation/codegen/tests/test_root_authority_negotiation.py \
            automation/codegen/tests/test_authority_collaboration_bus.py \
            automation/codegen/tests/test_negotiation_submission_accelerator.py
          python -m py_compile \
            automation/codegen/engine/authority_approval_constitution.py \
            automation/codegen/engine/root_authority_negotiation.py \
            automation/codegen/engine/authority_collaboration_bus.py \
            automation/codegen/engine/negotiation_submission_accelerator.py \
            automation/codegen/run_root_authority_negotiation.py \
            automation/codegen/run_negotiation_submission_accelerator.py
          python -m json.tool automation/codegen/config/authority_approval_constitution.json >/dev/null

      - name: Consolidate Boundary and Rights proposals before Root negotiation
        env:
          PYTHONPATH: automation/codegen
        run: |
          set -euo pipefail
          mkdir -p .authority-opportunity-runtime
          python automation/codegen/engine/authority_collaboration_bus.py \
            --bus-dir .authority-opportunity-runtime \
            --json-out /tmp/authority-collaboration-bus-root.json
          test "$(jq -r '.closed_loop' /tmp/authority-collaboration-bus-root.json)" = "true"
          test "$(jq -r '.authority_effect' /tmp/authority-collaboration-bus-root.json)" = "none"
          test "$(jq -r '.authority_activated' /tmp/authority-collaboration-bus-root.json)" = "false"
          test -s .authority-opportunity-runtime/authority_opportunity_queue.json

      - name: Run council-first new-host Root Authority negotiation
        env:
          PYTHONPATH: automation/codegen
        run: |
          mkdir -p .authority-opportunity-runtime
          python automation/codegen/run_root_authority_negotiation.py \
            --state .authority-opportunity-runtime \
            --repo-root . \
            --json-out .authority-opportunity-runtime/root_authority_negotiation_run.json
          test "$(jq -r '.closed_loop' .authority-opportunity-runtime/root_authority_negotiation_run.json)" = "true"
          test "$(jq -r '.negotiation_intensity' .authority-opportunity-runtime/root_authority_negotiation_run.json)" = "70"
          test "$(jq -r '.attempts_increment_every_cycle' .authority-opportunity-runtime/root_authority_negotiation_run.json)" = "true"
          test "$(jq -r '.new_unrelated_root_self_mint' .authority-opportunity-runtime/root_authority_negotiation_run.json)" = "false"
          test "$(jq -r '.new_root_created' .authority-opportunity-runtime/root_authority_negotiation_run.json)" = "false"
          test "$(jq -r '.META_X_SENJU_primary_review_is_first' .authority-opportunity-runtime/root_authority_negotiation_run.json)" = "true"
          test "$(jq -r '.secondary_owner_or_standing_evidence_rank' .authority-opportunity-runtime/root_authority_negotiation_run.json)" = "3"
          test "$(jq -r '.unlisted_approval_flows_excluded' .authority-opportunity-runtime/root_authority_negotiation_run.json)" = "true"
          test -s .authority-opportunity-runtime/root_authority_negotiation_campaign.json
          test -s .authority-opportunity-runtime/root_authority_negotiation_state.json
          test -s .authority-opportunity-runtime/owner_root_authority_review_packets.json
          test -s .authority-opportunity-runtime/authority_approval_constitution_effective.json
          echo "candidates=$(jq -r '.candidate_count' .authority-opportunity-runtime/root_authority_negotiation_run.json)"
          echo "tasks=$(jq -r '.task_count' .authority-opportunity-runtime/root_authority_negotiation_run.json)"
          echo "council_review_packets=$(jq -r '.council_review_packet_count' .authority-opportunity-runtime/root_authority_negotiation_run.json)"
          echo "post_council_activation_handoffs=$(jq -r '.existing_owner_activation_handoff_count' .authority-opportunity-runtime/root_authority_negotiation_run.json)"

      - name: Accelerate canonical submissions into META X SENJU primary review
        env:
          PYTHONPATH: automation/codegen
        run: |
          set -euo pipefail
          python automation/codegen/run_negotiation_submission_accelerator.py \
            --state .authority-opportunity-runtime \
            --json-out .authority-opportunity-runtime/negotiation_submission_accelerator_run.json
          test "$(jq -r '.approval_submission_is_goal' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "true"
          test "$(jq -r '.META_X_SENJU_primary_review_is_first' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "true"
          test "$(jq -r '.secondary_owner_or_standing_evidence_rank' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "3"
          test "$(jq -r '.unlisted_approval_flows_excluded' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "true"
          test "$(jq -r '.fresh_evidence_resubmits_immediately' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "true"
          test "$(jq -r '.unchanged_candidate_periodic_resubmission' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "true"
          test "$(jq -r '.writes_existing_review_surface' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "true"
          test "$(jq -r '.authority_effect' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "none"
          test "$(jq -r '.authority_activated' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)" = "false"
          test -s .authority-opportunity-runtime/root_authority_approval_outbox.json
          test -s .authority-opportunity-runtime/owner_root_authority_review_packets.json
          test -s .authority-opportunity-runtime/root_negotiation_peer_feed.json
          test -s .authority-opportunity-runtime/negotiation_submission_ledger.json
          test -s .authority-opportunity-runtime/authority_approval_constitution_effective.json
          echo "approval_submissions=$(jq -r '.approval_flow_submission_count' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)"
          echo "peer_share_tasks=$(jq -r '.peer_share_task_count' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)"
          echo "review_packets=$(jq -r '.existing_review_flow_packet_count' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)"
          echo "excluded_noncanonical=$(jq -r '.excluded_noncanonical_packet_count' .authority-opportunity-runtime/negotiation_submission_accelerator_run.json)"

      - name: Save shared authority collaboration memory
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .authority-opportunity-runtime/
          key: authority-opportunity-${{ github.ref_name }}-${{ github.run_id }}

      - name: Preserve Root negotiation and constitutional approval-flow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: root-authority-negotiation-${{ github.run_id }}
          path: |
            automation/codegen/config/authority_approval_constitution.json
            /tmp/authority-collaboration-bus-root.json
            .authority-opportunity-runtime/authority_approval_constitution_effective.json
            .authority-opportunity-runtime/authority_collaboration_bus.json
            .authority-opportunity-runtime/authority_opportunity_queue.json
            .authority-opportunity-runtime/root_authority_negotiation_run.json
            .authority-opportunity-runtime/root_authority_negotiation_campaign.json
            .authority-opportunity-runtime/root_authority_negotiation_state.json
            .authority-opportunity-runtime/owner_root_authority_review_packets.json
            .authority-opportunity-runtime/root_authority_approval_outbox.json
            .authority-opportunity-runtime/root_negotiation_peer_feed.json
            .authority-opportunity-runtime/negotiation_submission_ledger.json
            .authority-opportunity-runtime/negotiation_submission_accelerator_run.json
            .authority-opportunity-runtime/negotiation_submission_accelerator_result.json
            .authority-opportunity-runtime/owner_scope_negotiation_signals.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
