name: TOMOKI - HOUND
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/tomoki-hound.yml'
      - 'tomoki-agents/**'
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  security-events: read
  copilot-requests: write
jobs:
  hound:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.80
      - name: Run HOUND
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          copilot -p "$(cat tomoki-agents/prompts/hound.md)" -s --allow-tool=write --no-ask-user > /tmp/tomoki-copilot.log 2>&1
          rc=$?
          set -e

          # Preserve enough redacted failure evidence for MANAGER/SKEPTIC to diagnose
          # the next state. Never persist the raw Copilot log or environment secrets.
          if [[ ! -s tomoki-report.md ]]; then
            printf 'HOUND failed or produced no report. Exit code: %s\n' "$rc" > tomoki-report.md
          fi
          if [[ "$rc" -ne 0 ]]; then
            {
              printf '\n## Redacted diagnostic tail\n'
              tail -n 120 /tmp/tomoki-copilot.log \
                | sed -E 's/github_pat_[A-Za-z0-9_]+/[REDACTED_GITHUB_TOKEN]/g; s/gh[pousr]_[A-Za-z0-9_]+/[REDACTED_GITHUB_TOKEN]/g; s/Bearer[[:space:]]+[A-Za-z0-9._~+\/-]+/[REDACTED_BEARER]/g'
            } >> tomoki-report.md
          fi
          exit "$rc"
      - name: Persist HOUND evidence for Manager
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tomoki-hound-report
          path: tomoki-report.md
          retention-days: 14
          if-no-files-found: warn
      - name: Report to TOMOKI Slack
        if: always()
        env:
          TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
        run: python tomoki-agents/slack_post.py --agent HOUND --file tomoki-report.md --status "${{ job.status }}"
