name: Korean production publication
on:
  push:
    branches: [music-japan-production]
    paths:
      - '.github/workflows/korean-production-publication.yml'
      - 'music-japan-site-trace/learning/korean/**'
      - 'music-japan-site-trace/scripts/publish-korean.mjs'
      - 'music-japan-site-trace/scripts/build-deploy.mjs'
      - 'music-japan-site-trace/tests/korean-publication.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run the full site suite and build deployable production output
        working-directory: music-japan-site-trace
        run: |
          mkdir -p ../korean-release-evidence
          npm ci --ignore-scripts
          npm test 2>&1 | tee ../korean-release-evidence/site-tests.txt
          npm run build:deploy 2>&1 | tee ../korean-release-evidence/build.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=Path('learning/korean/index.html').read_bytes()
          b=Path('deploy-dist/korean/index.html').read_bytes()
          expected='3da5e732b47401cea010b64ded1086d9af773688f1b1c03f88e50dd5e90650c3'
          assert a==b and hashlib.sha256(b).hexdigest()==expected
          h=Path('deploy-dist/_headers').read_text()
          assert '/korean/*\n  ! Permissions-Policy\n' in h
          assert '/wahran/*\n  ! Permissions-Policy\n' in h
          print('Approved Korean deployment bytes and isolated route policies verified')
          PY
          git diff --exit-code -- next/public/wahran
      - name: Preserve actual test and build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-production-evidence
          path: korean-release-evidence/
          retention-days: 30
