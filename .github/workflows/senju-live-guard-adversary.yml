name: Senju Live Guard Adversary

on:
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "senju/**"
      - "scripts/security/artifact_guard.py"
      - "automation/security/workflow_policy.py"
      - "automation/security/workflow_policy_entrypoint.py"
      - ".github/workflows/security-guard.yml"
      - ".github/workflows/senju-live-guard-adversary.yml"
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "senju/**"
      - "scripts/security/artifact_guard.py"
      - "automation/security/workflow_policy.py"
      - "automation/security/workflow_policy_entrypoint.py"
      - ".github/workflows/security-guard.yml"
      - ".github/workflows/senju-live-guard-adversary.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senju-live-guard-adversary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-adversary:
    name: Active codepaths / 7 live guard surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD SINGULARITY workflow.")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run live adversary against active implementations and policy files
        env:
          PYTHONPATH: senju
        run: >-
          python -m senju.live_guard_adversary
          --rounds 8
          --scope-cases 1024
          --seed 31001
          --json security-reports/senju-live-guard-adversary.json
          --fail-on-crash
          --fail-on-weakness

      - name: Print per-surface evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("security-reports/senju-live-guard-adversary.json")
          if not path.exists():
              raise SystemExit("live adversary report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          print("execution_mode:", report.get("execution_mode"))
          print("summary:", report.get("summary"))
          if report.get("rounds"):
              for item in report["rounds"][-1].get("live_surfaces", []):
                  print(f"{item['layer']}: passed={item['passed']} detail={item['detail']}")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-live-guard-adversary-${{ github.sha }}
          path: security-reports/senju-live-guard-adversary.json
          if-no-files-found: error
          retention-days: 30
