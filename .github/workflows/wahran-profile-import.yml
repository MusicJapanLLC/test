name: Wahran conversation upgrade acceptance
on:
  push:
    branches: [chatgpt/wahran-conversation-profiles-20261011]
    paths: [.github/workflows/wahran-profile-import.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chatgpt/wahran-conversation-profiles-20261011
      - name: Receive and integrity-check only the approved teaching update
        env:
          PACKAGE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-07dc-8206-8679-8a68a2791331/raw?se=2026-10-11T07%3A35%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=58c1d60c-0caf-590a-99ec-5519547ad896&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T05%3A33%3A22Z&ske=2026-10-12T05%3A33%3A22Z&sks=b&skv=2026-02-06&sig=ZDBQDfiwHNtJkGJrmUkeul4VueFupkNcYf/dE5wgJ%2BY%3D'
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,hashlib,os,pathlib
          body=urllib.request.urlopen(os.environ['PACKAGE_URL'],timeout=40).read(100000)
          assert len(body)==56407
          assert hashlib.sha256(body).hexdigest()=='4bbbff790444593bc6e8f543977ffd33862f55bc19e302acba63f5d02503d5c5'
          dest=pathlib.Path('/tmp/wahran-upgrade');dest.mkdir()
          with zipfile.ZipFile(io.BytesIO(body)) as z:
              assert len(z.infolist())==9
              assert sum(i.file_size for i in z.infolist())<1000000
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert (item.external_attr>>16)&0o170000!=0o120000
              z.extractall(dest)
          print('Verified approved update package',len(body),'bytes')
          PY
      - name: Patch current source while preserving bundled audio
        run: |
          python /tmp/wahran-upgrade/tools/apply_upgrade.py --app music-japan-site-trace/next/public/wahran/index.html --publisher music-japan-site-trace/scripts/publish-wahran.mjs
          cp /tmp/wahran-upgrade/tests/repo_profiles.test.mjs music-japan-site-trace/tests/wahran-conversation.test.mjs
          cp /tmp/wahran-upgrade/tests/browser_profiles.py music-japan-site-trace/scripts/verify-wahran-profiles.py
          mkdir -p music-japan-site-trace/docs
          cp /tmp/wahran-upgrade/docs/DECISIONS.md music-japan-site-trace/docs/wahran-conversation-1.2.md
          git diff --stat
      - name: Run actual site tests and publication build
        working-directory: music-japan-site-trace
        run: |
          npm ci --ignore-scripts > /tmp/npm-install.log 2>&1 || { tail -60 /tmp/npm-install.log; exit 1; }
          npm test > /tmp/site-tests.log 2>&1 || { tail -120 /tmp/site-tests.log; exit 1; }
          tail -18 /tmp/site-tests.log
          npm run build:deploy > /tmp/site-build.log 2>&1 || { tail -100 /tmp/site-build.log; exit 1; }
          tail -20 /tmp/site-build.log
      - name: Install fixed browser runners
        run: |
          python -m pip install playwright==1.57.0 --quiet
          python -m playwright install --with-deps chromium webkit > /tmp/browsers.log 2>&1 || { tail -60 /tmp/browsers.log; exit 1; }
      - name: Exercise all four profiles in Chromium and WebKit with actual audio and storage
        run: |
          mkdir -p evidence
          python -m http.server 4178 --bind 127.0.0.1 --directory music-japan-site-trace/deploy-dist > /tmp/wahran-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4178/wahran/ > /dev/null && break || sleep 1; done
          WAHRAN_URL=http://127.0.0.1:4178/wahran/ BROWSERS=chromium,webkit EVIDENCE_DIR=evidence python music-japan-site-trace/scripts/verify-wahran-profiles.py
          sha256sum music-japan-site-trace/next/public/wahran/index.html
      - name: Commit only accepted course and regression tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- music-japan-site-trace/next/public/wahran/index.html music-japan-site-trace/next/public/wahran/japanese-data.js music-japan-site-trace/next/public/wahran/conversation-course.js music-japan-site-trace/next/public/wahran/conversation-ui.css music-japan-site-trace/scripts/publish-wahran.mjs music-japan-site-trace/tests/wahran-conversation.test.mjs music-japan-site-trace/scripts/verify-wahran-profiles.py music-japan-site-trace/docs/wahran-conversation-1.2.md
          git diff --cached --stat
          git commit -m 'feat(wahran): match conversation forms and add Japanese teaching support'
          git push origin HEAD:chatgpt/wahran-conversation-profiles-20261011
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wahran-conversation-acceptance
          path: evidence/
          retention-days: 14
