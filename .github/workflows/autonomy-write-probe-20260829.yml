name: THE WORLD Autonomy Write Probe 20260829

on:
  push:
    paths:
      - '.github/workflows/autonomy-write-probe-20260829.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  write-one-internal-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Write exactly one autonomous internal comment
        shell: bash
        run: |
          set -euo pipefail
          marker="AUTONOMY_PROBE:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/100/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1 || true)"
          if [[ -n "$existing" ]]; then
            echo "Already written: $existing"
            exit 0
          fi
          gh issue comment 100 --repo "$GITHUB_REPOSITORY" --body "[THE WORLD autonomous write proof]\n\n${marker}\n\nWriter: github-actions[bot]\nTrigger: GitHub Actions push event\nTarget: internal GitHub Issue #100\nEmail: not used\nResult: autonomous comment write path executed."
          echo "Autonomous internal comment written to Issue #100."
