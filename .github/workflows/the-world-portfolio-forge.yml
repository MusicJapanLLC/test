name: THE WORLD - Portfolio Forge Watch

on:
  workflow_dispatch:
  schedule:
    # Four production-evidence cycles/hour, offset from AI Dev Minute Foundry.
    - cron: '11,26,41,56 * * * *'
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/the-world-portfolio-forge.yml'
      - 'automation/portfolio_forge/**'
      - 'automation/reporting/portfolio_targets.json'

concurrency:
  group: the-world-portfolio-forge
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  portfolio-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STATE_DIR: /tmp/the-world-portfolio-forge
      GH_TOKEN: ${{ github.token }}
      PORTFOLIO_SLACK_WEBHOOK_URL: ${{ secrets.PORTFOLIO_SLACK_WEBHOOK_URL }}
      TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout THE WORLD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore prior live evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR/previous"
          prev="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow the-world-portfolio-forge.yml --status success --limit 12 --json databaseId --jq '.[].databaseId' | grep -v "^${GITHUB_RUN_ID}$" | head -n1 || true)"
          if [[ -n "$prev" ]]; then
            gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name "the-world-portfolio-forge-${prev}" --dir "$STATE_DIR/previous" || true
            candidate="$(find "$STATE_DIR/previous" -type f -name portfolio-watch.json | head -n1 || true)"
            if [[ -n "$candidate" ]]; then
              cp "$candidate" "$STATE_DIR/previous.json"
              echo "Restored prior live evidence from run $prev." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Probe registered live portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR"
          python automation/portfolio_forge/portfolio_watch.py \
            --registry automation/reporting/portfolio_targets.json \
            --json "$STATE_DIR/portfolio-watch.json" \
            --markdown "$STATE_DIR/portfolio-watch.md"
          cat "$STATE_DIR/portfolio-watch.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Compare Previous -> Current and dedupe incidents
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          state=os.environ['STATE_DIR']
          current=json.load(open(state+'/portfolio-watch.json',encoding='utf-8'))
          try:
              previous=json.load(open(state+'/previous.json',encoding='utf-8'))
          except Exception:
              previous={}
          cs=float(current.get('portfolio_score') or 0)
          ps=float(previous.get('portfolio_score') or cs)
          cf=int(current.get('failed') or 0)
          pf=int(previous.get('failed') or cf)
          current_fp=str(current.get('incident_fingerprint') or 'unknown')
          previous_fp=str(previous.get('incident_fingerprint') or '__none__')
          material=bool(current.get('material_delta'))
          improved=(cs >= ps + 5) or (cf < pf) or (previous_fp != 'healthy' and current_fp == 'healthy')
          regressed=(cs <= ps - 10) or (cf > pf)
          incident_changed=current_fp != previous_fp
          repair_due=material and (incident_changed or regressed or not previous)
          print(f'current_score={cs}')
          print(f'previous_score={ps}')
          print(f'current_fingerprint={current_fp}')
          print(f'previous_fingerprint={previous_fp}')
          print('improved=' + ('true' if improved else 'false'))
          print('regressed=' + ('true' if regressed else 'false'))
          print('incident_changed=' + ('true' if incident_changed else 'false'))
          print('material=' + ('true' if material else 'false'))
          print('repair_due=' + ('true' if repair_due else 'false'))
          print(f'failed={cf}')
          PY

      - name: Feed a new or worsened incident into autonomous repair loops
        if: steps.delta.outputs.repair_due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "New/worsened live portfolio incident detected. Dispatching both portfolio prioritization and AI development loops." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run portfolio-evolution-daily.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || true
          gh workflow run ai-dev-minute-foundry.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || true

      - name: Report new or worsened portfolio incident to Slack
        if: steps.delta.outputs.repair_due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          webhook="${PORTFOLIO_SLACK_WEBHOOK_URL:-}"
          if [[ -z "$webhook" ]]; then webhook="${TOMOKI_SLACK_WEBHOOK_URL:-}"; fi
          if [[ -z "$webhook" ]]; then
            echo "SLACK_INCIDENT_DELIVERY=BLOCKED_MISSING_WEBHOOK" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import json, os
          state=os.environ['STATE_DIR']
          cur=json.load(open(state+'/portfolio-watch.json',encoding='utf-8'))
          nf=cur.get('next_focus') or {}
          text=(
              '*THE WORLD PORTFOLIO — REPAIR LOOP STARTED*\n'
              f"Product: {nf.get('name','UNKNOWN')}\n"
              f"Live: {nf.get('url','')}\n"
              f"Priority: {nf.get('priority','UNKNOWN')}\n"
              f"Evidence: {nf.get('reason','unknown')}\n"
              f"Portfolio score: {cur.get('portfolio_score','?')} / failed={cur.get('failed','?')} / degraded={cur.get('degraded','?')}\n"
              f"Incident: {cur.get('incident_fingerprint','unknown')}\n"
              'Action: Portfolio Evolution + AI Dev Foundry dispatched; duplicate incident dispatches are suppressed until state changes.\n'
              f"GitHub run: {os.getenv('GITHUB_SERVER_URL')}/{os.getenv('GITHUB_REPOSITORY')}/actions/runs/{os.getenv('GITHUB_RUN_ID')}"
          )
          json.dump({'text':text},open(state+'/slack-incident.json','w',encoding='utf-8'),ensure_ascii=False)
          PY
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary "@$STATE_DIR/slack-incident.json" \
            "$webhook"

      - name: Report verified recovery or score improvement to portfolio Slack
        if: steps.delta.outputs.improved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          webhook="${PORTFOLIO_SLACK_WEBHOOK_URL:-}"
          if [[ -z "$webhook" ]]; then webhook="${TOMOKI_SLACK_WEBHOOK_URL:-}"; fi
          if [[ -z "$webhook" ]]; then
            echo "SLACK_RECOVERY_DELIVERY=BLOCKED_MISSING_WEBHOOK" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import json, os
          state=os.environ['STATE_DIR']
          cur=json.load(open(state+'/portfolio-watch.json',encoding='utf-8'))
          try:
              prev=json.load(open(state+'/previous.json',encoding='utf-8'))
          except Exception:
              prev={}
          weakest=cur.get('next_focus') or {}
          text=(
              '*THE WORLD PORTFOLIO UPDATE — VERIFIED IMPROVEMENT*\n'
              f"Portfolio score: {prev.get('portfolio_score','?')} -> {cur.get('portfolio_score','?')}\n"
              f"Failed: {prev.get('failed','?')} -> {cur.get('failed','?')}\n"
              f"Incident: {prev.get('incident_fingerprint','?')} -> {cur.get('incident_fingerprint','?')}\n"
              f"Next: {weakest.get('name','NONE')} / {weakest.get('priority','NONE')}\n"
              'Verified: fresh production GET/health checks + Previous -> Current artifact comparison.\n'
              'Owner action: NONE\n'
              f"GitHub run: {os.getenv('GITHUB_SERVER_URL')}/{os.getenv('GITHUB_REPOSITORY')}/actions/runs/{os.getenv('GITHUB_RUN_ID')}"
          )
          json.dump({'text':text},open(state+'/slack-recovery.json','w',encoding='utf-8'),ensure_ascii=False)
          PY
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary "@$STATE_DIR/slack-recovery.json" \
            "$webhook"

      - name: Preserve live portfolio evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: the-world-portfolio-forge-${{ github.run_id }}
          path: |
            /tmp/the-world-portfolio-forge/portfolio-watch.json
            /tmp/the-world-portfolio-forge/portfolio-watch.md
          retention-days: 30
          if-no-files-found: error

      - name: Keep detector health separate from target health
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.delta.outputs.material }}" == "true" ]]; then
            echo "DETECTOR=HEALTHY; TARGET_STATE=INCIDENT; repair loop has been routed without marking the detector itself broken." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DETECTOR=HEALTHY; TARGET_STATE=HEALTHY." >> "$GITHUB_STEP_SUMMARY"
          fi
