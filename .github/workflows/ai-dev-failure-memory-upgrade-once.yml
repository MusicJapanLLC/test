name: AI Dev - Failure Memory Upgrade Once

on:
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/ai-dev-failure-memory-upgrade-once.yml'
  workflow_dispatch:

concurrency:
  group: ai-dev-failure-memory-upgrade-once-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  apply:
    if: github.ref_name == 'claude/employee-onboarding-setup-udm86'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply fail-closed AI Failure Memory v4
        run: |
          set -euo pipefail
          python .github/patches/apply_ai_failure_memory_v4.py
          git diff --check -- automation/ai_foundry/minute_evolution.py automation/ai_foundry/test_minute_evolution.py

      - name: Validate AI Foundry and AI-Security boundary
        run: |
          set -euo pipefail
          python -m compileall -q automation/ai_foundry automation/security automation/agent_factory automation/world
          python -m unittest -v automation.ai_foundry.test_minute_evolution
          python -m unittest -v automation.security.test_ai_security_feedback
          (cd automation/agent_factory && python -m unittest discover -v -p 'test_*.py')

      - name: Commit only tested AI Foundry targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- automation/ai_foundry/minute_evolution.py automation/ai_foundry/test_minute_evolution.py
          if git diff --cached --quiet; then
            echo 'Failure Memory v4 already installed; no commit required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'THE WORLD AI Foundry'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ai-foundry: persist bounded failure learning memory'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:claude/employee-onboarding-setup-udm86
          echo 'Failure Memory v4 installed after AI + Security + Agent Factory tests.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report claim boundary
        if: always()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Failure Memory v4 contract
          - repeated rejected mutation families become lower-priority exploration after recurrence
          - memory is bounded and expires; fresh passing evidence can supersede historical failure
          - holdout, Security, correctness and permission gates remain authoritative
          - this is AI engineering-process evidence, not model-weight training or customer validation
          EOF
