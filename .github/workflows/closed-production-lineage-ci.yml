name: Closed Production Lineage CI

on:
  pull_request:
    paths:
      - 'automation/world/closed_loop_lineage.py'
      - 'automation/world/select_confirmed_fix_lineages.py'
      - 'automation/world/audit_closed_lineage_prs.py'
      - 'automation/world/test_closed_loop_lineage.py'
      - 'automation/world/test_select_confirmed_fix_lineages.py'
      - 'automation/world/test_audit_closed_lineage_prs.py'
      - '.github/workflows/closed-production-lineage-ci.yml'
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - 'automation/world/closed_loop_lineage.py'
      - 'automation/world/select_confirmed_fix_lineages.py'
      - 'automation/world/audit_closed_lineage_prs.py'
      - 'automation/world/test_closed_loop_lineage.py'
      - 'automation/world/test_select_confirmed_fix_lineages.py'
      - 'automation/world/test_audit_closed_lineage_prs.py'
      - '.github/workflows/closed-production-lineage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closed-production-lineage-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lineage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile lineage runtime
        run: |
          python -m py_compile \
            automation/world/closed_loop_lineage.py \
            automation/world/select_confirmed_fix_lineages.py \
            automation/world/audit_closed_lineage_prs.py

      - name: Verify Detection -> Fix -> Approval -> Apply -> Audit contracts
        run: |
          python -m pytest -q \
            automation/world/test_closed_loop_lineage.py \
            automation/world/test_select_confirmed_fix_lineages.py \
            automation/world/test_audit_closed_lineage_prs.py
