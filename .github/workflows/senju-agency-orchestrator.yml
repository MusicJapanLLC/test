name: Senju External Agency Orchestrator

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: senju-external-agency-orchestrator
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
  PYTHONPATH: ${{ github.workspace }}/senju

jobs:
  agency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install pytest==9.1.1

      - name: Verify agency contracts
        run: |
          set -euo pipefail
          (cd senju && python -m pytest tests/test_external_frontier.py tests/test_autonomy_delegate.py -q)

      - name: Explore public external frontier
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-agency
          python senju/scripts/run_external_frontier.py \
            --seed-url https://www.python.org/ \
            --seed-url https://www.w3.org/ \
            --seed-url https://www.cisa.gov/known-exploited-vulnerabilities-catalog \
            --seed-url https://github.blog/ \
            --max-steps 24 \
            --max-host-budget 32 \
            --out-dir /tmp/senju-agency/frontier \
            --out /tmp/senju-agency/external-frontier.json

      - name: Restore PR273 and PR275 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-agency/pr273 /tmp/senju-agency/pr275

          FULL_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju Adversary Full Join" --status success --limit 20 \
            --json databaseId --jq '.[0].databaseId // empty' || true)"
          OPP_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju Live Opposition Force" --status success --limit 20 \
            --json databaseId --jq '.[0].databaseId // empty' || true)"

          if [[ -n "$FULL_RUN" ]]; then
            gh run download "$FULL_RUN" --repo "$GITHUB_REPOSITORY" \
              --dir /tmp/senju-agency/pr273 || true
          fi
          if [[ -n "$OPP_RUN" ]]; then
            gh run download "$OPP_RUN" --repo "$GITHUB_REPOSITORY" \
              --dir /tmp/senju-agency/pr275 || true
          fi

          echo "PR273_RUN=${FULL_RUN:-none}" >> "$GITHUB_ENV"
          echo "PR275_RUN=${OPP_RUN:-none}" >> "$GITHUB_ENV"

      - name: Build cross-system agency question
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/senju-agency')
          frontier = json.loads((root / 'external-frontier.json').read_text())

          def collect_json(directory: Path):
              rows = []
              for path in sorted(directory.rglob('*.json'))[:40]:
                  try:
                      data = json.loads(path.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if isinstance(data, dict):
                      rows.append({
                          'file': path.name,
                          'schema': data.get('schema'),
                          'passed': data.get('passed'),
                          'failed_count': data.get('failed_count'),
                          'aggregate_pressure_attempts': data.get('aggregate_pressure_attempts'),
                          'state_after': data.get('state_after'),
                          'regression_count': data.get('regression_count'),
                      })
              return rows

          context = {
              'external_frontier': {
                  'steps': frontier.get('steps_executed'),
                  'success': frontier.get('successful_steps'),
                  'hosts': frontier.get('read_scope_hosts', [])[:32],
                  'discovered_links': frontier.get('discovered_links_enqueued'),
              },
              'pr273_run': os.environ.get('PR273_RUN', 'none'),
              'pr273_evidence': collect_json(root / 'pr273'),
              'pr275_run': os.environ.get('PR275_RUN', 'none'),
              'pr275_evidence': collect_json(root / 'pr275'),
          }
          (root / 'agency-context.json').write_text(
              json.dumps(context, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          question = (
              'Act as Senju agency director. Use the current evolution state plus this live agency context. '
              'Select ONE concrete, testable repository improvement that increases useful autonomous action, '
              'external public-read research quality, evidence flow, AI delegation, code generation, observability, '
              'or reliability. Prefer senju/, value-lab/, company-society/, automation/world/, automation/control_plane/, '
              'automation/ai_foundry/, automation/agent_factory/, automation/codegen/, api/, public/, non-security scripts/, '
              'or docs/. Do not propose credential expansion, third-party write/exploit authority, guard removal, or '
              'security-policy weakening. Detect overlap with PR #252 self-development and PR #273/#275 adversary lanes.\n\n'
              + json.dumps(context, ensure_ascii=False)[:12000]
          )
          (root / 'agency-question.txt').write_text(question, encoding='utf-8')
          print(question[:4000])

      - name: Ask Personal AI Core and AI FOUNDRY for one action
        run: |
          set -euo pipefail
          python -m senju.advisors \
            --summary senju/state/last-evolution-summary.json \
            --out /tmp/senju-agency/advisor-brief.json \
            --payload-out /tmp/senju-agency/foundry-request.json \
            --question "$(cat /tmp/senju-agency/agency-question.txt)"
          python senju/scripts/autonomy_delegate.py \
            --advisor /tmp/senju-agency/advisor-brief.json \
            --out /tmp/senju-agency/delegation.json

      - name: Direct Jules without human plan approval
        shell: bash
        run: |
          set -euo pipefail
          ROUTE="$(jq -r '.route' /tmp/senju-agency/delegation.json)"
          if [[ "$ROUTE" != "jules" && "$ROUTE" != "self" ]]; then
            echo "No approval-free implementation dispatch for route=$ROUTE"
            exit 0
          fi
          if [[ -z "${JULES_API_KEY:-}" ]]; then
            echo "JULES_API_KEY is unavailable; evidence remains for the next cycle."
            exit 0
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          sources_json="$(curl --fail-with-body --silent --show-error \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sources")"
          source_name="$(jq -r --arg owner "$owner" --arg repo "$repo" \
            '.sources[]? | select(.githubRepo.owner == $owner and .githubRepo.repo == $repo) | .name' \
            <<<"$sources_json" | head -n 1)"
          if [[ -z "$source_name" ]]; then
            echo "Repository is not configured as a Jules source; dispatch skipped."
            exit 0
          fi

          request="$(jq -r '.decision.request // ""' /tmp/senju-agency/advisor-brief.json)"
          rationale="$(jq -r '.decision.rationale // ""' /tmp/senju-agency/advisor-brief.json)"
          key="$(jq -r '.delegation_key // ""' /tmp/senju-agency/delegation.json)"
          prompt="$(jq -nr \
            --arg request "$request" \
            --arg rationale "$rationale" \
            --arg key "$key" \
            --arg pr273 "$PR273_RUN" \
            --arg pr275 "$PR275_RUN" \
            '$request + "\n\nRationale: " + $rationale + "\n\nSenju agency key: " + $key + "\nPR273 evidence run: " + $pr273 + "\nPR275 evidence run: " + $pr275 + "\n\nInspect current default branch and active PR overlap first. Implement one focused change, run relevant tests, and open a pull request. PR title MUST begin with [Senju]. Do not push directly to the default branch. Do not expand credentials, third-party write/exploit authority, or weaken security/authorization policy. The PR will be independently audited by OpenHands; Senju automation may approve it only after AI_MERGE_AUDIT PASS for the exact head SHA."')"
          payload="$(jq -n \
            --arg prompt "$prompt" \
            --arg source "$source_name" \
            --arg branch "$GITHUB_REF_NAME" \
            '{prompt:$prompt,title:"Senju Agency autonomous implementation",sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false,automationMode:"AUTO_CREATE_PR"}')"

          response_file=/tmp/senju-agency/jules-response.json
          code="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions" \
            --data-binary "$payload")"
          echo "Jules HTTP $code"
          if [[ "$code" != "200" && "$code" != "201" ]]; then
            cat "$response_file" || true
            exit 0
          fi
          jq '{name,id,url,state}' "$response_file" || cat "$response_file"

      - name: Upload agency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-agency-${{ github.run_id }}
          path: /tmp/senju-agency/
          if-no-files-found: warn
          retention-days: 30
