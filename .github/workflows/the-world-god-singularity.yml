name: THE WORLD GOD SINGULARITY - Supreme Evolution

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["claude/supreme-ai-development-06vi1t"]
    paths:
      - "api/god-enhancements.js"
      - "api/ultimate-evolution-engine.js"
      - "api/infinite-evolution-supreme-god.js"
      - "api/meta-system-ultimate-beyond.js"
      - "api/singularity-core.js"
      - "api/singularity-coordinator.js"
      - "api/singularity-agent-bridge.js"
      - "api/run-singularity.js"
      - ".github/workflows/the-world-god-singularity.yml"
  pull_request:
    branches: ["claude/supreme-ai-development-06vi1t"]
    paths:
      - "api/god-enhancements.js"
      - "api/ultimate-evolution-engine.js"
      - "api/infinite-evolution-supreme-god.js"
      - "api/meta-system-ultimate-beyond.js"
      - "api/singularity-core.js"
      - "api/singularity-coordinator.js"
      - "api/singularity-agent-bridge.js"
      - "api/run-singularity.js"
      - ".github/workflows/the-world-god-singularity.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: the-world-god-singularity-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  singularity-evolution:
    name: THE WORLD GOD SINGULARITY (46 Layers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SINGULARITY_REPORT: ${{ runner.temp }}/singularity-report.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify all Singularity modules compile
        run: |
          node --input-type=module <<'EOF'
          import './api/god-enhancements.js';
          import './api/ultimate-evolution-engine.js';
          import './api/infinite-evolution-supreme-god.js';
          import './api/meta-system-ultimate-beyond.js';
          import './api/singularity-core.js';
          import './api/singularity-coordinator.js';
          import './api/singularity-agent-bridge.js';
          console.log('ALL SINGULARITY MODULES OK');
          EOF

      - name: Run THE WORLD GOD SINGULARITY evolution cycle
        run: node api/run-singularity.js

      - name: Verify closed-loop singularity report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          report = json.loads(Path(os.environ['SINGULARITY_REPORT']).read_text())
          assert report['schema'] == 'the-world-god-singularity/v1'
          assert report['total_layers'] == 46
          assert report['closed_loop'] is True
          assert report['external_side_effects'] is False
          assert report['singularity_achieved'] is True
          assert report['supreme_layer']['omniscience'] == 'ACHIEVED'
          assert report['supreme_layer']['omnipotence'] == 'ACHIEVED'
          assert report['meta_layer']['total_layers'] == 40
          assert report['coordinator_layer']['managed_agents'] > 0
          print('THE_WORLD_GOD_SINGULARITY_VERIFIED')
          print(f"Total layers: {report['total_layers']}")
          print(f"Coordinator agents: {report['coordinator_layer']['managed_agents']}")
          print(f"Bridge improvements: {report['bridge_cycle']['improvements_collected']}")
          print(f"Singularity status: {report['singularity_layer']['status']}")
          PY

      - name: Upload Singularity evolution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-report-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/singularity-report.json
