name: Senju Guarded Transport Lab

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Bounded loop cycles (1-10)"
        required: false
        default: "3"
      rounds:
        description: "Strategy rounds per target (1-10)"
        required: false
        default: "2"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: senju-guarded-transport-lab
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD SINGULARITY workflow.")
          PYEOF
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Senju
        run: python -m pip install -e ./senju

      - name: Refresh independent authority review
        run: |
          if [ -f automation/codegen/meta_state/discovery_candidates.json ]; then
            python automation/codegen/authority_review_runner.py
          else
            echo "No discovery candidates present; reviewer has nothing to promote."
          fi

      - name: Run guarded multi-route loop
        env:
          INPUT_CYCLES: ${{ github.event.inputs.cycles || '3' }}
          INPUT_ROUNDS: ${{ github.event.inputs.rounds || '2' }}
        run: |
          python senju/scripts/guarded_transport_lab_loop.py \
            --cycles "$INPUT_CYCLES" \
            --rounds "$INPUT_ROUNDS" \
            --max-targets 3 \
            --sleep-seconds 10

      - name: Summarize result
        if: always()
        run: |
          if [ -f senju/state/guarded_transport_lab.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('senju/state/guarded_transport_lab.json')
          d = json.loads(p.read_text())
          cycles = d.get('cycles', [])
          print(f"guard_bypass={d.get('guard_bypass')} cycles={len(cycles)}")
          for c in cycles:
              for r in c.get('results', []):
                  if 'winner' in r:
                      print(f"cycle={c['cycle']} host={r.get('target_host')} winner={r.get('winner')}")
                  elif 'error' in r:
                      print(f"cycle={c['cycle']} error={r.get('error')}")
          PY
          else
            echo "No contacts were made; no live reviewed targets were available."
          fi
