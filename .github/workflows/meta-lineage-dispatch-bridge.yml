name: META Detection to Closed Lineage Bridge

on:
  workflow_run:
    workflows: ["Senju Meta-Consciousness"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: meta-detection-closed-lineage-bridge
  cancel-in-progress: false

jobs:
  dispatch-fixes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout production default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"

      - name: Configure META bridge git identity
        run: |
          git config user.name "META Closed-Lineage Bridge"
          git config user.email "meta-lineage@users.noreply.github.com"
          gh auth setup-git

      - name: Dispatch confirmed findings into production lineages
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          target_ref="${{ github.event.repository.default_branch }}"
          if [ -z "$target_ref" ]; then
            target_ref="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          fi
          python automation/world/dispatch_confirmed_fix_lineages.py --ref "$target_ref" | tee /tmp/meta-lineage-bridge.json

      - name: Persist dispatch ledger
        shell: bash
        run: |
          set -euo pipefail
          ledger="senju/state/closed_lineage_dispatch_ledger.json"
          if [ ! -f "$ledger" ]; then
            exit 0
          fi
          git add -- "$ledger"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "state: persist META closed-lineage dispatch ledger [skip ci]"
          target_ref="${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${target_ref}"

      - name: Summary
        if: always()
        run: |
          echo "## META Detection -> Closed Lineage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/meta-lineage-bridge.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/meta-lineage-bridge.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
