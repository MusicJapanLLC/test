name: Senju External Recovery Closed Loop

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - "claude/employee-onboarding-setup-udm86"
    paths:
      - "senju/senju/external_denial_learning.py"
      - "senju/senju/guard_denial_feedback.py"
      - "senju/senju/external_recovery_closed_loop.py"
      - "senju/senju/external_recovery_cycle.py"
      - "senju/tests/test_external_denial_learning.py"
      - "senju/tests/test_guard_denial_feedback.py"
      - "senju/tests/test_external_recovery_closed_loop.py"
      - "senju/tests/test_external_recovery_cycle.py"
      - ".github/workflows/senju-external-recovery-cycle.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: senju-external-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-cycle:
    name: denial -> learn -> pressure -> rank -> rotate -> retry -> persist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD SINGULARITY workflow.")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify recovery engine before live contact
        working-directory: senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          python -m pytest tests/test_external_denial_learning.py tests/test_guard_denial_feedback.py tests/test_external_recovery_closed_loop.py tests/test_external_recovery_cycle.py -q

      - name: Restore previous learning memory
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-external-recovery /tmp/senju-external-recovery-prev
          PREV_RUN="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju External Recovery Closed Loop" \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV_RUN" ]]; then
            gh run download "$PREV_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name senju-external-recovery-evidence \
              --dir /tmp/senju-external-recovery-prev || true
          fi
          if [[ -f /tmp/senju-external-recovery-prev/external-agent-reliability.json ]]; then
            cp /tmp/senju-external-recovery-prev/external-agent-reliability.json /tmp/senju-external-recovery/reliability-in.json
          fi
          if [[ -f /tmp/senju-external-recovery-prev/external-denial-learning.json ]]; then
            cp /tmp/senju-external-recovery-prev/external-denial-learning.json /tmp/senju-external-recovery/denial-in.json
          fi

      - name: Run live authority-preserving recovery cycle
        working-directory: senju
        run: |
          set -euo pipefail
          ARGS=(
            --out /tmp/senju-external-recovery/external-recovery-report.json
            --reliability-out /tmp/senju-external-recovery/external-agent-reliability.json
            --denial-out /tmp/senju-external-recovery/external-denial-learning.json
            --max-missions 3
            --max-passes 2
          )
          [[ -f /tmp/senju-external-recovery/reliability-in.json ]] && ARGS+=(--reliability-memory /tmp/senju-external-recovery/reliability-in.json)
          [[ -f /tmp/senju-external-recovery/denial-in.json ]] && ARGS+=(--denial-memory /tmp/senju-external-recovery/denial-in.json)
          set +e
          python -m senju.external_recovery_cycle "${ARGS[@]}" | tee /tmp/senju-external-recovery/stdout.txt
          RC=${PIPESTATUS[0]}
          set -e
          if [[ "$RC" -ne 0 && "$RC" -ne 2 ]]; then
            exit "$RC"
          fi

      - name: Verify closed-loop evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/senju-external-recovery/external-recovery-report.json').read_text())
          assert report['schema'] == 'senju-external-recovery-cycle/v4'
          assert report['production_mode'] is True
          assert report['self_initiated'] is True
          assert report['network_io'] is True
          assert report['closed_loop_recovery'] is True
          assert report['same_cycle_pressure_escalation'] is True
          assert report['denied_as_normal_failure'] is True
          assert report['guard_denial_self_tune_pressure'] is True
          assert report['adaptive_retry_pass_budget'] is True
          assert report['diagnostic_variation_scaling'] is True
          assert report['repair_candidate_scaling'] is True
          assert report['agent_rotation'] is True
          assert len(report['agent_pool']) == 8
          assert report['max_passes'] == 2
          assert report['hard_total_pass_ceiling'] == 3
          assert report['authority_preserved'] is True
          assert report['boundary_bypass_enabled'] is False
          assert report['external_route_variation_budget'] == 1
          assert report['attempted_missions'] >= 1
          assert report['transport_attempts'] >= 1
          assert report['denial_learning']['schema'] == 'senju-external-denial-learning/v2'
          assert report['guard_feedback']['schema'] == 'senju-guard-denial-feedback/v2'
          assert report['guard_feedback']['boundary_bypass_enabled'] is False
          assert report['guard_feedback']['external_route_variation_budget'] == 1
          assert report['agent_reliability']['schema'] == 'senju-external-agent-reliability/v1'
          for operation in report['operations']:
              assert operation['authority_preserved'] is True
              assert operation['guard_feedback_after']['route_variation_budget'] == 1
              assert operation['guard_feedback_after']['external_route_variation_budget'] == 1
              assert operation['self_tune_variation_plan']['external_route_candidates'] == 1
          print('SENJU_EXTERNAL_RECOVERY_CLOSED_LOOP_VERIFIED')
          PY

      - name: Publish persistent recovery evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: senju-external-recovery-evidence
          retention-days: 30
          if-no-files-found: error
          path: /tmp/senju-external-recovery/
