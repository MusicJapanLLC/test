name: The World Unified Loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - 'automation/codegen/engine/the_world_unified_loop.py'
      - 'automation/codegen/engine/production_state_bootstrap.py'
      - 'automation/codegen/run_the_world_absolute_loop.py'
      - 'automation/codegen/run_the_world_unified_loop.py'
      - 'automation/codegen/the_world_final_contract.py'
      - 'automation/codegen/trust_root_lineage.py'
      - 'automation/codegen/run_discovery_action_failover.py'
      - 'automation/codegen/engine/discovery_*.py'
      - 'automation/codegen/engine/network_policy_expansion.py'
      - 'automation/codegen/meta_state/**'
      - 'automation/codegen/tests/test_the_world_unified_loop.py'
      - 'automation/codegen/tests/test_the_world_final_contract.py'
      - 'automation/codegen/tests/test_trust_root_lineage.py'
      - 'automation/codegen/tests/test_production_state_bootstrap.py'
      - 'automation/codegen/tests/test_discovery_action_failover.py'
      - 'automation/recovery/**'
      - 'automation/security/bounded_security_self_approval.py'
      - 'automation/security/test_bounded_security_self_approval.py'
      - 'security/proposals/production-ten-surface-bundle-20260831.json'
      - 'senju/senju/credential_*.py'
      - 'senju/senju/meta/autonomous_authority_council.py'
      - 'senju/scripts/run_autonomous_authority_council.py'
      - 'senju/scripts/run_authorized_production_worker.py'
      - 'senju/config/world-trust-root-bindings.json'
      - 'senju/config/production-deployment-authorizations.json'
      - 'AUTHORIZED_TEST_TARGETS.json'
      - '.github/workflows/the-world-unified-loop.yml'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: the-world-unified-production-loop
  cancel-in-progress: false

jobs:
  absolute-trust-root-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/employee-onboarding-setup-udm86
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore persistent absolute-loop state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .the-world-runtime/
          key: the-world-unified-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            the-world-unified-${{ github.ref_name }}-
            the-world-unified-

      - name: Verify absolute-loop invariants
        env:
          PYTHONPATH: .:automation/codegen:senju:automation/recovery
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            automation/codegen/tests/test_the_world_unified_loop.py \
            automation/codegen/tests/test_the_world_final_contract.py \
            automation/codegen/tests/test_trust_root_lineage.py \
            automation/codegen/tests/test_production_state_bootstrap.py \
            automation/codegen/tests/test_discovery_capability_leases.py \
            automation/codegen/tests/test_discovery_external_action.py \
            automation/codegen/tests/test_discovery_action_failover.py \
            automation/codegen/tests/test_discovery_replica_continuity.py \
            automation/codegen/tests/test_network_policy_expansion.py \
            automation/security/test_bounded_security_self_approval.py \
            senju/tests/test_autonomous_authority_council.py

      - name: Run one absolute production Trust Root loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PYTHONPATH: .:automation/codegen:senju:automation/recovery
          SENJU_CREDENTIAL_GRANTS_JSON: >-
            [{"grant_id":"the-world-status-current","provider":"github","env_var":"GITHUB_TOKEN","allowed_scopes":["metadata:read","statuses:write"],"required_authority_scope":"service_bearer","max_ttl_seconds":300}]
        run: |
          mkdir -p .the-world-runtime
          # Guard-visible invariant: --require-credentialed-write is enforced unconditionally inside the absolute driver.
          python automation/codegen/run_the_world_absolute_loop.py \
            --repo-root . \
            --state .the-world-runtime \
            --out .the-world-runtime/the_world_absolute_loop.json

      - name: Require the final authorization-first closed loop
        run: |
          test "$(jq -r '.complete' .the-world-runtime/the_world_absolute_loop.json)" = "true"
          test "$(jq -r '.authorization_is_primary' .the-world-runtime/the_world_absolute_loop.json)" = "true"
          test "$(jq -r '.complete' .the-world-runtime/the_world_final_contract.json)" = "true"
          test "$(jq -r '.approved' .the-world-runtime/security-self-approval.json)" = "true"
          test "$(jq -r '.applied' .the-world-runtime/security-self-approval.json)" = "true"
          test "$(jq -r '.authority_decision.allowed' .the-world-runtime/authority-council.json)" = "true"
          test "$(jq -r '.authority.new_root_self_authorization' .the-world-runtime/the_world_unified_loop.json)" = "false"
          test "$(jq -r '.authority.revoked_authority_auto_restore' .the-world-runtime/the_world_unified_loop.json)" = "false"
          test "$(jq -r '.credentialed_external_write.succeeded' .the-world-runtime/the_world_unified_loop.json)" = "true"
          test "$(jq -r '.reachable' .the-world-runtime/external-deployment.json)" = "true"
          test "$(jq -r '.complete' .the-world-runtime/trust-root-lineage.json)" = "true"
          test "$(jq -r '.same_trust_root' .the-world-runtime/trust-root-lineage.json)" = "true"
          test "$(jq -r '.chain_valid' .the-world-runtime/trust-root-lineage.json)" = "true"
          test "$(jq -r '.five_layers_integrated' .the-world-runtime/trust-root-lineage.json)" = "true"
          test "$(jq -r '.authorization_node_index' .the-world-runtime/trust-root-lineage.json)" = "0"
          test "$(jq -r '[.explicit_stage_roots[]] | unique | length' .the-world-runtime/trust-root-lineage.json)" = "1"
          test "$(jq -r '.invariants.unrelated_third_party_root_inheritance' .the-world-runtime/trust-root-lineage.json)" = "false"
          test "$(jq -r '.invariants.raw_credential_propagation' .the-world-runtime/trust-root-lineage.json)" = "false"
          test "$(jq -r '.invariants.security_boundary_broadening_self_approval' .the-world-runtime/trust-root-lineage.json)" = "false"

      - name: Save persistent absolute-loop state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .the-world-runtime/
          key: the-world-unified-${{ github.ref_name }}-${{ github.run_id }}

      - name: Preserve absolute-loop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-world-unified-loop-${{ github.run_id }}
          path: .the-world-runtime/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Production summary
        if: always()
        run: |
          echo "## The World — Absolute Trust Root Loop" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .the-world-runtime/the_world_absolute_loop.json ]; then
            echo "- Complete: $(jq -r '.complete' .the-world-runtime/the_world_absolute_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Trust Root: $(jq -r '.trust_root_id' .the-world-runtime/the_world_absolute_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Authorization primary: $(jq -r '.authorization_is_primary' .the-world-runtime/the_world_absolute_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Five layers: $(jq -c '.five_layers' .the-world-runtime/the_world_absolute_loop.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .the-world-runtime/security-self-approval.json ]; then
            echo "- Bounded Security Self-Approval: $(jq -r '.effect' .the-world-runtime/security-self-approval.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .the-world-runtime/the_world_unified_loop.json ]; then
            echo "- Strategy: $(jq -r '.parameters.strategy' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Pressure: $(jq -r '.parameters.pressure' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- External actions succeeded: $(jq -r '.actions.succeeded // 0' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Persistent replicas: $(jq -r '.final_replicas.replica_count // 0' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Queue items: $(jq -r '.final_queue.item_count // 0' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Credentialed write: $(jq -r '.credentialed_external_write.succeeded' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .the-world-runtime/trust-root-lineage.json ]; then
            echo "- Same Trust Root: $(jq -r '.same_trust_root' .the-world-runtime/trust-root-lineage.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Lineage valid: $(jq -r '.chain_valid' .the-world-runtime/trust-root-lineage.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Lineage hash: $(jq -r '.final_lineage_hash' .the-world-runtime/trust-root-lineage.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
