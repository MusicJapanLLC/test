name: The World Unified Loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - 'automation/codegen/engine/the_world_unified_loop.py'
      - 'automation/codegen/engine/production_state_bootstrap.py'
      - 'automation/codegen/run_the_world_unified_loop.py'
      - 'automation/codegen/the_world_final_contract.py'
      - 'automation/codegen/run_discovery_action_failover.py'
      - 'automation/codegen/engine/discovery_*.py'
      - 'automation/codegen/engine/network_policy_expansion.py'
      - 'automation/codegen/meta_state/**'
      - 'automation/codegen/tests/test_the_world_unified_loop.py'
      - 'automation/codegen/tests/test_the_world_final_contract.py'
      - 'automation/codegen/tests/test_production_state_bootstrap.py'
      - 'automation/codegen/tests/test_discovery_action_failover.py'
      - 'automation/recovery/**'
      - 'senju/senju/credential_*.py'
      - 'senju/senju/meta/autonomous_authority_council.py'
      - 'senju/scripts/run_autonomous_authority_council.py'
      - 'senju/scripts/run_authorized_production_worker.py'
      - 'senju/config/world-trust-root-bindings.json'
      - 'senju/config/production-deployment-authorizations.json'
      - 'AUTHORIZED_TEST_TARGETS.json'
      - '.github/workflows/the-world-unified-loop.yml'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: the-world-unified-production-loop
  cancel-in-progress: false

jobs:
  unified-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/employee-onboarding-setup-udm86
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore persistent unified-loop state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .the-world-runtime/
          key: the-world-unified-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            the-world-unified-${{ github.ref_name }}-
            the-world-unified-

      - name: Verify unified loop invariants
        env:
          PYTHONPATH: automation/codegen:senju
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            automation/codegen/tests/test_the_world_unified_loop.py \
            automation/codegen/tests/test_the_world_final_contract.py \
            automation/codegen/tests/test_production_state_bootstrap.py \
            automation/codegen/tests/test_discovery_capability_leases.py \
            automation/codegen/tests/test_discovery_external_action.py \
            automation/codegen/tests/test_discovery_action_failover.py \
            automation/codegen/tests/test_discovery_replica_continuity.py \
            automation/codegen/tests/test_network_policy_expansion.py \
            senju/tests/test_autonomous_authority_council.py

      - name: Refresh production self-tuning state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STOP_LEARNING_STATE_FILE: .the-world-runtime/stop-learning-state.json
          PYTHONPATH: automation/recovery
        run: |
          mkdir -p .the-world-runtime
          python automation/recovery/stop_learning_runner.py | tee .the-world-runtime/stop-learning-run.json

      - name: Autonomous Authority Council authorizes inside explicit Owner envelope
        env:
          PYTHONPATH: senju
        run: |
          mkdir -p .the-world-runtime
          python senju/scripts/run_autonomous_authority_council.py \
            --repo-root . \
            --out .the-world-runtime/authority-council.json
          test "$(jq -r '.authority_decision.allowed' .the-world-runtime/authority-council.json)" = "true"
          test "$(jq -r '.ai_council.effect' .the-world-runtime/authority-council.json)" = "allow"
          test "$(jq -r '.ai_council.per_host_manual_reapproval_required' .the-world-runtime/authority-council.json)" = "false"
          test "$(jq -r '.invariants.hard_deny_override' .the-world-runtime/authority-council.json)" = "false"
          test "$(jq -r '.invariants.revocation_override' .the-world-runtime/authority-council.json)" = "false"

      - name: Run unified Self-Tuning -> Authority -> Action -> Persistence -> Recovery loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PYTHONPATH: automation/codegen:senju
          SENJU_CREDENTIAL_GRANTS_JSON: >-
            [{"grant_id":"the-world-status-current","provider":"github","env_var":"GITHUB_TOKEN","allowed_scopes":["metadata:read","statuses:write"],"required_authority_scope":"service_bearer","max_ttl_seconds":300}]
        run: |
          python automation/codegen/run_the_world_unified_loop.py \
            --state .the-world-runtime \
            --repo-root . \
            --tuning-state .the-world-runtime/stop-learning-state.json \
            --require-credentialed-write \
            --json-out .the-world-runtime/the_world_unified_loop.json

      - name: Learn failures and retry alternate same-authority routes
        env:
          PYTHONPATH: automation/codegen:senju
        run: |
          python automation/codegen/run_discovery_action_failover.py \
            --state .the-world-runtime \
            --repo-root . \
            --max-actions 8 \
            --json-out .the-world-runtime/discovery_action_failover_run.json

      - name: Owner-authorized external deployment continuity action
        env:
          PYTHONPATH: senju
        run: |
          python senju/scripts/run_authorized_production_worker.py \
            --repo-root . \
            --state-dir .the-world-runtime/deployment-worker \
            --target-host kabeya-authorized-test-range.onrender.com \
            --authority-reference canonical:kabeya-authorized-test-range \
            --desired-revision "${GITHUB_SHA}" \
            --action deploy \
            --worker-id "THE-WORLD-UNIFIED-${GITHUB_RUN_ID}" \
            --output .the-world-runtime/external-deployment.json
          test "$(jq -r '.environment' .the-world-runtime/external-deployment.json)" = "production"
          test "$(jq -r '.reachable' .the-world-runtime/external-deployment.json)" = "true"
          test "$(jq -r '.authority_expanded' .the-world-runtime/external-deployment.json)" = "false"
          test "$(jq -r '.raw_credential_inherited' .the-world-runtime/external-deployment.json)" = "false"

      - name: Require full closed-loop completion
        run: |
          test "$(jq -r '.closed_loop' .the-world-runtime/the_world_unified_loop.json)" = "true"
          test "$(jq -r '.runtime_bootstrap.authority_source' .the-world-runtime/the_world_unified_loop.json)" = "trusted_production_checkout"
          test "$(jq -r '.runtime_bootstrap.required_files_present' .the-world-runtime/the_world_unified_loop.json)" = "true"
          test "$(jq -r '.runtime_bootstrap.generated_authority_imported' .the-world-runtime/the_world_unified_loop.json)" = "false"
          test "$(jq -r '.credentialed_external_write.succeeded' .the-world-runtime/the_world_unified_loop.json)" = "true"
          test "$(jq -r '.authority.new_root_self_authorization' .the-world-runtime/the_world_unified_loop.json)" = "false"
          test "$(jq -r '.authority.revoked_authority_auto_restore' .the-world-runtime/the_world_unified_loop.json)" = "false"
          test "$(jq -r '.closed_loop' .the-world-runtime/discovery_action_failover_run.json)" = "true"
          test "$(jq -r '.boundary_denial_bypass' .the-world-runtime/discovery_action_failover_run.json)" = "false"
          test "$(jq -r '.authority_decision.allowed' .the-world-runtime/authority-council.json)" = "true"
          test "$(jq -r '.reachable' .the-world-runtime/external-deployment.json)" = "true"
          test -s .the-world-runtime/the_world_unified_loop_heartbeat.json
          echo "leases=$(jq -r '.final_lease.lease_count // 0' .the-world-runtime/the_world_unified_loop.json)"
          echo "replicas=$(jq -r '.final_replicas.replica_count // 0' .the-world-runtime/the_world_unified_loop.json)"
          echo "actions=$(jq -r '.actions.succeeded // 0' .the-world-runtime/the_world_unified_loop.json)"
          echo "failover_success=$(jq -r '.failover.succeeded // 0' .the-world-runtime/discovery_action_failover_run.json)"
          echo "boundary_denials_learned=$(jq -r '.failover.boundary_denials_learned // 0' .the-world-runtime/discovery_action_failover_run.json)"
          echo "queue=$(jq -r '.final_queue.item_count // 0' .the-world-runtime/the_world_unified_loop.json)"
          echo "deployment_http=$(jq -r '.http_status // 0' .the-world-runtime/external-deployment.json)"

      - name: Enforce final five-layer Trust Root contract
        run: |
          python automation/codegen/the_world_final_contract.py \
            --loop .the-world-runtime/the_world_unified_loop.json \
            --registry automation/recovery/approved_persistence_registry.json \
            --council .the-world-runtime/authority-council.json \
            --deployment .the-world-runtime/external-deployment.json \
            --out .the-world-runtime/the_world_final_contract.json
          test "$(jq -r '.complete' .the-world-runtime/the_world_final_contract.json)" = "true"
          test "$(jq -r '.authorization_is_primary' .the-world-runtime/the_world_final_contract.json)" = "true"
          test "$(jq -r '.checks.runtime_owner_state_bootstrapped' .the-world-runtime/the_world_final_contract.json)" = "true"
          test "$(jq -r '.checks.autonomous_authority_council_operational' .the-world-runtime/the_world_final_contract.json)" = "true"
          test "$(jq -r '.checks.owner_authorized_external_deployment_operational' .the-world-runtime/the_world_final_contract.json)" = "true"
          test "$(jq -r '[.layers[] | .integrated] | all' .the-world-runtime/the_world_final_contract.json)" = "true"

      - name: Save persistent unified-loop state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .the-world-runtime/
          key: the-world-unified-${{ github.ref_name }}-${{ github.run_id }}

      - name: Preserve unified-loop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-world-unified-loop-${{ github.run_id }}
          path: .the-world-runtime/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Production summary
        if: always()
        run: |
          echo "## The World Unified Loop" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .the-world-runtime/the_world_unified_loop.json ]; then
            echo "- Closed loop: $(jq -r '.closed_loop' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Runtime owner bootstrap: $(jq -r '.runtime_bootstrap.authority_source // "missing"' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Strategy: $(jq -r '.parameters.strategy' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Pressure: $(jq -r '.parameters.pressure' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- External actions succeeded: $(jq -r '.actions.succeeded // 0' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Persistent replicas: $(jq -r '.final_replicas.replica_count // 0' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Credentialed external write: $(jq -r '.credentialed_external_write.succeeded' .the-world-runtime/the_world_unified_loop.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .the-world-runtime/authority-council.json ]; then
            echo "- Autonomous Authority Council: $(jq -r '.ai_council.effect // "missing"' .the-world-runtime/authority-council.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .the-world-runtime/external-deployment.json ]; then
            echo "- Owner-authorized external deployment reachable: $(jq -r '.reachable // false' .the-world-runtime/external-deployment.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .the-world-runtime/discovery_action_failover_run.json ]; then
            echo "- Same-authority failover succeeded: $(jq -r '.failover.succeeded // 0' .the-world-runtime/discovery_action_failover_run.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Boundary denials learned (not bypassed): $(jq -r '.failover.boundary_denials_learned // 0' .the-world-runtime/discovery_action_failover_run.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .the-world-runtime/the_world_final_contract.json ]; then
            echo "- Final contract complete: $(jq -r '.complete' .the-world-runtime/the_world_final_contract.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Authorization primary: $(jq -r '.authorization_is_primary' .the-world-runtime/the_world_final_contract.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Five layers integrated: $(jq -r '[.layers[] | .integrated] | all' .the-world-runtime/the_world_final_contract.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
