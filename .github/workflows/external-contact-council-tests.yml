name: External Contact Council Tests

on:
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/external_contact_council.py'
      - 'senju/senju/external_contact_pressure.py'
      - 'senju/scripts/external_contact_pressure_campaign.py'
      - 'senju/tests/test_external_contact_council.py'
      - 'senju/EXTERNAL_CONTACT_COUNCIL.md'
      - '.github/workflows/external-contact-council-tests.yml'
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - 'senju/senju/external_contact_council.py'
      - 'senju/senju/external_contact_pressure.py'
      - 'senju/scripts/external_contact_pressure_campaign.py'
      - 'senju/tests/test_external_contact_council.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Verify council and pressure bus
        env:
          PYTHONPATH: senju:automation/codegen
        run: |
          python -m pytest -q senju/tests/test_external_contact_council.py senju/tests/test_external_contact.py
          python -m py_compile senju/senju/external_contact_council.py senju/senju/external_contact_pressure.py senju/scripts/external_contact_pressure_campaign.py
      - name: Materialize all-agent pressure campaign
        run: python senju/scripts/external_contact_pressure_campaign.py --state-dir /tmp/senju-contact-pressure --output security-reports/external-contact-pressure-campaign.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-contact-pressure-${{ github.run_id }}
          path: security-reports/external-contact-pressure-campaign.json
          retention-days: 14
