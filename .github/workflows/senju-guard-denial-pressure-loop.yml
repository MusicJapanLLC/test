name: Senju Guard Denial Pressure Loop

on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - "claude/employee-onboarding-setup-udm86"
    paths:
      - "senju/senju/guard_denial_feedback.py"
      - "senju/senju/guard_denial_pressure_loop.py"
      - "senju/senju/external_denial_learning.py"
      - "senju/senju/external.py"
      - "senju/tests/test_guard_denial_feedback.py"
      - "senju/tests/test_guard_denial_pressure_loop.py"
      - ".github/workflows/senju-guard-denial-pressure-loop.yml"
  pull_request:
    branches:
      - "claude/employee-onboarding-setup-udm86"
    paths:
      - "senju/senju/guard_denial_feedback.py"
      - "senju/senju/guard_denial_pressure_loop.py"
      - "senju/senju/external_denial_learning.py"
      - "senju/senju/external.py"
      - "senju/tests/test_guard_denial_feedback.py"
      - "senju/tests/test_guard_denial_pressure_loop.py"
      - ".github/workflows/senju-guard-denial-pressure-loop.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: senju-guard-denial-pressure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify pressure orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD SINGULARITY workflow.")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Verify denial pressure, route envelope, and hard-stop behavior
        working-directory: senju
        run: >-
          python -m pytest
          tests/test_guard_denial_feedback.py
          tests/test_guard_denial_pressure_loop.py
          tests/test_external_denial_learning.py
          -q

      - name: Compile production pressure modules
        run: >-
          python -m py_compile
          senju/senju/guard_denial_feedback.py
          senju/senju/guard_denial_pressure_loop.py
          senju/senju/external_denial_learning.py
          senju/senju/external.py

  live-pressure-loop:
    name: denial -> pressure -> bounded variation -> learn -> persist
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Restore previous denial pressure memory
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-guard-pressure /tmp/senju-guard-pressure-prev
          PREV_RUN="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju Guard Denial Pressure Loop" \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV_RUN" ]]; then
            gh run download "$PREV_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name senju-guard-denial-pressure-evidence \
              --dir /tmp/senju-guard-pressure-prev || true
          fi
          if [[ -f /tmp/senju-guard-pressure-prev/guard-denial-pressure-memory.json ]]; then
            cp /tmp/senju-guard-pressure-prev/guard-denial-pressure-memory.json /tmp/senju-guard-pressure/denial-in.json
          fi

      - name: Run production guard denial pressure loop
        working-directory: senju
        run: |
          set -euo pipefail
          ARGS=(
            --out /tmp/senju-guard-pressure/guard-denial-pressure-report.json
            --denial-out /tmp/senju-guard-pressure/guard-denial-pressure-memory.json
            --max-missions 3
          )
          [[ -f /tmp/senju-guard-pressure/denial-in.json ]] && ARGS+=(--denial-memory /tmp/senju-guard-pressure/denial-in.json)
          set +e
          python -m senju.guard_denial_pressure_loop "${ARGS[@]}" | tee /tmp/senju-guard-pressure/stdout.txt
          RC=${PIPESTATUS[0]}
          set -e
          if [[ "$RC" -ne 0 && "$RC" -ne 2 ]]; then
            exit "$RC"
          fi

      - name: Verify production pressure evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/senju-guard-pressure/guard-denial-pressure-report.json').read_text())
          assert report['schema'] == 'senju-guard-denial-pressure-loop/v1'
          assert report['production_mode'] is True
          assert report['self_initiated'] is True
          assert report['denied_as_normal_failure'] is True
          assert report['max_agent_variants'] == 16
          assert report['max_route_variants'] == 4
          assert report['max_recovery_rounds'] == 4
          assert report['max_transport_attempts'] == 32
          assert report['boundary_bypass_enabled'] is False
          assert report['attempted_missions'] >= 1
          for operation in report['operations']:
              plan = operation['pressure_plan']
              assert plan['route_variants_must_be_preapproved'] is True
              assert plan['route_discovery_from_denial'] is False
              assert plan['same_authority_scope'] is True
              assert plan['same_protocol'] is True
              assert plan['same_method'] is True
              assert plan['same_credential_scope'] is True
              assert plan['boundary_bypass_enabled'] is False
              assert operation['transport_attempts'] <= 32
              assert operation['authority_envelope']['authority_preserved'] is True
          print('SENJU_GUARD_DENIAL_PRESSURE_LOOP_VERIFIED')
          PY

      - name: Publish persistent denial pressure evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: senju-guard-denial-pressure-evidence
          retention-days: 30
          if-no-files-found: error
          path: /tmp/senju-guard-pressure/
