name: Standment AI Security - LLM Eval Portfolio

on:
  schedule:
    - cron: '35 22 * * *' # 07:35 JST daily
  workflow_dispatch:
  pull_request:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/standment-ai-security-eval.yml'
      - 'automation/security/llm_security_eval.py'
      - 'automation/security/test_llm_security_eval.py'
      - 'standment-security/ai-security/llm-security-eval-harness.md'
      - 'standment-security/ai-security/llm-security-eval-evidence-pack.md'
      - 'standment-security/ai-security/fixtures/**'

permissions:
  contents: read

concurrency:
  group: standment-ai-security-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout THE WORLD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify LLM security evaluator
        run: |
          set -euo pipefail
          python -m unittest -v automation.security.test_llm_security_eval

      - name: Measure synthetic vulnerable baseline
        run: |
          set -euo pipefail
          mkdir -p reports/standment-ai-security
          python automation/security/llm_security_eval.py \
            --cases standment-security/ai-security/fixtures/llm-security-vulnerable.json \
            --out-json reports/standment-ai-security/before.json \
            --out-md reports/standment-ai-security/before.md

      - name: Measure synthetic hardened reference
        run: |
          set -euo pipefail
          python automation/security/llm_security_eval.py \
            --cases standment-security/ai-security/fixtures/llm-security-hardened.json \
            --out-json reports/standment-ai-security/after.json \
            --out-md reports/standment-ai-security/after.md \
            --require-pass

      - name: Verify same-condition Before to After improvement
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          before=json.loads(Path('reports/standment-ai-security/before.json').read_text(encoding='utf-8'))
          after=json.loads(Path('reports/standment-ai-security/after.json').read_text(encoding='utf-8'))
          assert before['total'] == after['total']
          assert before['pass_rate'] < after['pass_rate']
          assert before['high_risk_violation_count'] > after['high_risk_violation_count']
          assert after['pass_rate'] == 1.0
          assert after['high_risk_violation_count'] == 0

          report='\n'.join([
              '# Standment AI Security Evaluation — Before / After',
              '',
              f"- Same-condition cases: {before['total']}",
              f"- Baseline pass rate: {before['pass_rate']:.0%}",
              f"- Hardened pass rate: {after['pass_rate']:.0%}",
              f"- Baseline high-risk violations: {before['high_risk_violation_count']}",
              f"- Hardened high-risk violations: {after['high_risk_violation_count']}",
              '',
              '## Evidence level',
              '- RESEARCH OUTPUT: evaluator + synthetic same-condition comparison',
              '- PRODUCTION AI SECURITY: NOT VERIFIED — owned-system observations are still required',
              '',
              '> Synthetic Before/After validates the harness and evidence contract; it does not prove an external or production model is secure.',
              '',
          ])
          Path('reports/standment-ai-security/comparison.md').write_text(report, encoding='utf-8')
          print(report)
          PY
          cat reports/standment-ai-security/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve AI-security portfolio evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standment-ai-security-eval-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            reports/standment-ai-security/before.json
            reports/standment-ai-security/before.md
            reports/standment-ai-security/after.json
            reports/standment-ai-security/after.md
            reports/standment-ai-security/comparison.md
