name: Senju Self-Development CI

on:
  push:
    paths:
      - "senju/senju/lab_planner.py"
      - "senju/scripts/self_code_gen.py"
      - "senju/tests/test_lab_planner_v2.py"
      - ".github/workflows/senju-self-develop.yml"
      - ".github/workflows/senju-self-develop-ci.yml"
  pull_request:
    paths:
      - "senju/senju/lab_planner.py"
      - "senju/scripts/self_code_gen.py"
      - "senju/tests/test_lab_planner_v2.py"
      - ".github/workflows/senju-self-develop.yml"
      - ".github/workflows/senju-self-develop-ci.yml"

permissions:
  contents: read

concurrency:
  group: senju-self-develop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  planner-contract:
    name: Determinism + idempotency + dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/senju

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          # Extract latest directive for env export
          top_target = "none"
          strategy = "coverage_expansion"
          coverage_gaps = ""
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True):
              c = e.get("content", {})
              if c.get("top_target") and c["top_target"] != "none":
                  top_target = c["top_target"]
                  strategy = c.get("strategy", strategy)
                  gaps = c.get("coverage_gaps", [])
                  coverage_gaps = ",".join(gaps[:5]) if gaps else ""
                  break
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD workflow.")
          # Write to GITHUB_ENV so downstream steps can consume GOD directives
          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"GOD_TOP_TARGET={top_target}\n")
                  f.write(f"GOD_STRATEGY={strategy}\n")
                  f.write(f"GOD_COVERAGE_GAPS={coverage_gaps}\n")
                  f.write(f"GOD_ENTRIES={total}\n")
              print(f"  → Exported: GOD_TOP_TARGET={top_target} GOD_STRATEGY={strategy}")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test dependency with layout compatibility
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f senju/pyproject.toml || -f senju/setup.py ]]; then
            python -m pip install -e './senju[dev]'
          else
            python -m pip install pytest
          fi

      - name: Run planner regression suite
        working-directory: senju
        run: python -m pytest tests/test_lab_planner_v2.py -q

      - name: Exercise self-code generator without writes to GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-ci-labs
          cat > /tmp/evolution-summary.json <<'JSON'
          {
            "vuln_class_hits": {},
            "vuln_class_elo": {}
          }
          JSON

          python senju/scripts/self_code_gen.py \
            --summary /tmp/evolution-summary.json \
            --labs-dir /tmp/senju-ci-labs \
            --max-manifests 3 \
            --dry-run \
            --report-json /tmp/self-code-gen-report.json

      - name: Validate dry-run evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/self-code-gen-report.json').read_text())
          assert report['schema'] == 'senju-self-code-gen/v2'
          assert report['dry_run'] is True
          assert report['generated_count'] > 0
          assert report['pr'] is None
          assert report['deduplicated'] is False
          assert len(report['campaign_fingerprint']) == 64

          manifests = sorted(Path('/tmp/senju-ci-labs').glob('*.json'))
          assert manifests
          for path in manifests:
              payload = json.loads(path.read_text())
              assert payload['schema'] == 'senju-auto-lab/v3'
              assert payload['host'] is None
              assert len(payload['fingerprint']) == 64

          print(f"validated {len(manifests)} deterministic local-lab manifests")
