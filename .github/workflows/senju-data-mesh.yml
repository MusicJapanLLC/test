name: Senju Data Mesh — Unified Intelligence Hub

# Runs on a bounded schedule, merges all evidence into Senju state,
# then triggers the self-development loop to re-plan with fresh data.
# Deliberately avoids workflow_run because this workflow has write permissions;
# schedule/manual dispatch prevents an upstream workflow from becoming a
# privilege-escalation trigger into this aggregation lane.
on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch:

concurrency:
  group: senju-data-mesh
  cancel-in-progress: false

jobs:
  aggregate-and-feed:
    name: Collect all evidence → merge → Senju state → trigger self-develop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write  # needed to trigger workflow_dispatch

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download adversary-full-join artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/adversary
          RUN=$(gh run list --repo "$REPO" \
            --workflow "Senju Adversary Full Join" \
            --status success --limit 3 \
            --json databaseId --jq '.[0].databaseId // empty' || true)
          if [[ -n "$RUN" ]]; then
            gh run download "$RUN" --repo "$REPO" --dir /tmp/mesh/adversary || true
            echo "Adversary artifacts from run $RUN"
          else
            echo "No adversary run found"
          fi

      - name: Download blitz artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/blitz
          for RUN in $(gh run list --repo "$REPO" \
            --workflow "Senju Blitz — Parallel Adversary Surge" \
            --status success --limit 5 \
            --json databaseId --jq '.[].databaseId' || true); do
            gh run download "$RUN" --repo "$REPO" --dir /tmp/mesh/blitz || true
          done
          echo "Blitz artifacts downloaded"

      - name: Download live-opposition artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/opposition
          RUN=$(gh run list --repo "$REPO" \
            --workflow "Senju Live Opposition Force" \
            --status success --limit 3 \
            --json databaseId --jq '.[0].databaseId // empty' || true)
          if [[ -n "$RUN" ]]; then
            gh run download "$RUN" --repo "$REPO" --dir /tmp/mesh/opposition || true
            echo "Opposition artifacts from run $RUN"
          else
            echo "No opposition run found"
          fi

      - name: Download nuclei-scan artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/nuclei
          RUN=$(gh run list --repo "$REPO" \
            --workflow "Senju Real Scan — Nuclei against own endpoints" \
            --status success --limit 3 \
            --json databaseId --jq '.[0].databaseId // empty' || true)
          if [[ -n "$RUN" ]]; then
            gh run download "$RUN" --repo "$REPO" --dir /tmp/mesh/nuclei || true
            echo "Nuclei artifacts from run $RUN"
          else
            echo "No nuclei run found"
          fi

      - name: Merge all intelligence into Senju state
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=senju python senju/scripts/data_mesh.py \
            --adversary-dir /tmp/mesh/adversary \
            --blitz-dir /tmp/mesh/blitz \
            --opposition-dir /tmp/mesh/opposition \
            --nuclei-dir /tmp/mesh/nuclei \
            --state senju/state/last-evolution-summary.json

      - name: Commit updated Senju state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senju/state/last-evolution-summary.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore(senju): data mesh state update [skip ci]"
            gh auth setup-git
            git push origin HEAD:claude/employee-onboarding-setup-udm86
          fi

      - name: Trigger self-development loop
        shell: bash
        run: |
          gh workflow run senju-self-develop.yml \
            --repo "$REPO" \
            --ref claude/employee-onboarding-setup-udm86 || true

      - name: Conditionally trigger autonomous improver
        shell: bash
        run: |
          HITS=$(python3 -c "
import json, pathlib
p = pathlib.Path('senju/state/last-evolution-summary.json')
if p.exists():
    d = json.loads(p.read_text())
    print(sum(d.get('vuln_class_hits', {}).values()))
else:
    print(0)
" 2>/dev/null || echo 0)
          echo "Total vuln class hits: $HITS"
          if (( HITS >= 5 )); then
            gh workflow run senju-autonomous-improver.yml \
              --repo "$REPO" \
              --ref claude/employee-onboarding-setup-udm86 || true
          fi

  auto-retry-failed-workflows:
    name: Auto-retry any failed Senju workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Re-run recently failed Senju workflows
        shell: bash
        run: |
          SENJU_WORKFLOWS=(
            "Senju Adversary Full Join"
            "Senju Autonomous Self-Development Loop"
            "Senju Real Scan — Nuclei against own endpoints"
            "Senju GitHub Native Autonomous Improver"
            "Senju Blitz — Parallel Adversary Surge"
          )
          for WF in "${SENJU_WORKFLOWS[@]}"; do
            FAILED_ID=$(gh run list --repo "$REPO" \
              --workflow "$WF" --status failure --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty' || true)
            if [[ -n "$FAILED_ID" ]]; then
              echo "Re-running failed run $FAILED_ID for: $WF"
              gh run rerun "$FAILED_ID" --repo "$REPO" || true
            fi
          done
