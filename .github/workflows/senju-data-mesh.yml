name: Senju Data Mesh — Unified Intelligence Hub

# Read-only evidence aggregation lane. Privileged state promotion, workflow dispatch,
# retries, and external delivery belong to their separately governed workflows.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: senju-data-mesh
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  aggregate-evidence:
    name: Collect evidence → build bounded Senju summary artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Load GOD Knowledge
        run: |
          GOD_BRANCH="claude/supreme-ai-development-06vi1t"
          git fetch origin "$GOD_BRANCH" --depth=1 2>/dev/null || true
          mkdir -p knowledge automation/unified-knowledge
          git show "origin/$GOD_BRANCH:knowledge/god-registry.json" \
            > knowledge/god-registry.json 2>/dev/null || \
            printf '{"schema":"god-knowledge-registry/v1","entries":[],"total_entries":0}' \
            > knowledge/god-registry.json
          git show "origin/$GOD_BRANCH:automation/unified-knowledge/senju_knowledge_query.py" \
            > automation/unified-knowledge/senju_knowledge_query.py 2>/dev/null || true
          python3 << 'PYEOF'
          import json
          from pathlib import Path
          registry = json.loads(Path("knowledge/god-registry.json").read_text())
          entries = registry.get("entries", [])
          total = registry.get("total_entries", len(entries))
          last = registry.get("last_updated") or "never"
          print(f"📚 GOD Knowledge: {total} entries | last: {last}")
          for e in sorted(entries, key=lambda x: x.get("created_at",""), reverse=True)[:5]:
              meta = e.get("meta_learning", {})
              print(f"  [{e.get('created_at','')[:10]}] {e.get('created_by_agent','?')}: {e.get('content',{}).get('title','?')}")
              if meta.get("omniscience"): print(f"    omniscience={meta['omniscience']} | omnipotence={meta.get('omnipotence','?')}")
              if meta.get("reward_trend"): print(f"    reward_trend={meta['reward_trend']}")
          if not entries: print("  → No GOD knowledge yet. Trigger THE WORLD GOD SINGULARITY workflow.")
          PYEOF
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download adversary-full-join artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/adversary
          RUN=$(gh run list --repo "$REPO" \
            --workflow "Senju Adversary Full Join" \
            --status success --limit 3 \
            --json databaseId --jq '.[0].databaseId // empty' || true)
          if [[ -n "$RUN" ]]; then
            gh run download "$RUN" --repo "$REPO" --dir /tmp/mesh/adversary || true
          fi

      - name: Download blitz artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/blitz
          for RUN in $(gh run list --repo "$REPO" \
            --workflow "Senju Blitz — Parallel Adversary Surge" \
            --status success --limit 5 \
            --json databaseId --jq '.[].databaseId' || true); do
            gh run download "$RUN" --repo "$REPO" --dir /tmp/mesh/blitz || true
          done

      - name: Download live-opposition artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/opposition
          RUN=$(gh run list --repo "$REPO" \
            --workflow "Senju Live Opposition Force" \
            --status success --limit 3 \
            --json databaseId --jq '.[0].databaseId // empty' || true)
          if [[ -n "$RUN" ]]; then
            gh run download "$RUN" --repo "$REPO" --dir /tmp/mesh/opposition || true
          fi

      - name: Download nuclei-scan artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/nuclei
          RUN=$(gh run list --repo "$REPO" \
            --workflow "Senju Real Scan — Nuclei against own endpoints" \
            --status success --limit 3 \
            --json databaseId --jq '.[0].databaseId // empty' || true)
          if [[ -n "$RUN" ]]; then
            gh run download "$RUN" --repo "$REPO" --dir /tmp/mesh/nuclei || true
          fi

      - name: Merge intelligence into bounded working summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh/out
          cp senju/state/last-evolution-summary.json /tmp/mesh/out/summary.json 2>/dev/null || printf '{}\n' > /tmp/mesh/out/summary.json
          PYTHONPATH=senju python senju/scripts/data_mesh.py \
            --adversary-dir /tmp/mesh/adversary \
            --blitz-dir /tmp/mesh/blitz \
            --opposition-dir /tmp/mesh/opposition \
            --nuclei-dir /tmp/mesh/nuclei \
            --state /tmp/mesh/out/summary.json
          python -m json.tool /tmp/mesh/out/summary.json >/dev/null

      - name: Upload data-mesh evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-data-mesh-${{ github.run_id }}
          path: /tmp/mesh/out/summary.json
          if-no-files-found: error
          retention-days: 7
