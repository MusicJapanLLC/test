"pos":"word","examples":[]},{"id":"w977","ar":"양말","en":"socks","ja":"靴下","ipa":"靴下","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w978","ar":"장갑","en":"gloves","ja":"手袋","ipa":"手袋","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w979","ar":"목도리","en":"scarf","ja":"マフラー","ipa":"マフラー","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w980","ar":"안경","en":"glasses","ja":"眼鏡","ipa":"眼鏡","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w981","ar":"우산","en":"umbrella","ja":"傘","ipa":"傘","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w982","ar":"지갑","en":"wallet","ja":"財布","ipa":"財布","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w983","ar":"하나","en":"one (native Korean)","ja":"ひとつ","ipa":"ひとつ","latin":"","topic":"things","pos":"word","examples":["l04-04"]},{"id":"w984","ar":"둘","en":"two (native Korean)","ja":"ふたつ","ipa":"ふたつ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w985","ar":"셋","en":"three (native Korean)","ja":"みっつ","ipa":"みっつ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w986","ar":"넷","en":"four (native Korean)","ja":"よっつ","ipa":"よっつ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w987","ar":"다섯","en":"five (native Korean)","ja":"いつつ","ipa":"いつつ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w988","ar":"여섯","en":"six (native Korean)","ja":"むっつ","ipa":"むっつ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w989","ar":"일곱","en":"seven (native Korean)","ja":"ななつ","ipa":"ななつ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w990","ar":"여덟","en":"eight (native Korean)","ja":"やっつ","ipa":"やっつ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w991","ar":"아홉","en":"nine (native Korean)","ja":"ここのつ","ipa":"ここのつ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w992","ar":"열둘","en":"twelve (native Korean)","ja":"十二","ipa":"十二","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w993","ar":"백","en":"hundred","ja":"百","ipa":"百","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w994","ar":"천","en":"thousand","ja":"千","ipa":"千","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w995","ar":"만","en":"ten thousand","ja":"万","ipa":"万","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w996","ar":"반","en":"half","ja":"半分","ipa":"半分","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w997","ar":"전부","en":"all; everything","ja":"全部","ipa":"全部","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w998","ar":"일부","en":"part; some","ja":"一部","ipa":"一部","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w999","ar":"각각","en":"each; separately","ja":"それぞれ","ipa":"それぞれ","latin":"","topic":"things","pos":"word","examples":[]},{"id":"w1000","ar":"정도","en":"degree; approximately","ja":"程度・くらい","ipa":"程度・くらい","latin":"","topic":"things","pos":"word","examples":[]}],"lessons":[{"id":"l01","number":1,"title":"First reactions","goal":"Say the things you actually say","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"気持ちの勢いは残し、丁寧さと場面を分ける","level":"Foundation","lines":[{"id":"l01-01","ar":"정말 재미있어요!","en":"This is really fun.","ja":"めっちゃ楽しい","ipa":"めっちゃ楽しい","latin":"","forms":{"casual":"진짜 재미있어!","polite":"정말 재미있어요!","formal":"정말 재미있습니다!"},"note":"진짜 is conversational; 정말 works across more settings.","provenance":"Adapted · this app request"},{"id":"l01-02","ar":"이거 최고예요.","en":"This is the best.","ja":"これ、最高","ipa":"これ、最高","latin":"","forms":{"casual":"이거 최고야.","polite":"이거 최고예요.","formal":"이것은 최고입니다."},"note":"The formal version is deliberately more presentation-like.","provenance":"Adapted · this app request"},{"id":"l01-03","ar":"잠깐만 기다려 주세요.","en":"Please wait a moment.","ja":"ちょっと待って","ipa":"ちょっと待って","latin":"","forms":{"casual":"잠깐만 기다려 줘.","polite":"잠깐만 기다려 주세요.","formal":"잠시만 기다려 주시겠습니까?"},"note":"Use the casual request only with an agreed casual-speaking partner.","provenance":"Supporting practice"},{"id":"l01-04","ar":"정말이에요?","en":"Really?","ja":"本当に？","ipa":"本当に？","latin":"","forms":{"casual":"진짜야?","polite":"정말이에요?","formal":"정말입니까?"},"note":"Rising intonation makes the question clear.","provenance":"Supporting practice"},{"id":"l01-05","ar":"이제 이해했어요.","en":"I understand now.","ja":"理解できた","ipa":"理解できた","latin":"","forms":{"casual":"이제 이해했어.","polite":"이제 이해했어요.","formal":"이제 이해했습니다."},"note":"Understanding is not the same as agreeing.","provenance":"Supporting practice"},{"id":"l01-06","ar":"한 번 더 말씀해 주세요.","en":"Please say that again.","ja":"もう一回言って","ipa":"もう一回言って","latin":"","forms":{"casual":"한 번 더 말해 줘.","polite":"한 번 더 말씀해 주세요.","formal":"한 번 더 말씀해 주시겠습니까?"},"note":"말씀 respects the other person's speech, not your own action here.","provenance":"Supporting practice"},{"id":"l01-07","ar":"좋은 생각이 났어요.","en":"I just had a good idea.","ja":"いいアイデアを思いついた","ipa":"いいアイデアを思いついた","latin":"","forms":{"casual":"좋은 생각이 났어.","polite":"좋은 생각이 났어요.","formal":"좋은 생각이 났습니다."},"note":"A complete, short reaction instead of a literal word-for-word translation.","provenance":"Adapted · this app request"},{"id":"l01-08","ar":"더 계속하고 싶어요.","en":"I want to keep going.","ja":"もっと続けたい","ipa":"もっと続けたい","latin":"","forms":{"casual":"더 계속하고 싶어.","polite":"더 계속하고 싶어요.","formal":"더 계속하고 싶습니다."},"note":"This states your wish rather than ordering the other person.","provenance":"Adapted · this app request"}]},{"id":"l02","number":2,"title":"First hello","goal":"Open a new conversation","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"初対面はPoliteが初期設定　自己紹介と相手への敬意を分ける","level":"Foundation","lines":[{"id":"l02-01","ar":"안녕하세요.","en":"Hello.","ja":"こんにちは","ipa":"こんにちは","latin":"","forms":{"casual":"안녕.","polite":"안녕하세요.","formal":"안녕하십니까?"},"note":"안녕 is casual; do not use it as the default with a stranger.","provenance":"Supporting practice"},{"id":"l02-02","ar":"만나서 반가워요.","en":"I'm glad to meet you.","ja":"会えて嬉しい","ipa":"会えて嬉しい","latin":"","forms":{"casual":"만나서 반가워.","polite":"만나서 반가워요.","formal":"만나서 반갑습니다."},"note":"The formal version fits a first business introduction.","provenance":"Supporting practice"},{"id":"l02-03","ar":"저는 토모키예요.","en":"I'm Tomoki.","ja":"僕はトモキ","ipa":"僕はトモキ","latin":"","forms":{"casual":"나는 토모키야.","polite":"저는 토모키예요.","formal":"저는 토모키입니다."},"note":"나 is casual; 저 is humble. Names may be adapted to your own pronunciation.","provenance":"Supporting practice"},{"id":"l02-04","ar":"일본에서 왔어요.","en":"I'm from Japan.","ja":"日本から来た","ipa":"日本から来た","latin":"","forms":{"casual":"일본에서 왔어.","polite":"일본에서 왔어요.","formal":"일본에서 왔습니다."},"note":"This can express your origin in an introduction.","provenance":"Supporting practice"},{"id":"l02-05","ar":"오사카에 살아요.","en":"I live in Osaka.","ja":"大阪に住んでいる","ipa":"大阪に住んでいる","latin":"","forms":{"casual":"오사카에 살아.","polite":"오사카에 살아요.","formal":"오사카에 살고 있습니다."},"note":"에 marks the place where you live.","provenance":"Supporting practice"},{"id":"l02-06","ar":"어디에 사세요?","en":"Where do you live?","ja":"どこに住んでいる？","ipa":"どこに住んでいる？","latin":"","forms":{"casual":"어디에 살아?","polite":"어디에 사세요?","formal":"어디에 사십니까?"},"note":"Ask for a city or area, not a private address.","provenance":"Supporting practice"},{"id":"l02-07","ar":"오늘 감사했어요.","en":"Thank you for today.","ja":"今日はありがとう","ipa":"今日はありがとう","latin":"","forms":{"casual":"오늘 고마웠어.","polite":"오늘 감사했어요.","formal":"오늘 감사했습니다."},"note":"A warm closing after spending time together.","provenance":"Adapted · saved LINE"},{"id":"l02-08","ar":"또 이야기할 수 있으면 좋겠어요.","en":"I'd be happy to talk again.","ja":"また話せたら嬉しい","ipa":"また話せたら嬉しい","latin":"","forms":{"casual":"또 이야기할 수 있으면 좋겠어.","polite":"또 이야기할 수 있으면 좋겠어요.","formal":"또 이야기할 수 있으면 좋겠습니다."},"note":"An invitation, not an assumption that they owe another conversation.","provenance":"Adapted · saved LINE"}]},{"id":"l03","number":3,"title":"Learning together","goal":"Talk about the language you are learning","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"韓国語と英語が主役　日本語は小さな補助","level":"Foundation","lines":[{"id":"l03-01","ar":"한국어 공부하고 있어요.","en":"I'm studying Korean.","ja":"韓国語を勉強している","ipa":"韓国語を勉強している","latin":"","forms":{"casual":"한국어 공부하고 있어.","polite":"한국어 공부하고 있어요.","formal":"한국어를 공부하고 있습니다."},"note":"Casual speech often drops particles; formal writing commonly keeps them.","provenance":"Supporting practice"},{"id":"l03-02","ar":"아직 초보예요.","en":"I'm still a beginner.","ja":"まだ初心者","ipa":"まだ初心者","latin":"","forms":{"casual":"아직 초보야.","polite":"아직 초보예요.","formal":"아직 초보입니다."},"note":"A useful way to set expectations.","provenance":"Supporting practice"},{"id":"l03-03","ar":"영어로도 말할 수 있어요.","en":"I can speak English too.","ja":"英語でも話せる","ipa":"英語でも話せる","latin":"","forms":{"casual":"영어로도 말할 수 있어.","polite":"영어로도 말할 수 있어요.","formal":"영어로도 말할 수 있습니다."},"note":"로 marks the language being used; 도 adds also.","provenance":"Supporting practice"},{"id":"l03-04","ar":"발음 좀 알려 주세요.","en":"Please teach me the pronunciation.","ja":"発音を教えて","ipa":"発音を教えて","latin":"","forms":{"casual":"발음 좀 알려 줘.","polite":"발음 좀 알려 주세요.","formal":"발음을 알려 주시겠습니까?"},"note":"좀 can soften a request; it does not automatically make it polite.","provenance":"Supporting practice"},{"id":"l03-05","ar":"제 발음 어때요?","en":"How is my pronunciation?","ja":"僕の発音、どう？","ipa":"僕の発音、どう？","latin":"","forms":{"casual":"내 발음 어때?","polite":"제 발음 어때요?","formal":"제 발음은 어떻습니까?"},"note":"내 becomes 제 in humble speech.","provenance":"Supporting practice"},{"id":"l03-06","ar":"이 표현 자연스러워요?","en":"Does this expression sound natural?","ja":"この言い方、自然？","ipa":"この言い方、自然？","latin":"","forms":{"casual":"이 표현 자연스러워?","polite":"이 표현 자연스러워요?","formal":"이 표현은 자연스럽습니까?"},"note":"Ask about a specific expression, not a universal rule.","provenance":"Supporting practice"},{"id":"l03-07","ar":"제 말로 이야기하고 싶어요.","en":"I want to speak in my own words.","ja":"自分の言葉で話したい","ipa":"自分の言葉で話したい","latin":"","forms":{"casual":"내 말로 이야기하고 싶어.","polite":"제 말로 이야기하고 싶어요.","formal":"제 말로 이야기하고 싶습니다."},"note":"Your own wording is the point of this course.","provenance":"Supporting practice"},{"id":"l03-08","ar":"제가 틀리면 알려 주세요.","en":"Please tell me when I make a mistake.","ja":"間違ったら教えて","ipa":"間違ったら教えて","latin":"","forms":{"casual":"내가 틀리면 알려 줘.","polite":"제가 틀리면 알려 주세요.","formal":"제가 틀리면 알려 주시겠습니까?"},"note":"Gives the other person permission to correct you gently.","provenance":"Supporting practice"}]},{"id":"l04","number":4,"title":"Make yourself understood","goal":"Clarify without pretending","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"分かったことと、同意したことを混ぜない","level":"Foundation","lines":[{"id":"l04-01","ar":"못 알아들었어요.","en":"I couldn't catch that.","ja":"聞き取れなかった","ipa":"聞き取れなかった","latin":"","forms":{"casual":"못 알아들었어.","polite":"못 알아들었어요.","formal":"못 알아들었습니다."},"note":"This is about hearing or comprehension, not disagreement.","provenance":"Supporting practice"},{"id":"l04-02","ar":"조금만 천천히 말씀해 주세요.","en":"Please speak a little more slowly.","ja":"もう少しゆっくり話して","ipa":"もう少しゆっくり話して","latin":"","forms":{"casual":"조금만 천천히 말해 줘.","polite":"조금만 천천히 말씀해 주세요.","formal":"조금만 천천히 말씀해 주시겠습니까?"},"note":"The respectful versions use 말씀 for the other person's speech.","provenance":"Supporting practice"},{"id":"l04-03","ar":"무슨 뜻이에요?","en":"What does that mean?","ja":"どういう意味？","ipa":"どういう意味？","latin":"","forms":{"casual":"무슨 뜻이야?","polite":"무슨 뜻이에요?","formal":"무슨 뜻입니까?"},"note":"무슨 asks what kind of meaning is intended.","provenance":"Supporting practice"},{"id":"l04-04","ar":"예를 하나 들어 주세요.","en":"Please give me one example.","ja":"例をひとつ出して","ipa":"例をひとつ出して","latin":"","forms":{"casual":"예를 하나 들어 줘.","polite":"예를 하나 들어 주세요.","formal":"예를 하나 들어 주시겠습니까?"},"note":"예를 들다 is the expression for giving an example.","provenance":"Supporting practice"},{"id":"l04-05","ar":"제 말은 그런 뜻이 아니에요.","en":"That's not what I mean.","ja":"言いたいのは、そういうことじゃない","ipa":"言いたいのは、そういうことじゃない","latin":"","forms":{"casual":"내 말은 그런 뜻이 아니야.","polite":"제 말은 그런 뜻이 아니에요.","formal":"제 말은 그런 뜻이 아닙니다."},"note":"Clear disagreement about meaning; tone can still sound firm.","provenance":"Adapted · your stated instructions"},{"id":"l04-06","ar":"설명을 잘 못하겠어요.","en":"I can't explain it very well.","ja":"うまく説明できない","ipa":"うまく説明できない","latin":"","forms":{"casual":"설명을 잘 못하겠어.","polite":"설명을 잘 못하겠어요.","formal":"설명을 잘 못하겠습니다."},"note":"잘 못 means not well; 잘못 as one word means wrongly.","provenance":"Supporting practice"},{"id":"l04-07","ar":"조금씩 이해가 돼요.","en":"I'm starting to understand a little.","ja":"少し分かってきた","ipa":"少し分かってきた","latin":"","forms":{"casual":"조금씩 이해가 돼.","polite":"조금씩 이해가 돼요.","formal":"조금씩 이해가 됩니다."},"note":"Gradual progress rather than claiming full understanding.","provenance":"Supporting practice"},{"id":"l04-08","ar":"이렇게 말하면 뜻이 전해져요?","en":"Does this get my meaning across?","ja":"これで伝わる？","ipa":"これで伝わる？","latin":"","forms":{"casual":"이렇게 말하면 뜻이 전해져?","polite":"이렇게 말하면 뜻이 전해져요?","formal":"이렇게 말하면 뜻이 전달됩니까?"},"note":"The formal version uses 전달되다 for conveyance.","provenance":"Adapted · your stated instructions"}]},{"id":"l05","number":5,"title":"Food first","goal":"Say what you need right now","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"空腹や好みを、普段のテンションで言う","level":"Foundation","lines":[{"id":"l05-01","ar":"배고파요.","en":"I'm hungry.","ja":"お腹が空いた","ipa":"お腹が空いた","latin":"","forms":{"casual":"배고파.","polite":"배고파요.","formal":"배가 고픕니다."},"note":"배고파요 is more natural in daily life than a formal announcement.","provenance":"Adapted · saved user chat"},{"id":"l05-02","ar":"일단 밥부터 먹을게요.","en":"I'll eat first.","ja":"まずご飯を食べる","ipa":"まずご飯を食べる","latin":"","forms":{"casual":"일단 밥부터 먹을게.","polite":"일단 밥부터 먹을게요.","formal":"일단 식사부터 하겠습니다."},"note":"The formal version uses 식사; it is not a higher level of intimacy.","provenance":"Adapted · saved user chat"},{"id":"l05-03","ar":"뭐 좀 드셨어요?","en":"Have you eaten anything?","ja":"何か食べた？","ipa":"何か食べた？","latin":"","forms":{"casual":"뭐 좀 먹었어?","polite":"뭐 좀 드셨어요?","formal":"뭐 좀 드셨습니까?"},"note":"드시다 respects the other person's eating.","provenance":"Supporting practice"},{"id":"l05-04","ar":"같이 밥 먹고 싶어요.","en":"I'd like to have a meal together.","ja":"一緒にご飯を食べたい","ipa":"一緒にご飯を食べたい","latin":"","forms":{"casual":"같이 밥 먹고 싶어.","polite":"같이 밥 먹고 싶어요.","formal":"함께 식사하고 싶습니다."},"note":"This expresses your wish; it is not a confirmed plan.","provenance":"Supporting practice"},{"id":"l05-05","ar":"커피 마시고 싶어요.","en":"I want some coffee.","ja":"コーヒーを飲みたい","ipa":"コーヒーを飲みたい","latin":"","forms":{"casual":"커피 마시고 싶어.","polite":"커피 마시고 싶어요.","formal":"커피를 마시고 싶습니다."},"note":"The object particle is optional in many casual contexts.","provenance":"Adapted · saved user chat"},{"id":"l05-06","ar":"이거 맛있어요.","en":"This is delicious.","ja":"これ、おいしい","ipa":"これ、おいしい","latin":"","forms":{"casual":"이거 맛있어.","polite":"이거 맛있어요.","formal":"이것은 맛있습니다."},"note":"A short everyday reaction.","provenance":"Supporting practice"},{"id":"l05-07","ar":"너무 많이 먹었어요.","en":"I ate too much.","ja":"食べすぎた","ipa":"食べすぎた","latin":"","forms":{"casual":"너무 많이 먹었어.","polite":"너무 많이 먹었어요.","formal":"너무 많이 먹었습니다."},"note":"Here 너무 means too much rather than merely very.","provenance":"Adapted · saved user chat"},{"id":"l05-08","ar":"배불러요.","en":"I'm full.","ja":"お腹いっぱい","ipa":"お腹いっぱい","latin":"","forms":{"casual":"배불러.","polite":"배불러요.","formal":"배가 부릅니다."},"note":"The formal version is mainly for comparing forms.","provenance":"Supporting practice"}]},{"id":"l06","number":6,"title":"Gym & ordinary days","goal":"Talk about your real daily routine","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"予定・実行中・完了を、時制でも区別する","level":"Foundation","lines":[{"id":"l06-01","ar":"지금 헬스장에 갈 거예요.","en":"I'm going to the gym now.","ja":"今からジムに行く","ipa":"今からジムに行く","latin":"","forms":{"casual":"지금 헬스장에 갈 거야.","polite":"지금 헬스장에 갈 거예요.","formal":"지금 헬스장에 가겠습니다."},"note":"갈 거예요 expresses a plan, not a completed action.","provenance":"Adapted · saved user chat"},{"id":"l06-02","ar":"헬스장에서 운동 끝났어요.","en":"I'm done at the gym.","ja":"ジムが終わった","ipa":"ジムが終わった","latin":"","forms":{"casual":"헬스장에서 운동 끝났어.","polite":"헬스장에서 운동 끝났어요.","formal":"헬스장에서 운동을 마쳤습니다."},"note":"The formal version explicitly says you finished exercising.","provenance":"Adapted · saved user chat"},{"id":"l06-03","ar":"집에 걸어서 갈 거예요.","en":"I'll walk home.","ja":"帰りは歩く","ipa":"帰りは歩く","latin":"","forms":{"casual":"집에 걸어서 갈 거야.","polite":"집에 걸어서 갈 거예요.","formal":"집에 걸어서 가겠습니다."},"note":"걸어서 means on foot.","provenance":"Adapted · saved user chat"},{"id":"l06-04","ar":"집에 가면 샤워할 거예요.","en":"I'll shower when I get home.","ja":"帰ったらシャワーを浴びる","ipa":"帰ったらシャワーを浴びる","latin":"","forms":{"casual":"집에 가면 샤워할 거야.","polite":"집에 가면 샤워할 거예요.","formal":"집에 가면 샤워하겠습니다."},"note":"가면 introduces the condition when you get home.","provenance":"Adapted · saved user chat"},{"id":"l06-05","ar":"오늘 좀 피곤해요.","en":"I'm a little tired today.","ja":"今日はちょっと疲れた","ipa":"今日はちょっと疲れた","latin":"","forms":{"casual":"오늘 좀 피곤해.","polite":"오늘 좀 피곤해요.","formal":"오늘은 조금 피곤합니다."},"note":"A current state, even when Japanese uses a past form.","provenance":"Supporting practice"},{"id":"l06-06","ar":"슬슬 졸려요.","en":"I'm getting sleepy.","ja":"眠くなってきた","ipa":"眠くなってきた","latin":"","forms":{"casual":"슬슬 졸려.","polite":"슬슬 졸려요.","formal":"슬슬 졸립니다."},"note":"슬슬 suggests the state is gradually beginning.","provenance":"Adapted · saved user chat"},{"id":"l06-07","ar":"아직 할 일이 있어요.","en":"I still have things to do.","ja":"まだやることがある","ipa":"まだやることがある","latin":"","forms":{"casual":"아직 할 일이 있어.","polite":"아직 할 일이 있어요.","formal":"아직 해야 할 일이 있습니다."},"note":"Avoids turning unfinished tasks into completed work.","provenance":"Adapted · saved user chat"},{"id":"l06-08","ar":"끝나고 전화할게요.","en":"I'll call after I'm done.","ja":"終わってから電話する","ipa":"終わってから電話する","latin":"","forms":{"casual":"끝나고 전화할게.","polite":"끝나고 전화할게요.","formal":"끝난 후에 전화하겠습니다."},"note":"A commitment about your own action; use it only when intended.","provenance":"Adapted · saved user chat"}]},{"id":"l07","number":7,"title":"Your music","goal":"Talk about songs you make","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"制作・好きな曲・聴いてほしい気持ち","level":"Foundation","lines":[{"id":"l07-01","ar":"음악 만드는 걸 좋아해요.","en":"I like making music.","ja":"音楽を作るのが好き","ipa":"音楽を作るのが好き","latin":"","forms":{"casual":"음악 만드는 걸 좋아해.","polite":"음악 만드는 걸 좋아해요.","formal":"음악을 만드는 것을 좋아합니다."},"note":"만드는 걸 is the spoken contraction of 만드는 것을.","provenance":"Adapted · saved user chat"},{"id":"l07-02","ar":"새 곡 만들었어요.","en":"I made a new song.","ja":"新しい曲を作った","ipa":"新しい曲を作った","latin":"","forms":{"casual":"새 곡 만들었어.","polite":"새 곡 만들었어요.","formal":"새 곡을 만들었습니다."},"note":"A completed action, unlike I'm planning a song.","provenance":"Supporting practice"},{"id":"l07-03","ar":"이 곡 들어 주셨으면 좋겠어요.","en":"I'd like you to listen to this song.","ja":"この曲を聴いてほしい","ipa":"この曲を聴いてほしい","latin":"","forms":{"casual":"이 곡 들어 줬으면 좋겠어.","polite":"이 곡 들어 주셨으면 좋겠어요.","formal":"이 곡을 들어 주셨으면 좋겠습니다."},"note":"A wish; not a demand that they provide feedback.","provenance":"Adapted · saved user chat"},{"id":"l07-04","ar":"제 마음을 썼어요.","en":"I wrote about how I felt.","ja":"自分の気持ちを書いた","ipa":"自分の気持ちを書いた","latin":"","forms":{"casual":"내 마음을 썼어.","polite":"제 마음을 썼어요.","formal":"제 마음을 글로 썼습니다."},"note":"The formal version makes the written medium explicit.","provenance":"Supporting practice"},{"id":"l07-05","ar":"영어로 가사 쓰고 있어요.","en":"I'm writing lyrics in English.","ja":"英語で歌詞を書いている","ipa":"英語で歌詞を書いている","latin":"","forms":{"casual":"영어로 가사 쓰고 있어.","polite":"영어로 가사 쓰고 있어요.","formal":"영어로 가사를 쓰고 있습니다."},"note":"고 있다 marks an ongoing activity.","provenance":"Supporting practice"},{"id":"l07-06","ar":"이 목소리가 좋아요.","en":"I like this voice.","ja":"この声が好き","ipa":"この声が好き","latin":"","forms":{"casual":"이 목소리가 좋아.","polite":"이 목소리가 좋아요.","formal":"이 목소리가 좋습니다."},"note":"This voice avoids guessing whose voice it is.","provenance":"Supporting practice"},{"id":"l07-07","ar":"감정이 담겨 있어요.","en":"There's a lot of feeling in it.","ja":"感情がこもっている","ipa":"感情がこもっている","latin":"","forms":{"casual":"감정이 담겨 있어.","polite":"감정이 담겨 있어요.","formal":"감정이 담겨 있습니다."},"note":"Can describe a voice, song or piece of writing in context.","provenance":"Supporting practice"},{"id":"l07-08","ar":"감상 들려주세요.","en":"Please tell me what you thought.","ja":"感想を聞かせて","ipa":"感想を聞かせて","latin":"","forms":{"casual":"감상 들려줘.","polite":"감상 들려주세요.","formal":"감상을 들려주시겠습니까?"},"note":"감상 asks for impressions; it is not automatically a request for corrections.","provenance":"Adapted · saved user chat"}]},{"id":"l08","number":8,"title":"Make something","goal":"Describe creative work","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"「できた」と「作っている途中」を分ける","level":"Developing","lines":[{"id":"l08-01","ar":"재미있는 걸 만들고 싶어요.","en":"I want to make something interesting.","ja":"面白いものを作りたい","ipa":"面白いものを作りたい","latin":"","forms":{"casual":"재미있는 걸 만들고 싶어.","polite":"재미있는 걸 만들고 싶어요.","formal":"재미있는 것을 만들고 싶습니다."},"note":"A desire, not a completed deliverable.","provenance":"Adapted · saved user chat"},{"id":"l08-02","ar":"지금 앱 만들고 있어요.","en":"I'm making an app now.","ja":"今、アプリを作っている","ipa":"今、アプリを作っている","latin":"","forms":{"casual":"지금 앱 만들고 있어.","polite":"지금 앱 만들고 있어요.","formal":"지금 앱을 만들고 있습니다."},"note":"An ongoing task, not a claim that it works.","provenance":"Adapted · saved user chat"},{"id":"l08-03","ar":"이 디자인 마음에 들어요.","en":"I like this design.","ja":"このデザインが好き","ipa":"このデザインが好き","latin":"","forms":{"casual":"이 디자인 마음에 들어.","polite":"이 디자인 마음에 들어요.","formal":"이 디자인이 마음에 듭니다."},"note":"마음에 들다 means to like or find appealing.","provenance":"Supporting practice"},{"id":"l08-04","ar":"색만 바꾸고 싶어요.","en":"I want to change only the colour.","ja":"色だけ変えたい","ipa":"色だけ変えたい","latin":"","forms":{"casual":"색만 바꾸고 싶어.","polite":"색만 바꾸고 싶어요.","formal":"색만 바꾸고 싶습니다."},"note":"만 limits the requested change.","provenance":"Adapted · this app request"},{"id":"l08-05","ar":"같은 형식으로 만들어 주세요.","en":"Please make it in the same format.","ja":"同じ形で作って","ipa":"同じ形で作って","latin":"","forms":{"casual":"같은 형식으로 만들어 줘.","polite":"같은 형식으로 만들어 주세요.","formal":"같은 형식으로 만들어 주시겠습니까?"},"note":"형식 means format; it is not necessarily physical shape.","provenance":"Adapted · this app request"},{"id":"l08-06","ar":"드디어 완성했어요.","en":"It's finally done.","ja":"やっとできた","ipa":"やっとできた","latin":"","forms":{"casual":"드디어 완성했어.","polite":"드디어 완성했어요.","formal":"드디어 완성했습니다."},"note":"Use after completion, not merely after starting.","provenance":"Supporting practice"},{"id":"l08-07","ar":"아직 완성 안 됐어요.","en":"It's not finished yet.","ja":"まだ完成していない","ipa":"まだ完成していない","latin":"","forms":{"casual":"아직 완성 안 됐어.","polite":"아직 완성 안 됐어요.","formal":"아직 완성되지 않았습니다."},"note":"A direct way to avoid overstating progress.","provenance":"Supporting practice"},{"id":"l08-08","ar":"작동하는 거 보여 주세요.","en":"Please show me it working.","ja":"動くところを見せて","ipa":"動くところを見せて","latin":"","forms":{"casual":"작동하는 거 보여 줘.","polite":"작동하는 거 보여 주세요.","formal":"작동하는 모습을 보여 주시겠습니까?"},"note":"Asks for observable operation, not an explanation alone.","provenance":"Supporting practice"}]},{"id":"l09","number":9,"title":"Messages & calls","goal":"Stay in touch with a person","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"返信の催促にも相手の都合を残す","level":"Developing","lines":[{"id":"l09-01","ar":"지금 통화할 수 있어요?","en":"Can you talk now?","ja":"今、話せる？","ipa":"今、話せる？","latin":"","forms":{"casual":"지금 통화할 수 있어?","polite":"지금 통화할 수 있어요?","formal":"지금 통화 가능하십니까?"},"note":"통화 specifically means a phone or voice call.","provenance":"Supporting practice"},{"id":"l09-02","ar":"메시지 봤어요.","en":"I saw your message.","ja":"メッセージ見たよ","ipa":"メッセージ見たよ","latin":"","forms":{"casual":"메시지 봤어.","polite":"메시지 봤어요.","formal":"메시지를 확인했습니다."},"note":"Reading a message is not the same as accepting its terms.","provenance":"Supporting practice"},{"id":"l09-03","ar":"답장이 늦어서 죄송해요.","en":"Sorry for the late reply.","ja":"返信が遅くなってごめん","ipa":"返信が遅くなってごめん","latin":"","forms":{"casual":"답장 늦어서 미안해.","polite":"답장이 늦어서 죄송해요.","formal":"답장이 늦어서 죄송합니다."},"note":"A common repair in both social and business messaging.","provenance":"Adapted · saved LINE"},{"id":"l09-04","ar":"지금 집에 가는 중이에요.","en":"I'm on my way home.","ja":"今、帰っているところ","ipa":"今、帰っているところ","latin":"","forms":{"casual":"지금 집에 가는 중이야.","polite":"지금 집에 가는 중이에요.","formal":"지금 귀가 중입니다."},"note":"중 means in the middle of doing something.","provenance":"Supporting practice"},{"id":"l09-05","ar":"나중에 연락할게요.","en":"I'll contact you later.","ja":"あとで連絡する","ipa":"あとで連絡する","latin":"","forms":{"casual":"나중에 연락할게.","polite":"나중에 연락할게요.","formal":"나중에 연락드리겠습니다."},"note":"드리다 humbles your action toward the recipient.","provenance":"Supporting practice"},{"id":"l09-06","ar":"서두르지 않으셔도 돼요.","en":"There's no need to rush.","ja":"急がなくて大丈夫","ipa":"急がなくて大丈夫","latin":"","forms":{"casual":"서두르지 않아도 돼.","polite":"서두르지 않으셔도 돼요.","formal":"서두르지 않으셔도 됩니다."},"note":"A respectful version should not sound like permission from a superior.","provenance":"Supporting practice"},{"id":"l09-07","ar":"편하실 때 답장해 주세요.","en":"Please reply when it's convenient.","ja":"都合のいい時に返して","ipa":"都合のいい時に返して","latin":"","forms":{"casual":"편할 때 답장해 줘.","polite":"편하실 때 답장해 주세요.","formal":"편하실 때 답장해 주시겠습니까?"},"note":"Leave the other person's schedule open.","provenance":"Supporting practice"},{"id":"l09-08","ar":"내일 또 이야기할까요?","en":"Would you like to talk again tomorrow?","ja":"また明日話そう","ipa":"また明日話そう","latin":"","forms":{"casual":"내일 또 이야기할래?","polite":"내일 또 이야기할까요?","formal":"내일 다시 이야기 나눠도 되겠습니까?"},"note":"The formal model asks whether another conversation would be acceptable.","provenance":"Supporting practice"}]},{"id":"l10","number":10,"title":"Friends & good company","goal":"Say why a conversation matters","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"親しくなることと、タメ口の合意は同じではない","level":"Developing","lines":[{"id":"l10-01","ar":"같이 이야기하는 게 재미있어요.","en":"I enjoy talking with you.","ja":"話すのが楽しい","ipa":"話すのが楽しい","latin":"","forms":{"casual":"같이 이야기하는 게 재미있어.","polite":"같이 이야기하는 게 재미있어요.","formal":"함께 이야기하는 것이 즐겁습니다."},"note":"The formal model is a polite, slightly more distant expression.","provenance":"Supporting practice"},{"id":"l10-02","ar":"더 알아 가고 싶어요.","en":"I'd like to get to know you better.","ja":"もっと知りたい","ipa":"もっと知りたい","latin":"","forms":{"casual":"더 알아 가고 싶어.","polite":"더 알아 가고 싶어요.","formal":"더 알아 가고 싶습니다."},"note":"The person is understood from context; no 당신 is needed.","provenance":"Supporting practice"},{"id":"l10-03","ar":"친구가 생겼어요.","en":"I made a friend.","ja":"友達ができた","ipa":"友達ができた","latin":"","forms":{"casual":"친구가 생겼어.","polite":"친구가 생겼어요.","formal":"친구가 생겼습니다."},"note":"친구가 생기다 means to make or gain a friend.","provenance":"Adapted · saved user chat"},{"id":"l10-04","ar":"예전만큼 외롭지 않아요.","en":"I'm not as lonely as before.","ja":"前ほど寂しくない","ipa":"前ほど寂しくない","latin":"","forms":{"casual":"예전만큼 외롭지 않아.","polite":"예전만큼 외롭지 않아요.","formal":"예전만큼 외롭지 않습니다."},"note":"Does not claim loneliness is gone forever.","provenance":"Adapted · saved user chat"},{"id":"l10-05","ar":"또 만나고 싶어요.","en":"I'd like to see you again.","ja":"また会いたい","ipa":"また会いたい","latin":"","forms":{"casual":"또 만나고 싶어.","polite":"또 만나고 싶어요.","formal":"다시 만나 뵙고 싶습니다."},"note":"뵙다 is a humble form of meeting a respected person.","provenance":"Supporting practice"},{"id":"l10-06","ar":"오늘 이야기해서 좋았어요.","en":"I'm glad we got to talk today.","ja":"今日は話せてよかった","ipa":"今日は話せてよかった","latin":"","forms":{"casual":"오늘 이야기해서 좋았어.","polite":"오늘 이야기해서 좋았어요.","formal":"오늘 이야기 나눌 수 있어서 좋았습니다."},"note":"A warm closing without making a new promise.","provenance":"Supporting practice"},{"id":"l10-07","ar":"무리하지 마세요.","en":"Please don't push yourself too hard.","ja":"無理しないで","ipa":"無理しないで","latin":"","forms":{"casual":"무리하지 마.","polite":"무리하지 마세요.","formal":"무리하지 않으셨으면 좋겠습니다."},"note":"The formal version is a wish, softer than a command.","provenance":"Supporting practice"},{"id":"l10-08","ar":"말 편하게 해도 돼요?","en":"May I speak casually?","ja":"タメ口で話してもいい？","ipa":"タメ口で話してもいい？","latin":"","forms":{"casual":"말 편하게 해도 돼?","polite":"말 편하게 해도 돼요?","formal":"말씀을 편하게 드려도 되겠습니까?"},"note":"Ask while still using polite speech; switching the course is not their consent.","provenance":"Supporting practice"}]},{"id":"l11","number":11,"title":"Feelings, honestly","goal":"Describe your mood without a diagnosis","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"いまの気持ちをそのまま言う","level":"Developing","lines":[{"id":"l11-01","ar":"오늘 기분 좋아요.","en":"I'm in a good mood today.","ja":"今日は気分がいい","ipa":"今日は気分がいい","latin":"","forms":{"casual":"오늘 기분 좋아.","polite":"오늘 기분 좋아요.","formal":"오늘은 기분이 좋습니다."},"note":"A present mood, not a permanent personality label.","provenance":"Supporting practice"},{"id":"l11-02","ar":"조금 불안해요.","en":"I'm a little uneasy.","ja":"ちょっと不安","ipa":"ちょっと不安","latin":"","forms":{"casual":"조금 불안해.","polite":"조금 불안해요.","formal":"조금 불안합니다."},"note":"Names a feeling without diagnosing its cause.","provenance":"Supporting practice"},{"id":"l11-03","ar":"기대하고 있어요.","en":"I'm looking forward to it.","ja":"楽しみにしている","ipa":"楽しみにしている","latin":"","forms":{"casual":"기대하고 있어.","polite":"기대하고 있어요.","formal":"기대하고 있습니다."},"note":"Context tells the listener what you are anticipating.","provenance":"Supporting practice"},{"id":"l11-04","ar":"그건 좀 아쉬워요.","en":"That's a little disappointing.","ja":"それはちょっと残念","ipa":"それはちょっと残念","latin":"","forms":{"casual":"그건 좀 아쉬워.","polite":"그건 좀 아쉬워요.","formal":"그 점은 조금 아쉽습니다."},"note":"아쉽다 often expresses mild regret or disappointment.","provenance":"Supporting practice"},{"id":"l11-05","ar":"솔직히 기뻐요.","en":"Honestly, I'm happy.","ja":"正直、嬉しい","ipa":"正直、嬉しい","latin":"","forms":{"casual":"솔직히 기뻐.","polite":"솔직히 기뻐요.","formal":"솔직히 기쁩니다."},"note":"솔직히 marks an honest personal reaction.","provenance":"Supporting practice"},{"id":"l11-06","ar":"조금 쉬고 싶어요.","en":"I'd like to rest a little.","ja":"少し休みたい","ipa":"少し休みたい","latin":"","forms":{"casual":"조금 쉬고 싶어.","polite":"조금 쉬고 싶어요.","formal":"조금 쉬고 싶습니다."},"note":"A simple need, not a medical claim.","provenance":"Supporting practice"},{"id":"l11-07","ar":"지금은 괜찮아요.","en":"I'm okay now.","ja":"今は大丈夫","ipa":"今は大丈夫","latin":"","forms":{"casual":"지금은 괜찮아.","polite":"지금은 괜찮아요.","formal":"지금은 괜찮습니다."},"note":"은 contrasts now with another time or state.","provenance":"Supporting practice"},{"id":"l11-08","ar":"그렇게 말씀해 주셔서 감사해요.","en":"Thank you for saying that.","ja":"そう言ってくれてありがとう","ipa":"そう言ってくれてありがとう","latin":"","forms":{"casual":"그렇게 말해 줘서 고마워.","polite":"그렇게 말씀해 주셔서 감사해요.","formal":"그렇게 말씀해 주셔서 감사합니다."},"note":"The listener's words take the honorific form.","provenance":"Supporting practice"}]},{"id":"l12","number":12,"title":"Compliments & distance","goal":"Be warm without getting ahead of the relationship","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"可愛い・会いたいは、丁寧形でも距離が近い言葉　Formalは文体比較用","level":"Developing","lines":[{"id":"l12-01","ar":"정말 다정하시네요.","en":"You're really kind.","ja":"本当に優しいね","ipa":"本当に優しいね","latin":"","forms":{"casual":"정말 다정하네.","polite":"정말 다정하시네요.","formal":"정말 다정하십니다."},"note":"Honorific grammar does not make a personal compliment suitable for every setting.","provenance":"Supporting practice"},{"id":"l12-02","ar":"미소가 정말 예뻐요.","en":"Your smile is lovely.","ja":"その笑顔、素敵","ipa":"その笑顔、素敵","latin":"","forms":{"casual":"미소가 정말 예뻐.","polite":"미소가 정말 예뻐요.","formal":"미소가 정말 아름답습니다."},"note":"A personal compliment; consider whether it is welcome.","provenance":"Supporting practice"},{"id":"l12-03","ar":"목소리를 들으면 마음이 편해져요.","en":"Your voice is soothing.","ja":"声が落ち着く","ipa":"声が落ち着く","latin":"","forms":{"casual":"목소리를 들으면 마음이 편해져.","polite":"목소리를 들으면 마음이 편해져요.","formal":"목소리를 들으면 마음이 편안해집니다."},"note":"Describes your reaction rather than making a claim about them.","provenance":"Supporting practice"},{"id":"l12-04","ar":"감각이 좋으시네요.","en":"You have good taste.","ja":"センスがいいね","ipa":"センスがいいね","latin":"","forms":{"casual":"감각이 좋네.","polite":"감각이 좋으시네요.","formal":"감각이 좋으십니다."},"note":"Can describe creative taste; context matters.","provenance":"Supporting practice"},{"id":"l12-05","ar":"좀 쑥스러워요.","en":"I'm a little shy about that.","ja":"ちょっと照れる","ipa":"ちょっと照れる","latin":"","forms":{"casual":"좀 쑥스러워.","polite":"좀 쑥스러워요.","formal":"조금 쑥스럽습니다."},"note":"쑥스럽다 is useful for shy embarrassment after a compliment.","provenance":"Supporting practice"},{"id":"l12-06","ar":"그렇게 불러도 돼요?","en":"May I call you that?","ja":"そう呼んでもいい？","ipa":"そう呼んでもいい？","latin":"","forms":{"casual":"그렇게 불러도 돼?","polite":"그렇게 불러도 돼요?","formal":"그렇게 불러도 되겠습니까?"},"note":"Ask before introducing a pet name or an unfamiliar form of address.","provenance":"Supporting practice"},{"id":"l12-07","ar":"싫으시면 말씀해 주세요.","en":"Please tell me if you don't like it.","ja":"嫌なら言ってね","ipa":"嫌なら言ってね","latin":"","forms":{"casual":"싫으면 말해 줘.","polite":"싫으시면 말씀해 주세요.","formal":"싫으시면 말씀해 주시겠습니까?"},"note":"Take the answer seriously; politeness does not cancel a boundary.","provenance":"Supporting practice"},{"id":"l12-08","ar":"천천히 친해지고 싶어요.","en":"I'd like us to get closer gradually.","ja":"ゆっくり仲良くなりたい","ipa":"ゆっくり仲良くなりたい","latin":"","forms":{"casual":"천천히 친해지고 싶어.","polite":"천천히 친해지고 싶어요.","formal":"천천히 친해지고 싶습니다."},"note":"A personal wish, not a promise of a relationship.","provenance":"Supporting practice"}]},{"id":"l13","number":13,"title":"Making plans","goal":"Make an invitation, not an assumption","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"誘い・希望・決定を区別する","level":"Developing","lines":[{"id":"l13-01","ar":"언제 시간 괜찮으세요?","en":"When are you free?","ja":"いつ空いている？","ipa":"いつ空いている？","latin":"","forms":{"casual":"언제 시간 있어?","polite":"언제 시간 괜찮으세요?","formal":"언제 시간이 괜찮으십니까?"},"note":"The polite versions ask about availability respectfully.","provenance":"Supporting practice"},{"id":"l13-02","ar":"내일 저녁은 어떠세요?","en":"How about tomorrow evening?","ja":"明日の夜はどう？","ipa":"明日の夜はどう？","latin":"","forms":{"casual":"내일 저녁 어때?","polite":"내일 저녁은 어떠세요?","formal":"내일 저녁은 어떻습니까?"},"note":"A proposal rather than a confirmed booking.","provenance":"Supporting practice"},{"id":"l13-03","ar":"주말에 만날 수 있어요?","en":"Can we meet this weekend?","ja":"週末に会える？","ipa":"週末に会える？","latin":"","forms":{"casual":"주말에 만날 수 있어?","polite":"주말에 만날 수 있어요?","formal":"주말에 뵐 수 있겠습니까?"},"note":"The formal model uses 뵙다 to humble your meeting action.","provenance":"Supporting practice"},{"id":"l13-04","ar":"아직 안 정했어요.","en":"I haven't decided yet.","ja":"まだ決めていない","ipa":"まだ決めていない","latin":"","forms":{"casual":"아직 안 정했어.","polite":"아직 안 정했어요.","formal":"아직 정하지 않았습니다."},"note":"Do not use this to mean a decision has already been made.","provenance":"Supporting practice"},{"id":"l13-05","ar":"일정 확인할게요.","en":"I'll check my schedule.","ja":"予定を確認する","ipa":"予定を確認する","latin":"","forms":{"casual":"일정 확인할게.","polite":"일정 확인할게요.","formal":"일정을 확인하겠습니다."},"note":"Checking is not the same as accepting the proposed time.","provenance":"Supporting practice"},{"id":"l13-06","ar":"그 시간 괜찮아요.","en":"That time works for me.","ja":"その時間で大丈夫","ipa":"その時間で大丈夫","latin":"","forms":{"casual":"그 시간 괜찮아.","polite":"그 시간 괜찮아요.","formal":"그 시간으로 괜찮습니다."},"note":"This is agreement about a time, not every other condition.","provenance":"Supporting practice"},{"id":"l13-07","ar":"조금 늦을 것 같아요.","en":"I think I'll be a little late.","ja":"少し遅れそう","ipa":"少し遅れそう","latin":"","forms":{"casual":"조금 늦을 것 같아.","polite":"조금 늦을 것 같아요.","formal":"조금 늦을 것 같습니다."},"note":"것 같다 marks an expectation, not a precise arrival time.","provenance":"Supporting practice"},{"id":"l13-08","ar":"도착하시면 연락해 주세요.","en":"Please let me know when you arrive.","ja":"着いたら連絡して","ipa":"着いたら連絡して","latin":"","forms":{"casual":"도착하면 연락해 줘.","polite":"도착하시면 연락해 주세요.","formal":"도착하시면 연락해 주시겠습니까?"},"note":"Honorific 시 applies to the other person's arrival.","provenance":"Supporting practice"}]},{"id":"l14","number":14,"title":"Introduce your work","goal":"Explain what you do","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"LINEの自己紹介を、固有の連絡先を出さずに練習","level":"Intermediate","lines":[{"id":"l14-01","ar":"회사를 운영하고 있어요.","en":"I run a company.","ja":"会社を運営している","ipa":"会社を運営している","latin":"","forms":{"casual":"회사 운영하고 있어.","polite":"회사를 운영하고 있어요.","formal":"회사를 운영하고 있습니다."},"note":"No legal company form is inferred from the translation.","provenance":"Supporting practice"},{"id":"l14-02","ar":"음악 제작 일을 하고 있어요.","en":"I make music professionally.","ja":"音楽制作をしている","ipa":"音楽制作をしている","latin":"","forms":{"casual":"음악 제작 일을 하고 있어.","polite":"음악 제작 일을 하고 있어요.","formal":"음악 제작 일을 하고 있습니다."},"note":"일 makes the professional activity explicit.","provenance":"Adapted · saved LINE"},{"id":"l14-03","ar":"사람을 소개하는 일도 하고 있어요.","en":"I also work in connecting people.","ja":"人を紹介する仕事もしている","ipa":"人を紹介する仕事もしている","latin":"","forms":{"casual":"사람을 소개하는 일도 하고 있어.","polite":"사람을 소개하는 일도 하고 있어요.","formal":"사람을 소개하는 일도 하고 있습니다."},"note":"This does not claim a specific licensed brokerage role.","provenance":"Adapted · saved LINE"},{"id":"l14-04","ar":"웹사이트도 만들고 있어요.","en":"I also build websites.","ja":"ウェブサイトも作っている","ipa":"ウェブサイトも作っている","latin":"","forms":{"casual":"웹사이트도 만들고 있어.","polite":"웹사이트도 만들고 있어요.","formal":"웹사이트도 제작하고 있습니다."},"note":"도 means also.","provenance":"Adapted · saved LINE"},{"id":"l14-05","ar":"팟캐스트를 운영하고 있어요.","en":"I run a podcast.","ja":"ポッドキャストをやっている","ipa":"ポッドキャストをやっている","latin":"","forms":{"casual":"팟캐스트 운영하고 있어.","polite":"팟캐스트를 운영하고 있어요.","formal":"팟캐스트를 운영하고 있습니다."},"note":"A straightforward description of your work.","provenance":"Supporting practice"},{"id":"l14-06","ar":"한번 정보 교환하고 싶어요.","en":"I'd like to exchange ideas sometime.","ja":"一度、情報交換したい","ipa":"一度、情報交換したい","latin":"","forms":{"casual":"한번 정보 교환하고 싶어.","polite":"한번 정보 교환하고 싶어요.","formal":"한번 정보 교환을 하고 싶습니다."},"note":"An initial invitation, not an accepted appointment.","provenance":"Adapted · saved LINE"},{"id":"l14-07","ar":"어떤 일 하세요?","en":"What kind of work do you do?","ja":"どんな仕事をしている？","ipa":"どんな仕事をしている？","latin":"","forms":{"casual":"어떤 일 해?","polite":"어떤 일 하세요?","formal":"어떤 일을 하십니까?"},"note":"Ask about work, not confidential clients or revenue.","provenance":"Supporting practice"},{"id":"l14-08","ar":"오늘 시간 내 주셔서 감사해요.","en":"Thank you for making time today.","ja":"今日は時間を取ってくれてありがとう","ipa":"今日は時間を取ってくれてありがとう","latin":"","forms":{"casual":"오늘 시간 내 줘서 고마워.","polite":"오늘 시간 내 주셔서 감사해요.","formal":"오늘 시간 내 주셔서 감사합니다."},"note":"내 주셔서 respects the effort the listener made.","provenance":"Adapted · saved LINE"}]},{"id":"l15","number":15,"title":"In a meeting","goal":"Listen, ask and identify the next step","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"議事録の本人発言と会話場面を教材化　相手の発言は本人のものにしない","level":"Intermediate","lines":[{"id":"l15-01","ar":"먼저 이야기 듣고 싶어요.","en":"I'd like to hear about it first.","ja":"まず話を聞きたい","ipa":"まず話を聞きたい","latin":"","forms":{"casual":"먼저 이야기 듣고 싶어.","polite":"먼저 이야기 듣고 싶어요.","formal":"먼저 말씀을 듣고 싶습니다."},"note":"Formal speech respects the other person's contribution.","provenance":"Supporting practice"},{"id":"l15-02","ar":"가장 큰 과제가 뭐예요?","en":"What's the main challenge?","ja":"一番の課題は何？","ipa":"一番の課題は何？","latin":"","forms":{"casual":"가장 큰 과제가 뭐야?","polite":"가장 큰 과제가 뭐예요?","formal":"가장 큰 과제는 무엇입니까?"},"note":"A focused business question.","provenance":"Supporting practice"},{"id":"l15-03","ar":"구체적으로 어떤 거예요?","en":"What specifically do you mean?","ja":"具体的にはどんなこと？","ipa":"具体的にはどんなこと？","latin":"","forms":{"casual":"구체적으로 어떤 거야?","polite":"구체적으로 어떤 거예요?","formal":"구체적으로 어떤 것입니까?"},"note":"Ask for detail instead of pretending to understand.","provenance":"Supporting practice"},{"id":"l15-04","ar":"조금 생각해 볼게요.","en":"I'll think about it a little.","ja":"少し考えてみる","ipa":"少し考えてみる","latin":"","forms":{"casual":"조금 생각해 볼게.","polite":"조금 생각해 볼게요.","formal":"조금 생각해 보겠습니다."},"note":"This is consideration, not acceptance.","provenance":"Supporting practice"},{"id":"l15-05","ar":"소개해 드릴 수 있는 분이 있어요.","en":"I know someone I could introduce.","ja":"紹介できる人がいる","ipa":"紹介できる人がいる","latin":"","forms":{"casual":"소개할 수 있는 사람이 있어.","polite":"소개해 드릴 수 있는 분이 있어요.","formal":"소개해 드릴 수 있는 분이 있습니다."},"note":"분 respects the person; 드리다 humbles your action for the listener.","provenance":"Supporting practice"},{"id":"l15-06","ar":"당사자에게 확인하고 연락드릴게요.","en":"I'll get in touch after checking with the person.","ja":"本人に確認してから連絡する","ipa":"本人に確認してから連絡する","latin":"","forms":{"casual":"당사자한테 확인하고 연락할게.","polite":"당사자에게 확인하고 연락드릴게요.","formal":"당사자에게 확인한 후 연락드리겠습니다."},"note":"Do not imply consent has already been obtained.","provenance":"Supporting practice"},{"id":"l15-07","ar":"자료 보내 드릴게요.","en":"I'll send the materials.","ja":"資料を送る","ipa":"資料を送る","latin":"","forms":{"casual":"자료 보낼게.","polite":"자료 보내 드릴게요.","formal":"자료를 보내 드리겠습니다."},"note":"A real commitment about sending, not merely drafting.","provenance":"Supporting practice"},{"id":"l15-08","ar":"다음에 어떻게 진행할지 확인하고 싶어요.","en":"I'd like to confirm how we'll proceed.","ja":"次の進め方を確認したい","ipa":"次の進め方を確認したい","latin":"","forms":{"casual":"다음에 어떻게 진행할지 확인하고 싶어.","polite":"다음에 어떻게 진행할지 확인하고 싶어요.","formal":"다음 진행 방식을 확인하고 싶습니다."},"note":"Confirms the process without inventing an agreement.","provenance":"Supporting practice"}]},{"id":"l16","number":16,"title":"Ask for the work","goal":"Request a result clearly","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"強い不満をそのまま罵倒にせず、必要な作業を具体的に言う","level":"Intermediate","lines":[{"id":"l16-01","ar":"어디까지 진행하셨어요?","en":"How far have you got?","ja":"どこまで進んだ？","ipa":"どこまで進んだ？","latin":"","forms":{"casual":"어디까지 진행했어?","polite":"어디까지 진행하셨어요?","formal":"어디까지 진행하셨습니까?"},"note":"This asks for progress, not a promise about future work.","provenance":"Adapted · your stated instructions"},{"id":"l16-02","ar":"현재 상태를 알려 주세요.","en":"Please tell me the current status.","ja":"今の状態を教えて","ipa":"今の状態を教えて","latin":"","forms":{"casual":"지금 상태 알려 줘.","polite":"현재 상태를 알려 주세요.","formal":"현재 상태를 알려 주시겠습니까?"},"note":"Ask for an observed state.","provenance":"Adapted · your stated instructions"},{"id":"l16-03","ar":"설명만이 아니라 실제 결과물을 보고 싶어요.","en":"I'd like to see the actual thing, not just an explanation.","ja":"説明だけじゃなく、実物を見たい","ipa":"説明だけじゃなく、実物を見たい","latin":"","forms":{"casual":"설명만 말고 실제 결과물을 보고 싶어.","polite":"설명만이 아니라 실제 결과물을 보고 싶어요.","formal":"설명뿐 아니라 실제 결과물을 보고 싶습니다."},"note":"결과물 is a concrete work product.","provenance":"Adapted · your stated instructions"},{"id":"l16-04","ar":"처음부터 다시 하지 말아 주세요.","en":"Please don't start over from the beginning.","ja":"最初からやり直さないで","ipa":"最初からやり直さないで","latin":"","forms":{"casual":"처음부터 다시 하지 마.","polite":"처음부터 다시 하지 말아 주세요.","formal":"처음부터 다시 하지 말아 주시겠습니까?"},"note":"A clear instruction; respectful endings do not erase its firmness.","provenance":"Adapted · your stated instructions"},{"id":"l16-05","ar":"하던 데서 이어서 해 주세요.","en":"Please continue where you left off.","ja":"続きからお願い","ipa":"続きからお願い","latin":"","forms":{"casual":"하던 데서 이어서 해 줘.","polite":"하던 데서 이어서 해 주세요.","formal":"하던 부분부터 이어서 진행해 주시겠습니까?"},"note":"The formal version says continue from the part you were working on.","provenance":"Adapted · your stated instructions"},{"id":"l16-06","ar":"완성된 것부터 보내 주세요.","en":"Please send what's ready first.","ja":"できたものを先に送って","ipa":"できたものを先に送って","latin":"","forms":{"casual":"완성된 것부터 보내 줘.","polite":"완성된 것부터 보내 주세요.","formal":"완성된 것부터 보내 주시겠습니까?"},"note":"Ready work is separate from the unfinished remainder.","provenance":"Adapted · your stated instructions"},{"id":"l16-07","ar":"어려운 부분을 구체적으로 알려 주세요.","en":"Please tell me specifically which part is difficult.","ja":"難しい部分を具体的に教えて","ipa":"難しい部分を具体的に教えて","latin":"","forms":{"casual":"어려운 부분을 구체적으로 알려 줘.","polite":"어려운 부분을 구체적으로 알려 주세요.","formal":"어려운 부분을 구체적으로 알려 주시겠습니까?"},"note":"Asks for the actual blocker rather than a vague failure report.","provenance":"Supporting practice"},{"id":"l16-08","ar":"끝나면 알려 주세요.","en":"Please let me know when it's finished.","ja":"終わったら報告して","ipa":"終わったら報告して","latin":"","forms":{"casual":"끝나면 알려 줘.","polite":"끝나면 알려 주세요.","formal":"완료되면 알려 주시겠습니까?"},"note":"Completion should be verified before reporting it.","provenance":"Supporting practice"}]},{"id":"l17","number":17,"title":"Facts, plans & agreement","goal":"Keep the distinctions clear","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"相談した・決めた・実行したを混同しない","level":"Intermediate","lines":[{"id":"l17-01","ar":"아직 의논만 했어요.","en":"We've only discussed it so far.","ja":"まだ相談しただけ","ipa":"まだ相談しただけ","latin":"","forms":{"casual":"아직 의논만 했어.","polite":"아직 의논만 했어요.","formal":"아직 의논만 했습니다."},"note":"만 keeps the claim limited to discussion.","provenance":"Adapted · your stated instructions"},{"id":"l17-02","ar":"아직 합의 안 했어요.","en":"We haven't agreed yet.","ja":"まだ合意していない","ipa":"まだ合意していない","latin":"","forms":{"casual":"아직 합의 안 했어.","polite":"아직 합의 안 했어요.","formal":"아직 합의하지 않았습니다."},"note":"No agreement is being asserted.","provenance":"Adapted · your stated instructions"},{"id":"l17-03","ar":"그건 계획이고 아직 안 했어요.","en":"That's planned, but I haven't done it yet.","ja":"それは予定で、まだやっていない","ipa":"それは予定で、まだやっていない","latin":"","forms":{"casual":"그건 계획이고 아직 안 했어.","polite":"그건 계획이고 아직 안 했어요.","formal":"그것은 계획이며 아직 실행하지 않았습니다."},"note":"Keeps a plan distinct from execution.","provenance":"Adapted · your stated instructions"},{"id":"l17-04","ar":"확인된 것만 알려 주세요.","en":"Please tell me only what you've confirmed.","ja":"確認できたことだけ教えて","ipa":"確認できたことだけ教えて","latin":"","forms":{"casual":"확인된 것만 알려 줘.","polite":"확인된 것만 알려 주세요.","formal":"확인된 것만 알려 주시겠습니까?"},"note":"확인된 means confirmed; it does not certify the source is infallible.","provenance":"Adapted · your stated instructions"},{"id":"l17-05","ar":"이건 추측이에요.","en":"This is a guess.","ja":"これは推測","ipa":"これは推測","latin":"","forms":{"casual":"이건 추측이야.","polite":"이건 추측이에요.","formal":"이것은 추측입니다."},"note":"Label an inference as an inference.","provenance":"Adapted · your stated instructions"},{"id":"l17-06","ar":"근거가 뭐예요?","en":"What is the basis for that?","ja":"根拠は何？","ipa":"根拠は何？","latin":"","forms":{"casual":"근거가 뭐야?","polite":"근거가 뭐예요?","formal":"근거는 무엇입니까?"},"note":"Can sound challenging; use an appropriate tone.","provenance":"Adapted · your stated instructions"},{"id":"l17-07","ar":"결정하기 전에 조건을 확인하고 싶어요.","en":"I'd like to check the terms before deciding.","ja":"決める前に条件を確認したい","ipa":"決める前に条件を確認したい","latin":"","forms":{"casual":"결정하기 전에 조건을 확인하고 싶어.","polite":"결정하기 전에 조건을 확인하고 싶어요.","formal":"결정하기 전에 조건을 확인하고 싶습니다."},"note":"A study sentence, not legal advice or an acceptance.","provenance":"Supporting practice"},{"id":"l17-08","ar":"틀린 게 있으면 바로잡아 주세요.","en":"Please correct any errors.","ja":"間違いがあれば訂正して","ipa":"間違いがあれば訂正して","latin":"","forms":{"casual":"틀린 게 있으면 바로잡아 줘.","polite":"틀린 게 있으면 바로잡아 주세요.","formal":"잘못된 부분이 있으면 바로잡아 주시겠습니까?"},"note":"Ask for a correction rather than a new unsupported claim.","provenance":"Adapted · your stated instructions"}]},{"id":"l18","number":18,"title":"Thinking out loud","goal":"Keep your own voice","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"日常の独り言を、会話で使える短文にする","level":"Intermediate","lines":[{"id":"l18-01","ar":"재미있는 생각이 났어요.","en":"I thought of something interesting.","ja":"面白いことを思いついた","ipa":"面白いことを思いついた","latin":"","forms":{"casual":"재미있는 생각이 났어.","polite":"재미있는 생각이 났어요.","formal":"재미있는 생각이 났습니다."},"note":"A thought is not an implementation.","provenance":"Supporting practice"},{"id":"l18-02","ar":"일단 한번 해 보고 싶어요.","en":"I'd like to try it once first.","ja":"まず一回やってみたい","ipa":"まず一回やってみたい","latin":"","forms":{"casual":"일단 한번 해 보고 싶어.","polite":"일단 한번 해 보고 싶어요.","formal":"일단 한번 해 보고 싶습니다."},"note":"한번 often means give it a try, not a measured frequency.","provenance":"Supporting practice"},{"id":"l18-03","ar":"지금 좀 고민 중이에요.","en":"I'm a little undecided right now.","ja":"今ちょっと迷っている","ipa":"今ちょっと迷っている","latin":"","forms":{"casual":"지금 좀 고민 중이야.","polite":"지금 좀 고민 중이에요.","formal":"현재 조금 고민 중입니다."},"note":"고민 can be uncertainty or concern, depending on context.","provenance":"Supporting practice"},{"id":"l18-04","ar":"전이랑 생각이 달라졌어요.","en":"I've changed my mind since before.","ja":"前とは考えが変わった","ipa":"前とは考えが変わった","latin":"","forms":{"casual":"전이랑 생각이 달라졌어.","polite":"전이랑 생각이 달라졌어요.","formal":"이전과 생각이 달라졌습니다."},"note":"Acknowledges a change instead of rewriting the past.","provenance":"Supporting practice"},{"id":"l18-05","ar":"작은 일에도 기뻐요.","en":"Even small things make me happy.","ja":"小さいことでも嬉しい","ipa":"小さいことでも嬉しい","latin":"","forms":{"casual":"작은 일에도 기뻐.","polite":"작은 일에도 기뻐요.","formal":"작은 일에도 기쁨을 느낍니다."},"note":"The formal version describes feeling joy.","provenance":"Adapted · saved user chat"},{"id":"l18-06","ar":"할 일이 쌓여 있어요.","en":"Things I need to do are piling up.","ja":"やることが溜まっている","ipa":"やることが溜まっている","latin":"","forms":{"casual":"할 일이 쌓여 있어.","polite":"할 일이 쌓여 있어요.","formal":"해야 할 일이 쌓여 있습니다."},"note":"A present situation, without assigning a diagnosis.","provenance":"Adapted · saved user chat"},{"id":"l18-07","ar":"생각만 하지 말고 움직이고 싶어요.","en":"I want to act, not just think.","ja":"考えるだけじゃなく動きたい","ipa":"考えるだけじゃなく動きたい","latin":"","forms":{"casual":"생각만 하지 말고 움직이고 싶어.","polite":"생각만 하지 말고 움직이고 싶어요.","formal":"생각에만 그치지 않고 행동하고 싶습니다."},"note":"A wish to act, not proof of action.","provenance":"Supporting practice"},{"id":"l18-08","ar":"저도 좀 웃었어요.","en":"I laughed a little at myself too.","ja":"自分でもちょっと笑った","ipa":"自分でもちょっと笑った","latin":"","forms":{"casual":"나도 좀 웃었어.","polite":"저도 좀 웃었어요.","formal":"저도 조금 웃었습니다."},"note":"Keep the tone light; the specific joke comes from context.","provenance":"Supporting practice"}]},{"id":"l19","number":19,"title":"Repair a misunderstanding","goal":"Be clear without escalating","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"意味の取り違え・断り・境界線を言葉にする","level":"Intermediate","lines":[{"id":"l19-01","ar":"그런 뜻은 아니었어요.","en":"That wasn't what I intended.","ja":"そういうつもりじゃなかった","ipa":"そういうつもりじゃなかった","latin":"","forms":{"casual":"그런 뜻은 아니었어.","polite":"그런 뜻은 아니었어요.","formal":"그런 뜻은 아니었습니다."},"note":"Clarifies intention; it does not invalidate the other person's reaction.","provenance":"Supporting practice"},{"id":"l19-02","ar":"제 설명이 부족했어요.","en":"I didn't explain enough.","ja":"僕の説明が足りなかった","ipa":"僕の説明が足りなかった","latin":"","forms":{"casual":"내 설명이 부족했어.","polite":"제 설명이 부족했어요.","formal":"제 설명이 부족했습니다."},"note":"Takes responsibility for an incomplete explanation.","provenance":"Supporting practice"},{"id":"l19-03","ar":"그 부분은 다르다고 생각해요.","en":"I think that part is different.","ja":"そこは違うと思う","ipa":"そこは違うと思う","latin":"","forms":{"casual":"그 부분은 다르다고 생각해.","polite":"그 부분은 다르다고 생각해요.","formal":"그 부분은 다르다고 생각합니다."},"note":"Marks your judgement as your view.","provenance":"Supporting practice"},{"id":"l19-04","ar":"이번에는 어려워요.","en":"That would be difficult this time.","ja":"今回は難しい","ipa":"今回は難しい","latin":"","forms":{"casual":"이번에는 어려워.","polite":"이번에는 어려워요.","formal":"이번에는 어렵겠습니다."},"note":"Often functions as a refusal, not a request for persuasion.","provenance":"Supporting practice"},{"id":"l19-05","ar":"그건 그만해 주셨으면 좋겠어요.","en":"I'd like you to stop doing that.","ja":"それはやめてほしい","ipa":"それはやめてほしい","latin":"","forms":{"casual":"그건 그만해 줬으면 좋겠어.","polite":"그건 그만해 주셨으면 좋겠어요.","formal":"그것은 그만해 주셨으면 좋겠습니다."},"note":"A boundary remains a boundary in polite language.","provenance":"Supporting practice"},{"id":"l19-06","ar":"지금은 혼자 생각하고 싶어요.","en":"I'd like to think on my own right now.","ja":"今は一人で考えたい","ipa":"今は一人で考えたい","latin":"","forms":{"casual":"지금은 혼자 생각하고 싶어.","polite":"지금은 혼자 생각하고 싶어요.","formal":"지금은 혼자 생각하고 싶습니다."},"note":"States a present need for space.","provenance":"Supporting practice"},{"id":"l19-07","ar":"확인해 주셔서 감사해요.","en":"Thank you for checking.","ja":"確認してくれてありがとう","ipa":"確認してくれてありがとう","latin":"","forms":{"casual":"확인해 줘서 고마워.","polite":"확인해 주셔서 감사해요.","formal":"확인해 주셔서 감사합니다."},"note":"Shows appreciation for the actual check, not an invented outcome.","provenance":"Supporting practice"},{"id":"l19-08","ar":"다시 이야기하고 싶어요.","en":"I'd like to talk about it again.","ja":"改めて話したい","ipa":"改めて話したい","latin":"","forms":{"casual":"다시 이야기하고 싶어.","polite":"다시 이야기하고 싶어요.","formal":"다시 말씀 나누고 싶습니다."},"note":"A request to reopen a conversation, not a demand for agreement.","provenance":"Supporting practice"}]},{"id":"l20","number":20,"title":"A little more of you","goal":"Join your thoughts into longer lines","note":"Choose the relationship and situation first. Everyday polite is the default; formal is not simply a higher politeness score.","ja":"本人の関心に基づく練習用の言い換え　原文引用とは区別","level":"Intermediate","lines":[{"id":"l20-01","ar":"음악은 좋은데 발매 절차는 번거로워요.","en":"I like music, but the release process is a hassle.","ja":"音楽は好きだけど、配信手続きは面倒","ipa":"音楽は好きだけど、配信手続きは面倒","latin":"","forms":{"casual":"음악은 좋은데 발매 절차는 번거로워.","polite":"음악은 좋은데 발매 절차는 번거로워요.","formal":"음악은 좋지만 발매 절차는 번거롭습니다."},"note":"발매 refers to releasing music; it is different from live broadcasting.","provenance":"Adapted · saved user chat"},{"id":"l20-02","ar":"그 절차를 생각하면 만들기 시작하기가 어려워요.","en":"Knowing that process is waiting makes it hard to start creating.","ja":"その手続きがあると思うと、作り始めにくい","ipa":"その手続きがあると思うと、作り始めにくい","latin":"","forms":{"casual":"그 절차를 생각하면 만들기 시작하기가 어려워.","polite":"그 절차를 생각하면 만들기 시작하기가 어려워요.","formal":"그 절차를 생각하면 제작을 시작하기가 어렵습니다."},"note":"Describes your own experience without diagnosing a cause.","provenance":"Adapted · saved user chat"},{"id":"l20-03","ar":"평소에 제가 쓰는 말로 배우고 싶어요.","en":"I want to learn through the words I use every day.","ja":"自分が普段使う言葉で覚えたい","ipa":"自分が普段使う言葉で覚えたい","latin":"","forms":{"casual":"평소에 내가 쓰는 말로 배우고 싶어.","polite":"평소에 제가 쓰는 말로 배우고 싶어요.","formal":"평소에 제가 쓰는 말로 배우고 싶습니다."},"note":"An adaptation of the goal of this app.","provenance":"Adapted · this app request"},{"id":"l20-04","ar":"재미있어서 더 계속하고 싶어요.","en":"It's fun, so I want to keep going.","ja":"楽しいから、もっと続けたい","ipa":"楽しいから、もっと続けたい","latin":"","forms":{"casual":"재미있어서 더 계속하고 싶어.","polite":"재미있어서 더 계속하고 싶어요.","formal":"재미있어서 더 계속하고 싶습니다."},"note":"어서 connects a reason to your wish.","provenance":"Adapted · this app request"},{"id":"l20-05","ar":"상대에 맞게 말투를 바꾸고 싶어요.","en":"I want to adjust how I speak to the person.","ja":"相手に合わせて話し方を変えたい","ipa":"相手に合わせて話し方を変えたい","latin":"","forms":{"casual":"상대에 맞게 말투를 바꾸고 싶어.","polite":"상대에 맞게 말투를 바꾸고 싶어요.","formal":"상대에 맞게 말투를 바꾸고 싶습니다."},"note":"Relationship, consent, context and subject honorifics all matter.","provenance":"Adapted · this app request"},{"id":"l20-06","ar":"다른 나라를 알아갈수록 일본의 좋은 점도 느껴요.","en":"The more I learn about other countries, the more I appreciate Japan too.","ja":"海外を知るほど、日本の良さも感じる","ipa":"海外を知るほど、日本の良さも感じる","latin":"","forms":{"casual":"다른 나라를 알아갈수록 일본의 좋은 점도 느껴.","polite":"다른 나라를 알아갈수록 일본의 좋은 점도 느껴요.","formal":"다른 나라를 알아갈수록 일본의 좋은 점도 느낍니다."},"note":"A personal observation, not a ranking of cultures.","provenance":"Adapted · saved user chat"},{"id":"l20-07","ar":"결과뿐 아니라 실제로 뭘 했는지 알고 싶어요.","en":"I want to know not just the result, but what was actually done.","ja":"結果だけじゃなく、実際に何をしたか知りたい","ipa":"結果だけじゃなく、実際に何をしたか知りたい","latin":"","forms":{"casual":"결과뿐 아니라 실제로 뭘 했는지 알고 싶어.","polite":"결과뿐 아니라 실제로 뭘 했는지 알고 싶어요.","formal":"결과뿐 아니라 실제로 무엇을 했는지 알고 싶습니다."},"note":"Keeps a reported result distinct from its evidence.","provenance":"Adapted · your stated instructions"},{"id":"l20-08","ar":"제 말로 제대로 소통하고 싶어요.","en":"I want to connect genuinely through my own words.","ja":"自分の言葉で、ちゃんとつながりたい","ipa":"自分の言葉で、ちゃんとつながりたい","latin":"","forms":{"casual":"내 말로 제대로 소통하고 싶어.","polite":"제 말로 제대로 소통하고 싶어요.","formal":"제 말로 제대로 소통하고 싶습니다."},"note":"An original practice adaptation of the purpose of the course.","provenance":"Supporting practice"}]}],"families":[{"id":"go","title":"Go somewhere","subtitle":"Three speaking styles","level":"Developing","note":"The destination already includes 에. All time choices fit present or future plans. The sentence is context → destination → predicate.","itemLabel":"Choose the main chunk","contextLabel":"Choose the context","items":[{"ar":"학교에","en":"school","ja":"学校","ipa":"学校","latin":""},{"ar":"카페에","en":"a cafe","ja":"カフェ","ipa":"カフェ","latin":""},{"ar":"식당에","en":"a restaurant","ja":"飲食店","ipa":"飲食店","latin":""},{"ar":"집에","en":"my home","ja":"家","ipa":"家","latin":""},{"ar":"회사에","en":"the office","ja":"会社","ipa":"会社","latin":""},{"ar":"병원에","en":"a hospital","ja":"病院","ipa":"病院","latin":""},{"ar":"도서관에","en":"a library","ja":"図書館","ipa":"図書館","latin":""},{"ar":"공원에","en":"a park","ja":"公園","ipa":"公園","latin":""},{"ar":"바다에","en":"the seaside","ja":"海","ipa":"海","latin":""},{"ar":"산에","en":"the mountains } 배우고 싶어","polite":"{c} {x} 배우고 싶어요","formal":"{c} {x} 배우고 싶습니다"}},{"ar":"{c} {x} 연습하고 싶어요","en":"I want to practise {x} {c}.","ja":"{c}、{x}を練習したい","ipa":"{c}、{x}を練習したい","latin":"","forms":{"casual":"{c} {x} 연습하고 싶어","polite":"{c} {x} 연습하고 싶어요","formal":"{c} {x} 연습하고 싶습니다"}},{"ar":"{c} {x} 다시 배워요","en":"I learn {x} again {c}.","ja":"{c}、{x}を学び直す","ipa":"{c}、{x}を学び直す","latin":"","forms":{"casual":"{c} {x} 다시 배워","polite":"{c} {x} 다시 배워요","formal":"{c} {x} 다시 배웁니다"}},{"ar":"{c} {x} 조금씩 익혀요","en":"I gradually learn {x} {c}.","ja":"{c}、{x}を少しずつ身につける","ipa":"{c}、{x}を少しずつ身につける","latin":"","forms":{"casual":"{c} {x} 조금씩 익혀","polite":"{c} {x} 조금씩 익혀요","formal":"{c} {x} 조금씩 익힙니다"}},{"ar":"{c} {x} 계속 연습해요","en":"I keep practising {x} {c}.","ja":"{c}、{x}を練習し続ける","ipa":"{c}、{x}を練習し続ける","latin":"","forms":{"casual":"{c} {x} 계속 연습해","polite":"{c} {x} 계속 연습해요","formal":"{c} {x} 계속 연습합니다"}}]}],"culture":[{"title":"Start with everyday polite","text":"This course defaults to 해요체, everyday polite speech. It is a practical starting choice for someone you do not know well, not a guarantee of suitability in every situation.","ja":"初対面はPoliteを初期設定にする　迷ったら相手との関係・場面も確かめる","practice":"Introduce yourself politely, then listen to how the other person addresses you.","line":"l02-02","kind":"Language & context","sources":["dict"]},{"title":"Three styles, not a politeness ladder","text":"Casual, everyday polite and formal polite are not simply low, medium and high on one slider. Formality and respect overlap, but formal endings can be stiff in a personal conversation.","ja":"Formalが常に「もっと親切」ではない　文体の改まり方と相手への敬意を分ける","practice":"Compare one sentence in all three styles, keeping its purpose in mind.","line":"l01-01","kind":"Language & context","sources":["dict"]},{"title":"Casual speech needs a relationship","text":"An age difference alone does not decide whether casual speech is welcome. Shared expectations, setting and the particular relationship matter.","ja":"年下だから・友達になったからと自動的にタメ口に切り替えない","practice":"Ask 말 편하게 해도 돼요? before switching; the app cannot supply their consent.","line":"l10-08","kind":"Language & context","sources":["dict"]},{"title":"The listener and the subject are different","text":"Polite sentence endings address the listener. Subject honorifics such as -(으)시- respect the person whose action or state you mention. They are different choices.","ja":"요の有無だけでは足りない　相手の食事は드셨어요、自分の食事は먹었어요","practice":"Compare What did you eat? with I ate, rather than adding 시 everywhere.","line":"l05-03","kind":"Language & context","sources":["dict"]},{"title":"Do not elevate yourself by accident","text":"저 and 제 are humble first-person forms. 드리다 and 뵙다 can lower your action toward a respected person. Honorific vocabulary is not attached to every verb mechanically.","ja":"自分の行為と相手の行為を区別　自分に尊敬語を付けない","practice":"Practise 제가 확인하고 연락드릴게요.","line":"l15-06","kind":"Language & context","sources":["dict"]},{"title":"Avoid translating every “you”","text":"Korean often leaves an obvious subject or object unspoken. 너 is casual, and 당신 is not a neutral all-purpose replacement for English you.","ja":"英語のyouを全部너や당신にしない　主語を省くほうが自然な場面が多い","practice":"Say 어디에 사세요? without adding a second-person pronoun.","line":"l02-06","kind":"Language & context","sources":["dict"]},{"title":"Names and titles","text":"Names, roles and relationship terms are used according to context. 씨 and 님 are not interchangeable decorations you can add without considering the relationship.","ja":"呼び名は相手の希望を確認　役職や名前を推測で決めない","practice":"Ask how the person would like to be addressed.","line":"l12-06","kind":"Language & context","sources":["dict"]},{"title":"오빠, 형, 언니, 누나","text":"For the usual older-sibling senses: a male speaker uses 형 for an older brother and 누나 for an older sister; a female speaker uses 오빠 and 언니. Extended social uses still depend on the relationship.","ja":"話し手と相手の組み合わせで変わる　親しくない相手を勝手に家族呼びしない","practice":"Learn the family meanings first; ask before using a familiar social form of address.","line":"l12-06","kind":"Language & context","sources":["dict"]},{"title":"A kind ending is not consent","text":"A personal compliment or pet name can still cross a boundary when the grammar is polite. Formal compliment models here are for comparison, not automatic office scripts.","ja":"可愛い・会いたい・愛称は、敬語でも距離が近い　歓迎されるかは別問題","practice":"Use the boundary and permission lines in lesson 12.","line":"l12-07","kind":"Language & context","sources":["dict"]},{"title":"Greeting and goodbye are different jobs","text":"안녕하세요 is a polite greeting. Goodbye depends on whether the other person stays or leaves; 안녕히 계세요 and 안녕히 가세요 are not chosen by a single generic translation.","ja":"相手が残るか、帰るかで別の挨拶になる","practice":"For now, end an online conversation with 오늘 이야기해서 좋았어요.","line":"l10-06","kind":"Language & context","sources":["dict"]},{"title":"Literal business formulas can sound odd","text":"A Japanese business greeting need not have a one-to-one Korean formula. Translate its function: a greeting, thanks, introduction or request, according to the actual exchange.","ja":"「お世話になっております」を毎回一語に置き換えない　挨拶・お礼・自己紹介に分ける","practice":"Start with a greeting and a concise introduction to your work.","line":"l14-01","kind":"Language & context","sources":["dict"]},{"title":"Plans are not completed actions","text":"갈 거예요 is a plan; 가고 있어요 describes going; 갔어요 describes having gone. Discussion, consent and completion should also remain distinct in a meeting.","ja":"予定・進行中・完了を時制でも区別する","practice":"Use lesson 17 to say exactly what has and has not been agreed.","line":"l17-03","kind":"Language & context","sources":["dict"]},{"title":"Numbers change with the counter","text":"Native and Sino-Korean numbers have different common uses. Before counters, 하나, 둘, 셋, 넷 often become 한, 두, 세, 네. Learn the whole number-and-counter expression.","ja":"単語の数字だけでなく、한 개・두 잔などのまとまりで覚える","practice":"When ordering, practise one complete expression rather than guessing from English.","line":"l05-05","kind":"Language & context","sources":["dict"]},{"title":"Your words, not your entire private archive","text":"Selected self-attributed LINE and user-chat language informed the course. The 160 examples also include supporting exercises and adaptations. The app does not contain the raw logs, contact list or live Keep Memo body.","ja":"全160文が本人の原文ではない　教材用の言い換えと補助例文をラベルで区別","practice":"Read the source label on a lesson line. Keep Memo remains unacquired.","line":"l20-03","kind":"Course provenance","sources":["dict"]}],"sounds":[{"symbol":"한글","title":"Read the syllable block","text":"A written Hangul block combines consonant and vowel letters. Learn the letters as well as the word, rather than treating each block as an unexplained picture.","ja":"文字の分解も少しずつ　この教材はIPAやカタカナ発音を捏造しない","example":"l03-01"},{"symbol":"ㅇ","title":"Silent at the start, nasal at the end","text":"Initial ㅇ is a placeholder before a vowel. At the end of a syllable it represents the ng sound. Compare the positions rather than giving it one English letter in every word.","ja":"先頭のㅇと末尾のㅇは役割が違う","example":"l03-03"},{"symbol":"ㅓ · ㅗ","title":"Do not collapse different vowels","text":"Listen to Korean vowel contrasts in complete words. Neither Japanese katakana nor a single English spelling is a reliable pronunciation model.","ja":"日本語の母音だけに丸めず、音声で比較する","example":"l02-07"},{"symbol":"ㅡ · ㅜ","title":"Another important vowel contrast","text":"Keep ㅡ and ㅜ distinct. Watch a trusted speaker’s mouth and compare your own recording; spelling alone does not specify every detail of the sound.","ja":"口の形と実際の音をセットで練習する","example":"l03-04"},{"symbol":"받침","title":"A final consonant is not a full extra syllable","text":"Korean syllable-final consonants have restricted pronunciations. Do not automatically add a Japanese vowel after each final consonant.","ja":"パッチムの後に余計な母音を足さない","example":"l05-02"},{"symbol":"연음","title":"Sounds connect across a boundary","text":"A final consonant may link to a following vowel-initial syllable. Listen to complete inflected words and phrases, not only dictionary forms in isolation.","ja":"単語帳の形と、文に入った形の音を聴き比べる","example":"l05-06"},{"symbol":"ㄱ · ㅋ · ㄲ","title":"Plain, aspirated and tense are different","text":"These consonant series are distinguished in Korean. English and Japanese spelling shortcuts cannot fully replace listening and guided feedback.","ja":"平音・激音・濃音は音声で確認　自動採点は行わない","example":"l04-02"},{"symbol":"요","title":"Keep the ending audible","text":"Sentence endings carry important social information. Practise the whole ending rather than dropping 요 when you run out of breath.","ja":"文末までひとまとまりで発音する","example":"l03-02"},{"symbol":"있어요","title":"Spelling and connected pronunciation differ","text":"Changes such as tensification, nasal assimilation and linking are why this app does not label generated Latin letters as verified IPA.","ja":"文字列変換だけで正確な発音記号とはしない","example":"l06-07"},{"symbol":"질문 ↗","title":"Intonation helps distinguish a question","text":"In everyday polite speech, the same word sequence can function as a statement or a question with context and intonation. Listen to the whole turn.","ja":"語尾を機械的に上げるだけではなく、文脈もセットで","example":"l03-06"},{"symbol":"속도","title":"Slow is a practice aid","text":"Slowing synthesized audio can help you hear pieces, but it is not a separate native recording. Return to normal speed and practise joining the phrase.","ja":"Slowは速度変更　自然な速度でも聴き直す","example":"l04-02"},{"symbol":"내 목소리","title":"Compare, do not invent a score","text":"Record, listen and compare. This app does not assign an unvalidated pronunciation percentage or claim a human teacher has checked your voice.","ja":"録音は自己比較用　発音の合否や習得を保証しない","example":"l03-05"}],"scenes":[{"title":"A first conversation","situation":"Meet a new person. Start in everyday polite and do not presume casual-speech permission.","prompts":[["Greet the person.","l02-01"],["Introduce yourself.","l02-03"],["Say where you live.","l02-05"],["Say you would enjoy talking again.","l02-08"]]},{"title":"Learn together","situation":"Explain your level and ask for help without pretending you understood.","prompts":[["Say what you are learning.","l03-01"],["Say you are a beginner.","l03-02"],["Ask for slower speech.","l04-02"],["Ask about the meaning.","l04-03"]]},{"title":"Food before everything","situation":"Talk about food with someone you know. Use the register appropriate to that relationship.","prompts":[["Say you are hungry.","l05-01"],["Say you will eat first.","l05-02"],["Say you want coffee.","l05-05"],["Say the food is good.","l05-06"]]},{"title":"After the gym","situation":"Talk about your actual routine and a planned call.","prompts":[["Say you finished at the gym.","l06-02"],["Say how you will get home.","l06-03"],["Say you are tired.","l06-05"],["Say when you will call.","l06-08"]]},{"title":"Share your song","situation":"Tell someone about a song and ask for their impressions, not necessarily criticism.","prompts":[["Say you like making music.","l07-01"],["Say you made a song.","l07-02"],["Ask them to listen.","l07-03"],["Ask for their impressions.","l07-08"]]},{"title":"Arrange another conversation","situation":"Propose a time, check the schedule and only then agree.","prompts":[["Ask about availability.","l13-01"],["Suggest tomorrow evening.","l13-02"],["Say you will check.","l13-05"],["Confirm the time works.","l13-06"]]},{"title":"A business introduction","situation":"Use an appropriately polite style; do not reveal other people’s private information.","prompts":[["Thank them for their time.","l14-08"],["Describe your company activity.","l14-01"],["Say you connect people.","l14-03"],["Offer to send materials.","l15-07"]]},{"title":"Ask for a concrete result","situation":"Keep a firm request clear. A progress statement must not become a false completion claim.","prompts":[["Ask how far the work has got.","l16-01"],["Ask to see the actual result.","l16-03"],["Ask to continue, not restart.","l16-05"],["Ask for ready work first.","l16-06"]]}],"sources":[{"id":"dict","title":"National Institute of Korean Language · Korean-English Learners’ Dictionary","url":"https://krdict.korean.go.kr/eng/mainAction","scope":"Official dictionary to check meanings, usage, pronunciation and examples. The course wording is original, not a copied dictionary corpus; not every entry was individually checked."},{"id":"sejong","title":"King Sejong Institute · Nuri learning resources","url":"https://nuri.iksi.or.kr/front/main/main.do","scope":"Official Korean-learning resources for further study. No endorsement or complete course review is implied."},{"id":"speech","title":"MDN · SpeechSynthesis.getVoices","url":"https://developer.mozilla.org/en-US/docs/Web/API/SpeechSynthesis/getVoices","scope":"How the app discovers device voices. Browser support does not prove audio quality on your actual phone."}]}</script><script>/* Pure learning logic; browser and Node share the same implementation. */
(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else root.WahranEngine=api;})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';
function create(data){
 const fixed=new Map([...data.words,...data.lessons.flatMap(l=>l.lines)].map(x=>[x.id,x]));
 function integer(v,max){if(!Number.isInteger(v)||v<0||v>=max)throw new RangeError('Invalid learning item index');return v}
 function index(f,t,i,c){return integer(f,5)*2000+integer(t,10)*200+integer(i,20)*10+integer(c,10)}
 function combo(n){integer(n,10000);const family=Math.floor(n/2000),frame=Math.floor(n%2000/200),item=Math.floor(n%200/10),context=n%10,F=data.families[family],fr=F.frames[frame],it=F.items[item],ct=F.contexts[context];const x={id:'c'+String(n).padStart(5,'0'),family,frame,item,context,n,note:F.note,kind:'combination'};for(const k of['ar','en','latin','ipa','ja'])x[k]=fr[k].replace('{x}',it[k]).replace('{c}',ct[k]);return x}
 function entry(id){if(typeof id!=='string')return null;if(fixed.has(id))return fixed.get(id);if(/^c\d{5}$/.test(id)&&+id.slice(1)<10000)return combo(+id.slice(1));return null}
 function normalize(s){return String(s??'').toLowerCase().normalize('NFKC').replace(/[?!.,:;\-/]/g,' ').replace(/\s+/g,' ').trim()}
 function matches(x,q){const terms=normalize(q).split(' ').filter(Boolean);const hay=normalize([x.ar,x.latin,x.en,x.ja].join(' '));return terms.every(t=>hay.includes(t))}
 function sameAnswer(a,b){return normalize(a)===normalize(b)}
 function shuffle(input,random=Math.random){const a=[...input];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
 function quiz(target,pool){let used=new Set([target.en]);let distractors=shuffle(pool).filter(x=>{if(used.has(x.en))return false;used.add(x.en);return true}).slice(0,3);const choices=shuffle([target,...distractors]);return{target,choices,correct:choices.findIndex(x=>x.id===target.id)}}
 function emptyState(){return{version:1,course:'wahran-ko-v1',register:data.meta.activeRegister||'polite',saved:[],reviews:{},completed:[],lastLesson:'l01',settings:{voice:'',rate:.85,pause:4,repeats:2,latin:false},stats:{answers:0,correct:0,spoken:0},session:null}}
 function grade(state,id,result,now=Date.now()){if(!entry(id)||!['again','good'].includes(result)||!Number.isFinite(now)||now<0)throw new Error('Invalid review');const prev=state.reviews[id]||{streak:0,attempts:0};const streak=result==='good'?Math.min(prev.streak+1,6):0;const days=[0,1,3,7,14,30,60];return{...state,reviews:{...state.reviews,[id]:{streak,attempts:prev.attempts+1,due:now+(result==='again'?600000:days[streak]*86400000)}}}}
 function due(state,now=Date.now()){return Object.entries(state.reviews).filter(([id,r])=>r.due<=now&&entry(id)).sort((a,b)=>a[1].due-b[1].due).map(([id])=>entry(id))}
 function restore(text){if(typeof text!=='string'||text.length>2000000)throw new Error('Backup is too large');let s;try{s=JSON.parse(text)}catch{throw new Error('Not a valid JSON backup')}if(!s||Array.isArray(s)||s.version!==1||s.course!=='wahran-ko-v1'||Object.hasOwn(s,'__proto__'))throw new Error('Unsupported backup');if(s.register!==(data.meta.activeRegister||'polite'))throw new Error('This backup belongs to a different speaking style. Select that style first.');const clean=emptyState();
  if(!Array.isArray(s.saved)||s.saved.length>11160||s.saved.some(id=>!entry(id)))throw new Error('Invalid saved items');clean.saved=[...new Set(s.saved)];
  if(!s.reviews||Array.isArray(s.reviews)||typeof s.reviews!=='object'||Object.keys(s.reviews).length>11160)throw new Error('Invalid review data');

function renderComboResults(){const all=[];for(let n=0;n<10000;n++){const x=E.combo(n);if(E.matches(x,comboQuery))all.push(x)}$('#combo-results').innerHTML=`<div class="count">${all.length.toLocaleString()} matching combinations</div>${all.slice(0,comboLimit).map(x=>`<button class="lesson-row" data-combo="${x.n}"><span class="lesson-info"><strong>${esc(x.en)}</strong><small>${String(x.n+1).padStart(5,'0')} · ${esc(D.families[x.family].title)}</small></span><span class="arrow">›</span></button>`).join('')}${all.length>comboLimit?'<div class="spacer"></div><button class="secondary wide" data-action="more-combos">Show 20 more</button>':''}${all.length?'':'<div class="empty">No matching combinations</div>'}`}

function renderSpeak(){const due=E.due(S).length;main.innerHTML=title('Practice that turns into speech','Listen. Say it. Repeat.','A little listening. A little recall. Your own voice.')+`<label for="practice-level">Meaning / listening practice range</label><select id="practice-level">${options([{value:'starter',label:'Foundation · lessons 1–7'},{value:'developing',label:'Developing · lessons 8–14'},{value:'intermediate',label:'Intermediate practice · lessons 15–20'},{value:'all',label:'All 1,000 words & 160 examples'}],practiceLevel)}</select><div class="spacer"></div><div class="stack">${[['session-setup','headphones','Shadowing session','Hear a line, pause, say it back. 5–30 minutes.'],['quiz-listen','headphones','Train your ear','Listen first. Choose the English meaning.'],['quiz-read','book','Connect sound and meaning','Read Korean, then choose the meaning.'],['chunk-random','build','Put the chunks together','Rebuild a useful sentence from three pieces.'],['review','slow','Your spaced review',due?`${due} items are ready to revisit.`:'Nothing due yet. Practise a line to start.']].map(([action,k,h,p])=>`<button class="card activity" data-action="${action}"><span class="activity-icon">${icon(k)}</span><span><strong>${h}</strong><small>${p}</small></span></button>`).join('')}</div><p class="metric-inline">${S.stats.answers} meaning / order answers · ${S.stats.correct} correct · ${S.stats.spoken} self-rated speaking attempts</p><section class="section"><div class="section-title"><h2>Real situations</h2><span class="eyebrow">8 guided scenes</span></div><div class="lesson-list">${D.scenes.map((x,i)=>`<button class="lesson-row" data-scene="${i}"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="lesson-info"><strong>${esc(x.title)}</strong><small>4 speaking turns · model replies</small></span><span class="arrow">›</span></button>`).join('')}</div></section><section class="section"><div class="section-title"><h2>Get to know the sounds</h2><span class=
