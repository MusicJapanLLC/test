function openWord(id){const x=E.entry(id);if(!x)return;openModal(x.pos?'Vocabulary':'Useful line',phrase(x)+`<p class="help">${esc(x.pos?D.topics.find(t=>t.id===x.topic).description:x.note||'Use this line in a short exchange.')}</p>${x.examples?.length?`<h3>In a conversation</h3><div class="spacer"></div>${x.examples.map(id=>phrase(E.entry(id),{mini:true})).join('')}`:''}<div class="assessment"><button class="secondary" data-grade="${id}" data-result="again">Review again soon</button><button class="primary" data-grade="${id}" data-result="good">I can recall this</button></div><p class="help">Self-review: “again” in 10 minutes; successful reviews at increasing day intervals.</p>`)}
function openPractice(id){const x=E.entry(id);if(!x)return;openModal('Your pronunciation',phrase(x,{practice:false})+`<div id="speech-error" class="speech-error" role="alert"></div><div class="record-panel"><div class="record-label">1. LISTEN &nbsp; 2. RECORD &nbsp; 3. COMPARE</div><button class="primary wide" data-action="record" id="record-button">${icon('mic')} Record my voice</button><p id="record-status" class="help">Up to 60 seconds. Your recording stays on this device.</p><div id="learner-audio"></div><label class="upload-label">Or import my Voice Memo<input id="learner-file" type="file" accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg"></label></div><div class="checklist"><label><input type="checkbox"> I paid attention to consonants and final sounds.</label><label><input type="checkbox"> I joined the line instead of adding extra vowels.</label><label><input type="checkbox"> I can say the meaning without reading English.</label></div><p class="help"><strong>No automatic pronunciation score</strong><br>Listen to your recording and compare. Device TTS is not a reliable judge of your pronunciation.</p><div class="assessment"><button class="secondary" data-spoken="${id}" data-result="again">Need another try</button><button class="primary" data-spoken="${id}" data-result="good">I said it comfortably</button></div><details class="section"><summary class="small muted">Use my own local reference audio</summary><p class="help">Import a recording you have permission to use. A native speaker’s line can replace TTS for this item. Imported audio is not automatically verified and is not included in progress backups.</p><label class="upload-label">Add a reference for this exact line<input id="reference-file" type="file" accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg"></label><button class="text-button" data-remove-reference="${id}">Remove this reference</button><p id="reference-status" class="help"></p></details>`);practiceId=id;recorder.onStatus=(status)=>{recording=status==='recording';const b=$('#record-button'),s=$('#record-status');if(!b)return;b.innerHTML=status==='recording'?`${icon('mic')} Stop recording`:status==='permission'?'Waiting for microphone…':`${icon('mic')} Record my voice`;b.classList.toggle('recording',recording);b.disabled=status==='permission';if(s)s.textContent=status==='recording'?'Recording… tap Stop when finished. Maximum 60 seconds.':status==='permission'?'Allow microphone access in the browser prompt. Closing this panel cancels the request.':'Your audio stays here. Listen and compare with the model.'};if(!navigator.mediaDevices?.getUserMedia||!window.isSecureContext)$('#record-status').textContent='Direct recording is unavailable in this context. Import a Voice Memo below. No upload is made.'}
function learnerBlob(blob){if(!$('#learner-audio'))return;if(learnerURL)URL.revokeObjectURL(learnerURL);learnerURL=URL.createObjectURL(blob);$('#learner-audio').innerHTML=`<audio controls playsinline preload="metadata" src="${learnerURL}" aria-label="My recorded voice"></audio><p class="small muted">My recording · temporary until this panel closes</p>`;$('#learner-audio audio').addEventListener('play',()=>stopAudio());$('#learner-audio audio').addEventListener('error',()=>showError('This recording cannot be decoded by your browser. Try MP3, M4A or WAV.'))}
function grade(id,result,spoken=false){S=E.grade(S,id,result);if(spoken)S.stats.spoken++;persist();toast(result==='again'?'Saved for another try in 10 minutes.':'Review saved. Your next revisit is scheduled.');if(tab==='learn'&&lessonId)renderLesson();if(tab==='words')renderWordResults()}
function startQuiz(mode){let pool,queue;if(mode==='review'){queue=E.shuffle(E.due(S));if(!queue.length){toast('Nothing is due yet. Self-review a word or phrase first.');return}pool=[...D.words,...D.lessons.flatMap(x=>x.lines),...queue]}else{const ranges={starter:[0,7,0,100],developing:[7,14,100,350],intermediate:[14,20,350,1000],all:[0,20,0,1000]},r=ranges[practiceLevel];pool=[...D.lessons.slice(r[0],r[1]).flatMap(x=>x.lines),...D.words.slice(r[2],r[3])];queue=E.shuffle(pool).slice(0,10)}quiz={mode,queue,pool,at:0,correct:0,answered:false};openModal(mode==='listen'?'Listening practice':mode==='review'?'Spaced review':'Meaning practice','');renderQuiz()}
function renderQuiz(){if(!quiz)return;if(quiz.at>=quiz.queue.length){modal.innerHTML=`<h2>Good practice.</h2><p class="help">${quiz.correct} / ${quiz.queue.length} meanings matched in this session. Missed items are scheduled for another try.</p><button class="primary wide" data-action="close-dialog">Keep learning</button>`;return}quiz.q=E.quiz(quiz.queue[quiz.at],quiz.pool);quiz.answered=false;const x=quiz.q.target;modal.innerHTML=`<div class="row between count"><span>${quiz.mode==='listen'?'Listen first':'Choose the English meaning'}</span><span>${quiz.at+1} / ${quiz.queue.length}</span></div><div class="progress-track"><span style="width:${quiz.at/quiz.queue.length*100}%"></span></div>${quiz.mode==='listen'?`<div class="card"><button class="primary wide" data-play="${x.id}">${icon('headphones')} Listen to the line</button><div class="source-tag" data-reference-label="${x.id}">Device Korean TTS · approximate</div></div>`:phrase(x,{practice:false,english:false,mini:true})}<div id="speech-error" class="speech-error" role="alert"></div><div class="options">${quiz.q.choices.map((c,i)=>`<button class="option" data-choice="${i}">${esc(c.en)}</button>`).join('')}</div><div id="quiz-feedback" class="feedback" role="status"></div><div id="quiz-next-slot"></div><p class="help">${quiz.mode==='review'?'Due items from your own reviews.':'Practice range: '+practiceLevel+'. Change the range on the Speak screen.'} Listening uses the selected voice; no speech recognition is running.</p>`;loadReference(x.id)}
function quizAnswer(i){if(!quiz||quiz.answered)return;quiz.answered=true;const right=i===quiz.q.correct,x=quiz.q.target;S.stats.answers++;if(right){quiz.correct++;S.stats.correct++}S=E.grade(S,x.id,right?'good':'again');persist();$$('[data-choice]').forEach(b=>{b.disabled=true;if(+b.dataset.choice===quiz.q.correct)b.classList.add('correct');else if(+b.dataset.choice===i)b.classList.add('wrong')});$('#quiz-feedback').innerHTML=`<strong>${right?'That’s it.':'Not quite — here’s the meaning.'}</strong><div class="ar" lang="ko-KR">${esc(x.ar)}</div><div class="en">${esc(x.en)}</div><div class="ja-inline" lang="ja">${esc(x.ipa)}</div>`;$('#quiz-next-slot').innerHTML='<button class="primary wide" data-action="quiz-next">Next line '+icon('arrow')+'</button>'}
function startChunk(n){const x=E.combo(n),F=D.families[x.family],fr=F.frames[x.frame];chunkQuiz={x,parts:[F.contexts[x.context].ar,F.items[x.item].ar,fr.ar.replace('{c}','').replace('{x}','').trim()],selected:[],order:E.shuffle([0,1,2]),answered:false};openModal('Chunk builder','');renderChunk()}

function renderChunk(){const q=chunkQuiz;modal.innerHTML=`<div class="eyebrow">Say this with three pieces</div><h2 class="section">${esc(q.x.en)}</h2><p class="help">Tap the chunks in spoken order. Korean reads left to right. Tap a chosen chunk to return it.</p><div class="answer-slots" aria-label="Your sentence">${q.selected.map((i,pos)=>`<button data-unpick="${pos}" lang="ko-KR">${esc(q.parts[i])}</button>`).join('')}</div><div class="chip-pool">${q.order.filter(i=>!q.selected.includes(i)).map(i=>`<button data-pick="${i}" lang="ko-KR">${esc(q.parts[i])}</button>`).join('')}</div><button class="primary wide" data-action="check-chunks" ${q.selected.length!==3?'disabled':''}>Check my sentence</button><div id="chunk-feedback" class="feedback" role="status"></div><div id="chunk-next"></div><p class="help">One of the 10,000 constrained combinations. Word order is checked; pronunciation is not automatically graded.</p>`}
function checkChunks(){const q=chunkQuiz;if(q.answered)return;q.answered=true;const right=E.sameAnswer(q.selected.map(i=>q.parts[i]).join(' '),q.x.ar);S.stats.answers++;if(right)S.stats.correct++;S=E.grade(S,q.x.id,right?'good':'again');persist();$('#chunk-feedback').innerHTML=`<strong>${right?'You built it.':'Here is a model order.'}</strong><div class="ar">${esc(q.x.ar)}</div><div class="ja-inline" lang="ja">${esc(q.x.ipa)}</div><button class="secondary" data-play="${q.x.id}">${icon('play')} Listen</button>`;$('#chunk-next').innerHTML='<button class="primary wide" data-action="chunk-random">Try another combination</button>';$$('[data-pick],[data-unpick],[data-action="check-chunks"]').forEach(b=>b.disabled=true)}
function openScene(n){scene={n,at:0};openModal('Guided conversation','');renderScene()}
function renderScene(){const s=D.scenes[scene.n];if(scene.at>=s.prompts.length){modal.innerHTML=`<h2>Now join the turns.</h2><p class="help">${esc(s.situation)}</p>${s.prompts.map(([p,id])=>phrase(E.entry(id),{mini:true})).join('')}<button class="primary wide" data-action="close-dialog">Finish the scene</button>`;loadVisibleReferences();return}const[p,id]=s.prompts[scene.at];modal.innerHTML=`<div class="eyebrow">${esc(s.title)} · turn ${scene.at+1} / 4</div><h2 class="section">${esc(p)}</h2><p class="help">${esc(s.situation)}</p><div class="try">Say a reply out loud first. Then compare with the model. This is guided roleplay, not live AI conversation.</div><button class="secondary wide" data-action="scene-model">Show a model reply</button><div id="scene-model"></div><div class="spacer"></div><button class="primary wide" data-action="scene-next">Next turn ${icon('arrow')}</button>`}
function sessionSetup(){const selected=lessonId||S.lastLesson;openModal('Listen → pause → speak',`<h2>Give your voice some time.</h2><div class="fields"><div><label for="session-pool">What to practise</label><select id="session-pool">${options([...D.lessons.map(l=>({value:l.id,label:`${l.number}. ${l.title}`})),{value:'all',label:'All 160 lesson lines'},{value:'saved',label:'My saved words & lines'}],selected)}</select></div><div><label for="session-minutes">Session length</label><select id="session-minutes">${options([{value:5,label:'5 minutes'},{value:15,label:'15 minutes'},{value:30,label:'30 minutes'}],15)}</select></div></div><div class="try"><strong>A simple rhythm</strong>${S.settings.repeats} plays per line, with ${S.settings.pause} seconds to speak after each play. Change the rhythm in Settings.</div><p class="help">Keep this app visible. Switching apps pauses the session. iPhone playback can still require another tap if the operating system interrupts audio.</p><button class="primary wide" data-action="session-start">${icon('play')} Start my session</button><div id="speech-error" class="speech-error" role="alert"></div>`)}
function beginSession(){const key=$('#session-pool').value,mins=+$('#session-minutes').value,pool=key==='saved'?S.saved.map(id=>E.entry(id)).filter(Boolean):key==='all'?D.lessons.flatMap(l=>l.lines):D.lessons.find(l=>l.id===key).lines;if(!pool.length){toast('Save a word or line first, or choose a lesson.');return}session={pool,step:0,plays:0,remaining:mins*60000,end:Date.now()+mins*60000,active:false,runToken:0};modal.innerHTML=`<div class="eyebrow">Your speaking time</div><div class="row between"><div id="session-clock" class="session-clock"></div><span class="pill" id="session-count">0 plays</span></div><div id="session-line"></div><div id="session-stage" class="session-stage"></div><div id="speech-error" class="speech-error" role="alert"></div><div class="row"><button id="session-toggle" class="primary wide" data-action="session-toggle">Pause</button><button class="secondary" data-action="session-skip">Next line</button></div><p class="help">Listen, then say it during the gap. Playback alone does not mark a phrase as learned.</p>`;runSession()}
function updateSessionControls(){if(!session||!$('#session-toggle'))return;$('#session-toggle').textContent=session.active?'Pause':'Resume';const remain=session.active?Math.max(0,session.end-Date.now()):session.remaining;$('#session-clock').textContent=`${Math.floor(remain/60000)}:${String(Math.floor(remain%60000/1000)).padStart(2,'0')}`;$('#session-count').textContent=`${session.plays} plays`}
async function runSession(){if(!session)return;const s=session;s.active=true;s.end=Date.now()+s.remaining;const token=++s.runToken;updateSessionControls();clearInterval(sessionClock);sessionClock=setInterval(()=>{updateSessionControls();if(session?.active&&Date.now()>=session.end){pauseSession();$('#session-stage').textContent='Session finished. Say one favourite line from memory.';$('#session-toggle').disabled=true}},500);
 while(session===s&&s.active&&token===s.runToken){const x=s.pool[Math.floor(s.step/S.settings.repeats)%s.pool.length];$('#session-line').innerHTML=phrase(x,{practice:false,mini:true});$('#session-stage').textContent=`Listen · repetition ${s.step%S.settings.repeats+1} / ${S.settings.repeats}`;loadReference(x.id);try{const ok=await playEntry(x.id);if(!ok||session!==s||!s.active||token!==s.runToken)break;s.plays++;updateSessionControls();$('#session-stage').textContent=`Your turn · say it out loud (${S.settings.pause} seconds)`;await wait(S.settings.pause*1000);if(session!==s||!s.active||token!==s.runToken)break;s.step++}catch(e){if(session===s){pauseSession();showError(e.message)}break}}
}
function renderSettings(){const voices=speech.voices();openModal('Settings & your data',`<h2>Keep it yours.</h2><div class="notice">Korean device synthesis, not human recordings. This is an AI-authored learning draft; a complete native-speaker review has not been performed.</div><div class="fields"><div><label for="voice-select">Korean voice on this device</label><select id="voice-select">${options([{value:'',label:'Automatic · prefer ko-KR'},...voices.map(v=>({value:v.voiceURI,label:`${v.name} · ${v.lang}`}))],S.settings.voice)}</select><p id="voice-info" class="help">${voices.length?`${voices.length} Korean voice(s) detected.`:'No Korean voice exposed by this browser. Add a Korean system voice and refresh, or use a local reference. English voices will not be substituted.'}</p><button class="secondary" data-action="refresh-voices">Refresh voices</button></div><div><label for="speech-rate">Speaking speed</label><select id="speech-rate">${options([{value:.6,label:'0.60 · very slow'},{value:.75,label:'0.75 · slow'},{value:.85,label:'0.85 · comfortable'},{value:1,label:'1.00 · normal'},{value:1.1,label:'1.10 · quicker'}],S.settings.rate)}</select></div><div class="field-row"><div><label for="pause-setting">Speaking gap</label><select id="pause-setting">${options([2,3,4,5,6,8,10,12].map(n=>({value:n,label:n+' seconds'})),S.settings.pause)}</select></div><div><label for="repeats-setting">Repetitions</label><select id="repeats-setting">${options([1,2,3,4].map(n=>({value:n,label:n+' per line'})),S.settings.repeats)}</select></div></div></div><label class="toggle">Show additional study notes<input id="latin-setting" type="checkbox" ${S.settings.latin?'checked':''}></label><button class="primary wide" data-action="test-voice">${icon('play')} Test Korean audio</button><div id="speech-error" class="speech-error" role="alert"></div><details class="section"><summary class="small muted">Audio & microphone help</summary><p class="help">Use a regular browser, not a document preview. A Korean voice must be exposed to the browser. Refresh after voices load. Some device voices use a network service.</p><p class="help">Recording needs a supported secure context and microphone permission. Use Voice Memo import when it is unavailable. No recording is uploaded by this app. The included local launcher works on this computer; an HTTP LAN address is not guaranteed to permit a phone microphone.</p></details><section class="section"><h3>Your progress · ${esc(REGISTERS[REGISTER].label)}</h3><p class="help">${storageOK?'Local storage available.':'Storage is currently temporary.'} ${S.saved.length} saved items. Progress is separate from Arabic Wahran and separate for each speaking style. Export before moving to another browser or URL. This backup can be imported only while the matching style is selected.</p><button class="secondary wide" data-action="export">Export progress</button><label class="upload-label">Import progress backup<input id="backup-file" type="file" accept="application/json,.json"></label><p class="help">Reference recordings and temporary microphone recordings are not included in progress backups. Keep your original audio files.</p><button class="text-button" data-action="reset">Reset this style’s progress</button></section><section class="section"><h3>Content & privacy</h3><p class="help">1,000 distinct headwords · 160 lesson examples with 3 authored speaking styles · 10,000 constrained combinations per style · 14 language/context notes. Three style variants do not count as three vocabulary words.</p><p class="help">Selected self-attributed saved LINE and chat expressions informed some lines. Other lines are supporting exercises, labelled separately. Live Keep Memo body was not acquired. No raw chats, contact lists, message identifiers, tokens, analytics or app-side uploads are included.</p><p class="ja-inline" lang="ja">未公開のHTML版　公開URLやiPhone実機での動作は未確認</p><button class="secondary wide" data-action="sources">Course notes & references</button><p class="footer-note">Wahran Korean ${D.meta.version} · ${D.meta.built}</p></section>`)}

function refreshVoices(){const voices=speech.voices();if(!$('#voice-select'))return;$('#voice-select').innerHTML=options([{value:'',label:'Automatic · prefer ko-KR'},...voices.map(v=>({value:v.voiceURI,label:`${v.name} · ${v.lang}`}))],S.settings.voice);$('#voice-info').textContent=voices.length?`${voices.length} Korean voice(s) detected.`:'No Korean voice exposed by this browser. Add a Korean system voice and reopen, or import a local reference.'}

function updateSaved(id){const i=S.saved.indexOf(id);if(i<0)S.saved.push(id);else S.saved.splice(i,1);persist();$$(`[data-save="${id}"]`).forEach(b=>{b.classList.toggle('saved',S.saved.includes(id));b.setAttribute('aria-pressed',String(S.saved.includes(id)));b.setAttribute('aria-label',S.saved.includes(id)?'Unsave phrase':'Save phrase')});toast(S.saved.includes(id)?'Saved to your practice collection.':'Removed from saved items.')}
function saveFile(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function audioFile(file){if(!file)throw new Error('Choose an audio file.');if(file.size>8*1024*1024)throw new Error('Choose an audio file smaller than 8 MB.');if(!file.type.startsWith('audio/')&&!/\.(m4a|mp3|wav|webm|ogg|aac|mp4)$/i.test(file.name))throw new Error('Choose an MP3, M4A, WAV or other audio file.');return file}

function renderRegister(){const box=$('#register-controls');box.innerHTML=`<div class="register-buttons" role="group" aria-label="Speaking style">${Object.entries(REGISTERS).map(([key,r])=>`<button data-register="${key}" aria-pressed="${REGISTER===key}" class="${REGISTER===key?'selected':''}">${esc(r.label)}</button>`).join('')}</div><div class="register-explainer"><span>${esc(REGISTERS[REGISTER].en)}</span><small lang="ja">${esc(REGISTERS[REGISTER].ja)}</small></div>`}
function changeRegister(mode){if(!Object.hasOwn(REGISTERS,mode)||mode===REGISTER)return;persist();stopEverything();if(dialog.open)closeModal();REGISTER=mode;applyRegister(mode);store.scope=mode;referenceCache.clear();loadedRefs.clear();S=memoryStates[mode]||E.emptyState();try{localStorage.setItem('wahran-korean-register',mode);if(!memoryStates[mode]){const raw=localStorage.getItem(progressKey());if(raw)S=E.restore(raw)}}catch(e){toast('Could not restore this style’s progress. Your existing stored copy has not been intentionally reset.')}render(true)}

// Delegate events so dynamically rendered exercises use the same tested actions.
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset;try{
 if(a.register){changeRegister(a.register);return}if(a.tab){go(a.tab);return}if(a.lesson){closeModal();tab='learn';lessonId=a.lesson;render(true);return}if(a.play){hear(a.play);return}if(a.slow){hear(a.slow,true);return}if(a.save){updateSaved(a.save);return}if(a.open){openWord(a.open);return}if(a.practice){openPractice(a.practice);return}if(a.grade){grade(a.grade,a.result);return}if(a.spoken){grade(a.spoken,a.result,true);return}if(a.complete){if(!S.completed.includes(a.complete))S.completed.push(a.complete);persist();renderLesson();toast('Lesson marked as practised — a self-report, not a test result.');return}if(a.combo){const c=E.combo(+a.combo);buildChoices=[c.family,c.frame,c.item,c.context];renderBuild();window.scrollTo(0,0);return}if(a.choice!==undefined){quizAnswer(+a.choice);return}if(a.pick!==undefined){if(!chunkQuiz.answered&&!chunkQuiz.selected.includes(+a.pick))chunkQuiz.selected.push(+a.pick);renderChunk();return}if(a.unpick!==undefined){if(!chunkQuiz.answered)chunkQuiz.selected.splice(+a.unpick,1);renderChunk();return}if(a.scene!==undefined){openScene(+a.scene);return}if(a.removeReference){await store.remove(a.removeReference);referenceCache.delete(a.removeReference);updateReferenceLabel(a.removeReference);$('#reference-status').textContent='Removed. This item will use device TTS.';return}
 switch(a.action){
 case'settings':renderSettings();break;case'close-dialog':closeModal();break;case'stop-audio':pauseSession();stopAudio();break;case'lesson-back':lessonId=null;render(true);break;case'more-words':wordLimit+=30;renderWordResults();break;case'random-combo':{let n=Math.floor(Math.random()*10000),x=E.combo(n);buildChoices=[x.family,x.frame,x.item,x.context];renderBuild();break}case'browse-combos':comboBrowse=!comboBrowse;comboLimit=20;renderBuild();break;case'more-combos':comboLimit+=20;renderComboResults();break;case'chunk-current':startChunk(E.index(...buildChoices));break;case'chunk-random':startChunk(Math.floor(Math.random()*10000));break;case'check-chunks':checkChunks();break;case'quiz-read':startQuiz('read');break;case'quiz-listen':startQuiz('listen');break;case'review':startQuiz('review');break;case'quiz-next':stopAudio();quiz.at++;renderQuiz();break;
 case'record':stopAudio();$('#learner-audio audio')?.pause();if(recording)recorder.finish();else await recorder.start(learnerBlob);break;
 case'scene-model':{const id=D.scenes[scene.n].prompts[scene.at][1];$('#scene-model').innerHTML='<div class="spacer"></div>'+phrase(E.entry(id),{mini:true});loadReference(id);break}case'scene-next':stopAudio();scene.at++;renderScene();break;
 case'session-setup':sessionSetup();break;case'session-start':beginSession();break;case'session-toggle':session?.active?pauseSession():runSession();break;case'session-skip':if(session){pauseSession();session.step=(Math.floor(session.step/S.settings.repeats)+1)*S.settings.repeats;runSession()}break;
 case'refresh-voices':refreshVoices();break;case'test-voice':hear('l01-01');break;
 case'export':saveFile('Wahran-Korean-'+REGISTER+'-progress-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));break;
 case'reset':if(confirm('Reset all progress and settings in this browser? Export a backup first. Imported reference audio is kept.')){S=E.emptyState();persist();closeModal();render(true);toast('Progress reset. Imported audio has not been deleted.')}break;
 case'sources':go('culture');break;
 }
}catch(err){showError(err.message||'Something could not be completed. Your saved progress has not been intentionally removed.')}});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){wordQuery=e.target.value;wordLimit=30;renderWordResults()}if(e.target.id==='combo-search'){comboQuery=e.target.value;comboLimit=20;renderComboResults()}});
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='practice-level'){practiceLevel=el.value;return}if(['family','frame','item','context'].includes(el.id)){const at=['family','frame','item','context'].indexOf(el.id);buildChoices[at]=+el.value;if(at===0)buildChoices=[+el.value,0,0,0];renderBuild();loadVisibleReferences();return}if(el.id==='word-topic'){wordTopic=el.value;wordLimit=30;renderWordResults()}if(el.id==='word-scope'){wordScope=el.value;wordLimit=30;renderWordResults()}if(el.id==='voice-select'){S.settings.voice=el.value;persist();stopAudio()}if(el.id==='speech-rate'){S.settings.rate=+el.value;persist()}if(el.id==='pause-setting'){S.settings.pause=+el.value;persist()}if(el.id==='repeats-setting'){S.settings.repeats=+el.value;persist()}if(el.id==='latin-setting'){S.settings.latin=el.checked;persist();render()}
 if(el.id==='learner-file'&&el.files[0]){stopAudio();recorder.abort();learnerBlob(audioFile(el.files[0]))}
 if(el.id==='reference-file'&&el.files[0]){const id=practiceId,file=audioFile(el.files[0]);if(!id)return;await store.put(id,file);referenceCache.set(id,file);loadedRefs.add(id);updateReferenceLabel(id);if($('#reference-status'))$('#reference-status').textContent='Local reference saved for this exact item. Use Listen to compare.';toast('Reference saved locally. Keep the original file as its backup.')}
 if(el.id==='backup-file'&&el.files[0]){const file=el.files[0];if(file.size>2000000)throw new Error('Backup exceeds 2 MB.');const state=E.restore(await file.text());if(confirm('Replace this browser’s progress with the selected backup? Imported audio is not changed.')){S=state;persist();closeModal();render();toast('Progress imported. Your original audio files are unchanged.')}}
}catch(err){showError(err.message)}});
window.addEventListener('pagehide',()=>stopEverything());document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseSession();stopAudio();recorder.abort()}});window.speechSynthesis?.addEventListener?.('voiceschanged',refreshVoices);
render();if(loadNotice)setTimeout(()=>toast(loadNotice),200);setTimeout(()=>speech.voices(),300);
})();
</script></body></html>
