ate pastry","pos":"noun.m","topic":"oran","examples":[]},{"id":"w489","ar":"زلابية","latin":"zlābiya","ipa":"zlaːbija","en":"syrup-soaked fried sweet","pos":"noun.f","topic":"oran","examples":[]},{"id":"w490","ar":"حريرة","latin":"ḥrīra","ipa":"ħriːra","en":"harira soup","pos":"noun.f","topic":"oran","examples":[]},{"id":"w491","ar":"سحور","latin":"sḥūr","ipa":"sħuːr","en":"pre-dawn Ramadan meal","pos":"noun.m","topic":"oran","examples":[]},{"id":"w492","ar":"رمضان","latin":"rəmḍān","ipa":"rəmdˤaːn","en":"Ramadan","pos":"name","topic":"oran","examples":[]},{"id":"w493","ar":"عيد","latin":"ʕīd","ipa":"ʕiːd","en":"Eid / celebration","pos":"noun.m","topic":"oran","examples":[]},{"id":"w494","ar":"عروسة","latin":"ʕrūsa","ipa":"ʕruːsa","en":"bride","pos":"noun.f","topic":"oran","examples":[]},{"id":"w495","ar":"عرس","latin":"ʕərs","ipa":"ʕərs","en":"wedding","pos":"noun.m","topic":"oran","examples":[]},{"id":"w496","ar":"مرحبا","latin":"mərḥba","ipa":"mərħba","en":"welcome","pos":"part","topic":"oran","examples":["l01-07"]},{"id":"w497","ar":"صحة","latin":"ṣaḥḥa","ipa":"sˤaħħa","en":"thanks / health / an appreciative wish","pos":"part","topic":"oran","examples":["l01-05","l01-06","l07-07"]},{"id":"w498","ar":"بركة","latin":"bərka","ipa":"bərka","en":"blessing / abundance","pos":"noun.f","topic":"oran","examples":[]},{"id":"w499","ar":"راني","latin":"rāni","ipa":"raːni","en":"I am / here I am","pos":"part","topic":"oran","examples":["l01-05","l01-06","l04-03"]},{"id":"w500","ar":"غادي","latin":"ghādi","ipa":"ɣaːdi","en":"going to / future marker (western usage)","pos":"part","topic":"oran","examples":["l08-06","l12-07","l14-08"]}],"lessons":[{"id":"l01","number":1,"title":"First words","goal":"Meet someone and exchange a greeting","note":"Start with a greeting, then wait for the reply. The last sound in rāk / rāki tells you who you are addressing.","ja":"男性に rāk、女性に rāki と呼びかける　自分の性別ではなく、話す相手で変わる","level":"Foundation","lines":[{"id":"l01-01","ar":"السلام عليكم","latin":"əs-salām ʕlīkum","ipa":"əs salaːm ʕliːkum","en":"Hello; peace be upon you.","note":"A widely used greeting"},{"id":"l01-02","ar":"وعليكم السلام","latin":"wə-ʕlīkum əs-salām","ipa":"wə ʕliːkum əs salaːm","en":"And peace be upon you.","note":"Reply to the greeting"},{"id":"l01-03","ar":"واش راك؟","latin":"wāsh rāk","ipa":"waːʃ raːk","en":"How are you?","note":"To one man"},{"id":"l01-04","ar":"واش راكي؟","latin":"wāsh rāki","ipa":"waːʃ raːki","en":"How are you?","note":"To one woman"},{"id":"l01-05","ar":"راني مليح، صحة","latin":"rāni mlīḥ ṣaḥḥa","ipa":"raːni mliːħ sˤaħħa","en":"I'm well, thanks.","note":"Man speaking"},{"id":"l01-06","ar":"راني مليحة، صحة","latin":"rāni mlīḥa ṣaḥḥa","ipa":"raːni mliːħa sˤaħħa","en":"I'm well, thanks.","note":"Woman speaking"},{"id":"l01-07","ar":"مرحبا بيك","latin":"mərḥba bīk","ipa":"mərħba biːk","en":"Welcome.","note":"To one person"},{"id":"l01-08","ar":"بالسلامة","latin":"bəs-slāma","ipa":"bəs slaːma","en":"Goodbye; go safely.","note":"Parting"}]},{"id":"l02","number":2,"title":"Names & beginnings","goal":"Introduce yourself and ask about someone","note":"A present-tense sentence can work without an English-style verb “to be”: ana mən… = I am from…","ja":"英語の am / is にあたる単語を、いつも入れるわけではない","level":"Foundation","lines":[{"id":"l02-01","ar":"سمي ياسين","latin":"smī yāsīn","ipa":"smiː jaːsiːn","en":"My name is Yacine.","note":"An example name, not a required identity"},{"id":"l02-02","ar":"واش سميتك؟","latin":"wāsh smītək","ipa":"waːʃ smiːtək","en":"What's your name?","note":"To one person"},{"id":"l02-03","ar":"أنا من اليابان","latin":"ana mən əl-yābān","ipa":"ana mən əl jaːbaːn","en":"I'm from Japan.","note":"Origin"},{"id":"l02-04","ar":"منين نتا؟","latin":"mnīn nta","ipa":"mniːn nta","en":"Where are you from?","note":"To one man"},{"id":"l02-05","ar":"منين نتي؟","latin":"mnīn nti","ipa":"mniːn nti","en":"Where are you from?","note":"To one woman"},{"id":"l02-06","ar":"نسكن في وهران","latin":"nəskən fi wahrān","ipa":"nəskən fi wahraːn","en":"I live in Oran.","note":"Home city"},{"id":"l02-07","ar":"فرحت كي تعرفت عليك","latin":"frəḥt ki tʕərrəft ʕlīk","ipa":"frəħt ki tʕərrəft ʕliːk","en":"I'm happy to have met you.","note":"A friendly introduction"},{"id":"l02-08","ar":"أنا هنا باش نتعلم الدارجة","latin":"ana hna bāsh nətʕəlləm əd-dārja","ipa":"ana hna baːʃ nətʕəlləm əd daːrʒa","en":"I'm here to learn Darija.","note":"Your purpose"}]},{"id":"l03","number":3,"title":"Keep the conversation going","goal":"Ask for repetition instead of giving up","note":"For a common verb negation, wrap the verb with ma…sh: nəfhəm → ma nəfhəmsh. Other negative forms also exist.","ja":"動詞を否定するときは ma…sh で挟む形がよく出る","level":"Foundation","lines":[{"id":"l03-01","ar":"سمحلي، ما فهمتش","latin":"smaḥli ma fhəmtsh","ipa":"smaħli ma fhəmtʃ","en":"Sorry, I didn't understand.","note":"To one man"},{"id":"l03-02","ar":"سمحيلي، ما فهمتش","latin":"smaḥīli ma fhəmtsh","ipa":"smaħiːli ma fhəmtʃ","en":"Sorry, I didn't understand.","note":"To one woman"},{"id":"l03-03","ar":"عاود من فضلك","latin":"ʕāwəd mən fəḍlək","ipa":"ʕaːwəd mən fədˤlək","en":"Repeat that, please.","note":"To one man"},{"id":"l03-04","ar":"عاودي من فضلك","latin":"ʕāwdi mən fəḍlək","ipa":"ʕaːwdi mən fədˤlək","en":"Repeat that, please.","note":"To one woman"},{"id":"l03-05","ar":"هدر بشوية من فضلك","latin":"hdər b-shwiya mən fəḍlək","ipa":"hdər b ʃwija mən fədˤlək","en":"Speak slowly, please.","note":"To one man"},{"id":"l03-06","ar":"واش معناها؟","latin":"wāsh məʕnāha","ipa":"waːʃ məʕnaːha","en":"What does it mean?","note":"Ask about a word or expression"},{"id":"l03-07","ar":"كيفاش نقولو هذي بالدارجة؟","latin":"kīfāsh nqūlu hādi bəd-dārja","ipa":"kiːfaːʃ nquːlu haːdi bəd daːrʒa","en":"How do we say this in Darija?","note":"Point to something when useful"},{"id":"l03-08","ar":"فهمت شوية، ماشي كامل","latin":"fhəmt shwiya māshi kāməl","ipa":"fhəmt ʃwija maːʃi kaːməl","en":"I understood a little, not everything.","note":"An honest repair strategy"}]},{"id":"l04","number":4,"title":"Questions & short answers","goal":"Use a few question words in real conversation","note":"Wāsh is useful, but not every question needs it. Listen to intonation as well as the words. Maʕlīsh can reassure or accept a small problem.","ja":"maʕlīsh は「気にしないで」「大丈夫」のように文脈で意味が変わる","level":"Foundation","lines":[{"id":"l04-01","ar":"وين راك؟","latin":"wīn rāk","ipa":"wiːn raːk","en":"Where are you?","note":"To one man"},{"id":"l04-02","ar":"وين راكي؟","latin":"wīn rāki","ipa":"wiːn raːki","en":"Where are you?","note":"To one woman"},{"id":"l04-03","ar":"راني هنا","latin":"rāni hna","ipa":"raːni hna","en":"I'm here.","note":"Location"},{"id":"l04-04","ar":"واش كاين؟","latin":"wāsh kāyən","ipa":"waːʃ kaːjən","en":"What's happening / what's there?","note":"Meaning depends on the situation"},{"id":"l04-05","ar":"شكون هذا؟","latin":"shkūn hāda","ipa":"ʃkuːn haːda","en":"Who is this?","note":"About a man"},{"id":"l04-06","ar":"علاش؟","latin":"ʕlāsh","ipa":"ʕlaːʃ","en":"Why?","note":"Keep your tone curious, not demanding"},{"id":"l04-07","ar":"ما عليش","latin":"maʕlīsh","ipa":"maʕliːʃ","en":"No worries / that's okay.","note":"Reassurance"},{"id":"l04-08","ar":"عندي سؤال صغير","latin":"ʕəndi suʔāl ṣghīr","ipa":"ʕəndi suʔaːl sˤɣiːr","en":"I have a small question.","note":"Starting a question"}]},{"id":"l05","number":5,"title":"People around you","goal":"Introduce a friend and talk about family","note":"A male friend is ṣāḥbi; a female friend is ṣāḥbti. Possession is often attached to the noun, so learn the whole useful form.","ja":"","level":"Foundation","lines":[{"id":"l05-01","ar":"هذا صاحبي عمر","latin":"hāda ṣāḥbi ʕumər","ipa":"haːda sˤaːħbi ʕumər","en":"This is my friend Omar.","note":"Male friend"},{"id":"l05-02","ar":"هذي صاحبتي مريم","latin":"hādi ṣāḥbti məryəm","ipa":"haːdi sˤaːħbti mərjəm","en":"This is my friend Meriem.","note":"Female friend"},{"id":"l05-03","ar":"عندي خو و خت","latin":"ʕəndi khū w kht","ipa":"ʕəndi xuː w xt","en":"I have a brother and a sister.","note":"Family"},{"id":"l05-04","ar":"عائلتي تسكن في اليابان","latin":"ʕāylti təskən fi əl-yābān","ipa":"ʕaːjlti təskən fi əl jaːbaːn","en":"My family lives in Japan.","note":"Family"},{"id":"l05-05","ar":"خويا يخدم هنا","latin":"khūya yəkhdəm hna","ipa":"xuːja jəxdəm hna","en":"My brother works here.","note":"Third-person verb"},{"id":"l05-06","ar":"ختي تقرا في الجامعة","latin":"khti təqra fi əl-jāmiʕa","ipa":"xti təqra fi əl ʒaːmiʕa","en":"My sister studies at university.","note":"Third-person verb"},{"id":"l05-07","ar":"كيفاش راهي العائلة؟","latin":"kīfāsh rāhi əl-ʕāyla","ipa":"kiːfaːʃ raːhi əl ʕaːjla","en":"How is the family?","note":"Friendly follow-up"},{"id":"l05-08","ar":"سلم على العائلة","latin":"səlləm ʕla əl-ʕāyla","ipa":"səlləm ʕla əl ʕaːjla","en":"Say hello to the family for me.","note":"To one man"}]},{"id":"l06","number":6,"title":"Say how you feel","goal":"Describe your mood and ask about theirs","note":"Adjectives often change with the person described: fərḥān / fərḥāna. Do not simply add -a to every word; learn the useful pairs.","ja":"自分の状態を話すときは、自分に合わせて男性形・女性形を使う","level":"Foundation","lines":[{"id":"l06-01","ar":"راني فرحان اليوم","latin":"rāni fərḥān əl-yūm","ipa":"raːni fərħaːn əl juːm","en":"I'm happy today.","note":"Man speaking"},{"id":"l06-02","ar":"راني فرحانة اليوم","latin":"rāni fərḥāna əl-yūm","ipa":"raːni fərħaːna əl juːm","en":"I'm happy today.","note":"Woman speaking"},{"id":"l06-03","ar":"راني عيان شوية","latin":"rāni ʕəyyān shwiya","ipa":"raːni ʕəjjaːn ʃwija","en":"I'm a little tired.","note":"Man speaking"},{"id":"l06-04","ar":"راني عيانة شوية","latin":"rāni ʕəyyāna shwiya","ipa":"raːni ʕəjjaːna ʃwija","en":"I'm a little tired.","note":"Woman speaking"},{"id":"l06-05","ar":"راني متحمس باش نشوف وهران","latin":"rāni mətḥəmməs bāsh nshūf wahrān","ipa":"raːni mətħəmməs baːʃ nʃuːf wahraːn","en":"I'm excited to see Oran.","note":"Man speaking"},{"id":"l06-06","ar":"ما رانيش زعفان","latin":"ma rānīsh zəʕfān","ipa":"ma raːniːʃ zəʕfaːn","en":"I'm not upset.","note":"Man speaking; negative rāni"},{"id":"l06-07","ar":"فرحت كي شفتك","latin":"frəḥt ki shəftək","ipa":"frəħt ki ʃəftək","en":"I was happy to see you.","note":"To one person"},{"id":"l06-08","ar":"نحتاج نرتاح شوية","latin":"nəḥtāj nərtāḥ shwiya","ipa":"nəħtaːʒ nərtaːħ ʃwija","en":"I need to rest a little.","note":"A clear personal need"}]},{"id":"l07","number":7,"title":"Taste & compliments","goal":"Say what you enjoy and give a specific compliment","note":"Nḥəbb can mean like, love or want. Context matters. A compliment about a voice or a song is easier to interpret than a very intimate compliment to a stranger.","ja":"","level":"Foundation","lines":[{"id":"l07-01","ar":"نحب نسمع الراي","latin":"nḥəbb nəsmaʕ ər-rāy","ipa":"nħəbb nəsmaʕ ər raːj","en":"I like listening to raï.","note":"Music"},{"id":"l07-02","ar":"تعجبني هذي الغناية","latin":"təʕjəbni hādi əl-ghnāya","ipa":"təʕʒəbni haːdi əl ɣnaːja","en":"I like this song.","note":"About a feminine noun"},{"id":"l07-03","ar":"صوتك شباب بزاف","latin":"ṣūtək shbāb bəzzāf","ipa":"sˤuːtək ʃbaːb bəzzaːf","en":"Your voice is really lovely.","note":"A specific compliment"},{"id":"l07-04","ar":"عندك ذوق مليح في الموسيقى","latin":"ʕəndək dhūq mlīḥ fi əl-mūsīqa","ipa":"ʕəndək duːq mliːħ fi əl muːsiːqa","en":"You have good taste in music.","note":"A specific compliment"},{"id":"l07-05","ar":"وهران شابة بزاف","latin":"wahrān shābba bəzzāf","ipa":"wahraːn ʃaːbba bəzzaːf","en":"Oran is really beautiful.","note":"About the city"},{"id":"l07-06","ar":"نحب نهدر معاك","latin":"nḥəbb nəhdər mʕāk","ipa":"nħəbb nəhdər mʕaːk","en":"I like talking with you.","note":"To one man; mʕāk is a useful whole form"},{"id":"l07-07","ar":"صحة على هذي الغناية","latin":"ṣaḥḥa ʕla hādi əl-ghnāya","ipa":"sˤaħħa ʕla haːdi əl ɣnaːja","en":"Thanks for this song.","note":"Thanking someone for sharing"},{"id":"l07-08","ar":"واشمن موسيقى تحب؟","latin":"wāshmən mūsīqa tḥəbb","ipa":"waːʃmən muːsiːqa tħəbb","en":"What kind of music do you like?","note":"To one man"}]},{"id":"l08","number":8,"title":"Wants, needs & ability","goal":"Ask for something and say what you can do","note":"Nḥəbb + verb is a useful frame. Lāzəm means “must / need to”. Ghādi + verb is a western future pattern used in Oran.","ja":"ghādi ＋ 動詞で「これから〜する」　この教材ではOran向けの形として使う","level":"Developing","lines":[{"id":"l08-01","ar":"نحب نتعلم أكثر","latin":"nḥəbb nətʕəlləm əktər","ipa":"nħəbb nətʕəlləm əktər","en":"I want to learn more.","note":"A goal"},{"id":"l08-02","ar":"نبغي نشوف البحر","latin":"nəbghi nshūf əl-bḥər","ipa":"nəbɣi nʃuːf əl bħər","en":"I want to see the sea.","note":"Western nbghi form"},{"id":"l08-03","ar":"نقدر نهدر شوية بالدارجة","latin":"nəqdər nəhdər shwiya bəd-dārja","ipa":"nəqdər nəhdər ʃwija bəd daːrʒa","en":"I can speak a little Darija.","note":"Your current ability"},{"id":"l08-04","ar":"ما نقدرش نجي اليوم","latin":"ma nəqdərsh nji əl-yūm","ipa":"ma nəqdərʃ nʒi əl juːm","en":"I can't come today.","note":"Negation"},{"id":"l08-05","ar":"لازم نروح","latin":"lāzəm nrūḥ","ipa":"laːzəm nruːħ","en":"I have to go.","note":"A necessary action"},{"id":"l08-06","ar":"غادي نرجع غدوة","latin":"ghādi nərjaʕ ghədwa","ipa":"ɣaːdi nərʒaʕ ɣədwa","en":"I'll come back tomorrow.","note":"Future"},{"id":"l08-07","ar":"تقدر تعاونني؟","latin":"təqdər tʕāwənni","ipa":"təqdər tʕaːwənni","en":"Can you help me?","note":"To one man"},{"id":"l08-08","ar":"تقدري تعاونيني؟","latin":"təqdri tʕāwnīni","ipa":"təqdri tʕaːwniːni","en":"Can you help me?","note":"To one woman"}]},{"id":"l09","number":9,"title":"At the café","goal":"Order a drink and ask for the bill","note":"Nḥəbb… can be a polite request with mən fəḍlək. Menus and service talk may contain French loans; that does not make the conversation “not Darija”.","ja":"","level":"Developing","lines":[{"id":"l09-01","ar":"قهوة بلا سكر من فضلك","latin":"qahwa blā səkkər mən fəḍlək","ipa":"qahwa blaː səkkər mən fədˤlək","en":"A coffee without sugar, please.","note":"Order"},{"id":"l09-02","ar":"نحب أتاي بالنعناع","latin":"nḥəbb atāy bən-nəʕnāʕ","ipa":"nħəbb ataːj bən nəʕnaːʕ","en":"I'd like mint tea.","note":"Order"},{"id":"l09-03","ar":"عندكم ما بارد؟","latin":"ʕəndkum mā bārəd","ipa":"ʕəndkum maː baːrəd","en":"Do you have cold water?","note":"To staff / plural addressee"},{"id":"l09-04","ar":"زوج قهاوي من فضلك","latin":"zūj qhāwi mən fəḍlək","ipa":"zuːʒ qhaːwi mən fədˤlək","en":"Two coffees, please.","note":"Useful plural form"},{"id":"l09-05","ar":"نقعد هنا؟","latin":"nəqʕəd hna","ipa":"nəqʕəd hna","en":"May I sit here?","note":"Use rising intonation"},{"id":"l09-06","ar":"الحساب من فضلك","latin":"əl-ḥsāb mən fəḍlək","ipa":"əl ħsaːb mən fədˤlək","en":"The bill, please.","note":"Paying"},{"id":"l09-07","ar":"شحال كامل؟","latin":"shḥāl kāməl","ipa":"ʃħaːl kaːməl","en":"How much is it altogether?","note":"Checking the total"},{"id":"l09-08","ar":"صحة، القهوة مليحة","latin":"ṣaḥḥa əl-qahwa mlīḥa","ipa":"sˤaħħa əl qahwa mliːħa","en":"Thanks, the coffee is good.","note":"Feminine adjective"}]},{"id":"l10","number":10,"title":"Food & hospitality","goal":"Choose food, describe it and thank a host","note":"Learn whole requests first. Fṭūr can refer to breakfast or breaking a fast; meal names can vary with context and speaker. Never guess about an allergy from the dish name alone.","ja":"","level":"Developing","lines":[{"id":"l10-01","ar":"نحب نجرب الكارانتيكا","latin":"nḥəbb njərrəb əl-karantīka","ipa":"nħəbb nʒərrəb əl karantiːka","en":"I'd like to try karantika.","note":"A chickpea-flour bake"},{"id":"l10-02","ar":"واش فيها هذي الماكلة؟","latin":"wāsh fīha hādi əl-mākla","ipa":"waːʃ fiːha haːdi əl maːkla","en":"What's in this food?","note":"Ask about ingredients"},{"id":"l10-03","ar":"فيها لحم؟","latin":"fīha lḥəm","ipa":"fiːha lħəm","en":"Does it contain meat?","note":"About a feminine noun / dish"},{"id":"l10-04","ar":"بلا فلفل حار من فضلك","latin":"blā fəlfəl ḥārr mən fəḍlək","ipa":"blaː fəlfəl ħaːrr mən fədˤlək","en":"Without hot pepper, please.","note":"A preference"},{"id":"l10-05","ar":"هذي بنينة بزاف","latin":"hādi bnīna bəzzāf","ipa":"haːdi bniːna bəzzaːf","en":"This is really tasty.","note":"About a feminine noun / dish"},{"id":"l10-06","ar":"صحة، شبعت","latin":"ṣaḥḥa shbəʕt","ipa":"sˤaħħa ʃbəʕt","en":"Thank you, I'm full.","note":"A polite, direct answer"},{"id":"l10-07","ar":"يعطيك الصحة على الماكلة","latin":"yəʕṭīk əṣ-ṣaḥḥa ʕla əl-mākla","ipa":"jəʕtˤiːk əsˤ sˤaħħa ʕla əl maːkla","en":"Thank you for the food.","note":"Appreciation for someone's effort"},{"id":"l10-08","ar":"نعاونك في الكوزينة؟","latin":"nʕāwnək fi əl-kūzīna","ipa":"nʕaːwnək fi əl kuːziːna","en":"Shall I help you in the kitchen?","note":"An offer"}]},{"id":"l11","number":11,"title":"Find your way","goal":"Ask where something is and check directions","note":"Keep fī “in / at” distinct from l- “to”. This lesson uses whole direction chunks rather than word-for-word English order.","ja":"","level":"Developing","lines":[{"id":"l11-01","ar":"سمحلي، وين المحطة؟","latin":"smaḥli wīn əl-məḥaṭṭa","ipa":"smaħli wiːn əl məħatˤtˤa","en":"Excuse me, where is the station?","note":"To one man"},{"id":"l11-02","ar":"كيفاش نروح للبحر؟","latin":"kīfāsh nrūḥ ləl-bḥər","ipa":"kiːfaːʃ nruːħ ləl bħər","en":"How do I get to the sea?","note":"Destination"},{"id":"l11-03","ar":"كاين صيدلية قريبة؟","latin":"kāyən ṣaydaliya qrība","ipa":"kaːjən sˤajdalija qriːba","en":"Is there a pharmacy nearby?","note":"A practical request"},{"id":"l11-04","ar":"روح طول","latin":"rūḥ ṭūl","ipa":"ruːħ tˤuːl","en":"Go straight ahead.","note":"To one man"},{"id":"l11-05","ar":"دور على اليمين","latin":"dūr ʕla l-ymīn","ipa":"duːr ʕla l jmiːn","en":"Turn right.","note":"To one man"},{"id":"l11-06","ar":"دوري على اليسار","latin":"dūri ʕla l-ysār","ipa":"duːri ʕla l jsaːr","en":"Turn left.","note":"To one woman"},{"id":"l11-07","ar":"بعيد من هنا؟","latin":"bʕīd mən hna","ipa":"bʕiːd mən hna","en":"Is it far from here?","note":"About a masculine place word"},{"id":"l11-08","ar":"تقدر توريني في الخريطة؟","latin":"təqdər twərrīni fi əl-khrīṭa","ipa":"təqdər twərriːni fi əl xriːtˤa","en":"Can you show me on the map?","note":"To one man"}]},{"id":"l12","number":12,"title":"Travel around Oran","goal":"Tell a driver your destination and check a ticket","note":"A short destination request is often enough. Check the actual destination and price with the person providing the service; the example is not a fare quote.","ja":"","level":"Developing","lines":[{"id":"l12-01","ar":"لوسط المدينة من فضلك","latin":"lwəsṭ əl-mdīna mən fəḍlək","ipa":"lwəstˤ əl mdiːna mən fədˤlək","en":"To the city centre, please.","note":"A destination request"},{"id":"l12-02","ar":"نحب نروح لعين الترك","latin":"nḥəbb nrūḥ l-ʕīn ət-turk","ipa":"nħəbb nruːħ l ʕiːn ət turk","en":"I want to go to Aïn El Turk.","note":"A place name in the Oran area"},{"id":"l12-03","ar":"هذا الطرامواي يروح لوسط المدينة؟","latin":"hāda əṭ-ṭrāmwāy yrūḥ lwəsṭ əl-mdīna","ipa":"haːda ətˤ tˤraːmwaːj jruːħ lwəstˤ əl mdiːna","en":"Does this tram go to the city centre?","note":"Check locally; no route promise"},{"id":"l12-04","ar":"وين نشري التيكي؟","latin":"wīn nəshri ət-tīki","ipa":"wiːn nəʃri ət tiːki","en":"Where do I buy the ticket?","note":"Tickets"},{"id":"l12-05","ar":"شحال للّوطيل؟","latin":"shḥāl ləl-lūṭīl","ipa":"ʃħaːl ləl luːtˤiːl","en":"How much to the hotel?","note":"Price check"},{"id":"l12-06","ar":"حبس هنا من فضلك","latin":"ḥbəs hna mən fəḍlək","ipa":"ħbəs hna mən fədˤlək","en":"Stop here, please.","note":"To one man"},{"id":"l12-07","ar":"غادي نهبط هنا","latin":"ghādi nəhbəṭ hna","ipa":"ɣaːdi nəhbətˤ hna","en":"I'm going to get off here.","note":"Public transport"},{"id":"l12-08","ar":"وصلنا، يعطيك الصحة","latin":"wṣəlna yəʕṭīk əṣ-ṣaḥḥa","ipa":"wsˤəlna jəʕtˤiːk əsˤ sˤaħħa","en":"We've arrived, thank you.","note":"Thanking a driver"}]},{"id":"l13","number":13,"title":"Shopping & quantities","goal":"Ask a price and check whether something fits","note":"Treat a price example as language practice only. Algerian money talk may use centimes informally: ask the speaker to confirm the amount in dinars.","ja":"","level":"Developing","lines":[{"id":"l13-01","ar":"شحال هذي؟","latin":"shḥāl hādi","ipa":"ʃħaːl haːdi","en":"How much is this?","note":"Feminine item"},{"id":"l13-02","ar":"شحال هذا بالدينار؟","latin":"shḥāl hāda bəd-dīnār","ipa":"ʃħaːl haːda bəd diːnaːr","en":"How much is this in dinars?","note":"Clarifying the unit"},{"id":"l13-03","ar":"نحب نص كيلو تاع تمر","latin":"nḥəbb nəṣṣ kīlū tāʕ tmər","ipa":"nħəbb nəsˤsˤ kiːluː taːʕ tmər","en":"I'd like half a kilo of dates.","note":"A quantity"},{"id":"l13-04","ar":"عندكم قياس أصغر؟","latin":"ʕəndkum qyās aṣghər","ipa":"ʕəndkum qjaːs asˤɣər","en":"Do you have a smaller size?","note":"Clothes"},{"id":"l13-05","ar":"نقدر نجربها؟","latin":"nəqdər njərrəbha","ipa":"nəqdər nʒərrəbha","en":"Can I try it on / try it?","note":"Feminine item"},{"id":"l13-06","ar":"غالية شوية","latin":"ghālya shwiya","ipa":"ɣaːlja ʃwija","en":"It's a little expensive.","note":"Feminine item; keep the tone friendly"},{"id":"l13-07","ar":"نخلص بالكاش؟","latin":"nkhəlləṣ bəl-kāsh","ipa":"nxəlləsˤ bəl kaːʃ","en":"Can I pay in cash?","note":"Payment method"},{"id":"l13-08","ar":"ما نحتاجش صاك، صحة","latin":"ma nəḥtājsh sāk ṣaḥḥa","ipa":"ma nəħtaːʒʃ saːk sˤaħħa","en":"I don't need a bag, thanks.","note":"Declining politely"}]},{"id":"l14","number":14,"title":"Home & daily life","goal":"Explain where things are and make a small request","note":"ʕƏndi = I have; ma ʕəndīsh = I don't have. Fiha = in it / it contains, referring to a feminine noun.","ja":"","level":"Developing","lines":[{"id":"l14-01","ar":"وين المفتاح؟","latin":"wīn əl-məftāḥ","ipa":"wiːn əl məftaːħ","en":"Where is the key?","note":"Everyday question"},{"id":"l14-02","ar":"خليتو فوق الطابلة","latin":"khəllītu fūq əṭ-ṭābla","ipa":"xəlliːtu fuːq ətˤ tˤaːbla","en":"I left it on the table.","note":"Masculine object"},{"id":"l14-03","ar":"عندك شارجور؟","latin":"ʕəndək shārjūr","ipa":"ʕəndək ʃaːrʒuːr","en":"Do you have a charger?","note":"To one person"},{"id":"l14-04","ar":"التليفون ما فيهش باتري","latin":"ət-tīlīfūn ma fīhsh bātri","ipa":"ət tiːliːfuːn ma fiːhʃ baːtri","en":"The phone is out of battery.","note":"Everyday phrasing"},{"id":"l14-05","ar":"واش هو الموط دو باس تاع الويفي؟","latin":"wāsh huwa əl-mū d pās tāʕ əl-wīfi","ipa":"waːʃ huwa əl muː d paːs taːʕ əl wiːfi","en":"What's the Wi-Fi password?","note":"A common French loan phrase"},{"id":"l14-06","ar":"نقدر نستعمل الدوش؟","latin":"nəqdər nəstəʕməl əd-dūsh","ipa":"nəqdər nəstəʕməl əd duːʃ","en":"Can I use the shower?","note":"Asking permission"},{"id":"l14-07","ar":"ما عنديش المفتاح","latin":"ma ʕəndīsh əl-məftāḥ","ipa":"ma ʕəndiːʃ əl məftaːħ","en":"I don't have the key.","note":"Possession and negation"},{"id":"l14-08","ar":"غادي نرقد بكري الليلة","latin":"ghādi nərgəd bəkri əl-līla","ipa":"ɣaːdi nərɡəd bəkri əl liːla","en":"I'm going to sleep early tonight.","note":"A daily plan"}]},{"id":"l15","number":15,"title":"Ask for help","goal":"Describe a simple problem and ask for assistance","note":"These are communication phrases, not medical advice. State an allergy and confirm understanding. For urgent illness or injury, seek local professional help rather than relying on this course.","ja":"","level":"Intermediate practice","lines":[{"id":"l15-01","ar":"راني مريض","latin":"rāni mrīḍ","ipa":"raːni mriːdˤ","en":"I'm ill.","note":"Man speaking"},{"id":"l15-02","ar":"راني مريضة","latin":"rāni mrīḍa","ipa":"raːni mriːdˤa","en":"I'm ill.","note":"Woman speaking"},{"id":"l15-03","ar":"راسي يوجعني","latin":"rāsi yūjəʕni","ipa":"raːsi juːʒəʕni","en":"My head hurts.","note":"Symptom description"},{"id":"l15-04","ar":"كرشي توجعني","latin":"kərshi tūjəʕni","ipa":"kərʃi tuːʒəʕni","en":"My stomach hurts.","note":"Feminine body-part agreement"},{"id":"l15-05","ar":"عندي حساسية من الكاوكاو","latin":"ʕəndi ḥasāsiya mən əl-kāwkāw","ipa":"ʕəndi ħasaːsija mən əl kaːwkaːw","en":"I have a peanut allergy.","note":"Do not rely on a guessed ingredient list"},{"id":"l15-06","ar":"نحتاج طبيب","latin":"nəḥtāj ṭbīb","ipa":"nəħtaːʒ tˤbiːb","en":"I need a doctor.","note":"Seeking care"},{"id":"l15-07","ar":"عيط للإسعاف من فضلك","latin":"ʕəyyəṭ ləl-isʕāf mən fəḍlək","ipa":"ʕəjjətˤ ləl isʕaːf mən fədˤlək","en":"Call emergency help, please.","note":"To one man"},{"id":"l15-08","ar":"راني ضايع، تقدر تعاونني؟","latin":"rāni ḍāyəʕ təqdər tʕāwənni","ipa":"raːni dˤaːjəʕ təqdər tʕaːwənni","en":"I'm lost. Can you help me?","note":"Man speaking, to one man"}]},{"id":"l16","number":16,"title":"The sea & the day","goal":"Make simple small talk about the weather","note":"Use a whole expression such as kāyən ər-rīḥ “it's windy”. Weather vocabulary does not always match English word for word.","ja":"","level":"Intermediate practice","lines":[{"id":"l16-01","ar":"اليوم كاين الشمس","latin":"əl-yūm kāyən əsh-shəms","ipa":"əl juːm kaːjən əʃ ʃəms","en":"It's sunny today.","note":"Small talk"},{"id":"l16-02","ar":"اليوم كاين الريح","latin":"əl-yūm kāyən ər-rīḥ","ipa":"əl juːm kaːjən ər riːħ","en":"It's windy today.","note":"Small talk"},{"id":"l16-03","ar":"راهي تطيح الشتا","latin":"rāhi ṭṭīḥ əsh-shta","ipa":"raːhi tˤtˤiːħ əʃ ʃta","en":"It's raining.","note":"Ongoing action"},{"id":"l16-04","ar":"البحر شباب اليوم","latin":"əl-bḥər shbāb əl-yūm","ipa":"əl bħər ʃbaːb əl juːm","en":"The sea looks lovely today.","note":"A simple observation"},{"id":"l16-05","ar":"الما بارد بزاف","latin":"əl-mā bārəd bəzzāf","ipa":"əl maː baːrəd bəzzaːf","en":"The water is very cold.","note":"Masculine adjective"},{"id":"l16-06","ar":"نتمشاو شوية؟","latin":"nətmshāw shwiya","ipa":"nətmʃaːw ʃwija","en":"Shall we take a little walk?","note":"An invitation"},{"id":"l16-07","ar":"نحب نشوف غروب الشمس","latin":"nḥəbb nshūf ghrūb əsh-shəms","ipa":"nħəbb nʃuːf ɣruːb əʃ ʃəms","en":"I'd like to see the sunset.","note":"A simple wish"},{"id":"l16-08","ar":"نقدر نصور هنا؟","latin":"nəqdər nṣəwwər hna","ipa":"nəqdər nsˤəwwər hna","en":"May I take photos here?","note":"Ask before photographing people or restricted sites"}]},{"id":"l17","number":17,"title":"Work & learning","goal":"Explain what you do and request help learning","note":"First-person imperfective verbs often start with n-. Third-person masculine forms often start with y-, but not every tense follows the same pattern.","ja":"","level":"Intermediate practice","lines":[{"id":"l17-01","ar":"نخدم في الموسيقى","latin":"nəkhdəm fi əl-mūsīqa","ipa":"nəxdəm fi əl muːsiːqa","en":"I work in music.","note":"Work"},{"id":"l17-02","ar":"عندي شركة صغيرة","latin":"ʕəndi shərka ṣghīra","ipa":"ʕəndi ʃərka sˤɣiːra","en":"I have a small company.","note":"Feminine agreement"},{"id":"l17-03","ar":"نتعلم الدارجة كل نهار","latin":"nətʕəlləm əd-dārja kull nhār","ipa":"nətʕəlləm əd daːrʒa kull nhaːr","en":"I learn Darija every day.","note":"A habit"},{"id":"l17-04","ar":"مازالني مبتدئ","latin":"māzālni mubtadiʔ","ipa":"maːzaːlni mubtadiʔ","en":"I'm still a beginner.","note":"Man speaking"},{"id":"l17-05","ar":"نحب نولي نهدر مليح","latin":"nḥəbb nwəlli nəhdər mlīḥ","ipa":"nħəbb nwəlli nəhdər mliːħ","en":"I want to be able to speak well.","note":"Your aim"},{"id":"l17-06","ar":"صححلي كي نغلط","latin":"ṣaḥḥəḥli ki nəghləṭ","ipa":"sˤaħħəħli ki nəɣlətˤ","en":"Correct me when I make a mistake.","note":"To one man"},{"id":"l17-07","ar":"اكتبها من فضلك","latin":"əktəbha mən fəḍlək","ipa":"əktəbha mən fədˤlək","en":"Write it down, please.","note":"To one man; feminine referent such as a word"},{"id":"l17-08","ar":"تعلمت كلمة جديدة اليوم","latin":"tʕəlləmt kəlma jdīda əl-yūm","ipa":"tʕəlləmt kəlma ʒdiːda əl juːm","en":"I learned a new word today.","note":"Past action"}]},{"id":"l18","number":18,"title":"Make a plan","goal":"Arrange a time and respond to an invitation","note":"Ghādi + an imperfective verb can express a future plan. A polite “no” can include a short reason and an alternative.","ja":"","level":"Intermediate practice","lines":[{"id":"l18-01","ar":"وقتاش نتلاقاو؟","latin":"wəqtāsh nətlāqāw","ipa":"wəqtaːʃ nətlaːqaːw","en":"When shall we meet?","note":"Arranging a meeting"},{"id":"l18-02","ar":"نتلاقاو غدوة مع الستة؟","latin":"nətlāqāw ghədwa mʕa s-sətta","ipa":"nətlaːqaːw ɣədwa mʕa s sətta","en":"Shall we meet tomorrow at six?","note":"Confirm AM or PM when needed"},{"id":"l18-03","ar":"وين نتلاقاو؟","latin":"wīn nətlāqāw","ipa":"wiːn nətlaːqaːw","en":"Where shall we meet?","note":"Meeting place"},{"id":"l18-04","ar":"قدام القهوة","latin":"quddām əl-qahwa","ipa":"quddaːm əl qahwa","en":"In front of the café.","note":"Here qahwa means café"},{"id":"l18-05","ar":"غادي نجي مع مريم","latin":"ghādi nji mʕa məryəm","ipa":"ɣaːdi nʒi mʕa mərjəm","en":"I'll come with Meriem.","note":"A plan"},{"id":"l18-06","ar":"سمحلي، ما نقدرش اليوم","latin":"smaḥli ma nəqdərsh əl-yūm","ipa":"smaħli ma nəqdərʃ əl juːm","en":"Sorry, I can't today.","note":"To one man"},{"id":"l18-07","ar":"نقدرو غدوة في العشية؟","latin":"nəqdru ghədwa fi əl-ʕshiya","ipa":"nəqdru ɣədwa fi əl ʕʃija","en":"Could we do tomorrow afternoon / evening?","note":"Clarify an exact time"},{"id":"l18-08","ar":"نتلاقاو غدوة إن شاء الله","latin":"nətlāqāw ghədwa in shāʔ allāh","ipa":"nətlaːqaːw ɣədwa in ʃaːʔ allaːh","en":"We'll meet tomorrow, God willing.","note":"A common expression; still confirm practical details"}]},{"id":"l19","number":19,"title":"Tell a small story","goal":"Connect a few past events","note":"Past forms in this lesson are complete chunks: rḥt “I went”, klīt “I ate”, shəft “I saw”. Do not create a past tense by just removing n-.","ja":"過去形は n- を取るだけでは作れない　まずはこの短い文ごと覚える","level":"Intermediate practice","lines":[{"id":"l19-01","ar":"البارح رحت للبحر","latin":"əl-bāraḥ rḥt ləl-bḥər","ipa":"əl baːraħ rħt ləl bħər","en":"Yesterday I went to the sea.","note":"Past"},{"id":"l19-02","ar":"رحت مع صاحبي","latin":"rḥt mʕa ṣāḥbi","ipa":"rħt mʕa sˤaːħbi","en":"I went with my friend.","note":"Male friend"},{"id":"l19-03","ar":"كلينا كارانتيكا","latin":"klīna karantīka","ipa":"kliːna karantiːka","en":"We ate karantika.","note":"We-form in the past"},{"id":"l19-04","ar":"من بعد سمعنا الراي","latin":"mən bəʕd sməʕna ər-rāy","ipa":"mən bəʕd sməʕna ər raːj","en":"After that, we listened to raï.","note":"Sequence"},{"id":"l19-05","ar":"شفت سانتا كروز من بعيد","latin":"shəft sānta krūz mən bʕīd","ipa":"ʃəft saːnta kruːz mən bʕiːd","en":"I saw Santa Cruz from a distance.","note":"An Oran landmark name"},{"id":"l19-06","ar":"عجبني المنظر بزاف","latin":"ʕjəbni əl-mənḍər bəzzāf","ipa":"ʕʒəbni əl məndˤər bəzzaːf","en":"I really liked the view.","note":"A personal reaction"},{"id":"l19-07","ar":"ما فهمتش كامل الهدرة","latin":"ma fhəmtsh kāməl əl-hədra","ipa":"ma fhəmtʃ kaːməl əl hədra","en":"I didn't understand all the conversation.","note":"Honest reflection"},{"id":"l19-08","ar":"بصح تعلمت بزاف","latin":"bəṣṣaḥ tʕəlləmt bəzzāf","ipa":"bəsˤsˤaħ tʕəlləmt bəzzaːf","en":"But I learned a lot.","note":"Connect two thoughts"}]},{"id":"l20","number":20,"title":"A longer conversation","goal":"Express an opinion, give a reason and ask back","note":"Combine small chunks instead of searching for one long perfect sentence. Reuse bṣṣaḥ “but”, khāṭər “because” and w nta / w nti “and you?”.","ja":"","level":"Intermediate practice","lines":[{"id":"l20-01","ar":"نحب وهران خاطر نحب البحر والموسيقى","latin":"nḥəbb wahrān khāṭər nḥəbb əl-bḥər w əl-mūsīqa","ipa":"nħəbb wahraːn xaːtˤər nħəbb əl bħər w əl muːsiːqa","en":"I like Oran because I love the sea and music.","note":"An opinion plus a reason"},{"id":"l20-02","ar":"الدارجة صعيبة شوية، بصح نحب نتعلمها","latin":"əd-dārja ṣʕība shwiya bəṣṣaḥ nḥəbb nətʕəlləmha","ipa":"əd daːrʒa sˤʕiːba ʃwija bəsˤsˤaħ nħəbb nətʕəlləmha","en":"Darija is a little difficult, but I want to learn it.","note":"Contrast; feminine agreement"},{"id":"l20-03","ar":"على حساب رايي، لازم نسمع أكثر","latin":"ʕla ḥsāb rāyi lāzəm nəsmaʕ əktər","ipa":"ʕla ħsaːb raːji laːzəm nəsmaʕ əktər","en":"In my opinion, I need to listen more.","note":" [{"ar":"وهران","latin":"wahrān","en":"Oran","ipa":"wahraːn"},{"ar":"الراي","latin":"ər-rāy","en":"raï","ipa":"ər raːj"},{"ar":"الدارجة","latin":"əd-dārja","en":"Darija","ipa":"əd daːrʒa"},{"ar":"العادات هنا","latin":"əl-ʕādāt hna","en":"customs here","ipa":"əl ʕaːdaːt hna"},{"ar":"الماكلة","latin":"əl-mākla","en":"food","ipa":"əl maːkla"},{"ar":"رمضان","latin":"rəmḍān","en":"Ramadan","ipa":"rəmdˤaːn"},{"ar":"السفر","latin":"əs-sfər","en":"travel","ipa":"əs sfər"},{"ar":"الخدمة","latin":"əl-khədma","en":"work","ipa":"əl xədma"},{"ar":"القراية","latin":"əl-qrāya","en":"studying","ipa":"əl qraːja"},{"ar":"الموسيقى","latin":"əl-mūsīqa","en":"music","ipa":"əl muːsiːqa"},{"ar":"الأفلام","latin":"əl-aflām","en":"films","ipa":"əl aflaːm"},{"ar":"البحر","latin":"əl-bḥər","en":"the sea","ipa":"əl bħər"},{"ar":"الرياضة","latin":"ər-riyāḍa","en":"sport","ipa":"ər rijaːdˤa"},{"ar":"التصوير","latin":"ət-təṣwīr","en":"photography","ipa":"ət təsˤwiːr"},{"ar":"الطبخ","latin":"əṭ-ṭbəkh","en":"cooking","ipa":"ətˤ tˤbəx"},{"ar":"التاريخ تاع وهران","latin":"ət-tārīkh tāʕ wahrān","en":"Oran's history","ipa":"ət taːriːx taːʕ wahraːn"},{"ar":"المتحف","latin":"əl-mətḥəf","en":"the museum","ipa":"əl mətħəf"},{"ar":"الحياة هنا","latin":"əl-ḥayāt hna","en":"life here","ipa":"əl ħajaːt hna"},{"ar":"اللغات","latin":"əl-lughāt","en":"languages","ipa":"əl luɣaːt"},{"ar":"النقل","latin":"ən-nəql","en":"transport","ipa":"ən nəql"}],"contexts":[{"ar":"اليوم","latin":"əl-yūm","en":"today","ipa":"əl juːm"},{"ar":"غدوة","latin":"ghədwa","en":"tomorrow","ipa":"ɣədwa"},{"ar":"الليلة","latin":"əl-līla","en":"tonight","ipa":"əl liːla"},{"ar":"غدوة الصباح","latin":"ghədwa əṣ-ṣbāḥ","en":"tomorrow morning","ipa":"ɣədwa əsˤ sˤbaːħ"},{"ar":"نهار الاثنين","latin":"nhār l-tnīn","en":"on Monday","ipa":"nhaːr l tniːn"},{"ar":"نهار الجمعة","latin":"nhār l-jəmʕa","en":"on Friday","ipa":"nhaːr l ʒəmʕa"},{"ar":"بعد الغدا","latin":"bəʕd əl-ghda","en":"after lunch","ipa":"bəʕd əl ɣda"},{"ar":"قبل العشا","latin":"qbəl əl-ʕsha","en":"before dinner","ipa":"qbəl əl ʕʃa"},{"ar":"في السيمانة الجاية","latin":"fi əs-sīmāna əl-jāya","en":"next week","ipa":"fi əs siːmaːna əl ʒaːja"},{"ar":"مع الستة","latin":"mʕa s-sətta","en":"at six","ipa":"mʕa s sətta"}],"itemLabel":"Conversation topic","contextLabel":"When"},{"id":"find","title":"Find what you need","subtitle":"Objects, places & small problems","level":"Developing","note":"Here the final chunk is a location, not a destination. The past forms “forgot / found / left / saw” are authored as whole frames, not mechanically made from present forms.","frames":[{"ar":"راني نحوس على {x} {c}","latin":"rāni nḥawwəs ʕla {x} {c}","en":"I'm looking for {x} {c}.","ipa":"raːni nħawwəs ʕla {x} {c}"},{"ar":"نحتاج {x} {c}","latin":"nəḥtāj {x} {c}","en":"I need {x} {c}.","ipa":"nəħtaːʒ {x} {c}"},{"ar":"نسيت {x} {c}","latin":"nsīt {x} {c}","en":"I forgot {x} {c}.","ipa":"nsiːt {x} {c}"},{"ar":"لقيت {x} {c}","latin":"lqīt {x} {c}","en":"I found {x} {c}.","ipa":"lqiːt {x} {c}"},{"ar":"خليت {x} {c}","latin":"khəllīt {x} {c}","en":"I left {x} {c}.","ipa":"xəlliːt {x} {c}"},{"ar":"عندي {x} {c}","latin":"ʕəndi {x} {c}","en":"I have {x} {c}.","ipa":"ʕəndi {x} {c}"},{"ar":"ما عنديش {x} {c}","latin":"ma ʕəndīsh {x} {c}","en":"I don't have {x} {c}.","ipa":"ma ʕəndiːʃ {x} {c}"},{"ar":"شفت {x} {c}","latin":"shəft {x} {c}","en":"I saw {x} {c}.","ipa":"ʃəft {x} {c}"},{"ar":"لازم نلقى {x} {c}","latin":"lāzəm nəlqa {x} {c}","en":"I need to find {x} {c}.","ipa":"laːzəm nəlqa {x} {c}"},{"ar":"غادي نحوس على {x} {c}","latin":"ghādi nḥawwəs ʕla {x} {c}","en":"I'm going to look for {x} {c}.","ipa":"ɣaːdi nħawwəs ʕla {x} {c}"}],"items":[{"ar":"التليفون","latin":"ət-tīlīfūn","en":"the phone","ipa":"ət tiːliːfuːn"},{"ar":"الشارجور","latin":"əsh-shārjūr","en":"the charger","ipa":"əʃ ʃaːrʒuːr"},{"ar":"الباسبور","latin":"əl-pās pūr","en":"the passport","ipa":"əl paːs puːr"},{"ar":"التيكي","latin":"ət-tīki","en":"the ticket","ipa":"ət tiːki"},{"ar":"الصاك","latin":"əṣ-ṣāk","en":"the bag","ipa":"əsˤ sˤaːk"},{"ar":"المفتاح","latin":"əl-məftāḥ","en":"the key","ipa":"əl məftaːħ"},{"ar":"البورتفوي","latin":"əl-pūrtfūy","en":"the wallet","ipa":"əl puːrtfuːj"},{"ar":"الكارطة","latin":"əl-kārṭa","en":"the card","ipa":"əl kaːrtˤa"},{"ar":"الدراهم","latin":"əd-drāhəm","en":"the money","ipa":"əd draːhəm"},{"ar":"الكتاب","latin":"əl-ktāb","en":"the book","ipa":"əl ktaːb"},{"ar":"الورقة","latin":"əl-wərqa","en":"the paper","ipa":"əl wərqa"},{"ar":"الستيلو","latin":"əs-stīlū","en":"the pen","ipa":"əs stiːluː"},{"ar":"قارورة الما","latin":"qārūrat əl-mā","en":"the water bottle","ipa":"qaːruːrat əl maː"},{"ar":"النظاضر","latin":"ən-nḍāḍər","en":"the glasses","ipa":"ən ndˤaːdˤər"},{"ar":"الشابو","latin":"əsh-shābū","en":"the hat","ipa":"əʃ ʃaːbuː"},{"ar":"الفيستة","latin":"əl-fīsta","en":"the jacket","ipa":"əl fiːsta"},{"ar":"القميجة","latin":"əl-qmīja","en":"the shirt","ipa":"əl qmiːʒa"},{"ar":"الصباط","latin":"əṣ-ṣəbbāṭ","en":"the shoes","ipa":"əsˤ sˤəbbaːtˤ"},{"ar":"الفاليزة","latin":"əl-fālīza","en":"the suitcase","ipa":"əl faːliːza"},{"ar":"البارابلوي","latin":"əl-parāplwi","en":"the umbrella","ipa":"əl paraːplwi"}],"contexts":[{"ar":"في الدار","latin":"fi əd-dār","en":"at home","ipa":"fi əd daːr"},{"ar":"في القهوة","latin":"fi əl-qahwa","en":"at the café","ipa":"fi əl qahwa"},{"ar":"في اللوطيل","latin":"fi əl-lūṭīl","en":"at the hotel","ipa":"fi əl luːtˤiːl"},{"ar":"في السوق","latin":"fi əs-sūq","en":"at the market","ipa":"fi əs suːq"},{"ar":"في المحطة","latin":"fi əl-məḥaṭṭa","en":"at the station","ipa":"fi əl məħatˤtˤa"},{"ar":"في المطار","latin":"fi əl-məṭār","en":"at the airport","ipa":"fi əl mətˤaːr"},{"ar":"في الطوموبيل","latin":"fi əṭ-ṭūmūbīl","en":"in the car","ipa":"fi ətˤ tˤuːmuːbiːl"},{"ar":"في الكار","latin":"fi əl-kār","en":"on the bus","ipa":"fi əl kaːr"},{"ar":"في وهران","latin":"fi wahrān","en":"in Oran","ipa":"fi wahraːn"},{"ar":"في الحانوت","latin":"fi əl-ḥānūt","en":"in the shop","ipa":"fi əl ħaːnuːt"}],"itemLabel":"Object","contextLabel":"Where"}],"culture":[{"title":"Oran is not one identical accent","kind":"Language","text":"The city’s speech mixes regional influences. You may hear g and q variants of familiar words. This course favours everyday Algerian forms usable in Oran, not a claim that every word is exclusive to the city.","practice":"Ask a local friend how they personally say a word.","line":"l17-07","sources":["oran"]},{"title":"The sound of raï","kind":"Culture","text":"Raï is recognised by UNESCO as Algerian intangible cultural heritage. Make it a conversation, not a test of who knows the “right” artist.","practice":"Share one song, then ask which music the other person enjoys.","line":"l07-01","sources":["rai"]},{"title":"Couscous belongs around a table","kind":"Culture","text":"UNESCO recognises couscous-related knowledge and practices jointly across Algeria, Mauritania, Morocco and Tunisia. The heritage includes preparation and sharing, not only a recipe.","practice":"Thank the cook and ask about the family’s version.","line":"l10-07","sources":["couscous"]},{"title":"Try karantika","kind":"Food","text":"Karantika is a chickpea-flour preparation associated with Oran’s street-food scene. Recipes and serving styles differ.","practice":"Ask what is in it. Never use a learning-app phrase as your only allergy safeguard.","line":"l10-01","sources":["karantika"]},{"title":"Start with a greeting","kind":"Practice suggestion","text":"A useful first exchange is salām, a reply, and a short check-in. Practise the whole turn instead of saying isolated dictionary words.","practice":"Say hello before asking for directions. This is a courtesy suggestion, not a rigid rule about all residents.","line":"l01-01","sources":["oran"]},{"title":"Notice who you are speaking to","kind":"Language","text":"Second-person singular masculine and feminine forms are distinguished in Oran Arabic. The labels in this course identify grammatical forms, not assumptions about a person.","practice":"Compare rāk and rāki in the first lesson, then follow your conversation partner’s preferred form.","line":"l01-04","sources":["oran"]},{"title":"Make a future plan","kind":"Language","text":"Ghādi is a future marker described for Oran Arabic. A plan is easier to follow when you add a time and place.","practice":"Offer a plan, then check that the other person agrees.","line":"l18-05","sources":["oran"]},{"title":"Ramadan: check the rhythm","kind":"Visitor guidance","text":"During Ramadan, opening hours can change. UK visitor guidance advises avoiding public daytime eating, drinking and smoking, and asking local contacts for guidance.","practice":"Ask your host which time and place work well. Do not assume everyone observes in the same way.","line":"l18-01","sources":["uk"]},{"title":"Ask before taking a photo","kind":"Practice suggestion","text":"Visitor guidance warns about photography restrictions and equipment in sensitive contexts. For ordinary portraits, asking permission is a sensible additional courtesy.","practice":"A yes to a photo is not automatically a yes to posting it online.","line":"l16-08","sources":["uk"]},{"title":"A home is not a rulebook","kind":"Practice suggestion","text":"Local customs deserve attention, but a national summary cannot tell you one household’s preferences.","practice":"Ask about shoes, seating and helping with the meal. Follow the host rather than an imagined universal rule.","line":"l10-08","sources":["ca"]},{"title":"Keep compliments specific","kind":"Practice suggestion","text":"This lesson uses comments about music, a voice or a conversation. These are practice choices, not a promise that a phrase will be welcome in every relationship.","practice":"Match the other person’s comfort and give them room not to respond.","line":"l07-04","sources":["oran"]},{"title":"Confirm the fare","kind":"Visitor guidance","text":"Canadian visitor guidance recommends agreeing the taxi fare in advance and having small notes available. This course does not supply live prices or route information.","practice":"Ask the destination and total before setting off.","line":"l12-05","sources":["ca"]},{"title":"Names and borrowed words","kind":"Language","text":"French and Spanish contact have left vocabulary in local speech. A familiar-looking borrowed word may have a local pronunciation and meaning.","practice":"Listen to the whole phrase, not the spelling in the source language.","line":"l14-05","sources":["oran"]},{"title":"Leave room for “no”","kind":"Practice suggestion","text":"Consent and a graceful exit make practice more comfortable. This is a learning recommendation, not a claim that there is one Algerian communication style.","practice":"Use a short refusal, thank the person, and offer another time only when appropriate.","line":"l18-06","sources":["ca"]}],"sounds":[{"symbol":"/ə/","title":"The small, relaxed vowel","text":"Like the unstressed vowel in “about”, kept short. Do not give every written consonant a full English vowel.","example":"l01-01","ja":"強い「ア」ではなく、力を抜いた短い母音"},{"symbol":"/aː iː uː/","title":"Length matters","text":"The two dots mean a longer vowel. Hold the vowel, not the following consonant. ā, ī and ū in the optional reading aid match these symbols.","example":"l01-01","ja":"ː は長さの記号。音量を上げる記号ではない"},{"symbol":"/ħ/","title":"A breathy throat sound","text":"An unvoiced pharyngeal sound, deeper than English h. Keep the airflow gentle; do not squeeze or strain.","example":"l01-05","ja":"喉を痛めるほど力を入れない"},{"symbol":"/ʕ/","title":"A voiced throat sound","text":"A voiced pharyngeal sound. It is not an English vowel or a separate “ah” syllable. A local human model is especially valuable here.","example":"l01-01","ja":"英語に同じ音はないため、人の発音を優先して比較"},{"symbol":"/x/","title":"Back-of-mouth friction","text":"Similar to the final sound of Scottish “loch”. Air passes through a narrow space without a full stop.","example":"l17-01","ja":""},{"symbol":"/ɣ/","title":"The voiced partner","text":"Similar placement to /x/, with voice. In the reading aid it is gh. Do not read it as English g followed by h.","example":"l08-06","ja":""},{"symbol":"/ʃ/","title":"English “sh”","text":"Like “sh” in “shop”. The reading aid uses sh.","example":"l03-06","ja":""},{"symbol":"/ʒ/","title":"The middle of “measure”","text":"The voiced sound in “measure”. Oran’s j is commonly this sound, not English j in “jump”.","example":"l08-04","ja":""},{"symbol":"/q/ ~ /ɡ/","title":"Listen for local variation","text":"/q/ is a stop farther back than /k/. /ɡ/ is like English g in “go”. Both spellings and speaker choices vary; do not force every q into one rule.","example":"l08-04","ja":"表記 ق でも、語や話者により g に近い場合がある"},{"symbol":"/sˤ dˤ tˤ zˤ/","title":"The emphatic consonants","text":"The small raised sign marks a secondary tongue-root/back-of-mouth quality. Nearby vowels may sound darker. These are broad learning transcriptions.","example":"l01-05","ja":"小さい ˤ は別の一音として読まない"},{"symbol":"/r/","title":"A tap or trill","text":"Use the tongue tip, not the English r posture. Start with a light tap; avoid forcing a long rolled sound in every word.","example":"l02-07","ja":""},{"symbol":"/bb/ /ll/ /nn/","title":"Hold a consonant","text":"Repeated consonants indicate a longer consonant here. Keep the closure or contact longer rather than adding a vowel between them.","example":"l07-01","ja":"重なった子音の間に「ウ」などを足さない"}],"scenes":[{"title":"Meet someone","situation":"You have just met someone in Oran. Greet them, give your name, and say what you are learning.","prompts":[["Say hello.","l01-01"],["Give your name using the model.","l02-01"],["Say you are from Japan.","l02-03"],["Say you are here to learn Darija.","l02-08"]]},{"title":"Get unstuck","situation":"Your conversation partner is speaking too fast. Keep the conversation open instead of pretending to understand.","prompts":[["Ask a man to repeat.","l03-03"],["Ask him to speak slowly.","l03-05"],["Ask what a word means.","l03-06"],["Say you understood a little.","l03-08"]]},{"title":"Talk about music","situation":"A friend has shared a song. React with a specific compliment.","prompts":[["Say you like raï.","l07-01"],["Compliment the song.","l07-02"],["Compliment their music taste.","l07-04"],["Thank them for the song.","l07-07"]]},{"title":"At the café","situation":"Order, find a seat, and pay.","prompts":[["Ask for coffee without sugar.","l09-01"],["Ask for two coffees.","l09-04"],["Ask whether you can sit here.","l09-05"],["Ask for the bill.","l09-06"]]},{"title":"Share a meal","situation":"You are trying a local dish. Ask questions and show appreciation.","prompts":[["Ask to try karantika.","l10-01"],["Ask about its ingredients.","l10-02"],["Say the food is good.","l10-05"],["Thank the host.","l10-07"]]},{"title":"Make tomorrow happen","situation":"Suggest a simple meeting. Be ready for the other person to choose something else.","prompts":[["Ask when you will meet.","l18-01"],["Ask where you will meet.","l18-03"],["Propose tomorrow at six.","l18-02"],["Suggest an alternative.","l18-07"]]},{"title":"A day by the sea","situation":"Describe the weather and your plan without inventing transport times or local access rules.","prompts":[["Say it is sunny today.","l16-01"],["Comment on the sea.","l16-04"],["Suggest a walk.","l16-06"],["Ask about taking a photograph.","l16-08"]]},{"title":"Tell a small story","situation":"Put a few past-tense lines together. Pause naturally rather than rushing through isolated words.","prompts":[["Say where you went yesterday.","l19-01"],["Say you went with a friend.","l19-02"],["Mention what you ate.","l19-03"],["Mention the view.","l19-06"]]}],"sources":[{"id":"oran","title":"Oran Arabic — Jairo Guerrero, CORVAM / University of Zaragoza","url":"https://corvam.unizar.es/en/localities/oran/","scope":"Dialect features and a historical field recording. Not a verification of every course sentence."},{"id":"paper","title":"Preliminary Notes on the Current Arabic Dialect of Oran","url":"https://journals.unibuc.ro/index.php/ro function nav(){const labels={learn:'Learn',build:'Build',speak:'Speak',words:'Words',culture:'Culture'};$('.bottom-nav').innerHTML=Object.entries(labels).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}" ${tab===k?'aria-current="page"':''}>${icon(k==='learn'?'book':k)}<span>${v}</span></button>`).join('')}

function renderLearn(){if(lessonId){renderLesson();return}const l=D.lessons.find(l=>l.id===S.lastLesson)||D.lessons[0],done=S.completed.length;main.innerHTML=title('Local words. Real connections.','Speak in Oran','Listen, say it out loud, and make it your own.')+`<section class="hero"><div class="row between"><span class="eyebrow">${done?'Continue learning':'Your first conversation'}</span><span class="pill">${String(l.number).padStart(2,'0')} / 20</span></div><div class="ar" lang="ar-DZ">${esc(l.lines[0].ar)}</div><div class="ipa">/${esc(l.lines[0].ipa)}/</div><div class="en">${esc(l.lines[0].en)}</div><div class="hero-bottom"><div><div class="caption">LESSON ${String(l.number).padStart(2,'0')}</div><h2>${esc(l.title)}</h2><div class="caption">8 useful lines · listen & speak</div></div><button class="icon-button hero-play" data-play="${l.lines[0].id}" aria-label="Listen to the first phrase">${icon('play')}</button></div><div class="spacer"></div><button class="primary wide" data-lesson="${l.id}">${done?'Continue lesson':'Start speaking'} ${icon('arrow')}</button></section><div class="stats"><div><strong>500</strong><small>WORDS TO USE</small></div><div><strong>10,000</strong><small>COMBINATIONS</small></div><div><strong>${done}<span class="small"> / 20</span></strong><small>LESSONS PRACTISED</small></div></div><div class="notice compact">Audio is included — no voice installation. It is synthetic Algerian Arabic, not verified Oran recordings. Combinations play as chunks; IPA and sentences remain a learning draft. <button class="text-button" data-action="settings">Audio & quality</button></div><section class="section"><div class="section-title"><h2>Your practice, today</h2><span class="small muted">${E.due(S).length} due</span></div><button class="card activity" data-action="session-setup"><span class="activity-icon">${icon('headphones')}</span><span><strong>Listen → pause → speak</strong><small>5, 15 or 30 minutes. No card-flipping.</small></span></button></section>
