<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" width="330" height="64" role="img" aria-label="Baton Partners">
  <defs><linearGradient id="pw-paper" x1="0" x2="1"><stop offset="0" stop-color="#FF6B7D"/><stop offset="0.55" stop-color="#E2334F"/><stop offset="1" stop-color="#FF8A99"/></linearGradient></defs>
  <g>
  <defs>
    <linearGradient id="lpaper-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2A31"/><stop offset="0.55" stop-color="#16161B"/><stop offset="1" stop-color="#0A0A0D"/></linearGradient>
    <radialGradient id="lpaper-shine" cx="0.22" cy="0.12" r="0.85"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="lpaper-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/><stop offset="1" stop-color="#E2334F" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="lpaper-arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FF4D63"/></linearGradient>
    <radialGradient id="lpaper-red" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FF6B7D"/><stop offset="0.45" stop-color="#E0142F"/><stop offset="1" stop-color="#9E0A22"/></radialGradient>
    <radialGradient id="lpaper-white" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DAE0"/></radialGradient>
    <filter id="lpaper-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="lpaper-halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#lpaper-bg)"/>
  <rect width="64" height="64" rx="13" fill="url(#lpaper-shine)"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="12.4" fill="none" stroke="url(#lpaper-rim)" stroke-width="1.2"/>
  <path d="M22 30 C 26 17, 39 17, 43 30" fill="none" stroke="url(#lpaper-arc)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0.1 3.2"/>
  <circle cx="43" cy="32" r="9" fill="#E2334F" opacity="0.45" filter="url(#lpaper-halo)"/>
  <circle cx="22" cy="32" r="6.8" fill="url(#lpaper-white)"/>
  <circle cx="43" cy="32" r="6.8" fill="url(#lpaper-red)"/>
  <circle cx="43" cy="32" r="10" fill="none" stroke="#E2334F" stroke-opacity="0.5" stroke-width="0.8"/>
  
</g>
  <text x="82" y="43" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="28" letter-spacing="4.5" fill="#FFFFFF">Baton</text>
  <text x="196" y="44" font-family="Fraunces, 'Times New Roman', serif" font-style="italic" font-weight="500" font-size="33" fill="url(#pw-paper)">Partners</text>
